let state={screen:'intro',at:0,answers:Array(20).fill(null),profile:null,exam:null};
function mount(html,light=false){document.body.classList.toggle('light',light);$('#app').innerHTML='<div class="fade">'+html+'</div>';const heading=$('main h1,main h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}window.scrollTo(0,0);}
function bind(id,fn){const el=document.getElementById(id);if(el)el.onclick=fn;}
function button(id,label,cls=''){return `<button type="button" id="${id}" class="${cls}">${label}</button>`;}
function startProfile(){state={screen:'profile',at:0,answers:Array(20).fill(null),profile:null,exam:null};renderItem();}
function intro(){state.screen='intro';mount(`<section class="hero"><div><p class="eyebrow">01 / Primeiro, seu jeito de estudar</p><h1>Mais clareza.<br>Uma questão<br>de cada vez.</h1><p class="lead">São 20 perguntas rápidas sobre seu estudo.<br>Não existe resposta certa ou errada.<br>O resultado ajusta seu próximo treino.</p>${button('start','Começar','primary')}<p class="small muted" style="margin-top:14px">Tudo em português. Responda pensando na sua rotina real.</p></div><div><div class="orb" aria-hidden="true"><div class="orb-label"><strong>20</strong><span>um novo ponto de partida</span></div></div></div></section><div class="steps"><div><b>01 · Seu perfil</b><span>20 escolhas rápidas</span></div><div><b>02 · Sua direção</b><span>Um plano de treino</span></div><div><b>03 · Sua prática</b><span>100 questões · EN + PT</span></div></div><details><summary>Como este material foi preparado</summary>${sourceNotes()}</details>`);bind('start',startProfile);}
function renderItem(){const i=state.at,[axis,q,opts]=ITEMS[i];mount(`<section class="question-shell"><div class="topline"><span class="eyebrow" style="margin:0">Seu perfil de estudo</span><span class="small num">${String(i+1).padStart(2,'0')} <span class="muted">/ 20</span></span></div><progress value="${i}" max="20" aria-label="${i} de 20 itens anteriores concluídos"></progress><p class="eyebrow">${esc(AXES[axis].split(':')[0])}</p><h2>${esc(q)}</h2><div class="choices">${opts.map((x,j)=>`<button type="button" class="choice" data-choice="${j}" aria-pressed="${state.answers[i]===j}"><span class="letter">${letters[j]}</span><span>${esc(x)}</span></button>`).join('')}</div><div class="actions">${i?button('back','Voltar'):''}${button('next',i===19?'Ver meu perfil':'Continuar','primary')}</div><p class="small muted" style="margin-top:22px">Escolha uma opção para continuar. Ao sair ou recarregar, você perde as respostas.</p></section>`);$('#next').disabled=state.answers[i]===null;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.answers[i]=Number(b.dataset.choice);document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#next').disabled=false;});bind('back',()=>{state.at--;renderItem();});bind('next',()=>{if(state.answers[i]===null)return;if(i===19){state.profile=classify(state.answers);result();}else{state.at++;renderItem();}});}
function classify(a){if(a.length!==20||a.some(x=>!Number.isInteger(x)||x<0||x>3))throw Error('Responda todos os 20 itens.');const axes={};for(const key of Object.keys(AXES)){const ids=ITEMS.map((x,i)=>x[0]===key?i:-1).filter(i=>i>=0);axes[key]=Math.round(ids.reduce((n,i)=>n+ITEMS[i][3][a[i]],0)/ids.length*10)/10;}const can=[2,7,14],mot=[4,18],errs=[5,11,15,19];const scores={'ROTAÇÃO':(axes.RET+axes.PRA)/8,'ANSIOSA':axes.ANS/4*.8+errs.filter(i=>a[i]===2).length/4*.2,'VISUAL':can.filter(i=>a[i]===0).length/3,'AUDITIVA':can.filter(i=>a[i]===1).length/3,'PRAGMÁTICA':mot.reduce((n,i)=>n+ITEMS[i][3][a[i]],0)/8};const ranked=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]);const dominant=ranked[0],secondary=ranked[1],tie=Math.abs(scores[dominant]-scores[secondary])<.001;const anxious=scores.ANSIOSA>=.6,visual=scores.VISUAL>=.5,pragmatic=scores.PRAGMÁTICA>=.5;return {axes,scores,dominant,secondary,tie,note:Math.round(100*(scores[dominant]-scores[secondary])),config:{timer:anxious?'não':'sim',imagem:visual?'alta':scores.VISUAL>0?'média':'baixa',idioma:a[12]>=2?'PT':'EN',bloco:anxious||pragmatic?10:20},hour:ITEMS[8][2][a[8]],created:new Date()};}
function exportProfile(p,a){const d=p.created,pad=n=>String(n).padStart(2,'0');return `PERFIL-MBLEX v1\nDATA: ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}\nPERFIL: ${p.dominant} | SECUNDÁRIO: ${p.secondary}\nEIXOS: ${Object.keys(AXES).map(k=>`${k} (${p.axes[k]}/4)`).join(' ')}\nRESPOSTAS: ${a.map((x,i)=>`${i+1}${letters[x]}`).join(' ')}\nCONFIG: timer=${p.config.timer} imagem=${p.config.imagem} idioma=${p.config.idioma} bloco=${p.config.bloco}\nNOTA: ${p.note}`;}
function result(){state.screen='result';const p=state.profile,c=p.config;mount(`<p class="eyebrow">02 / Seu ponto de partida</p><h1 style="font-size:40px">Um plano para<br>estudar com direção.</h1><div class="grid"><section class="glass"><span class="tag">Perfil predominante no autorrelato</span><h2 class="profile-name">${p.dominant}</h2><p class="small muted">Secundário: ${p.secondary} · apoio complementar</p><div class="reading">${PROFILES[p.dominant].lines.map(x=>`<p>${x}</p>`).join('')}</div>${p.tie?'<p class="note">Houve empate. A ordem dos rótulos é apenas operacional; não há predominância clara.</p>':''}<h3>Prescrição prática</h3><ul class="prescription">${PROFILES[p.dominant].rx.map(x=>`<li>${x}</li>`).join('')}</ul><p class="small"><b>Complemento:</b> ${PROFILES[p.secondary].rx[0]}</p><p class="small muted">Horário relatado: ${p.hour.toLowerCase()}.</p></section><section class="glass"><h2>Seu treino, ajustado.</h2><div class="config"><div><span>Timer inicial</span>${c.timer==='sim'?'Ativado':'A partir do 3º bloco'}</div><div><span>Imagens recomendadas</span>${c.imagem}</div><div><span>Primeiro idioma</span>${c.idioma==='PT'?'Português':'Inglês'}</div><div><span>Tamanho do bloco</span>${c.bloco} questões</div></div><p class="small muted">O modo treino aplica esses ajustes. O modo prova usa 5 blocos de 20 e 110 minutos contínuos.</p><h3>Seis eixos</h3>${Object.keys(AXES).map(k=>`<div class="axis" title="${AXES[k]}"><span>${k}</span><progress value="${p.axes[k]}" max="4" aria-label="${AXES[k]}: ${p.axes[k]} de 4"></progress><span>${p.axes[k]}/4</span></div>`).join('')}<details><summary>Entender pontuação e limites</summary><p>As pontuações organizam apenas as respostas desta sessão. Não medem memória real, personalidade, inteligência ou aptidão. Visual e auditiva são preferências de recurso, não estilos de aprendizagem comprovados.</p><p>RET/PRA: maior pontuação indica mais dependência de estudo concentrado. CAN: apoio visual ou oral relatado. ERR/ANS: interferência de leitura ou pressão. MOT: apoio de metas e idioma; horário é uma escolha neutra.</p><p>NOTA ${p.note}/100: diferença entre os dois maiores índices, em pontos percentuais. É um indicador editorial de separação, não confiança estatística nem chance de aprovação. Empates seguem a ordem rotação, ansiosa, visual, auditiva, pragmática.</p></details></section></div><p class="note">Perfil não é diagnóstico clínico. Um questionário de autorrelato não confirma a causa dos erros; o desempenho no treino deve conferir esta hipótese.</p><div class="actions">${button('generate','Gerar resumo para enviar')}${button('configure','Configurar simulado','primary')}</div><div id="export"></div><div class="actions">${button('redo','Refazer perfil','quiet')}</div>`);bind('generate',()=>{const target=$('#export');target.innerHTML='<label for="summary-text">Resumo para enviar</label><textarea id="summary-text" readonly spellcheck="false"></textarea><div class="actions">'+button('copy','Copiar')+'</div><p id="copy-status" class="status" role="status"></p>';$('#summary-text').value=exportProfile(p,state.answers);bind('copy',()=>copyText($('#summary-text'),$('#copy-status')));target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});});bind('configure',setup);bind('redo',()=>{if(confirm('Refazer apaga as respostas desta sessão. Continuar?'))startProfile();});}
async function copyText(field,status){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(field.value);}else{field.focus();field.select();field.setSelectionRange(0,field.value.length);if(!document.execCommand('copy'))throw Error('Cópia indisponível');}status.textContent='Copiado. Cole na mensagem que desejar.';}catch{field.focus();field.select();field.setSelectionRange(0,field.value.length);status.textContent='Cópia automática bloqueada. O texto está selecionado: use Copiar no menu do aparelho.';}}
function sourceNotes(){return `<p>Questões autorais de treino, inspiradas nos temas dos prints e no formato público do MBLEx. Não são itens oficiais nem reprodução de um exame real. Fontes consultadas em 05/11/2026; os links precisam de internet, o treino não.</p><p><b>Correções dos prints:</b> educação, competência e lei delimitam <i lang="en">scope of practice</i>, não <i lang="en">certificate</i>. Flashback isolado não prova transferência. As questões 28 e 37 repetem draping; várias imagens enviadas repetem a mesma página. Venda de prática não autoriza divulgar prontuários indiscriminadamente.</p><p>O exame oficial é adaptativo; este banco é fixo e sua dificuldade é editorial. Percentual neste treino não prevê aprovação. Não há sequência previsível de letras corretas. Há duas repetições deliberadas, nas posições 40 e 80, para retomar conteúdo.</p><p><b>Exame:</b> 100 questões em 110 minutos; é preciso concluir todas. Resultado oficial PASS/FAIL, sem equivalência com percentual deste treino. Inscrição: US$ 265 no manual de setembro de 2026. O prazo de 30 dias citado no material enviado não foi confirmado nessa edição; confira a regra vigente com a FSMTB. <a href="${SOURCES.exam[1]}" target="_blank" rel="noopener noreferrer">Manual oficial</a>.</p><p><b>Nevada:</b> o conselho informa programa de pelo menos 625 horas e impressões digitais para verificação de antecedentes. Há outros requisitos; aprovação no exame não é licença. <a href="${SOURCES.nevada[1]}" target="_blank" rel="noopener noreferrer">Conselho de Nevada</a>.</p><details><summary>Mapa de revisão: termos e decisões</summary>${studyGuide()}</details><ul class="sources">${Object.values(SOURCES).map(([name,url])=>`<li><a href="${url}" target="_blank" rel="noopener noreferrer">${name}</a></li>`).join('')}</ul><p>Alterne fontes públicas de prática e compare explicações. Não use repetição de letras como estratégia; evite decorar o mesmo banco. Um intervalo fixo de três semanas não é uma regra oficial de retenção.</p>`;}
function studyGuide(){const rows=[
['Global vs local','Febre ou suspeita de trombose exige adiar e encaminhar; hematoma recente exige cautela local e avaliação do contexto. Crônico não significa automaticamente seguro.','Fever or a suspected clot calls for deferral and referral; a fresh bruise requires local caution and contextual assessment. Chronic does not automatically mean safe.','massage'],
['Client rights vs therapist prerogative','Privacidade, cobertura e recusa são direitos do cliente. O profissional também pode recusar conduta insegura ou fora do escopo.','Privacy, draping and refusal are client rights. Practitioners may also decline unsafe or out-of-scope services.','rights'],
['Scope vs ethics','Escopo delimita atividades permitidas; ética orienta conduta. Certificado não substitui licença nem competência.','Scope defines permitted activities; ethics guides conduct. A certificate does not replace licensure or competence.','ethics'],
['Transference vs countertransference','Transferência: projeção do cliente. Contratransferência: questões pessoais do profissional interferem no atendimento. Flashback isolado não estabelece nenhum dos dois.','Transference: client projection. Countertransference: practitioner issues affect care. An isolated flashback establishes neither.','transfer'],
['Abuse / misappropriation / power differential','Abuse: abuso. Misappropriation: apropriação indevida, por exemplo de bens. Power differential: influência desigual da relação profissional. Não são sinônimos.','Abuse, wrongful appropriation of property and unequal professional influence describe different conduct or circumstances.','abmp'],
['Cleaning / disinfection / sterilization','Limpeza remove sujeira. Desinfecção não garante eliminar esporos. Esterilização elimina formas microbianas, inclusive esporos; siga uso indicado do equipamento.','Cleaning removes soil. Disinfection does not guarantee spore elimination. Sterilization eliminates microbial forms including spores; match processing to intended use.','cdc'],
['Informed / implied / assumption of risk / waiver','Consentimento informado exige compreensão e escolha. Implícito é inferido da conduta. Assumir risco e assinar isenção não substituem consentimento nem autorizam negligência.','Informed consent requires understanding and choice. Implied consent is inferred from conduct. Risk acknowledgment and a waiver do not replace consent or authorize negligence.','rights'],
['Anticoagulants / corticosteroids','Anticoagulantes aumentam preocupação com sangramento. Corticoides podem causar fragilidade cutânea. Adapte manejo e não altere medicação.','Anticoagulants raise bleeding concerns. Corticosteroids may cause skin fragility. Adapt handling and do not alter medication.','drugs'],
['Antihypertensives / analgesics','Anti-hipertensivos podem causar tontura. Analgésicos podem reduzir dor sem comprovar recuperação. Levantar com segurança e reavaliar são mais úteis que presumir tolerância.','Antihypertensives may cause dizziness. Analgesics may reduce pain without proving recovery. Safe transitions and reassessment matter more than assumed tolerance.','pressure'],
['Pregnancy positioning','Decúbito lateral apoiado é uma opção adequada; lado, pressão e duração dependem de conforto, sintomas e avaliação. Não transforme um lado específico em regra universal.','Supported side-lying is an appropriate option; side, pressure and duration depend on comfort, symptoms and assessment. Do not make one side a universal rule.','pregnancy']
];return rows.map(([term,pt,en,s])=>`<p><b>${term}</b><br>${pt}<br><span lang="en">${en}</span><br><a href="${SOURCES[s][1]}" target="_blank" rel="noopener noreferrer">${SOURCES[s][0]}</a></p>`).join('');}
function setup(){state.screen='setup';mount(`<section class="question-shell"><p class="eyebrow">03 / Da intenção à prática</p><h1 style="font-size:42px">Prepare seu bloco.</h1><p class="muted">100 questões autorais. Sete domínios. Perguntas, alternativas e correções em inglês e português.</p><label for="mode">Modo</label><select id="mode"><option value="study">Treino ajustado ao perfil · ver resposta</option><option value="exam" selected>Prova · 100 questões / 110 minutos</option></select><label for="difficulty">Dificuldade</label><select id="difficulty"><option value="progressive">Progressiva · básico até superavançado</option><option value="1">Básico primeiro</option><option value="2">Intermediário primeiro</option><option value="3">Avançado primeiro</option><option value="4">Superavançado primeiro</option></select><p class="small muted">As opções mudam a ordem inicial; todos os níveis e domínios permanecem no percurso completo. Superavançado exige distinguir prioridade, contexto e termos próximos.</p><label for="first-language">Idioma apresentado primeiro</label><select id="first-language"><option value="PT">Português + inglês</option><option value="EN">Inglês + português</option></select><label for="deadline">Horário pessoal de encerramento (opcional)</label><input id="deadline" type="time" style="font:inherit;padding:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px"><div class="note"><b>Briefing</b><br>100 itens, quatro alternativas, uma correta.<br>Na prova: 110 minutos, sem voltar; o relógio continua nos intervalos.<br>Planejamento: 25 min nas primeiras 20, 44 nas próximas 40, 35 nas últimas 40; 6 min de reserva.<br>Metas de treino: 80% nas primeiras 20 e 60% nas questões 21–60.<br>Ao fim de cada bloco, confira o parcial e clique em Seguir.</div><p class="small muted">Os ajustes de timer e blocos do perfil são aplicados ao selecionar Treino. Imagens clínicas não verificadas aparecem como SEM IMAGEM; densidade recomendada não significa acervo disponível.</p><div class="actions">${button('profile','Voltar ao perfil')}${button('begin','Iniciar','primary')}</div><details><summary>Fontes, correções dos prints e limites</summary>${sourceNotes()}</details></section>`,true);$('#first-language').value=state.profile.config.idioma;bind('profile',result);bind('begin',()=>startExam($('#mode').value,$('#difficulty').value,$('#first-language').value,$('#deadline').value));}
function shuffle(a){const out=a.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function makeDeck(difficulty){const priority=l=>difficulty==='progressive'?l:((l-Number(difficulty)+4)%4);const pools=Object.keys(DOMAINS).map(d=>shuffle(BANK.filter(q=>q.d===d&&!q.slot)).sort((a,b)=>priority(a.l)-priority(b.l)));const deck=[];while(pools.some(p=>p.length)){for(const p of pools){if(p.length)deck.push(p.shift());}}deck.sort((a,b)=>priority(a.l)-priority(b.l));for(const q of BANK.filter(q=>q.slot).sort((a,b)=>a.slot-b.slot))deck.splice(q.slot-1,0,q);return deck.map(q=>{const opts=shuffle(q.o.map((v,i)=>({v,correct:i===0})));return {...q,options:opts,correct:opts.findIndex(x=>x.correct)};});}
function startExam(mode,difficulty,lang,deadline){const now=Date.now();state.exam={mode,difficulty,lang,deadline,deck:makeDeck(difficulty),index:0,selected:null,records:[],revealed:false,block:1,blockSize:mode==='exam'?20:state.profile.config.bloco,started:now,blockStarted:now,itemStarted:now,blockDue:null,ended:null,expired:false};state.screen='question';setBlockTimer();renderQuestion();}
function setBlockTimer(){const e=state.exam;e.blockDue=e.mode==='study'&&(state.profile.config.timer==='sim'||e.block>=3)?Date.now()+e.blockSize*66000:null;}
function remaining(){const e=state.exam;if(!e)return null;const due=e.mode==='exam'?e.started+6600000:e.blockDue;return due===null?null:Math.max(0,due-Date.now());}
function formatTime(ms){const sec=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function bilingual(p,lang,cls=''){const order=lang==='PT'?[1,0]:[0,1];return order.map((idx,n)=>`<div lang="${idx?'pt-BR':'en'}" class="${n?'pt':cls||'en'}"><span class="language">${idx?'PORTUGUÊS':'ENGLISH'}</span>${esc(p[idx])}</div>`).join('');}
function renderQuestion(){state.screen='question';const e=state.exam,q=e.deck[e.index];mount(`<section class="question-shell"><div class="topline"><span class="tag">Bloco ${e.block} · ${e.mode==='exam'?'Prova':'Treino'}</span><span id="clock" class="small num" aria-label="Tempo restante"></span></div><progress value="${e.index}" max="100" aria-label="${e.index} questões concluídas de 100"></progress><div class="topline"><p class="eyebrow" style="margin:0">${DOMAINS[q.d]}</p><span class="small num">${e.index+1} / 100</span></div><p class="small muted" style="margin-top:10px">${LEVELS[q.l-1]}${e.deadline?' · Encerrar até '+esc(e.deadline):''}</p><h2 class="sr">Questão ${e.index+1}</h2>${bilingual(q.q,e.lang)}<div class="choices">${q.options.map((o,j)=>`<button class="choice" data-answer="${j}" aria-pressed="${e.selected===j}"><span class="letter">${letters[j]}</span><span lang="${e.lang==='PT'?'pt-BR':'en'}">${esc(o.v[e.lang==='PT'?1:0])}<small lang="${e.lang==='PT'?'en':'pt-BR'}">${esc(o.v[e.lang==='PT'?0:1])}</small></span></button>`).join('')}</div><div id="feedback"></div><div class="actions">${button('submit',e.mode==='study'?'Ver resposta':'Confirmar resposta','primary')}</div><p class="small muted" style="margin-top:18px">${e.mode==='study'?'Escolha antes de revelar. A primeira resposta fica registrada.':'Depois de confirmar, não é possível voltar. Correção completa ao encerrar.'}</p></section>`,true);$('#submit').disabled=e.selected===null;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(e.revealed)return;e.selected=Number(b.dataset.answer);document.querySelectorAll('[data-answer]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#submit').disabled=false;});bind('submit',submitAnswer);tick();}
function explanation(q,selected,lang){const correct=q.options[q.correct].v;return `<div class="answer"><h3>${selected===q.correct?'Resposta correta':'Vamos revisar'} · ${letters[q.correct]}</h3>${bilingual(q.why,lang,'small')}<div class="memory"><b>Vocabulário / Vocabulary</b><span lang="en">${esc(correct[0])}</span> = <span lang="pt-BR">${esc(correct[1])}</span></div><h3>Por que as outras não respondem</h3><ul class="small">${q.options.map((o,j)=>j===q.correct?'':`<li><b>${letters[j]}.</b> <span lang="en">${esc(o.v[2])}</span><br><span lang="pt-BR">${esc(o.v[3])}</span></li>`).join('')}</ul><p class="small"><b>Gancho / Memory cue:</b><br>${esc(correct[0])} · ${esc(correct[1])}</p><p class="small"><b>Na prática / In practice:</b><br>${esc(q.why[1])}<br><span lang="en">${esc(q.why[0])}</span></p>${['ANA','CIN'].includes(q.d)||q.s==='pregnancy'?'<p class="small muted">SEM IMAGEM · nenhuma ilustração anatômica não verificada foi usada.</p>':''}<p class="small"><a href="${SOURCES[q.s][1]}" target="_blank" rel="noopener noreferrer">Fonte de consulta: ${SOURCES[q.s][0]}</a></p></div>`;}
function submitAnswer(){const e=state.exam;if(e.selected===null||e.revealed)return;if(remaining()!==null&&remaining()<=0){expire();return;}const q=e.deck[e.index];e.records.push({id:q.id,selected:e.selected,correct:e.selected===q.correct,ms:Date.now()-e.itemStarted,cause:null});if(e.mode==='exam'){advance();return;}e.revealed=true;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(Number(b.dataset.answer)===q.correct)b.classList.add('correct');else if(Number(b.dataset.answer)===e.selected)b.classList.add('wrong');});$('#feedback').innerHTML=explanation(q,e.selected,e.lang)+(e.selected===q.correct?'':causeSelect(e.records.length-1));$('#submit').textContent='Continuar';bind('submit',advance);wireCauses();$('#feedback').scrollIntoView({block:'start',behavior:'instant'});}
function causeSelect(i){return `<label for="cause-${i}">O que contribuiu para este erro? (opcional)</label><select id="cause-${i}" data-cause="${i}"><option value="">Não informado</option><option>Conteúdo</option><option>Leitura/idioma</option><option>Ansiedade</option><option>Chute</option></select>`;}
function wireCauses(){document.querySelectorAll('[data-cause]').forEach(x=>{x.value=state.exam.records[Number(x.dataset.cause)].cause||'';x.onchange=()=>{state.exam.records[Number(x.dataset.cause)].cause=x.value||null;};});}
function advance(){const e=state.exam;e.index=e.records.length;e.revealed=false;e.selected=null;if(e.index>=100){finish(false);return;}if(e.index%e.blockSize===0){blockResult();return;}e.itemStarted=Date.now();renderQuestion();}
function blockResult(){state.screen='break';const e=state.exam,records=e.records.slice(-e.blockSize),right=records.filter(r=>r.correct).length;mount(`<section class="question-shell glass"><div class="break-symbol" aria-hidden="true">Ⅱ</div><p class="eyebrow">Bloco ${e.block} concluído</p><h1 style="font-size:43px">Respire.<br>Reconstrua.<br>Continue.</h1><p class="score">${right}<span class="muted" style="font-size:25px"> / ${e.blockSize}</span></p><p>${e.blockSize-right} erros · ${formatTime(Date.now()-e.blockStarted)} neste bloco</p><p class="muted">${e.mode==='exam'?'O relógio da prova continua correndo durante esta tela.':'Faça uma pequena pausa como recompensa. Antes de continuar, retome uma regra que errou.'}</p><p id="clock" class="num"></p><p class="small">${state.profile.config.timer==='não'&&e.block===2&&e.mode==='study'?'O próximo bloco introduz o timer.':''}</p><div class="actions">${button('continue','Seguir','primary')}${button('end','Encerrar e corrigir')}</div></section>`,true);if(e.mode==='study')e.blockDue=null;bind('continue',()=>{if(remaining()!==null&&remaining()<=0){expire();return;}e.block++;e.blockStarted=Date.now();e.itemStarted=Date.now();setBlockTimer();renderQuestion();});bind('end',()=>finish(false));tick();}
function tick(){const e=state.exam;if(!e||e.ended)return;const left=remaining(),clock=$('#clock');if(clock)clock.textContent=left===null?'Sem limite de tempo':formatTime(left)+' restantes';if(left!==null&&left<=0)expire();}
function expire(){const e=state.exam;if(!e||e.ended)return;e.expired=true;finish(true);}
function finish(expired){const e=state.exam;if(!e.ended)e.ended=Date.now();e.expired=expired||e.expired;state.screen='finished';const n=e.records.length,right=e.records.filter(x=>x.correct).length,stats=Object.keys(DOMAINS).map(d=>{const r=e.records.filter((x,i)=>e.deck[i].d===d);return {d,n:r.length,ok:r.filter(x=>x.correct).length};}),wrong=e.records.map((r,i)=>({r,i})).filter(x=>!x.r.correct),first=e.records.slice(0,20),middle=e.records.slice(20,60),rate=r=>r.length?Math.round(r.filter(x=>x.correct).length/r.length*100):0;mount(`<p class="eyebrow">Seu resultado de treino</p><h1 style="font-size:43px">O erro vira direção.</h1><div class="grid"><section class="glass"><p class="score">${n?Math.round(right/n*100):0}<span style="font-size:26px">%</span></p><p>${right} acertos / ${n} respondidas · ${100-n} sem responder</p><p class="small muted">Tempo total: ${formatTime(e.ended-e.started)} · ${e.mode==='study'?'Treino':'Prova'}</p>${e.expired?'<p class="note">Tempo encerrado. As respostas confirmadas foram preservadas nesta tela.</p>':''}<p class="small">${n===100?'Percurso completo.':'Sessão parcial: não compare este percentual com um percurso completo.'}</p><p class="note">Este percentual não corresponde ao resultado oficial PASS/FAIL. Não é possível inferir aprovação nem um corte de 70% ou 80% neste banco.</p><p class="small">Primeiras 20: ${first.length===20?rate(first)+'% · meta 80%':'parcial, '+first.length+'/20'}<br>Questões 21–60: ${middle.length===40?rate(middle)+'% · meta 60%':'parcial, '+middle.length+'/40'}</p></section><section class="glass"><h2>Por domínio</h2><table><thead><tr><th>Domínio</th><th>Acertos</th><th>%</th></tr></thead><tbody>${stats.map(x=>`<tr><td>${DOMAINS[x.d]}</td><td>${x.ok}/${x.n}</td><td>${x.n?Math.round(x.ok/x.n*100):'—'}</td></tr>`).join('')}</tbody></table></section></div><section class="glass" style="margin-top:18px"><h2>Seu próximo passo</h2><p class="small">Prioridades pelo erro observado; amostras pequenas não medem domínio. Misture essas fichas com conteúdos já acertados.</p><ul>${stats.filter(x=>x.n&&x.ok<x.n).sort((a,b)=>(b.n-b.ok)/b.n-(a.n-a.ok)/a.n).slice(0,3).map(x=>`<li>${DOMAINS[x.d]}: ${Math.min(10,Math.max(3,(x.n-x.ok)*2))} fichas de recuperação ativa.</li>`).join('')||'<li>Sem erros registrados: retome depois, com questões diferentes, para conferir retenção.</li>'}</ul><p class="small">Se a prova for amanhã, priorize os erros recorrentes, uma revisão mista curta e descanso. Revisão em 48 horas é continuidade, não preparação para amanhã.</p><p class="small">Causas são autorrelatadas abaixo. O programa não consegue distinguir ansiedade de desconhecimento apenas pela alternativa marcada.</p></section><h2 style="margin-top:32px">Revisão das respostas</h2><p class="small muted">${wrong.length} erros. Acertos também podem ser abertos para consultar a explicação.</p>${e.records.map((r,i)=>`<details class="glass"><summary>${r.correct?'Acerto':'Revisar'} · ${i+1} · ${DOMAINS[e.deck[i].d]} · marcada ${letters[r.selected]}, correta ${letters[e.deck[i].correct]}</summary>${bilingual(e.deck[i].q,e.lang,'small')}${explanation(e.deck[i],r.selected,e.lang)}${r.correct?'':causeSelect(i)}</details>`).join('')}<p class="note">Incertezas: não há item incluído com gabarito deliberadamente incerto.<br>Questões clínicas simplificam o contexto; decisões reais dependem de avaliação e escopo local.<br>Este banco não passou por validação psicométrica nem revisão independente de uma banca.</p><details><summary>Fontes e correções</summary>${sourceNotes()}</details><div class="actions">${button('again','Novo percurso','primary')}${button('profile','Meu perfil')}</div>`,true);wireCauses();bind('again',setup);bind('profile',result);}
window.addEventListener('beforeunload',event=>{if(state.answers.some(x=>x!==null)||state.exam){event.preventDefault();event.returnValue='';}});
setInterval(tick,1000);
intro();
</script>
