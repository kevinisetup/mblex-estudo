const FOCUS_BANK=[{"id":1,"d":"PAT","l":3,"flag":"FIRST","s":"clots","q":["Renata, 44, just off a nine-hour flight, shows you a firm warm lump on one calf and says the leg feels heavy. Her calf symptoms began this morning. She has a massage booked. What happens FIRST?","Renata, 44, recém-chegada de um voo de nove horas, mostra um caroço firme e quente na panturrilha e diz que a perna está pesada. Os sintomas na panturrilha começaram hoje cedo. Ela tem massagem marcada. O que acontece PRIMEIRO?"],"options":[{"letter":"A","en":"Work around the lump and continue","pt":"Trabalhar ao redor do caroço e seguir","reasonEN":"Light pressure is not enough to rule it out.","reasonPT":"Pressão leve não descarta."},{"letter":"B","en":"Defer and send her for medical assessment","pt":"Adiar e encaminhar para avaliação médica","reasonEN":"Suspected clot is absolute, not site-specific.","reasonPT":"Suspeita de trombose é absoluta, não local."},{"letter":"C","en":"Elevate the leg and apply cold","pt":"Elevar a perna e aplicar frio","reasonEN":"Both treat symptoms without ruling anything out.","reasonPT":"Os dois tratam sintoma sem descartar nada."},{"letter":"D","en":"Shorten the session to twenty minutes","pt":"Encurtar a sessão para vinte minutos","reasonEN":"Duration does not change the risk.","reasonPT":"Duração não muda o risco."}],"correct":1,"why":["A clot anywhere is an absolute contraindication, not just at the site.","Coágulo em qualquer lugar é contraindicação absoluta, não só no local."],"hook":["Heavy warm calf after flying: stop.","Panturrilha pesada e quente após voo: pare."],"practice":["Explain why you are not starting and who she should see.","Explique por que não vai começar e a quem ela deve recorrer."],"img":null},{"id":6,"d":"PAT","l":2,"flag":"0","s":"ppe","q":["Tom, 38, has a weeping scrape on his shin. The scrape appeared yesterday. You will not work over it, but the linen will contact the drainage. What do you do?","Tom, 38, tem um ralado que exsuda na canela. O ralado apareceu ontem. Você não vai trabalhar sobre ele, mas o lençol vai tocar a secreção. O que fazer?"],"options":[{"letter":"A","en":"Bare hands, wash afterward","pt":"Mãos nuas, lavar depois","reasonEN":"Washing does not replace the barrier.","reasonPT":"Lavar não substitui a barreira."},{"letter":"B","en":"Gloves for the anticipated fluid contact","pt":"Luvas pelo contato previsto com fluido","reasonEN":"Standard precaution when fluid contact is expected.","reasonPT":"Precaução padrão quando se prevê contato com fluido."},{"letter":"C","en":"Gloves and then work over the scrape too","pt":"Luvas e trabalhar sobre o ralado também","reasonEN":"Gloves do not remove a local contraindication.","reasonPT":"Luvas não eliminam contraindicação local."},{"letter":"D","en":"Reuse gloves if they look clean","pt":"Reutilizar luvas se parecerem limpas","reasonEN":"Used gloves carry contamination.","reasonPT":"Luvas usadas carregam contaminação."}],"correct":1,"why":["Gloves protect the contact; they do not authorize treatment over the lesion.","Luvas protegem o contato; não autorizam tratar a lesão."],"hook":["A barrier protects contact, not treatment.","A barreira protege o contato, não o tratamento."],"practice":["Gloves on, area out of the plan, hands washed after.","Luvas, área fora do plano, mãos lavadas depois."],"img":null},{"id":7,"d":"PAT","l":3,"flag":"0","s":"pregnancy","q":["Camila, 34, is in her third trimester and cannot lie prone. The positional discomfort has lasted two weeks. She wants the back worked. Which setup do you choose?","Camila, 34, está no terceiro trimestre e não consegue ficar de bruços. O desconforto ao deitar dura duas semanas. Quer as costas trabalhadas. Qual montagem escolher?"],"options":[{"letter":"A","en":"Flat supine with a thin pillow","pt":"Supina plana com travesseiro fino","reasonEN":"The uterus compresses the vena cava.","reasonPT":"O útero comprime a veia cava."},{"letter":"B","en":"Prone with a wedge under the hips","pt":"Prona com cunha sob o quadril","reasonEN":"Still compresses the abdomen.","reasonPT":"Ainda comprime o abdome."},{"letter":"C","en":"Supported side-lying with pillows","pt":"Decúbito lateral apoiado com travesseiros","reasonEN":"Offloads the vena cava and the abdomen.","reasonPT":"Alivia a veia cava e o abdome."},{"letter":"D","en":"Seated in a chair for back work","pt":"Sentada na cadeira para trabalho nas costas","reasonEN":"Seated care may be possible, but supported side-lying fits the requested back work here.","reasonPT":"Atendimento sentado pode ser possível, mas decúbito lateral apoiado atende melhor ao trabalho nas costas neste caso."}],"correct":2,"why":["Supported side-lying is the standard for late pregnancy; check dizziness and shorten pressure.","Decúbito lateral apoiado é o padrão no fim da gestação; cheque tontura e reduza a pressão."],"hook":["Third trimester sleeps on her side. So do you.","O terceiro trimestre dorme de lado. Você também."],"practice":["Build the support before she climbs on the table.","Monte o apoio antes de ela subir na maca."],"img":null},{"id":8,"d":"PAT","l":2,"flag":"0","s":"massage","q":["Aline, 71, has osteoporosis and a dowager's hump. Her upper-back discomfort has lasted six weeks. She asks for strong work on the upper back. What fits?","Aline, 71, tem osteoporose e cifose. O desconforto na parte superior das costas dura seis semanas. Pede trabalho forte na parte superior das costas. O que cabe?"],"options":[{"letter":"A","en":"Strong percussion over the hump","pt":"Percussão forte sobre a corcunda","reasonEN":"Bone is fragile there.","reasonPT":"O osso é frágil ali."},{"letter":"B","en":"Avoid force and adapt the support","pt":"Evitar força e adaptar o apoio","reasonEN":"Fragility changes force and positioning.","reasonPT":"Fragilidade muda força e posicionamento."},{"letter":"C","en":"Force the joints to end range","pt":"Forçar as articulações até o limite","reasonEN":"Forceful end range may harm.","reasonPT":"Fim de amplitude forçado pode lesionar."},{"letter":"D","en":"Ignore the history if she has no pain","pt":"Ignorar o histórico se ela não tem dor","reasonEN":"No pain does not mean no fragility.","reasonPT":"Sem dor não significa sem fragilidade."}],"correct":1,"why":["Osteoporosis changes how much force and how you position.","Osteoporose muda quanta força e como posicionar."],"hook":["Fragile bone answers to hands, not to will.","Osso frágil responde às mãos, não à vontade."],"practice":["Bolster under the chest and keep pressure broad.","Apoio sob o tórax e pressão ampla."],"img":null},{"id":9,"d":"PAT","l":2,"flag":"FIRST","s":"massage","q":["Ines, 66, diabetic with reduced sensation in both feet, wants hot stones on the soles. The reduced foot sensation has lasted six months. What do you check FIRST?","Ines, 66, diabética com sensibilidade reduzida nos dois pés, quer pedras quentes nas solas. A sensibilidade reduzida nos pés dura seis meses. O que verificar PRIMEIRO?"],"options":[{"letter":"A","en":"Check sensation and avoid hot stones if it is reduced","pt":"Verificar a sensibilidade e evitar pedras quentes se estiver reduzida","reasonEN":"Reduced sensation hides the warning.","reasonPT":"Sensibilidade reduzida esconde o aviso."},{"letter":"B","en":"The stone temperature with your own hand","pt":"A temperatura da pedra com a sua mão","reasonEN":"Your hand is not her foot.","reasonPT":"Sua mão não é o pé dela."},{"letter":"C","en":"How long she wants the stones","pt":"Quanto tempo ela quer as pedras","reasonEN":"Duration is secondary to the check.","reasonPT":"Duração é secundária à checagem."},{"letter":"D","en":"Whether she prefers warm or cold","pt":"Se prefere quente ou frio","reasonEN":"Preference does not fix risk.","reasonPT":"Preferência não resolve o risco."}],"correct":0,"why":["Reduced sensation can hide a burn. Check it first; when sensation is impaired, avoid hot stones on the feet.","Sensibilidade reduzida pode esconder uma queimadura. Verifique primeiro; se estiver prejudicada, evite pedras quentes nos pés."],"hook":["No feeling, no alarm.","Sem sensação, sem alarme."],"practice":["Choose a nonthermal option for the feet and document the reduced sensation.","Escolha uma opção sem calor para os pés e registre a sensibilidade reduzida."],"img":null},{"id":10,"d":"PAT","l":3,"flag":"0","s":"massage","q":["Lea, 52, is mid-chemotherapy with a port and reports fatigue and nausea. The fatigue and nausea began three days ago. She asks for a gentle session. Which statement fits?","Lea, 52, está no meio da quimioterapia, tem um cateter e relata fadiga e náusea. A fadiga e a náusea começaram há três dias. Pede sessão suave. Qual afirmação cabe?"],"options":[{"letter":"A","en":"Massage treats the cancer itself","pt":"A massagem trata o câncer em si","reasonEN":"It is supportive, not oncology treatment.","reasonPT":"É apoio, não tratamento oncológico."},{"letter":"B","en":"Every patient on chemo needs the same plan","pt":"Todo paciente em quimio precisa do mesmo plano","reasonEN":"Drugs and cycles differ.","reasonPT":"Drogas e ciclos diferem."},{"letter":"C","en":"Coordinate precautions, avoid the port site, keep pressure light","pt":"Combinar precauções, evitar o cateter, manter pressão leve","reasonEN":"Supportive care inside your scope.","reasonPT":"Cuidado de apoio dentro do escopo."},{"letter":"D","en":"Ask her to pause chemo while you work","pt":"Pedir que ela pause a quimio durante o trabalho","reasonEN":"Pausing is the oncologist's call.","reasonPT":"Pausar é decisão do oncologista."}],"correct":2,"why":["Supportive care with coordination, not treatment of the disease.","Cuidado de apoio com coordenação, não tratamento da doença."],"hook":["You support the person, not the protocol.","Você apoia a pessoa, não o protocolo."],"practice":["Ask about the port, nausea timing and current precautions.","Pergunte sobre o cateter, a náusea e as precauções atuais."],"img":null},{"id":11,"d":"PAT","l":3,"flag":"FIRST","s":"pressure","q":["Rafael, 69, on blood pressure medication, sits up after the session and goes pale and dizzy. The dizziness began a minute ago. What do you do FIRST?","Rafael, 69, em uso de anti-hipertensivo, senta depois da sessão e fica pálido e tonto. A tontura começou há um minuto. O que fazer PRIMEIRO?"],"options":[{"letter":"A","en":"Have him walk it off alone","pt":"Mandar caminhar sozinho para passar","reasonEN":"Walking increases fall risk.","reasonPT":"Andar aumenta risco de queda."},{"letter":"B","en":"Support him seated and let it pass","pt":"Apoiá-lo sentado e aguardar","reasonEN":"Support him in place, reassess, and seek medical care if symptoms persist.","reasonPT":"Apoie-o onde está, reavalie e procure atendimento médico se persistir."},{"letter":"C","en":"Offer him a dose of his medicine","pt":"Oferecer uma dose do remédio dele","reasonEN":"Prescribing is out of scope.","reasonPT":"Prescrever está fora do escopo."},{"letter":"D","en":"Lie him flat and lift his legs","pt":"Deitá-lo e elevar as pernas","reasonEN":"A safe position may help, but moving him abruptly is not the first step.","reasonPT":"Posição segura pode ajudar, mas movê-lo bruscamente não é o primeiro passo."}],"correct":1,"why":["Keep him supported and assess; persistent dizziness needs medical attention.","Mantenha apoiado e avalie; tontura persistente exige atenção médica."],"hook":["Standing up is the risky part.","O risco está em levantar."],"practice":["Sit him up slowly, feet down, wait before he stands.","Sente devagar, pés para baixo, espere antes de levantar."],"img":null},{"id":15,"d":"ETI","l":3,"flag":"0","s":"ethics","q":["Lia, 44, has felt unusually tired for three weeks at intake. A regular client asks you to recommend a supplement for tiredness, because a friend suggested a thyroid product. How do you answer?","Lia, 44 anos, relata cansaço incomum há três semanas na avaliação. Um cliente fixo pede que você recomende um suplemento para cansaço, porque uma amiga sugeriu produto de tireoide. Como responder?"],"options":[{"letter":"A","en":"Recommend the same product that helped another client","pt":"Recomendar o mesmo produto que ajudou outro cliente","reasonEN":"Recommending a supplement exceeds this role; another client’s history is also private.","reasonPT":"Recomendar suplemento excede esse papel; a história de outro cliente também é privada."},{"letter":"B","en":"Say nutrition is outside your scope and point her to her physician","pt":"Dizer que nutrição está fora do escopo e indicar o médico","reasonEN":"Scope logic resolves it.","reasonPT":"A lógica de escopo resolve."},{"letter":"C","en":"Say it is fine because it is over the counter","pt":"Dizer que é ok porque é isento de receita","reasonEN":"OTC does not create scope.","reasonPT":"Isento de receita não cria escopo."},{"letter":"D","en":"Write it down as informal advice","pt":"Anotar como orientação informal","reasonEN":"Informal does not make it permissible.","reasonPT":"Informal não torna permitido."}],"correct":1,"why":["Recommendation without prescription is still outside massage scope.","Recomendar sem prescrever continua fora do escopo."],"hook":["Outside the licence: point, don't prescribe.","Fora da licença: aponte, não prescreva."],"practice":["Redirect without making her feel dismissed.","Redirecione sem fazê-la se sentir dispensada."],"img":null},{"id":16,"d":"ETI","l":3,"flag":"EXCEPT","s":"rights","q":["Mara, 37, has had shoulder discomfort for two weeks and is discussing a new technique. All of these support informed consent EXCEPT:","Mara, 37 anos, sente desconforto no ombro há duas semanas e conversa sobre técnica nova. Todas apoiam o consentimento informado, EXCETO:"],"options":[{"letter":"A","en":"Explaining the relevant risks","pt":"Explicar os riscos relevantes","reasonEN":"Risk talk is the core of it.","reasonPT":"Falar de risco é o núcleo."},{"letter":"B","en":"Allowing questions","pt":"Permitir perguntas","reasonEN":"Questions reveal understanding.","reasonPT":"Perguntas revelam compreensão."},{"letter":"C","en":"Treating yesterday's signature as permanent permission","pt":"Tratar a assinatura de ontem como permissão permanente","reasonEN":"Consent is continuous.","reasonPT":"Consentimento é contínuo."},{"letter":"D","en":"Respecting a refusal","pt":"Respeitar a recusa","reasonEN":"Refusal is part of autonomy.","reasonPT":"Recusa faz parte da autonomia."}],"correct":2,"why":["Consent is a process, not a document.","Consentimento é processo, não documento."],"hook":["A signature is a photo, not a film.","Assinatura é foto, não filme."],"practice":["Reconfirm before changing area, pressure or technique.","Reconfirme antes de mudar área, pressão ou técnica."],"img":null},{"id":20,"d":"ETI","l":2,"flag":"0","s":"rights","q":["Rui, 52, has had gluteal tightness for three weeks and agrees to local work. You need to work the gluteal area with the client prone. What is the correct draping conduct?","Rui, 52 anos, sente tensão glútea há três semanas e aceita trabalho local. Você precisa trabalhar a região glútea com o cliente em pronação. Qual é a conduta correta de draping?"],"options":[{"letter":"A","en":"Remove the lower drape completely","pt":"Retirar a cobertura de baixo por completo","reasonEN":"Exposes more than needed.","reasonPT":"Expõe mais que o necessário."},{"letter":"B","en":"Undrape only the area, secure the drape, and tell him before you do it","pt":"Descobrir só a área, firmar a cobertura e avisar antes","reasonEN":"Safe practice plus communication.","reasonPT":"Prática segura mais comunicação."},{"letter":"C","en":"Ask him to hold the drape himself","pt":"Pedir que ele segure a cobertura","reasonEN":"Works, but it is not the standard.","reasonPT":"Funciona, mas não é o padrão."},{"letter":"D","en":"Keep the glutes covered and skip them","pt":"Manter coberto e pular a região","reasonEN":"Error in the opposite direction.","reasonPT":"Erro na direção oposta."}],"correct":1,"why":["Draping is listed as safe practice and as communication; both count.","Draping consta como prática segura e como comunicação; os dois contam."],"hook":["Tell a prone client before you move cloth.","Avise quem está de bruços antes de mexer no pano."],"practice":["Name the area, fold once, anchor at the far hip.","Nomeie a área, dobre uma vez, firme no quadril oposto."],"img":null},{"id":21,"d":"ETI","l":3,"flag":"FIRST","s":"rights","q":["Camila, 32, has had abdominal tension for two weeks. A client in her first session asks to keep both legs covered while you work the abdomen. What comes FIRST?","Camila, 32 anos, sente tensão abdominal há duas semanas. Uma cliente na primeira sessão pede para manter as duas pernas cobertas enquanto você trabalha o abdome. O que vem PRIMEIRO?"],"options":[{"letter":"A","en":"Explain the limited exposure and confirm","pt":"Explicar a exposição limitada e confirmar","reasonEN":"Consent precedes the change.","reasonPT":"Consentimento precede a mudança."},{"letter":"B","en":"Move the drape and explain afterward","pt":"Mover a cobertura e explicar depois","reasonEN":"Permission should come first.","reasonPT":"A permissão deve vir antes."},{"letter":"C","en":"Uncover the legs, it is standard","pt":"Descobrir as pernas, é o padrão","reasonEN":"Standard does not override her limit.","reasonPT":"O padrão não supera o limite dela."},{"letter":"D","en":"Treat her agreement as consent to everything","pt":"Tratar a concordância como consentimento a tudo","reasonEN":"Consent is specific.","reasonPT":"Consentimento é específico."}],"correct":0,"why":["Respect the limit, say what will be exposed, confirm.","Respeite o limite, diga o que será exposto, confirme."],"hook":["Explain, cover, confirm, then move.","Explique, cubra, confirme, depois mova."],"practice":["If the work cannot fit her limits, agree on another plan.","Se o trabalho não couber nos limites, combinem outro plano."],"img":null},{"id":22,"d":"ETI","l":2,"flag":"0","s":"rights","q":["Marco, 45, has had shoulder tension for one week. He signed the form yesterday. Today he declines the same technique. What governs today?","Marco, 45 anos, sente tensão no ombro há uma semana. Ele assinou a ficha ontem. Hoje recusa a mesma técnica. O que governa hoje?"],"options":[{"letter":"A","en":"The signed form","pt":"A ficha assinada","reasonEN":"Yesterday does not bind today.","reasonPT":"Ontem não obriga hoje."},{"letter":"B","en":"The therapist's plan","pt":"O plano do terapeuta","reasonEN":"The plan is a proposal.","reasonPT":"O plano é proposta."},{"letter":"C","en":"Today's refusal","pt":"A recusa de hoje","reasonEN":"Autonomy is current.","reasonPT":"Autonomia é atual."},{"letter":"D","en":"A new signature","pt":"Uma nova assinatura","reasonEN":"Useful, not required to refuse.","reasonPT":"Útil, não exigida para recusar."}],"correct":2,"why":["Consent can be withdrawn at any moment, even mid-session.","O consentimento pode ser retirado a qualquer momento, até no meio."],"hook":["Today's no beats yesterday's yes.","O não de hoje supera o sim de ontem."],"practice":["Thank him and offer an alternative.","Agradeça e ofereça alternativa."],"img":null},{"id":23,"d":"ETI","l":3,"flag":"0","s":"ethics","q":["A 45-year-old practitioner has been considering a practice sale for three weeks. You are selling your practice. The buyer asks for named client histories. What do you do?","Um profissional de 45 anos considera vender o consultório há três semanas. Você está vendendo sua prática. O comprador pede históricos identificados de clientes. O que fazer?"],"options":[{"letter":"A","en":"Send everything, to show transparency","pt":"Enviar tudo, para mostrar transparência","reasonEN":"Honesty is not the issue.","reasonPT":"Honestidade não é o problema."},{"letter":"B","en":"Send only records without names","pt":"Enviar só registros sem nomes","reasonEN":"Loses the point of a history.","reasonPT":"Perde a utilidade do histórico."},{"letter":"C","en":"Assume the sale transfers consent","pt":"Presumir que a venda transfere consentimento","reasonEN":"Sale is not authorization.","reasonPT":"Venda não é autorização."},{"letter":"D","en":"Check what the rules allow and disclose within that","pt":"Verificar o que as regras permitem e divulgar nesse limite","reasonEN":"Confidentiality survives the sale.","reasonPT":"Confidencialidade sobrevive à venda."}],"correct":3,"why":["A business transaction does not erase the duty of confidentiality.","Transação comercial não apaga o dever de sigilo."],"hook":["Selling the business does not sell the privacy.","Vender o negócio não vende a privacidade."],"practice":["Ask the board or a lawyer what must be in the sale terms.","Pergunte ao conselho ou a um advogado o que deve constar no contrato."],"img":null},{"id":24,"d":"ETI","l":3,"flag":"FIRST","s":"abmp","q":["Ana, 57, has had back tension for six months and attends regularly. A long-time client gives you an expensive gift and asks for priority booking from now on. What comes FIRST?","Ana, 57 anos, sente tensão nas costas há seis meses e faz sessões regulares. Uma cliente antiga te dá um presente caro e pede prioridade de agenda a partir de agora. O que vem PRIMEIRO?"],"options":[{"letter":"A","en":"Accept and promise priority forever","pt":"Aceitar e prometer prioridade para sempre","reasonEN":"Creates obligation.","reasonPT":"Cria obrigação."},{"letter":"B","en":"Take the gift as proof of consent","pt":"Tomar o presente como prova de consentimento","reasonEN":"Gift is not consent.","reasonPT":"Presente não é consentimento."},{"letter":"C","en":"Discuss the limit and decline the condition","pt":"Conversar sobre o limite e recusar a condição","reasonEN":"Keeps the relationship even.","reasonPT":"Mantém a relação equilibrada."},{"letter":"D","en":"Dismiss the client without discussing the boundary","pt":"Dispensar a cliente sem conversar sobre o limite","reasonEN":"This skips the necessary boundary conversation.","reasonPT":"Isso pula a conversa necessária sobre limites."}],"correct":2,"why":["Discuss the boundary and decline the requested exception. Gift policies differ; the condition attached to this gift is the problem in this case.","Converse sobre o limite e recuse a exceção solicitada. Políticas sobre presentes variam; a condição ligada a este presente é o problema aqui."],"hook":["A gift cannot buy an exception.","Presente não compra exceção."],"practice":["Explain the policy you actually apply to everyone.","Explique a política que você aplica a todos."],"img":null},{"id":25,"d":"ETI","l":2,"flag":"0","s":"rights","q":["Lia, 37, has had back discomfort for two weeks and is a current client. A friend asks whether a named person is your client. What do you answer?","Lia, 37 anos, sente desconforto nas costas há duas semanas e é cliente atual. Uma amiga pergunta se determinada pessoa é sua cliente. O que responder?"],"options":[{"letter":"A","en":"Yes, and mention her diagnosis","pt":"Sim, e citar o diagnóstico","reasonEN":"Diagnosis is extra information.","reasonPT":"Diagnóstico é informação a mais."},{"letter":"B","en":"That you do not confirm whether anyone is a client","pt":"Que você não confirma se alguém é cliente","reasonEN":"Even the bond is private.","reasonPT":"Até o vínculo é privado."},{"letter":"C","en":"Only if the friend is trustworthy","pt":"Só se a amiga for confiável","reasonEN":"Trust is not authorization.","reasonPT":"Confiança não é autorização."},{"letter":"D","en":"Yes, if she promises not to tell","pt":"Sim, se ela prometer não contar","reasonEN":"Still disclosure.","reasonPT":"Ainda é divulgação."}],"correct":1,"why":["Being someone's therapist is confidential information too.","Ser terapeuta de alguém também é informação sigilosa."],"hook":["Knowing who is a client is already private.","Saber quem é cliente já é privado."],"practice":["Say you do not comment on who you attend.","Diga que não comenta quem você atende."],"img":null},{"id":27,"d":"AVA","l":2,"flag":"FIRST","s":"rights","q":["A new client, Vitor, 40, says his shoulder has hurt for a week. He is already on the table. What happens FIRST?","Um cliente novo, Vitor, 40, diz que o ombro dói há uma semana. Ele já está na maca. O que acontece PRIMEIRO?"],"options":[{"letter":"A","en":"Start with light effleurage to warm up","pt":"Começar com deslizamento leve para aquecer","reasonEN":"Technique before information.","reasonPT":"Técnica antes de informação."},{"letter":"B","en":"Take history and goals before planning","pt":"Colher histórico e objetivos antes de planejar","reasonEN":"Assessment precedes treatment.","reasonPT":"Avaliação precede tratamento."},{"letter":"C","en":"Test resisted shoulder movement","pt":"Testar movimento resistido do ombro","reasonEN":"Good, but after the history.","reasonPT":"Bom, mas depois do histórico."},{"letter":"D","en":"Diagnose the likely cause for him","pt":"Diagnosticar a causa provável para ele","reasonEN":"Diagnosis exceeds the role.","reasonPT":"Diagnóstico excede o papel."}],"correct":1,"why":["Nothing is chosen before the history and the goal are clear.","Nada se escolhe antes de histórico e objetivo claros."],"hook":["Questions before hands.","Perguntas antes das mãos."],"practice":["Ask onset, what worsens it, what he wants back.","Pergunte início, o que piora e o que ele quer recuperar."],"img":null},{"id":28,"d":"AVA","l":2,"flag":"FIRST","s":"rights","q":["Marina, 46, has had neck pain for five days. Mid-session, Marina says the pressure is too much on the neck. What comes FIRST?","Marina, 46 anos, sente dor cervical há cinco dias. No meio da sessão, Marina diz que a pressão está demais no pescoço. O que vem PRIMEIRO?"],"options":[{"letter":"A","en":"Reduce pressure and check in","pt":"Reduzir a pressão e checar","reasonEN":"Immediate response to the signal.","reasonPT":"Resposta imediata ao sinal."},{"letter":"B","en":"Keep pressure, it is a sensitive area","pt":"Manter, é área sensível","reasonEN":"Sensitivity does not equal tolerance.","reasonPT":"Sensibilidade não é tolerância."},{"letter":"C","en":"Move to another region","pt":"Mudar de região","reasonEN":"May work, but confirm first.","reasonPT":"Pode funcionar, mas confirme antes."},{"letter":"D","en":"Explain that discomfort is expected","pt":"Explicar que o desconforto é esperado","reasonEN":"Explanation does not relieve it.","reasonPT":"Explicação não alivia."}],"correct":0,"why":["Pressure is a live negotiation, not a decision made once.","Pressão é negociação viva, não decisão única."],"hook":["Pain changes the pressure conversation.","Dor muda a conversa sobre pressão."],"practice":["Ask \"less, same, or stop?\" and follow the answer.","Pergunte \"menos, igual ou parar?\" e siga a resposta."],"img":null},{"id":29,"d":"AVA","l":2,"flag":"0","s":"soap","q":["Theo, 38, has had neck pain for four days and rates it today. The note reads: \"Client rates neck pain 6/10 today.\" Which SOAP section is this?","Theo, 38 anos, sente dor cervical há quatro dias e atribui uma nota hoje. A nota diz: \"Cliente classifica dor cervical 6/10 hoje.\" Qual seção SOAP é essa?"],"options":[{"letter":"A","en":"Subjective","pt":"Subjetivo","reasonEN":"Client-reported information.","reasonPT":"Informação relatada pelo cliente."},{"letter":"B","en":"Objective","pt":"Objetivo","reasonEN":"That is what you measure.","reasonPT":"Isso é o que você mede."},{"letter":"C","en":"Assessment","pt":"Avaliação","reasonEN":"That is your interpretation.","reasonPT":"Isso é sua interpretação."},{"letter":"D","en":"Plan","pt":"Plano","reasonEN":"That is the next step.","reasonPT":"Isso é o próximo passo."}],"correct":0,"why":["A pain score is the client's report, so it is subjective.","Nota de dor é relato do cliente, logo subjetivo."],"hook":["S is what they Say.","S é o que a pessoa diz."],"practice":["Write her words, not your summary.","Escreva as palavras dela, não seu resumo."],"img":null},{"id":30,"d":"AVA","l":2,"flag":"EXCEPT","s":"soap","q":["Nina, 41, has had shoulder stiffness for three weeks; a therapist compares chart sections. All of these belong in the Objective section EXCEPT:","Nina, 41 anos, tem rigidez no ombro há três semanas; o terapeuta compara as seções do prontuário. Todos pertencem ao campo Objetivo, EXCETO:"],"options":[{"letter":"A","en":"Measured neck rotation in degrees","pt":"Rotação cervical medida em graus","reasonEN":"A measurement.","reasonPT":"Uma medida."},{"letter":"B","en":"Tissue temperature on palpation","pt":"Temperatura do tecido à palpação","reasonEN":"A finding.","reasonPT":"Um achado."},{"letter":"C","en":"The client's description of the pain","pt":"A descrição da dor pelo cliente","reasonEN":"Report is subjective.","reasonPT":"Relato é subjetivo."},{"letter":"D","en":"Visible swelling over the joint","pt":"Edema visível sobre a articulação","reasonEN":"An observation.","reasonPT":"Uma observação."}],"correct":2,"why":["Anything reported rather than observed or measured is subjective.","Tudo relatado, e não observado ou medido, é subjetivo."],"hook":["Observed is O. Reported is S.","Observado é O. Relatado é S."],"practice":["Separate the two before writing a single line.","Separe os dois antes de escrever uma linha."],"img":null},{"id":31,"d":"AVA","l":3,"flag":"0","s":"soap","q":["Omar, 52, has had limited neck rotation for one month and plans a follow-up. The note says: \"Reassess pain-free rotation next visit.\" Which section is this?","Omar, 52 anos, tem rotação cervical limitada há um mês e planeja acompanhamento. A nota diz: \"Reavaliar rotação sem dor na próxima visita.\" Qual seção é essa?"],"options":[{"letter":"A","en":"Subjective","pt":"Subjetivo","reasonEN":"Not a report.","reasonPT":"Não é relato."},{"letter":"B","en":"Objective","pt":"Objetivo","reasonEN":"Not a measurement yet.","reasonPT":"Ainda não é medida."},{"letter":"C","en":"Assessment","pt":"Avaliação","reasonEN":"Not the interpretation.","reasonPT":"Não é a interpretação."},{"letter":"D","en":"Plan","pt":"Plano","reasonEN":"Future action belongs here.","reasonPT":"Ação futura pertence aqui."}],"correct":3,"why":["Anything you intend to do next is Plan.","Qualquer intenção futura é Plano."],"hook":["Tomorrow belongs in the plan.","O amanhã mora no plano."],"practice":["Date the reassessment so it actually happens.","Date a reavaliação para que ela aconteça."],"img":null},{"id":32,"d":"AVA","l":3,"flag":"0","s":"motion","q":["Joana, 35, has had difficulty lifting her arm for two weeks. You ask Joana to lift her arm alone while you watch. Which are you testing?","Joana, 35 anos, tem dificuldade para elevar o braço há duas semanas. Você pede que Joana eleve o braço sozinha enquanto observa. O que está testando?"],"options":[{"letter":"A","en":"Passive range","pt":"Amplitude passiva","reasonEN":"You would move it.","reasonPT":"Você moveria."},{"letter":"B","en":"Active range","pt":"Amplitude ativa","reasonEN":"She moves it herself.","reasonPT":"Ela move sozinha."},{"letter":"C","en":"Resisted movement","pt":"Movimento resistido","reasonEN":"You would oppose.","reasonPT":"Você se oporia."},{"letter":"D","en":"Joint play","pt":"Movimento articular acessório","reasonEN":"Small amplitude, not this.","reasonPT":"Pequena amplitude, não isso."}],"correct":1,"why":["Self-generated movement is active by definition.","Movimento gerado pelo próprio cliente é ativo por definição."],"hook":["Their effort, their movement.","Esforço deles, movimento deles."],"practice":["Note degrees and where she reports discomfort.","Anote os graus e onde ela relata desconforto."],"img":null},{"id":34,"d":"AVA","l":3,"flag":"EXCEPT","s":"rights","q":["Bia, 47, has had neck stiffness for six weeks and wants to compare visits. All of these help you compare change across sessions EXCEPT:","Bia, 47 anos, sente rigidez cervical há seis semanas e quer comparar sessões. Todos ajudam a comparar mudança entre sessões, EXCETO:"],"options":[{"letter":"A","en":"Repeating the same measure","pt":"Repetir a mesma medida","reasonEN":"Comparability requires it.","reasonPT":"Comparabilidade exige."},{"letter":"B","en":"Using the same position and instruction","pt":"Usar a mesma posição e instrução","reasonEN":"Controls the variables.","reasonPT":"Controla as variáveis."},{"letter":"C","en":"Changing to a new test each time","pt":"Mudar para um teste novo a cada vez","reasonEN":"Breaks comparison.","reasonPT":"Quebra a comparação."},{"letter":"D","en":"Recording the numbers","pt":"Registrar os números","reasonEN":"Memory is not a record.","reasonPT":"Memória não é registro."}],"correct":2,"why":["A different test cannot be compared to the previous one.","Teste diferente não se compara ao anterior."],"hook":["Same ruler, useful comparison.","Mesma régua, comparação útil."],"practice":["Pick two measures and keep them fixed.","Escolha duas medidas e mantenha fixas."],"img":null},{"id":35,"d":"AVA","l":2,"flag":"FIRST","s":"rights","q":["Nico, 49, has had shoulder discomfort for five days. A client on the table asks you to stop touching the shoulder. What comes FIRST?","Nico, 49 anos, sente desconforto no ombro há cinco dias. Um cliente na maca pede para você parar de tocar o ombro. O que vem PRIMEIRO?"],"options":[{"letter":"A","en":"Finish that area quickly","pt":"Terminar a área rápido","reasonEN":"Finishing is not stopping.","reasonPT":"Terminar não é parar."},{"letter":"B","en":"Lift your hands off the shoulder","pt":"Tirar as mãos do ombro","reasonEN":"The request is about the contact.","reasonPT":"O pedido é sobre o contato."},{"letter":"C","en":"Explain why you were there","pt":"Explicar por que estava ali","reasonEN":"Explanation after removal.","reasonPT":"Explicação depois de retirar."},{"letter":"D","en":"Ask if the pressure was too much","pt":"Perguntar se a pressão era demais","reasonEN":"Good, but hands come off first.","reasonPT":"Bom, mas as mãos saem antes."}],"correct":1,"why":["Hands come off on the request; the conversation comes after.","As mãos saem no pedido; a conversa vem depois."],"hook":["A stop request ends the touch.","Pedido de parada encerra o toque."],"practice":["Remove, then ask if another area or pressure is fine.","Retire, depois pergunte se outra área ou pressão serve."],"img":null},{"id":36,"d":"PRO","l":1,"flag":"FIRST","s":"cdc","q":["A 36-year-old practitioner has noticed lotion residue between clients for two days. There is visible lotion residue on the table. What comes FIRST?","Um profissional de 36 anos nota resíduos de loção entre clientes há dois dias. Há resíduo visível de loção na maca. O que vem PRIMEIRO?"],"options":[{"letter":"A","en":"Disinfect over the residue","pt":"Desinfetar sobre o resíduo","reasonEN":"Product works worse on soil.","reasonPT":"O produto rende menos com sujeira."},{"letter":"B","en":"Clean off the residue","pt":"Limpar o resíduo","reasonEN":"Soil blocks the disinfectant.","reasonPT":"A sujeira bloqueia o desinfetante."},{"letter":"C","en":"Wipe with a dry cloth and finish","pt":"Passar pano seco e encerrar","reasonEN":"Removes little.","reasonPT":"Remove pouco."},{"letter":"D","en":"Spray fragrance to freshen","pt":"Borrifar aroma para refrescar","reasonEN":"Odor is not cleaning.","reasonPT":"Odor não é limpeza."}],"correct":1,"why":["Cleaning comes before disinfection; soil protects what lives under it.","Limpeza vem antes da desinfecção; sujeira protege o que vive embaixo."],"hook":["Remove the dirt before the germ step.","Tire a sujeira antes da etapa contra germe."],"practice":["Clean, then disinfect with contact time.","Limpe, depois desinfete com tempo de contato."],"img":null},{"id":37,"d":"PRO","l":2,"flag":"0","s":"cdc","q":["A 44-year-old clinic manager has reviewed infection-control steps for two weeks. Which process does NOT necessarily eliminate bacterial spores?","Um gestor de clínica de 44 anos revisa controle de infecção há duas semanas. Qual processo NÃO elimina necessariamente esporos bacterianos?"],"options":[{"letter":"A","en":"Sterilization","pt":"Esterilização","reasonEN":"That is its definition.","reasonPT":"Essa é a definição."},{"letter":"B","en":"Disinfection","pt":"Desinfecção","reasonEN":"Kills most pathogens, spores survive.","reasonPT":"Mata a maioria, esporo sobrevive."},{"letter":"C","en":"Autoclave processing","pt":"Processamento em autoclave","reasonEN":"A sterilization method.","reasonPT":"Um método de esterilização."},{"letter":"D","en":"A validated steam sterilization cycle","pt":"Um ciclo validado de esterilização a vapor","reasonEN":"This is a sterilization method that covers spores.","reasonPT":"É método de esterilização que abrange esporos."}],"correct":1,"why":["Only sterilization covers spores.","Só a esterilização cobre esporos."],"hook":["All forms includes spores.","Todas as formas inclui esporos."],"practice":["Match the process to the item, not to habit.","Case o processo ao item, não ao hábito."],"img":null},{"id":38,"d":"PRO","l":2,"flag":"0","s":"cdc","q":["A 31-year-old practitioner has been using this surface product for one week. The label says the surface must stay wet for three minutes. What do you do?","Um profissional de 31 anos usa este produto de superfície há uma semana. O rótulo diz que a superfície deve ficar molhada por três minutos. O que fazer?"],"options":[{"letter":"A","en":"Wipe it dry right away","pt":"Secar imediatamente","reasonEN":"Drying ends the action.","reasonPT":"Secar encerra a ação."},{"letter":"B","en":"Keep it wet for the full time","pt":"Manter molhada pelo tempo todo","reasonEN":"Contact time is the rule.","reasonPT":"Tempo de contato é a regra."},{"letter":"C","en":"Use scent to judge it is done","pt":"Usar o cheiro para julgar","reasonEN":"Odor is not a clock.","reasonPT":"Odor não é relógio."},{"letter":"D","en":"Apply twice and dry fast","pt":"Aplicar duas vezes e secar rápido","reasonEN":"Doubling does not replace time.","reasonPT":"Dobrar não substitui o tempo."}],"correct":1,"why":["The label defines correct use; wet time is part of it.","O rótulo define o uso correto; o tempo molhado faz parte."],"hook":["Wet for the time on the label.","Molhado pelo tempo do rótulo."],"practice":["Read the label before you start, not after.","Leia o rótulo antes de começar, não depois."],"img":null},{"id":39,"d":"PRO","l":2,"flag":"0","s":"mechanics","q":["You are 35, your lower back aches every evening, and you work bent over a low table. This lower-back ache has lasted two weeks. What changes?","Você tem 35 anos, sua lombar dói toda noite e você trabalha inclinado sobre uma mesa baixa. Essa dor lombar dura duas semanas. O que muda?"],"options":[{"letter":"A","en":"Raise the table and step closer","pt":"Elevar a mesa e aproximar-se","reasonEN":"Less flexion, less reach.","reasonPT":"Menos flexão, menos alcance."},{"letter":"B","en":"Lower the table and lock the feet","pt":"Baixar a mesa e fixar os pés","reasonEN":"More bending.","reasonPT":"Mais inclinação."},{"letter":"C","en":"Twist the trunk to reach across","pt":"Torcer o tronco para alcançar","reasonEN":"Twisting adds load.","reasonPT":"Torção soma carga."},{"letter":"D","en":"Push harder with the same posture","pt":"Empurrar mais com a mesma postura","reasonEN":"Force does not fix posture.","reasonPT":"Força não corrige postura."}],"correct":0,"why":["Height and proximity are the two variables that remove the load.","Altura e proximidade são as duas variáveis que tiram a carga."],"hook":["Bring the work to your base.","Traga o trabalho para a sua base."],"practice":["Adjust height before the first stroke, not after the pain.","Ajuste a altura antes da primeira manobra."],"img":null},{"id":40,"d":"PRO","l":3,"flag":"FIRST","s":"ethics","q":["A 43-year-old practitioner has been reviewing notes from this week. You notice a wrong date in a note you finished yesterday. What comes FIRST?","Um profissional de 43 anos revisa anotações desta semana. Você percebe uma data errada numa nota que finalizou ontem. O que vem PRIMEIRO?"],"options":[{"letter":"A","en":"Erase the original entry","pt":"Apagar o registro original","reasonEN":"Erasing loses the trail.","reasonPT":"Apagar perde o histórico."},{"letter":"B","en":"Rewrite the note with the right date","pt":"Reescrever a nota com a data certa","reasonEN":"Looks clean, hides the change.","reasonPT":"Parece limpo, esconde a mudança."},{"letter":"C","en":"Add a dated correction that names the error","pt":"Acrescentar correção datada que nomeia o erro","reasonEN":"Keeps the history visible.","reasonPT":"Mantém o histórico visível."},{"letter":"D","en":"Wait and see if anyone notices","pt":"Esperar para ver se alguém nota","reasonEN":"The error stays live.","reasonPT":"O erro segue valendo."}],"correct":2,"why":["Correction keeps the record accurate and the trail intact.","A correção mantém o registro preciso e o rastro intacto."],"hook":["Correct the record, keep the trail.","Corrija o registro, preserve o rastro."],"practice":["Initial and date the correction, never backdate.","Rubrique e date a correção, nunca retroaja."],"img":null},{"id":41,"d":"PRO","l":2,"flag":"0","s":"insurance","q":["Sara, 54, has reported pain since a session two days ago. A client says the massage injured her and mentions a lawyer. Which policy answers this?","Sara, 54 anos, relata dor desde uma sessão há dois dias. Uma cliente diz que a massagem a lesionou e menciona advogado. Qual apólice responde a isso?"],"options":[{"letter":"A","en":"Health insurance","pt":"Plano de saúde","reasonEN":"Covers her body, not your claim.","reasonPT":"Cobre o corpo dela, não a sua alegação."},{"letter":"B","en":"Homeowners insurance","pt":"Seguro residencial","reasonEN":"Residential property.","reasonPT":"Imóvel residencial."},{"letter":"C","en":"Professional liability","pt":"Responsabilidade profissional","reasonEN":"Covers alleged negligence in practice.","reasonPT":"Cobre alegada negligência no exercício."},{"letter":"D","en":"Business interruption","pt":"Interrupção de atividade","reasonEN":"Lost income after shutdown.","reasonPT":"Renda perdida após fechamento."}],"correct":2,"why":["Alleged negligent care is exactly what professional liability covers.","Cuidado negligente alegado é exatamente o que a responsabilidade cobre."],"hook":["A treatment claim needs professional cover.","Alegação de atendimento pede cobertura profissional."],"practice":["Read the policy before there is a claim, not after.","Leia a apólice antes da reclamação."],"img":null},{"id":42,"d":"PRO","l":3,"flag":"EXCEPT","s":"ppe","q":["A 41-year-old clinic manager has reviewed safety steps for two weeks. All of these are standard precautions EXCEPT:","Um gestor de clínica de 41 anos revisa medidas de segurança há duas semanas. Todas são precauções padrão, EXCETO:"],"options":[{"letter":"A","en":"Hand hygiene before and after contact","pt":"Higiene das mãos antes e depois do contato","reasonEN":"Core precaution.","reasonPT":"Precaução central."},{"letter":"B","en":"Gloves when fluid contact is expected","pt":"Luvas quando se prevê contato com fluido","reasonEN":"Barrier for anticipated contact.","reasonPT":"Barreira para contato previsto."},{"letter":"C","en":"Sterilizing the table between every client","pt":"Esterilizar a maca entre cada cliente","reasonEN":"Table is disinfected, not sterilized.","reasonPT":"Maca é desinfetada, não esterilizada."},{"letter":"D","en":"Not recapping a used needle bare-handed","pt":"Não reencapar agulha usada com a mão nua","reasonEN":"Standard practice.","reasonPT":"Prática padrão."}],"correct":2,"why":["Surface disinfection is the level for a table; sterilization is for critical items.","Desinfecção de superfície é o nível da maca; esterilização é para item crítico."],"hook":["The table does not go in the autoclave.","A maca não entra na autoclave."],"practice":["Clean, then disinfect, with the label time.","Limpe, depois desinfete, com o tempo do rótulo."],"img":null},{"id":43,"d":"EFE","l":3,"flag":"0","s":"anatomy","q":["Mia, 48, has felt stressed for three weeks. After a calm session, her heart rate is lower. Which autonomic pattern is consistent with that observation, without claiming the massage caused it?","Mia, 48 anos, sente estresse há três semanas. Após sessão tranquila, sua frequência cardíaca está menor. Qual padrão autonômico é compatível com a observação, sem afirmar que a massagem a causou?"],"options":[{"letter":"A","en":"Sympathetic dominance increases","pt":"O predomínio simpático aumenta","reasonEN":"That raises it.","reasonPT":"Isso eleva."},{"letter":"B","en":"A shift toward parasympathetic dominance","pt":"Um desvio para predomínio parassimpático","reasonEN":"Rest and digest lowers it.","reasonPT":"Repouso e digestão reduzem."},{"letter":"C","en":"Mechanical compression of the heart","pt":"Compressão mecânica do coração","reasonEN":"Not how it works.","reasonPT":"Não é assim."},{"letter":"D","en":"Reduced blood volume","pt":"Volume sanguíneo reduzido","reasonEN":"Does not change in minutes.","reasonPT":"Não muda em minutos."}],"correct":1,"why":["Greater parasympathetic activity is consistent with a slower heart rate, but one before-and-after observation does not establish cause.","Maior atividade parassimpática é compatível com frequência cardíaca menor, mas uma observação antes e depois não estabelece causa."],"hook":["Slower heart is the rest branch talking.","Coração mais lento é o ramo do repouso falando."],"practice":["Note heart rate and breathing before and after.","Registre pulso e respiração antes e depois."],"img":null},{"id":44,"d":"EFE","l":2,"flag":"0","s":"thermal","q":["Maya, 28, has had ankle swelling since a sprain 20 hours ago. Twenty hours after a sprain, with swelling and warmth, which application fits?","Maya, 28 anos, tem inchaço no tornozelo desde uma entorse há 20 horas. Vinte horas após uma entorse, com edema e calor, qual aplicação cabe?"],"options":[{"letter":"A","en":"Moist heat over the swelling","pt":"Calor úmido sobre o edema","reasonEN":"Heat may increase acute swelling.","reasonPT":"Calor pode aumentar o edema agudo."},{"letter":"B","en":"Brief protected cold with skin checks","pt":"Frio breve e protegido, checando a pele","reasonEN":"Vasoconstriction limits swelling and pain.","reasonPT":"Vasoconstrição limita edema e dor."},{"letter":"C","en":"Ice until the area is numb","pt":"Gelo até anestesiar","reasonEN":"Numbness is not the target.","reasonPT":"Anestesia não é a meta."},{"letter":"D","en":"Heat then deep friction","pt":"Calor e depois fricção profunda","reasonEN":"Friction is much for an acute sprain.","reasonPT":"Fricção é muito para entorse aguda."}],"correct":1,"why":["Cold limits the early vascular response; protect the skin and check it.","Frio limita a resposta vascular inicial; proteja e cheque a pele."],"hook":["Cool the flare, don't force the repair.","Esfrie a crise, não force o reparo."],"practice":["Wrapped pack, ten minutes, check between.","Compressa protegida, dez minutos, cheque entre."],"img":null},{"id":45,"d":"EFE","l":2,"flag":"0","s":"thermal","q":["Luis, 46, has had stable, non-swollen neck stiffness for six months. He has had stiff, non-swollen neck for six months. Which preparation fits the session?","Luis, 46 anos, tem rigidez cervical estável e sem edema há seis meses. Ele tem pescoço rígido e sem edema há seis meses. Qual preparação cabe à sessão?"],"options":[{"letter":"A","en":"Prolonged ice to numb the area","pt":"Gelo prolongado para anestesiar","reasonEN":"Numbness does not prepare movement.","reasonPT":"Anestesia não prepara movimento."},{"letter":"B","en":"A scalding pack for depth","pt":"Compressa escaldante para profundidade","reasonEN":"Burn risk.","reasonPT":"Risco de queimadura."},{"letter":"C","en":"Comfortable moist warmth with skin checks","pt":"Calor úmido confortável checando a pele","reasonEN":"Vasodilation eases stiffness.","reasonPT":"Vasodilatação alivia rigidez."},{"letter":"D","en":"Forced stretch before any heat","pt":"Alongamento forçado antes do calor","reasonEN":"Cold tissue resists more.","reasonPT":"Tecido frio resiste mais."}]," es."}],"correct":2,"why":["Pressure is a fit, not a ranking.","Pressão é ajuste, não ranking."],"hook":["Deeper is not automatically better.","Mais profundo não é automaticamente melhor."],"practice":["Agree on a comfort scale and check as you go.","Combine escala de conforto e cheque durante."],"img":null},{"id":49,"d":"CIN","l":4,"flag":"FIRST","s":"abduction","q":["Rui, 55, has had difficulty raising his arm for two weeks; passive movement is more complete than active movement. Which muscle contributes FIRST to normal shoulder abduction, without treating this finding as a diagnosis?","Rui, 55 anos, tem dificuldade para elevar o braço há duas semanas; o movimento passivo é mais completo que o ativo. Qual músculo contribui PRIMEIRO para a abdução normal do ombro, sem usar esse achado como diagnóstico?"],"options":[{"letter":"A","en":"Deltoid","pt":"Deltoide","reasonEN":"Takes over later in range.","reasonPT":"Assume mais adiante."},{"letter":"B","en":"Supraspinatus","pt":"Supraespinhal","reasonEN":"Initiates the first degrees.","reasonPT":"Inicia os primeiros graus."},{"letter":"C","en":"Latissimus dorsi","pt":"Latíssimo do dorso","reasonEN":"Adductor and extensor.","reasonPT":"Adutor e extensor."},{"letter":"D","en":"The joint capsule","pt":"A cápsula articular","reasonEN":"Passive range does not by itself localize the cause of weakness.","reasonPT":"Amplitude passiva, isoladamente, não localiza a causa da fraqueza."}],"correct":1,"why":["Supraspinatus helps initiate abduction. Active-passive differences alone cannot identify the cause of Rui’s limitation.","O supraespinhal ajuda a iniciar a abdução. Diferenças entre movimento ativo e passivo não identificam, sozinhas, a causa da limitação de Rui."],"hook":["The first lift has a helper.","O início da elevação tem um ajudante."],"practice":["Record both active and passive ranges and refer unexplained weakness.","Registre amplitudes ativa e passiva e encaminhe fraqueza sem explicação."],"img":null},{"id":50,"d":"ANA derme"}},{"id":62,"d":"ANA","l":3,"flag":"0","s":"motion","q":["Zara, 35, has had wrist pain for one week. When you explain where it is, which term correctly describes the fingers relative to the wrist?","Zara, 35, tem dor no punho há uma semana. Ao explicar onde é, qual termo descreve corretamente os dedos em relação ao punho?"],"options":[{"letter":"A","en":"Distal","pt":"Distal","reasonEN":"Farther from the trunk.","reasonPT":"Mais longe do tronco."},{"letter":"B","en":"Proximal","pt":"Proximal","reasonEN":"Toward the trunk.","reasonPT":"Em direção ao tronco."},{"letter":"C","en":"Medial","pt":"Medial","reasonEN":"Toward the midline.","reasonPT":"Em direção à linha média."},{"letter":"D","en":"Superior","pt":"Superior","reasonEN":"Above.","reasonPT":"Acima."}],"correct":0,"why":["Distal means farther from the trunk; the fingers are distal to the wrist.","Distal significa mais longe do tronco; os dedos são distais ao punho."],"hook":["Away from trunk: distal.","Longe do tronco: distal."],"practice":["Use distal and proximal instead of up and down.","Use distal e proximal em vez de cima e baixo."],"img":null},{"id":63,"d":"EFE","l":2,"flag":"0","s":"techniques","q":["Mila, 40, has had back tension for three weeks and agrees to a full session. Which stroke order fits the outline of a session?","Mila, 40, tem tensão nas costas há três semanas e aceita uma sessão completa. Qual ordem de manobras cabe no desenho de uma sessão?"],"options":[{"letter":"A","en":"Effleurage, then petrissage, then effleurage again","pt":"Effleurage, depois petrissage, depois effleurage de novo","reasonEN":"Glide opens and closes around deeper work.","reasonPT":"O deslizamento abre e fecha em volta do trabalho profundo."},{"letter":"B","en":"Petrissage, then effleurage, then tapotement to open","pt":"Petrissage, depois effleurage, depois tapotement para abrir","reasonEN":"Opens with kneading, not glide.","reasonPT":"Abre com amassamento, não com deslizamento."},{"letter":"C","en":"Tapotement rtão, depois leve — vasos linfáticos são superficiais."}],"correct":3,"why":["Drainage clears the proximal station before moving fluid, and pressure stays light because lymph vessels sit shallow.","A drenagem esvazia a estação proximal antes de mover líquido, e a pressão fica leve porque os vasos linfáticos são superficiais."],"hook":["Gate first, then light to the heart.","Portão primeiro, depois leve ao coração."],"practice":["Empty the groin before touching the ankle.","Esvazie a virilha antes de encostar no tornozelo."],"img":{"show":"Sentido centrípeto da drenagem, proximal primeiro","avoid":"Setas em direção ao pé","search":"lymphatic drainage leg direction arrows","capEN":"Clear the proximal station first.","capPT":"Esvazie a estação proximal primeiro.","check":"Setas da virilha para baixo depois ao coração"}}] .map(q=>({...q,id:"F"+String(q.id).padStart(2,"0"),options:q.options.map((o,i)=>({v:[o.en,o.pt,o.reasonEN,o.reasonPT],correct:i===q.correct}))}));
let ptEnabled=true;
let state={screen:'intro',at:0,answers:Array(20).fill(null),profile:null,exam:null};
function mount(html,light=false){document.body.classList.toggle('pt-off',!ptEnabled);document.body.classList.toggle('light',light);$('#app').innerHTML='<div class="fade">'+html+'</div>';const heading=$('main h1,main h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}window.scrollTo(0,0);}
function bind(id,fn){const el=document.getElementById(id);if(el)el.onclick=fn;}
function button(id,label,cls=''){return `<button type="button" id="${id}" class="${cls}">${label}</button>`;}
function navButtons(){return `<div class="topline">${button('nav-back','Voltar')}${button('nav-home','Início')}</div>`;}
function goHome(){const message=state.exam?'Ir ao início apaga as respostas desta rodada. Copie ou salve o relatório antes. Continuar?':'Ir ao início apaga as respostas do perfil desta sessão. Continuar?';if((state.answers.some(x=>x!==null)||state.exam)&&!confirm(message))return;state={screen:'intro',at:0,answers:Array(20).fill(null),profile:null,exam:null};intro();}
function backToSetup(){const e=state.exam;if((e.records.length||e.selected!==null)&&!confirm('Voltar à configuração encerra esta rodada e apaga as respostas. Use Rodada para salvar antes. Continuar?'))return;state.exam=null;setup();}
function backQuestion(){const e=state.exam;if(e.index===0){backToSetup();return;}e.index--;e.selected=e.records[e.index].selected;e.revealed=true;renderQuestion();}
function startProfile(){state={screen:'profile',at:0,answers:Array(20).fill(null),profile:null,exam:null};renderItem();}
function intro(){state.screen='intro';mount(`<section class="hero"><div><p class="eyebrow">MBLEx · treino bilíngue</p><h1>Simulado MBLEx</h1><p class="lead">${BANK.length} questões gerais e 50 em um bloco separado, em inglês com português abaixo.<br>O perfil de estudo é opcional e tem 20 escolhas.<br>Use Rodada para revisar e compartilhar as respostas.</p><div class="actions">${button('direct','Ir direto às questões','primary')}${button('start','Fazer perfil de estudo')}</div></div></section><details><summary>Fontes e limites</summary>${sourceNotes()}</details>`);bind('start',startProfile);bind('direct',()=>{state.profile=null;setup();});}
function ptButton(){return `<button type="button" id="pt-toggle" aria-label="PT on/off: tradução em português" aria-pressed="${ptEnabled}">${ptEnabled?'PT ligado':'PT desligado'}</button>${state.exam?`${button('round','Desempenho')}<button type="button" id="share-live" class="icon" aria-label="Compartilhar rodada e gráfico" title="Compartilhar rodada e gráfico"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg></button>`:''}`;}
function wirePT(){bind('pt-toggle',()=>{ptEnabled=!ptEnabled;document.body.classList.toggle('pt-off',!ptEnabled);const b=$('#pt-toggle');b.setAttribute('aria-pressed',String(ptEnabled));b.textContent=ptEnabled?'PT ligado':'PT desligado';});bind('round',reviewReport);bind('share-live',shareLive);}
function renderItem(){const i=state.at,[axis,q,opts]=ITEMS[i];mount(`<section class="question-shell"><div class="topline">${ptButton()}</div>${navButtons()}<div class="topline"><span class="eyebrow" style="margin:0">Seu perfil de estudo</span><span class="small num">${String(i+1).padStart(2,'0')} <span class="muted">/ 20</span></span></div><progress value="${i}" max="20" aria-label="${i} de 20 itens anteriores concluídos"></progress><p class="eyebrow">${esc(AXES[axis].split(':')[0])}</p><div class="question-text"><h2 lang="en">${esc(PROFILE_EN[i][0])}</h2><p lang="pt-BR" class="pt">${esc(q)}</p><div class="choices">${opts.map((x,j)=>`<button type="button" class="choice profile-choice" data-choice="${j}" aria-pressed="${state.answers[i]===j}"><span class="letter">${letters[j]}</span><span><span lang="en">${esc(PROFILE_EN[i][1][j])}</span><span lang="pt-BR" class="pt">${esc(x)}</span></span></button>`).join('')}</div></div><div class="actions">${button('next',i===19?'Ver meu perfil':'Continuar','primary')}</div><p class="small muted" style="margin-top:22px">Escolha uma opção para continuar. Ao sair ou recarregar, você perde as respostas.</p></section>`);wirePT();bind('nav-back',()=>{if(i){state.at--;renderItem();}else goHome();});bind('nav-home',goHome);$('#next').disabled=state.answers[i]===null;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.answers[i]=Number(b.dataset.choice);document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#next').disabled=false;});bind('next',()=>{if(state.answers[i]===null)return;if(i===19){state.profile=classify(state.answers);result();}else{state.at++;renderItem();}});}
function classify(a){if(a.length!==20||a.some(x=>!Number.isInteger(x)||x<0||x>3))throw Error('Responda todos os 20 itens.');const axes={};for(const key of Object.keys(AXES)){const ids=ITEMS.map((x,i)=>x[0]===key?i:-1).filter(i=>i>=0);axes[key]=Math.round(ids.reduce((n,i)=>n+ITEMS[i][3][a[i]],0)/ids.length*10)/10;}const can=[2,7,14],mot=[4,18],errs=[5,11,15,19];const scores={'ROTAÇÃO':(axes.RET+axes.PRA)/8,'ANSIOSA':axes.ANS/4*.8+errs.filter(i=>a[i]===2).length/4*.2,'VISUAL':can.filter(i=>a[i]===0).length/3,'AUDITIVA':can.filter(i=>a[i]===1).length/3,'PRAGMÁTICA':mot.reduce((n,i)=>n+ITEMS[i][3][a[i]],0)/8};const ranked=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]);const dominant=ranked[0],secondary=ranked[1],tie=Math.abs(scores[dominant]-scores[secondary])<.001;const anxious=scores.ANSIOSA>=.6,visual=scores.VISUAL>=.5,pragmatic=scores.PRAGMÁTICA>=.5;return {axes,scores,dominant,secondary,tie,note:Math.round(100*(scores[dominant]-scores[secondary])),config:{timer:anxious?'não':'sim',imagem:visual?'alta':scores.VISUAL>0?'média':'baixa',idioma:a[12]>=2?'PT':'EN',bloco:anxious||pragmatic?10:20},hour:ITEMS[8][2][a[8]],created:new Date()};}
function exportProfile(p,a){
 const d=p.created,pad=n=>String(n).padStart(2,'0');
 const header=`PERFIL-MBLEX v1\nDATA: ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}\nPERFIL: ${p.dominant} | SECUNDÁRIO: ${p.secondary}\nEIXOS: ${Object.keys(AXES).map(k=>`${k} (${p.axes[k]}/4)`).join(' ')}\nRESPOSTAS: ${a.map((x,i)=>`${i+1}${letters[x]}`).join(' ')}\nCONFIG: timer=${p.config.timer} imagem=${p.config.imagem} idioma=${p.config.idioma} bloco=${p.config.bloco}\nNOTA: ${p.note}`;
 const detailed=a.map((choice,i)=>`${i+1} | ${ITEMS[i][0]} | ${letters[choice]} | EN: ${PROFILE_EN[i][1][choice]} | PT: ${ITEMS[i][2][choice]}`).join('\n');
 const complete=`DOMINANTE: ${p.dominant} | SECUNDÁRIO: ${p.secondary} | NOTA: ${p.note}\n${Object.keys(AXES).map(k=>`${k} ${p.axes[k]}/4`).join(' ')}`;
 return `${header}\n\nRESPOSTAS DETALHADAS:\n${detailed}\n\nPERFIL COMPLETO:\n${complete}`;
}
function result(){state.screen='result';const p=state.profile,c=p.config;mount(`<p class="eyebrow">02 / Seu ponto de partida</p><h1 style="font-size:40px">Resultado do perfil</h1><div class="grid"><section class="glass"><span class="tag">Perfil predominante no autorrelato</span><h2 class="profile-name">${p.dominant}</h2><p class="small muted">Secundário: ${p.secondary} · apoio complementar</p><div class="reading">${PROFILES[p.dominant].lines.map(x=>`<p>${x}</p>`).join('')}</div>${p.tie?'<p class="note">Houve empate. A ordem dos rótulos é apenas operacional; não há predominância clara.</p>':''}<h3>Prescrição prática</h3><ul class="prescription">${PROFILES[p.dominant].rx.map(x=>`<li>${x}</li>`).join('')}</ul><p class="small"><b>Complemento:</b> ${PROFILES[p.secondary].rx[0]}</p><p class="small muted">Horário relatado: ${p.hour.toLowerCase()}.</p></section><section class="glass"><h2>Seu treino, ajustado.</h2><div class="config"><div><span>Timer inicial</span>${c.timer==='sim'?'Ativado':'A partir do 3º bloco'}</div><div><span>Imagens recomendadas</span>${c.imagem}</div><div><span>Primeiro idioma</span>Inglês + português abaixo</div><div><span>Tamanho do bloco</span>${c.bloco} questões</div></div><p class="small muted">O treino aplica timer e bloco; a apresentação começa em inglês, com tradução abaixo. O modo prova usa 100 itens em 110 minutos. O treino completo usa ${Math.ceil(BANK.length/c.bloco)} blocos (o último com ${BANK.length%c.bloco||c.bloco} itens).</p><h3>Seis eixos</h3>${Object.keys(AXES).map(k=>`<div class="axis" title="${AXES[k]}"><span>${k}</span><progress value="${p.axes[k]}" max="4" aria-label="${AXES[k]}: ${p.axes[k]} de 4"></progress><span>${p.axes[k]}/4</span></div>`).join('')}<details><summary>Entender pontuação e limites</summary><p>As pontuações organizam apenas as respostas desta sessão. Não medem memória real, personalidade, inteligência ou aptidão. Visual e auditiva são preferências de recurso, não estilos de aprendizagem comprovados.</p><p>RET/PRA: maior pontuação indica mais dependência de estudo concentrado. CAN: apoio visual ou oral relatado. ERR/ANS: interferência de leitura ou pressão. MOT: apoio de metas e idioma; horário é uma escolha neutra.</p><p>NOTA ${p.note}/100: diferença entre os dois maiores índices, em pontos percentuais. É um indicador editorial de separação, não confiança estatística nem chance de aprovação. Empates seguem a ordem rotação, ansiosa, visual, auditiva, pragmática.</p></details></section></div><p class="note">Perfil não é diagnóstico clínico. Um questionário de autorrelato não confirma a causa dos erros; o desempenho no treino deve conferir esta hipótese.</p><div class="actions">${button('review','Perfil e respostas')}${button('generate','Gerar resumo para enviar')}${button('configure','Configurar simulado','primary')}</div><div id="export"></div><div class="actions">${button('redo','Refazer perfil','quiet')}${button('home-result','Início')}</div>`);bind('review',reviewReport);bind('generate',()=>{const target=$('#export');target.innerHTML='<label for="summary-text">Resumo para enviar</label><textarea id="summary-text" readonly spellcheck="false"></textarea><div class="actions">'+button('copy','Copiar')+'</div><p id="copy-status" class="status" role="status"></p>';$('#summary-text').value=exportProfile(p,state.answers);bind('copy',()=>copyText($('#summary-text'),$('#copy-status')));target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});});bind('configure',setup);bind('home-result',goHome);bind('redo',()=>{if(confirm('Refazer apaga as respostas desta sessão. Continuar?'))startProfile();});}
async function copyText(field,status){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(field.value);}else{field.focus();field.select();field.setSelectionRange(0,field.value.length);if(!document.execCommand('copy'))throw Error('Cópia indisponível');}status.textContent='Copiado. Cole na mensagem que desejar.';}catch{field.focus();field.select();field.setSelectionRange(0,field.value.length);status.textContent='Cópia automática bloqueada. O texto está selecionado: use Copiar no menu do aparelho.';}}
function sourceNotes(){return `<p>Questões autorais de treino, inspiradas nos temas dos prints e no formato público do MBLEx. Não são itens oficiais nem reprodução de um exame real. Fontes consultadas em 05/11/2026; os links precisam de internet, o treino não.</p><p><b>Correções dos prints:</b> educação, competência e lei delimitam <i lang="en">scope of practice</i>, não <i lang="en">certificate</i>. Flashback isolado não prova transferência. As questões 28 e 37 repetem draping; várias imagens enviadas repetem a mesma página. Venda de prática não autoriza divulgar prontuários indiscriminadamente.</p><p>O exame oficial é adaptativo; este banco é fixo e sua dificuldade é editorial. Percentual neste treino não prevê aprovação. Alegação fornecida, não verificada: "Em 87 questões medidas de três bancos públicos, B e C concentraram 62% das respostas corretas. Amostra pequena: use só como desempate, depois de eliminar." Os bancos e gabaritos dessa medição não foram fornecidos. No banco geral as alternativas são embaralhadas a cada rodada; no bloco de 50 elas também são embaralhadas. A alegação de B e C não fundamenta preferência. Há duas repetições deliberadas, nas posições 40 e 80, para retomar conteúdo.</p><p><b>Exame:</b> 100 questões em 110 minutos; é preciso concluir todas. Resultado oficial PASS/FAIL, sem equivalência com percentual deste treino. Inscrição: US$ 265 no manual de setembro de 2026. O prazo de 30 dias citado no material enviado não foi confirmado nessa edição; confira a regra vigente com a FSMTB. <a href="${SOURCES.exam[1]}" target="_blank" rel="noopener noreferrer">Manual oficial</a>.</p><p><b>Nevada:</b> o conselho informa programa de pelo menos 625 horas e impressões digitais para verificação de antecedentes. Há outros requisitos; aprovação no exame não é licença. <a href="${SOURCES.nevada[1]}" target="_blank" rel="noopener noreferrer">Conselho de Nevada</a>.</p><details><summary>Mapa de revisão: termos e decisões</summary>${studyGuide()}</details><ul class="sources">${Object.values(SOURCES).map(([name,url])=>`<li><a href="${url}" target="_blank" rel="noopener noreferrer">${name}</a></li>`).join('')}</ul><p>Alterne fontes públicas de prática e compare explicações. Alegação fornecida, não verificada: "Em 87 questões medidas de três bancos públicos, B e C concentraram 62% das respostas corretas. Amostra pequena: use só como desempate, depois de eliminar." Os bancos e gabaritos dessa medição não foram fornecidos. No banco geral as alternativas são embaralhadas a cada rodada; no bloco de 50 elas também são embaralhadas. A alegação de B e C não fundamenta preferência. Um intervalo fixo de três semanas não é uma regra oficial de retenção.</p>`;}
function studyGuide(){const rows=[
['Global vs local','Febre ou suspeita de trombose exige adiar e encaminhar; hematoma recente exige cautela local e avaliação do contexto. Crônico não significa automaticamente seguro.','Fever or a suspected clot calls for deferral and referral; a fresh bruise requires local caution and contextual assessment. Chronic does not automatically mean safe.','massage'],
['Client rights vs therapist prerogative','Privacidade, cobertura e recusa são direitos do cliente. O profissional também pode recusar conduta insegura ou fora do escopo.','Privacy, draping and refusal are client rights. Practitioners may also decline unsafe or out-of-scope services.','rights'],
['Scope vs ethics','Escopo delimita atividades permitidas; ética orienta conduta. Certificado não substitui licença nem competência.','Scope defines permitted activities; ethics guides conduct. A certificate does not replace licensure or competence.','ethics'],
['Transference vs countertransference','Transferência: projeção do cliente. Contratransferência: questões pessoais do profissional interferem no atendimento. Flashback isolado não estabelece nenhum dos dois. Atalho incorreto do material: "Na prova, flashback durante a sessão é transference; o distrator é countertransference." Um flashback sozinho não sustenta essa resposta; procure projeção de sentimentos de relações anteriores no profissional.','Transference: client projection. Countertransference: practitioner issues affect care. An isolated flashback establishes neither. Do not label a flashback as transference without evidence of projection onto the practitioner.','transfer'],
['Abuse / misappropriation / power differential','Abuse: abuso. Misappropriation: apropriação indevida, por exemplo de bens. Power differential: influência desigual da relação profissional. Não são sinônimos.','Abuse, wrongful appropriation of property and unequal professional influence describe different conduct or circumstances.','abmp'],
['Cleaning / disinfection / sterilization','Limpeza remove sujeira. Desinfecção não garante eliminar esporos. Esterilização elimina formas microbianas, inclusive esporos; siga uso indicado do equipamento.','Cleaning removes soil. Disinfection does not guarantee spore elimination. Sterilization eliminates microbial forms including spores; match processing to intended use.','cdc'],
['Informed / implied / assumption of risk / waiver','Consentimento informado exige compreensão e escolha. Implícito é inferido da conduta. Assumir risco e assinar isenção não substituem consentimento nem autorizam negligência.','Informed consent requires understanding and choice. Implied consent is inferred from conduct. Risk acknowledgment and a waiver do not replace consent or authorize negligence.','rights'],
['Anticoagulants / corticosteroids','Anticoagulantes aumentam preocupação com sangramento. Corticoides podem causar fragilidade cutânea. Adapte manejo e não altere medicação.','Anticoagulants raise bleeding concerns. Corticosteroids may cause skin fragility. Adapt handling and do not alter medication.','drugs'],
['Antihypertensives / analgesics','Anti-hipertensivos podem causar tontura. Analgésicos podem reduzir dor sem comprovar recuperação. Levantar com segurança e reavaliar são mais úteis que presumir tolerância.','Antihypertensives may cause dizziness. Analgesics may reduce pain without proving recovery. Safe transitions and reassessment matter more than assumed tolerance.','pressure'],
['Pregnancy positioning','Decúbito lateral apoiado é uma opção adequada; lado, pressão e duração dependem de conforto, sintomas e avaliação. Não transforme um lado específico em regra universal. Atalho do material, não regra oficial confirmada: "Na prova, decúbito lateral esquerdo é o padrão no terceiro trimestre, com pressão e duração reduzidas." O cenário e as alternativas devem orientar a escolha; adapte lado, pressão e duração à avaliação individual.','Supported side-lying is an appropriate option; side, pressure and duration depend on comfort, symptoms and assessment. Do not make one side a universal rule. A universal exam rule requiring left-side positioning and reduced pressure and duration has not been established here.','pregnancy']
];return rows.map(([term,pt,en,s])=>`<p><b>${term}</b><br>${pt}<br><span lang="en">${en}</span><br><a href="${SOURCES[s][1]}" target="_blank" rel="noopener noreferrer">${SOURCES[s][0]}</a></p>`).join('');}
function setup(){state.screen='setup';mount(`<section class="question-shell"><p class="eyebrow">03 / Da intenção à prática</p><h1 style="font-size:42px">Configurar simulado</h1><p class="muted">${BANK.length} itens de treino (${BANK.filter(q=>!q.repeatOf).length} únicos). Sete domínios. Perguntas, alternativas e correções em inglês e português.</p><label for="mode">Modo</label><select id="mode"><option value="study">Treino completo · ver resposta</option><option value="focus">Bloco separado · 50 questões · sem cronômetro</option><option value="exam" selected>100 de ${BANK.length} · 110 minutos</option></select><label for="difficulty">Dificuldade</label><select id="difficulty"><option value="progressive">Progressiva · básico até superavançado</option><option value="1">Básico primeiro</option><option value="2">Intermediário primeiro</option><option value="3">Avançado primeiro</option><option value="4">Superavançado primeiro</option></select><p class="small muted">As opções mudam a ordem inicial; o treino completo inclui todos os itens e a prova sorteia 100. Superavançado exige distinguir prioridade, contexto e termos próximos.</p><label for="first-language">Idioma apresentado primeiro</label><select id="first-language"><option value="EN">English first · português abaixo</option></select><label for="deadline">Horário pessoal de encerramento (opcional)</label><input id="deadline" type="time" style="font:inherit;padding:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px"><div class="note"><b>Briefing</b><br>Modo prova: 100 de ${BANK.length} itens sorteados, quatro alternativas e uma correta; 110 minutos (66 s por item), sem alterar respostas confirmadas, com explicação após cada resposta. O relógio continua nos intervalos.<br>Treino: ${BANK.length} itens; o último bloco pode ser menor.<br>Metas de treino: 80% nas primeiras 20 e 60% nas questões 21–60.<br>Ao fim de cada bloco, confira o parcial e clique em Seguir.</div><p class="sma function shuffle(a){const out=a.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}

function makeDeck(difficulty,count=BANK.length){

 const selected=count===100?[...unique.filter(q=>q.id===20||q.id===52),...shuffle(unique.filter(q=>q.id!==20&&q.id!==52)).slice(0,96)]:unique;
 const pools=Object.keys(DOMAINS).map(d=>shuffle(selected.filter(q=>q.d===d)).sort((a,b)=>priority(a.l)-priority(b.l)));

}
