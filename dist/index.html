{id:36,hook:'Small shakes, not long strokes.|Pequenas oscilações, não longos percursos.',practice:'Notice the small repeated oscillations at the contact point.|Observe as pequenas oscilações repetidas no ponto de contato.',img:{show:'Mão em contato e setas curtas oscilatórias.',avoid:'Seta longa de deslizamento ou batidas separadas.',search:'massage vibration small oscillations diagram',capEN:'Fine oscillations at the contact point.',capPT:'Oscilações finas no ponto de contato.',check:'As setas devem indicar oscilação de pequena amplitude.'}},
{id:37,hook:'Press inward without traveling.|Pressione sem percorrer a área.',practice:'Separate pressure directed into tissue from a stroke that moves along it.|Diferencie a pressão dirigida ao tecido de um movimento que percorre sua superfície.',img:{show:'Mão apoiada com seta de pressão dirigida ao tecido.',avoid:'Seta tangencial longa sugerindo deslizamento.',search:'massage compression pressure without glide diagram',capEN:'Pressure is directed into the tissue.',capPT:'A pressão é dirigida ao tecido.',check:'Não devem aparecer instruções de força máxima ou pressão sobre área vulnerável.'}},
{id:38,hook:'Small area, little glide.|Área pequena, pouco deslizamento.',practice:'Identify the localized rubbing rather than following the length of a limb.|Identifique o movimento localizado, em vez de um percurso pelo comprimento do membro.',img:{show:'Contato localizado e setas curtas de fricção.',avoid:'Promessas de romper aderências ou trabalho em lesão aguda.',search:'localized massage friction short movement diagram',capEN:'Localized movement with limited glide.',capPT:'Movimento localizado com pouco deslizamento.',check:'A região e as setas devem distinguir fricção de effleurage.'}},
{id:39,hook:'May help is not will cure.|Pode ajudar não é vai curar.',practice:'Describe a possible benefit without promising that every client will improve.|Descreva um benefício possível sem prometer melhora para todos os clientes.',img:null},
{id:40,hook:'One result is one observation.|Um resultado é uma observação.',practice:'Record what changed today and ask about the response at the next visit.|Registre o que mudou hoje e pergunte sobre a resposta na próxima visita.',img:null},
{id:41,hook:'Pain changes the pressure conversation.|Dor muda a conversa sobre pressão.',practice:'Ask whether the client wants less pressure, another approach or a stop.|Pergunte se o cliente quer menos pressão, outra abordagem ou uma interrupção.',img:null},
{id:42,hook:'A guarantee is the odd one out.|A garantia é o elemento fora do grupo.',practice:'Cross out claims promising lasting relief when comparing realistic expectations.|Elimine promessas de alívio duradouro ao comparar expectativas realistas.',img:null},
{id:43,hook:'Slow and sustained, not tapping.|Lento e sustentado, não percussivo.',practice:'Use the tissue target and sustained contact to distinguish the approach in the vignette.|Use o tecido-alvo e o contato sustentado para distinguir a abordagem da vinheta.',img:{show:'Contato manual lento sobre uma representação de tecido fascial.',avoid:'Percussão, promessas de cura ou ruptura desenhada da fáscia.',search:'myofascial release sustained manual pressure diagram',capEN:'Controlled sustained contact with fascial tissue.',capPT:'Contato sustentado e controlado com tecido fascial.',check:'A imagem deve diferenciar pressão sustentada de deslizamento e percussão.'}},
{id:44,hook:'Deeper is not automatically better.|Mais profundo não é automaticamente melhor.',practice:'Agree on comfortable pressure and ask for feedback before increasing it.|Combine pressão confortável e peça retorno antes de aumentá-la.',img:null},
{id:45,hook:'Support the person, not a cure claim.|Apoie a pessoa, sem prometer cura.',practice:'Ask about current treatment precautions and seek appropriate coordination before proceeding.|Pergunte sobre precauções do tratamento atual e busque coordenação adequada antes de prosseguir.',img:null},
{id:46,hook:'Soreness is feedback, not a detox badge.|Dor posterior é retorno, não selo de desintoxicação.',practice:'Ask how the soreness affected daily activities and adjust the next session accordingly.|Pergunte como a dor posterior afetou as atividades diárias e ajuste a próxima sessão.',img:null},
{id:47,hook:'Quiet pain does not prove healed tissue.|Dor silenciosa não comprova tecido recuperado.',practice:'Ask what medication was taken and reassess tissue tolerance before deeper work.|Pergunte qual medicamento foi usado e reavalie a tolerância antes de trabalho mais profundo.',img:null},
{id:48,hook:'Remove the dirt before the germ step.|Tire a sujeira antes da etapa contra germes.',practice:'Remove the lotion residue before applying the appropriate disinfectant.|Remova o resíduo de loção antes de aplicar o desinfetante adequado.',img:null},
{id:49,hook:'All forms includes spores.|Todas as formas inclui esporos.',practice:'Check whether the item’s intended use requires sterilization rather than surface disinfection.|Confira se o uso do item exige esterilização em vez de desinfecção de superfície.',img:null},
{id:50,hook:'A clean surface can still need disinfection.|Superfície limpa ainda pode precisar de desinfecção.',practice:'After removing soil, apply a product suitable for that surface according to its label.|Após remover sujeira, aplique produto adequado à superfície conforme o rótulo.',img:null},
{id:51,hook:'Wet for the time on the label.|Molhado pelo tempo do rótulo.',practice:'Read the contact time before starting and keep the surface wet for that period.|Leia o tempo de contato antes de começar e mantenha a superfície molhada por esse período.',img:null},
{id:52,hook:'Price before the first touch.|Preço antes do primeiro toque.',practice:'Confirm the session price and any relevant cancellation policy before beginning.|Confirme o valor da sessão e a política de cancelamento pertinente antes de começar.',img:null},
{id:53,hook:'No cash does not mean no value.|Sem dinheiro não significa sem valor.',practice:'Record the fair market value of the goods received in the exchange.|Registre o valor justo de mercado dos bens recebidos na troca.',img:null},
{id:54,hook:'Income included is not the tax rate.|Renda incluída não é alíquota.',practice:'Separate the value reported as income from the tax calculation on that income.|Separe o valor declarado como renda do cálculo do imposto sobre essa renda.',img:null},
{id:55,hook:'A referral is not a payment promise.|Encaminhamento não promete pagamento.',practice:'Check the client’s plan and documentation requirements before discussing reimbursement.|Confira o plano do cliente e as exigências de documentação antes de discutir reembolso.',img:null},
{id:56,hook:'Write what happened, not what sells.|Escreva o que ocorreu, não o que vende.',practice:'Document the relevant findings, what you did and how the client responded.|Documente achados relevantes, o que você fez e como o cliente respondeu.',img:null},
{id:57,hook:'Correct the record; keep the trail.|Corrija o registro; preserve o histórico.',practice:'Add a dated correction that identifies the original error without concealing it.|Acrescente correção datada que identifique o erro original sem ocultá-lo.',img:null},
{id:58,hook:'Treatment claim, professional cover.|Alegação sobre atendimento, cobertura profissional.',practice:'Read the policy’s professional liability section when checking coverage for treatment-related allegations.|Leia a seção de responsabilidade profissional ao conferir cobertura de alegações sobre atendimento.',img:null},
{id:59,hook:'State the policy, not a judgment.|Explique a política, não um julgamento.',practice:'Explain how late arrival affects session length under the policy already communicated.|Explique como o atraso afeta a duração da sessão conforme a política já informada.',img:null},
{id:60,hook:'One person, accountable access.|Uma pessoa, acesso rastreável.',practice:'Ask the authorized administrator to provide individual access instead of sharing your password.|Peça ao administrador autorizado um acesso individual em vez de compartilhar sua senha.',img:null},
{id:61,hook:'Passing opens a step, not a license.|Aprovar conclui uma etapa, não emite licença.',practice:'Check the state board’s remaining requirements before advertising yourself as licensed.|Confira exigências restantes do conselho antes de se anunciar como profissional licenciado.',img:null},
{id:62,hook:'Breathing and chest pain outrank the session.|Respiração e dor no peito vêm antes da sessão.',practice:'Stop treatment and call emergency medical assistance immediately for these sudden symptoms.|Interrompa o atendimento e acione assistência médica de emergência para esses sintomas súbitos.',img:null},
{id:63,hook:'Less clotting means more bleeding concern.|Menos coagulação, mais atenção a sangramento.',practice:'Ask about bruising and relevant medical instructions before selecting pressure.|Pergunte sobre hematomas e orientações médicas pertinentes antes de escolher a pressão.',img:null},
{id:64,hook:'Support the side; listen to symptoms.|Apoie de lado; observe os sintomas.',practice:'Arrange supports for comfortable side-lying and ask about dizziness or discomfort.|Organize apoios para decúbito lateral confortável e pergunte sobre tontura ou desconforto.',img:{show:'Gestante em decúbito lateral apoiado, com cabeça e membros confortáveis.',avoid:'Compressão abdominal, posição supina prolongada ou apoio insuficiente.',search:'pregnancy massage supported side lying positioning diagram',capEN:'Supported side-lying during pregnancy.',capPT:'Decúbito lateral com apoio na gestação.',check:'A postura deve concordar com o gabarito e não impor um lado como regra universal.'}},
{id:65,hook:'A fever pauses the appointment.|Febre pausa o atendimento.',practice:'Explain that the session should be postponed while the acute illness is assessed.|Explique que a sessão deve ser adiada enquanto o quadro agudo é avaliado.',img:null},
{id:66,hook:'Fresh bruising is not a target for force.|Hematoma recente não é alvo para força.',practice:'Ask how the bruise appeared and avoid pressing directly over it.|Pergunte como surgiu o hematoma e evite pressioná-lo diretamente.',img:null},
{id:67,hook:'Fragile bones need a lighter plan.|Ossos frágeis pedem um plano mais leve.',practice:'Adjust positioning and avoid forceful contacts over vulnerable bony areas.|Ajuste o posicionamento e evite contatos intensos sobre regiões ósseas vulneráveis.',img:null},
{id:68,hook:'Less feeling means less warning.|Menos sensibilidade significa menos aviso.',practice:'Do not use the absence of pain as the only check on heat or pressure.|Não use a ausência de dor como única verificação de calor ou pressão.',img:null},
{id:69,hook:'Light touch does not clear a clot concern.|Toque leve não descarta suspeita de trombose.',practice:'Defer the requested massage and explain why new postoperative swelling needs prompt assessment.|Adie a massagem pedida e explique por que o novo inchaço após cirurgia exige avaliação rápida.',img:null},
{id:70,hook:'Sharp pain is a stop sign.|Dor aguda é sinal de parada.',practice:'Release the stretch and ask where and when the sharp pain began.|Interrompa o alongamento e pergunte onde e quando a dor aguda começou.',img:null},
{id:71,hook:'Broken skin needs protection, not friction.|Pele aberta precisa de proteção, não fricção.',practice:'Keep massage products and direct manipulation away from the open wound.|Mantenha produtos de massagem e manipulação direta longe da ferida aberta.',img:null},
{id:72,hook:'An old diagnosis does not explain every new symptom.|Diagnóstico antigo não explica todo sintoma novo.',practice:'Ask about the new symptom before relying on the previous treatment plan.|Pergunte sobre o novo sintoma antes de confiar no plano anterior.',img:null},
{id:73,hook:'Stand slowly; protect against a fall.|Levante devagar; proteja contra quedas.',practice:'Help the client remain supported and do not let them walk alone while dizzy.|Ajude o cliente a permanecer apoiado e não o deixe caminhar sozinho enquanto estiver tonto.',img:null},
{id:74,hook:'Thin skin changes how hands work.|Pele fina muda o cuidado das mãos.',practice:'Ask about easy bruising and use gentler handling without changing the prescribed drug.|Pergunte sobre hematomas fáceis e use manejo mais suave sem alterar o medicamento prescrito.',img:null},
{id:75,hook:'Sudden breathing trouble moves to the front.|Falta de ar súbita passa à frente.',practice:'Prioritize emergency assistance over routine session concerns when chest pain accompanies sudden breathlessness.|Priorize assistência de emergência quando a dor no peito acompanha falta de ar súbita.',img:null},
{id:76,hook:'Cup toward mouth, angle closes.|Copo à boca, ângulo fecha.',practice:'Watch the elbow angle decrease as the forearm approaches the upper arm.|Observe o ângulo do cotovelo diminuir quando o antebraço se aproxima do braço.',img:{show:'Cotovelo dobrando, com o antebraço aproximando-se do braço.',avoid:'Seta de extensão ou movimento principal no ombro.',search:'elbow flexion cup to mouth movement diagram',capEN:'The elbow angle decreases.',capPT:'O ângulo do cotovelo diminui.',check:'A seta deve mostrar flexão do cotovelo, não flexão do ombro.'}},
{id:77,hook:'Straighten the knee, open the angle.|Estique o joelho, abra o ângulo.',practice:'Compare the bent and straight positions without forcing the knee beyond its comfortable range.|Compare joelho dobrado e estendido sem forçar além da amplitude confortável.',img:{show:'Joelho passando de flexionado para estendido.',avoid:'Hiperextensão forçada ou seta de flexão.',search:'knee extension bent to straight diagram',capEN:'The knee moves toward a straight position.',capPT:'O joelho se aproxima da posição estendida.',check:'A direção deve aumentar o ângulo do joelho sem representar hiperextensão.'}},
{id:78,hook:'Away is the A in abduction.|Abdução afasta.',practice:'Use the trunk’s midline as the reference while the arm moves sideways away from it.|Use a linha média do tronco como referência enquanto o braço se afasta lateralmente.',img:{show:'Vista anterior com braço afastando-se lateralmente do tronco.',avoid:'Elevação anterior do braço ou seta de aproximação.',search:'shoulder abduction frontal plane diagram',capEN:'The arm moves away from the midline.',capPT:'O braço se afasta da linha média.',check:'A vista e a seta devem mostrar abdução, sem confundir com flexão.'}},
{id:79,hook:'Add the arm back to the body.|Traga o braço de volta ao corpo.',practice:'Follow the arm returning toward the trunk rather than continuing outward.|Acompanhe o braço retornando ao tronco em vez de continuar para fora.',img:{show:'Braço elevado lateralmente retornando em direção ao tronco.',avoid:'Seta de afastamento ou rotação do antebraço.',search:'shoulder adduction arm toward body diagram',capEN:'The arm moves toward the midline.',capPT:'O braço se aproxima da linha média.',check:'A seta deve apontar para o tronco.'}},
{id:80,hook:'Hold the soup in your palm.|Segure a sopa na palma.',practice:'With the elbow bent, turn the forearm until the palm faces upward.|Com o cotovelo dobrado, gire o antebraço até a palma ficar para cima.',img:{show:'Cotovelo dobrado e antebraço girando para palma voltada para cima.',avoid:'Movimento isolado do punho ou palma final para baixo.',search:'forearm supination elbow bent palm up diagram',capEN:'The palm turns upward with the elbow bent.',capPT:'A palma vira para cima com o cotovelo dobrado.',check:'O movimento deve ocorrer no antebraço e terminar em supinação.'}},
{id:81,hook:'Turn the soup bowl over.|Vire a tigela de sopa.',practice:'Keep the elbow bent while observing the palm turn from up to down.|Mantenha o cotovelo dobrado enquanto observa a palma virar de cima para baixo.',img:{show:'Antebraço girando de palma para cima para palma para baixo.',avoid:'Supinação ou somente flexão do punho.',search:'forearm pronation palm down elbow bent diagram',capEN:'The palm turns downward.',capPT:'A palma vira para baixo.',check:'A posição final deve ser pronação no contexto do cotovelo dobrado.'}},
{id:82,hook:'Toes toward the shin.|Dedos em direção à perna.',practice:'Observe the front of the foot rise while the heel remains supported.|Observe a frente do pé subir enquanto o calcanhar permanece apoiado.',img:{show:'Vista lateral com frente do pé aproximando-se da perna.',avoid:'Calcanhar elevado ou seta de flexão plantar.',search:'ankle dorsiflexion heel down diagram',capEN:'The top of the foot approaches the shin.',capPT:'O dorso do pé se aproxima da perna.',check:'A seta deve apontar a frente do pé para cima.'}},
{id:83,hook:'Press the pedal with the foot.|Pise no pedal com o pé.',practice:'Compare pointing the foot downward with lifting its front toward the shin.|Compare apontar o pé para baixo com elevar sua frente em direção à perna.',img:{show:'Pé apontando para baixo em relação à perna.',avoid:'Seta de dorsiflexão ou apenas flexão dos dedos.',search:'ankle plantar flexion pointing foot diagram',capEN:'The foot points away from the shin.',capPT:'O pé aponta para longe da perna.',check:'O movimento deve estar no tornozelo, não apenas nos dedos.'}},
{id:84,hook:'Lift and shorten.|Eleve e encurte.',practice:'Notice the elbow flexors shortening while the weight rises against gravity.|Observe os flexores do cotovelo encurtarem enquanto o peso sobe contra a gravidade.',img:{show:'Peso subindo durante flexão do cotovelo e músculo encurtando.',avoid:'Seta de descida ou músculo alongando durante a subida.',search:'concentric elbow flexion lifting weight diagram',capEN:'Active elbow flexors shorten while lifting.',capPT:'Flexores ativos encurtam durante a elevação.',check:'Direção do peso e mudança do comprimento devem corresponder à contração concêntrica.'}},
{id:85,hook:'Lower slowly, lengthen under control.|Desça devagar, alongue sob controle.',practice:'Distinguish controlled lowering from simply relaxing and letting the weight drop.|Diferencie descida controlada de apenas relaxar e deixar o peso cair.',img:{show:'Peso descendo lentamente e flexores do cotovelo alongando sob carga.',avoid:'Queda livre, relaxamento completo ou seta de subida.',search:'eccentric elbow flexors lowering weight diagram',capEN:'Active flexors lengthen while controlling descent.',capPT:'Flexores ativos alongam ao controlar a descida.',check:'A figura deve manter atividade muscular durante o alongamento.'}},
{id:86,hook:'Hold still, keep the effort.|Fique parado, mantenha o esforço.',practice:'Watch for a fixed elbow angle while the client continues supporting the load.|Observe o ângulo fixo do cotovelo enquanto o cliente sustenta a carga.',img:{show:'Peso sustentado e cotovelo com ângulo estável.',avoid:'Setas de movimento ou alteração grande do comprimento muscular.',search:'isometric elbow flexion static weight hold diagram',capEN:'The load is held without appreciable movement.',capPT:'A carga é sustentada sem movimento apreciável.',check:'Não deve haver subida ou descida da carga.'}},
{id:87,hook:'Name the role for this action.|Nomeie o papel nesta ação.',practice:'Identify elbow flexion first, then identify the muscle whose action opposes it.|Identifique primeiro a flexão do cotovelo e depois o músculo cuja ação se opõe a ela.',img:{show:'Bíceps e tríceps identificados em um esquema de flexão do cotovelo.',avoid:'Tríceps rotulado como flexor principal do cotovelo.',search:'elbow flexion biceps triceps antagonist diagram',capEN:'Triceps opposes elbow flexion.',capPT:'O tríceps se opõe à flexão do cotovelo.',check:'Rótulos e setas devem relacionar antagonismo à ação específica.'}},
{id:88,hook:'Muscle to bone is the force cable.|Músculo ao osso: cabo de força.',practice:'Trace the calf muscle toward its cordlike attachment at the heel.|Acompanhe o músculo da panturrilha até sua inserção em cordão no calcanhar.',img:{show:'Panturrilha, tendão calcâneo e calcâneo identificados.',avoid:'Tendão rotulado como ligamento ou conexão apenas entre ossos.',search:'Achilles tendon calf muscle calcaneus labeled diagram',capEN:'The tendon transmits calf muscle force to the heel.',capPT:'O tendão transmite força da panturrilha ao calcanhar.',check:'A continuidade músculo-tendão-osso deve estar correta.'}},
{id:89,hook:'Bone to bone supports the joint.|Osso a osso sustenta a articulação.',practice:'Identify the bone-to-bone connection instead of a muscle attachment in an ankle diagram.|Identifique a conexão entre ossos, em vez de inserção muscular, num diagrama do tornozelo.',img:{show:'Ossos do tornozelo unidos por um ligamento identificado.',avoid:'Tendão muscular identificado como ligamento.',search:'ankle ligament bone to bone connection diagram',capEN:'A ligament connects bones at the ankle.',capPT:'Um ligamento conecta ossos no tornozelo.',check:'As duas extremidades da estrutura devem se conectar a ossos.'}},
{id:90,hook:'The smooth cover is at the joint surface.|A cobertura lisa está na superfície articular.',practice:'Locate the covering on the opposing bone surfaces rather than outside the joint.|Localize o revestimento nas superfícies ósseas opostas, não fora da articulação.',img:{show:'Corte de articulação sinovial com cartilagem sobre extremidades ósseas.',avoid:'Cartilagem indicada como tendão ou cobrindo toda a diáfise.',search:'synovial joint articular cartilage labeled diagram',capEN:'Articular cartilage covers the opposing surfaces.',capPT:'A cartilagem articular reveste as superfícies opostas.',check:'O rótulo deve apontar para cartilagem, não líquido ou cápsula.'}},
{id:91,hook:'Median takes the carpal tunnel.|Mediano passa pelo túnel do carpo.',practice:'Follow the median nerve through the wrist tunnel without confusing nearby nerves.|Acompanhe o nervo mediano no túnel do punho sem confundir nervos próximos.',img:{show:'Túnel do carpo em corte com nervo mediano identificado.',avoid:'Nervo ulnar apresentado dentro do túnel do carpo.',search:'carpal tunnel median nerve cross section labeled diagram',capEN:'The median nerve travels through the carpal tunnel.',capPT:'O nervo mediano atravessa o túnel do carpo.',check:'Conferir nervo mediano, retináculo e limites do túnel.'}},
{id:92,hook:'Behind the inner elbow: ulnar.|Atrás do cotovelo medial: ulnar.',practice:'Locate the medial epicondyle before discussing the nearby nerve’s vulnerable course.|Localize o epicôndilo medial antes de discutir o trajeto vulnerável do nervo próximo.',img:{show:'Nervo ulnar passando atrás do epicôndilo medial.',avoid:'Epicôndilo lateral confundido com medial.',search:'ulnar nerve behind medial epicondyle diagram',capEN:'The ulnar nerve passes behind the medial epicondyle.',capPT:'O nervo ulnar passa atrás do epicôndilo medial.',check:'A orientação medial e o trajeto posterior precisam estar corretos.'}},
{id:93,hook:'Artery means away.|Artéria: afastando-se do coração.',practice:'Follow the flow arrow away from the heart instead of deciding by blood color alone.|Acompanhe a seta para fora do coração em vez de decidir só pela cor do sangue.',img:{show:'Coração e vaso com seta de fluxo saindo do coração.',avoid:'Definir artéria exclusivamente como vaso de sangue oxigenado.',search:'artery blood flow away from heart diagram',capEN:'Arterial flow travels away from the heart.',capPT:'O fluxo arterial se afasta do coração.',check:'A direção do fluxo, não a cor isolada, deve fundamentar a legenda.'}},
{id:94,hook:'Extra tissue fluid finds the return route.|Líquido extra encontra o caminho de volta.',practice:'Trace fluid from the interstitial space into lymphatic vessels and toward venous return.|Acompanhe líquido do espaço intersticial aos vasos linfáticos e ao retorno venoso.',img:{show:'Espaço intersticial, capilar linfático e retorno à circulação.',avoid:'Sistema linfático apresentado como bomba arterial independente.',search:'lymphatic interstitial fluid venous return diagram',capEN:'Lymphatic vessels return excess interstitial fluid.',capPT:'Vasos linfáticos devolvem excesso de líquido intersticial.',check:'As setas devem seguir do tecido para a via de retorno.'}},
{id:95,hook:'Rest and digest travel together.|Repouso e digestão caminham juntos.',practice:'Match the question’s digestive context to autonomic function without promising a massage effect.|Relacione o contexto digestivo à função autonômica sem prometer efeito da massagem.',img:{show:'Esquema autonômico com funções de repouso e digestão.',avoid:'Afirmar que uma técnica ativa somente uma divisão autonômica.',search:'parasympathetic rest digest autonomic diagram',capEN:'Parasympathetic activity supports rest and digestion.',capPT:'Atividade parassimpática favorece repouso e digestão.',check:'As funções devem ser exemplos, não garantias de resposta à massagem.'}},
{id:96,hook:'A threat mobilizes the body.|Uma ameaça mobiliza o corpo.',practice:'Use the sudden-threat context to distinguish mobilization from digestion.|Use o contexto de ameaça súbita para distinguir mobilização de digestão.',img:{show:'Resposta autonômica de alerta com aumento da frequência cardíaca.',avoid:'Confundir sistema motor somático com divisão autonômica.',search:'sympathetic threat response heart rate diagram',capEN:'Sympathetic activity supports rapid mobilization.',capPT:'Atividade simpática favorece mobilização rápida.',check:'O esquema não deve apresentar efeitos autonômicos como sempre idênticos.'}},
{id:97,hook:'Urine points you toward the kidneys.|Urina aponta para os rins.',practice:'Locate the kidneys in the urinary system before linking them to fluid balance.|Localize os rins no sistema urinário antes de relacioná-los ao equilíbrio de líquidos.',img:{show:'Rins, ureteres e bexiga identificados.',avoid:'Bexiga identificada como órgão que produz urina.',search:'urinary system kidneys ureters bladder labeled diagram',capEN:'The kidneys produce urine; the bladder stores it.',capPT:'Os rins produzem urina; a bexiga a armazena.',check:'Não confundir produção, transporte e armazenamento de urina.'}},
{id:98,hook:'Tiny walls make exchange possible.|Paredes finas permitem as trocas.',practice:'Locate the capillary bed between larger vessels and identify the exchange surface.|Localize a rede capilar entre vasos maiores e identifique a superfície de troca.',img:{show:'Rede capilar e trocas entre sangue e tecido.',avoid:'Atribuir a troca principal de gases às paredes de grandes artérias.',search:'capillary bed tissue gas exchange diagram',capEN:'Exchange occurs across thin capillary walls.',capPT:'As trocas ocorrem pelas paredes finas dos capilares.',check:'As setas devem distinguir fluxo sanguíneo de trocas com os tecidos.'}},
{id:99,hook:'Privacy stays covered between regions.|A privacidade continua coberta entre regiões.',practice:'When changing treatment areas, cover the previous area before exposing the next agreed area.|Ao mudar de região, cubra a anterior antes de descobrir a próxima área combinada.',img:null},
{id:100,hook:'Agree on the bill before the session.|Combine o valor antes da sessão.',practice:'Ask whether the client has questions about the stated fee before treatment begins.|Pergunte se o cliente tem dúvidas sobre o valor informado antes do início.',img:null},

const STEM_PATCH={"1":"Ava, 45, reports shoulder pain for one week at intake. A new client reports shoulder pain for a week. What should happen FIRST?|Ava, 45 anos, relata dor no ombro há uma semana na avaliação. Um novo cliente relata dor no ombro há uma semana. O que fazer PRIMEIRO?","2":"Ben, 38, reports neck pain rated 6/10 for five days. Which SOAP section should the practitioner choose to record his own report before planning care?|Ben, 38 anos, relata dor cervical 6/10 há cinco dias. Qual seção SOAP o profissional deve escolher para registrar esse relato antes de planejar o atendimento?","3":"Cleo, 52, has had shoulder stiffness for three weeks at intake. You measure shoulder movement before a session. Which SOAP section records the measurement?|Cleo, 52 anos, tem rigidez no ombro há três semanas na avaliação. Você mede o movimento do ombro antes da sessão. Qual seção SOAP registra a medida?","4":"Davi, 40, has had painful movement for two weeks. The practitioner decides to reassess pain-free movement at the next visit. Which SOAP section should hold this follow-up action?|Davi, 40 anos, sente dor ao mover-se há duas semanas. O profissional decide reavaliar o movimento sem dor na próxima visita. Qual seção SOAP deve conter essa ação?","5":"Eva, 47, has struggled to lift her arm for one month. Which assessment should the practitioner choose first to observe her own unassisted movement?|Eva, 47 anos, tem dificuldade para elevar o braço há um mês. Qual avaliação o profissional deve escolher primeiro para observar o movimento sem ajuda?","6":"Finn, 54, has had shoulder stiffness for two weeks. With permission, you move a relaxed shoulder while the client does not help. Which assessment is this?|Finn, 54 anos, tem rigidez no ombro há duas semanas. Com permissão, você move o ombro relaxado sem ajuda do cliente. Qual avaliação é essa?","7":"Gia, 36, has had forearm weakness for three weeks. Which assessment should the practitioner choose when she pushes against the examiner's opposing hand?|Gia, 36 anos, sente fraqueza no antebraço há três semanas. Qual avaliação o profissional deve escolher quando ela empurra contra a mão que oferece resistência?","8":"Hugo, 61, has had shoulder pain for ten days. During treatment, a client asks you to stop touching the shoulder. What should you do FIRST?|Hugo, 61 anos, sente dor no ombro há dez dias. Durante o atendimento, cliente pede para parar de tocar o ombro. O que fazer PRIMEIRO?","9":"Iris, 48, has had calf swelling for one day after a long flight. After a long flight, a client has a newly swollen, warm calf. What should the practitioner do FIRST before any massage of the calf?|Iris, 48 anos, tem inchaço na panturrilha há um dia após um voo longo. Após voo longo, cliente apresenta panturrilha recém-inchada e quente. O que o profissional deve fazer PRIMEIRO antes de massagear a panturrilha?","10":"Jon, 59, has been limping since a fall two hours ago. A returning client arrives limping after a fall today. What should happen FIRST?|Jon, 59 anos, manca desde uma queda há duas horas. Cliente habitual chega mancando após queda hoje. O que deve acontecer PRIMEIRO?","11":"Kira, 42, has had restricted neck movement for six weeks. Which is the BEST way to compare change after a session?|Kira, 42 anos, tem movimento cervical limitado há seis semanas. Qual é a MELHOR forma de comparar mudança após a sessão?","12":"Leo, 33, has had limited neck rotation for three weeks. A client wants easier neck movement for driving. Which goal is MOST useful?|Leo, 33 anos, tem rotação cervical limitada há três semanas. Cliente quer mover o pescoço com mais facilidade ao dirigir. Qual meta é MAIS útil?","13":"Mina, 50, has had shoulder discomfort for four weeks. A form was signed yesterday, but today the client declines a technique. What controls today’s decision?|Mina, 50 anos, sente desconforto no ombro há quatro semanas. O formulário foi assinado ontem, mas hoje o cliente recusa uma técnica. O que orienta a decisão de hoje?","14":"Nora, 37, has had back tension for two weeks. What should the practitioner do FIRST before switching techniques?|Nora, 37 anos, sente tensão nas costas há duas semanas. O que o profissional deve fazer PRIMEIRO antes de mudar de técnica?","15":"Omar, 46, has had shoulder pain for five days and needs clarification during intake. A client has trouble understanding your intake questions. What should the practitioner do FIRST to make intake understandable?|Omar, 46 anos, sente dor no ombro há cinco dias e precisa de esclarecimento na avaliação. Cliente tem dificuldade para entender suas perguntas de avaliação. O que o profissional deve fazer PRIMEIRO para tornar a avaliação compreensível?","16":"Pia, 57, has had worsening back pain since a session three days ago. A client reports worsening pain after your last session. What should you do FIRST?|Pia, 57 anos, sente dor nas costas piorando desde uma sessão há três dias. Cliente relata piora da dor após a última sessão. O que fazer PRIMEIRO?","17":"Quin, 44, has had neck pain for one month and brings a referral. A referral requests a technique you have never learned. What should the practitioner do FIRST about the unfamiliar technique?|Quin, 44 anos, sente dor cervical há um mês e traz um encaminhamento. Um encaminhamento solicita técnica que você nunca aprendeu. O que o profissional deve fazer PRIMEIRO quanto à técnica que não domina?","18":"Rae, 35, has had wrist discomfort for two weeks and requests a medical diagnosis from a massage therapist. Which professional limit should guide the therapist's decision to stay within training and applicable law?|Rae, 35 anos, sente desconforto no punho há duas semanas e pede diagnóstico médico ao massoterapeuta. Qual limite profissional deve orientar a decisão de respeitar formação e lei aplicável?","19":"Sam, 49, has had calf tightness for three weeks. Before choosing a technique, the practitioner explains risks and alternatives and Sam agrees. Which consent concept should guide the plan?|Sam, 49 anos, sente tensão na panturrilha há três semanas. Antes de escolher a técnica, o profissional explica riscos e alternativas, e Sam concorda. Qual conceito de consentimento deve orientar o plano?","20":"Tia, 41, has had back tension for two weeks and requests careful draping. Which client interest should the practitioner protect when arranging coverage?|Tia, 41 anos, sente tensão nas costas há duas semanas e pede cobertura cuidadosa. Qual interesse da cliente o profissional deve proteger ao arrumar o lençol?","21":"Uma, 58, has discussed discomfort with touch for four weeks. A client relates to the therapist as if the therapist were a critical parent. Which term BEST fits?|Uma, 58 anos, discute desconforto com o toque há quatro semanas. Cliente se relaciona com terapeuta como se fosse um pai crítico. Qual termo MELHOR se aplica?","22":"Vic, 43, has noticed emotional discomfort in sessions for three weeks. The therapist's own unresolved family feelings begin to influence care. Which boundary concept should the therapist recognize and address before continuing?|Vic, 43 anos, nota desconforto emocional nas sessões há três semanas. Sentimentos familiares não resolvidos do terapeuta começam a influenciar o cuidado. Qual conceito de limites ele deve reconhecer e abordar antes de continuar?","23":"Wes, 62, has felt vulnerable during care for two weeks and treats the therapist's advice as unquestionable. Which influence should the practitioner recognize when inviting Wes to make his own decisions?|Wes, 62 anos, sente-se vulnerável há duas semanas e aceita conselhos sem questionar. Qual influência o profissional deve reconhecer ao convidá-lo a decidir por si?","24":"Xena, 39, has had neck tension for one month and asks for extra favors. A client repeatedly asks for favors outside agreed session times. Which issue should be clarified FIRST?|Xena, 39 anos, sente tensão cervical há um mês e pede favores extras. Cliente pede repetidamente favores fora dos horários combinados. Qual questão esclarecer PRIMEIRO?","25":"Yuri, 45, has discussed exchanging massage for business services for two weeks and also becomes the client's customer. Which added relationship should the practitioner evaluate before agreeing?|Yuri, 45 anos, conversa há duas semanas sobre trocar massagem por serviços e também vira cliente da pessoa. Qual relação adicional o profissional deve avaliar antes de concordar?","26":"Zoe, 53, has been reviewing a practice sale for three weeks. A potential buyer of your practice asks for named client histories. What should the practitioner do FIRST with the request for client records?|Zoe, 53 anos, avalia a venda do consultório há três semanas. Possível comprador da sua prática pede históricos identificados dos clientes. O que o profissional deve fazer PRIMEIRO diante do pedido de prontuários?","27":"Ari, 34, has felt distressed by touch for two sessions over one week. A client becomes distressed during touch. What should you do FIRST?|Ari, 34 anos, sente angústia com o toque em duas sessões ao longo de uma semana. Cliente fica angustiado durante o toque. O que fazer PRIMEIRO?","28":"Bea, 27, has felt uneasy about a therapist's behavior for two weeks. Which behavior is incompatible with professional sexual boundaries?|Bea, 27 anos, sente-se desconfortável com a conduta de um terapeuta há duas semanas. Qual conduta é incompatível com limites sexuais profissionais?","29":"Cal, 40, has questioned the practitioner's qualifications for a week. The practitioner seeks needed training and describes credentials honestly. Which professional framework should guide this response?|Cal, 40 anos, questiona as qualificações profissionais há uma semana. O profissional busca formação e descreve suas credenciais honestamente. Qual estrutura profissional deve orientar essa resposta?","30":"Dee, 48, has considered a new technique for three weeks and wants to control consent. All support informed consent EXCEPT which action?|Dee, 48 anos, considera uma técnica nova há três semanas e quer controlar o consentimento. Todas apoiam consentimento informado, EXCETO qual ação?","31":"Eli, 56, has had a privacy concern for ten days. A friend asks whether a named person is your client. What should the practitioner say FIRST about the named client's status?|Eli, 56 anos, tem uma preocupação com privacidade há dez dias. Amigo pergunta se determinada pessoa é sua cliente. O que o profissional deve dizer PRIMEIRO sobre o status do cliente mencionado?","32":"Fay, 51, has requested special access for two weeks. A client offers an expensive gift and requests special access. What should the practitioner do FIRST about the gift and requested access?|Fay, 51 anos, pede acesso especial há duas semanas. Cliente oferece presente caro e pede acesso especial. O que o profissional deve fazer PRIMEIRO sobre o presente e o acesso pedido?","33":"Gus, 48, has had back stiffness for three weeks and agrees to a gentle introductory stroke. Which technique should the practitioner choose for long, smooth gliding movements?|Gus, 48 anos, sente rigidez nas costas há três semanas e concorda com manobra inicial suave. Qual técnica o profissional deve escolher para deslizamentos longos e suaves?","34":"Hana, 44, has had calf tightness for a month and agrees to kneading without pain. Which technique should the practitioner choose to lift and knead soft tissue?|Hana, 44 anos, sente tensão na panturrilha há um mês e concorda com amassamento sem dor. Qual técnica o profissional deve escolher para levantar e amassar o tecido mole?","35":"Ian, 38, has had shoulder tension for two weeks and asks about rhythmic tapping. Rhythmic tapping is applied to soft tissue. Which term names the technique?|Ian, 38 anos, sente tensão no ombro há duas semanas e pergunta sobre percussão rítmica. Batidas rítmicas são aplicadas ao tecido mole. Qual termo nomeia a técnica?","36":"Jill, 50, has had back tension for six weeks and asks for small comfortable oscillations. Which technique should the practitioner choose to transmit them through the hand?|Jill, 50 anos, sente tensão nas costas há seis semanas e pede pequenas oscilações confortáveis. Qual técnica o profissional deve escolher para transmiti-las pela mão?","37":"Kai, 42, has had neck tension for three weeks and asks about stationary pressure. A therapist applies pressure into tissue without gliding. Which term describes this?|Kai, 42 anos, sente tensão cervical há três semanas e pergunta sobre pressão estacionária. Terapeuta aplica pressão sobre o tecido sem deslizar. Qual termo descreve isso?","38":"Luz, 47, has had localized back tension for one month and asks about a small rubbing stroke. Localized rubbing uses little glide over the skin. Which term describes this?|Luz, 47 anos, sente tensão localizada nas costas há um mês e pergunta sobre fricção curta. Movimento localizado usa pouco deslizamento sobre a pele. Qual termo descreve isso?","39":"Max, 55, has had mild back discomfort for three months and asks whether massage guarantees a cure. Which claim should the practitioner choose when setting realistic expectations?|Max, 55 anos, sente leve desconforto nas costas há três meses e pergunta se massagem garante cura. Qual afirmação o profissional deve escolher ao definir expectativas realistas?","40":"Nia, 31, has had neck tension for two weeks and feels better after one session. Which conclusion should the practitioner document without promising that the improvement will last?|Nia, 31 anos, sente tensão cervical há duas semanas e melhora após uma sessão. Qual conclusão o profissional deve registrar sem prometer duração do efeito?","41":"Oli, 60, has had shoulder discomfort for four weeks and now reports painful pressure. A client tenses and says the pressure hurts. What should you do FIRST?|Oli, 60 anos, sente desconforto no ombro há quatro semanas e agora relata pressão dolorosa. Cliente contrai o corpo e diz que a pressão dói. O que fazer PRIMEIRO?","42":"Paz, 37, has had back pain for six weeks. The practitioner is preparing a discussion of reasonable limits. Which claim should be excluded because it promises a guaranteed outcome? (EXCEPT)|Paz, 37 anos, sente dor nas costas há seis semanas. O profissional prepara uma conversa sobre limites razoáveis. Qual afirmação deve ser excluída por prometer um resultado garantido? (EXCETO)","43":"Quin, 46, has had thigh tightness for one month and asks about sustained fascial work. Slow sustained manual pressure targets restrictions in fascia. Which approach BEST matches this description?|Quin, 46 anos, sente tensão na coxa há um mês e pergunta sobre trabalho fascial sustentado. Pressão manual lenta e sustentada visa restrições na fáscia. Qual abordagem MELHOR corresponde à descrição?","44":"Rui, 52, has had neck pain for three weeks and asks about deeper pressure. A client asks whether deep pressure is always more effective. What should the practitioner explain FIRST about pressure?|Rui, 52 anos, sente dor cervical há três semanas e pergunta sobre pressão mais profunda. Cliente pergunta se pressão profunda é sempre mais eficaz. O que o profissional deve explicar PRIMEIRO sobre a pressão?","45":"Sia, 63, has been receiving cancer care for four months and asks about massage. A person in cancer care asks for massage. Which point should the practitioner clarify FIRST before planning care?|Sia, 63 anos, está em tratamento oncológico há quatro meses e pergunta sobre massagem. Pessoa em tratamento de câncer solicita massagem. Qual ponto o profissional deve esclarecer PRIMEIRO antes de planejar o atendimento?","46":"Tom, 45, has felt sore for two days after forceful work. A client feels sore after forceful work. Which explanation should be avoided?|Tom, 45 anos, sente dor há dois dias após trabalho com muita força. Cliente fica dolorido após trabalho intenso. Qual explicação deve ser evitada?","47":"Uma, 54, has had shoulder pain for three weeks and reports less pain after medication. Pain decreased after an analgesic. Which inference should guide the practitioner FIRST before using deeper pressure?|Uma, 54 anos, sente dor no ombro há três semanas e relata menos dor após medicação. Dor diminuiu após analgésico. Qual inferência deve orientar o profissional PRIMEIRO antes de usar pressão maior?","48":"Vic, 39, has noticed table residue after sessions for three days. Visible lotion residue remains on a table. Which process must happen FIRST before disinfection?|Vic, 39 anos, nota resíduos na mesa após sessões há três dias. Há resíduo visível de loção na maca. Qual processo deve ocorrer PRIMEIRO antes da desinfecção?","49":"Wes, 36, has been asking about instrument hygiene for two weeks. Which process eliminates all forms of microbial life, including bacterial spores?|Wes, 36 anos, pergunta sobre higiene de instrumentos há duas semanas. Qual processo elimina todas as formas de vida microbiana, incluindo esporos bacterianos?","50":"Xena, 48, has questioned surface disinfection for one week. After cleaning a suitable nonporous surface, which process reduces pathogens using an appropriate product?|Xena, 48 anos, questiona a desinfecção de superfícies há uma semana. Após limpar superfície não porosa adequada, qual processo reduz patógenos com produto apropriado?","51":"Yara, 41, has been reviewing a disinfectant protocol for two days. The disinfectant label requires a wet contact time. What should the practitioner follow FIRST to make disinfection effective?|Yara, 41 anos, revisa um protocolo de desinfecção há dois dias. O rótulo exige tempo de contato com a superfície molhada. O que o profissional deve seguir PRIMEIRO para a desinfecção ser eficaz?","52":"Zed, 33, has asked about massage fees for one week. A client asks about the price before treatment. What should the practitioner explain FIRST before treatment begins?|Zed, 33 anos, pergunta sobre preços da massagem há uma semana. Cliente pergunta o preço antes do atendimento. O que o profissional deve explicar PRIMEIRO antes de iniciar o atendimento?","53":"Ava, 45, has discussed exchanging massage for goods for two weeks. You receive goods worth $100 for a massage. What gross barter income is generally included?|Ava, 45 anos, conversa sobre troca de massagem por produtos há duas semanas. Você recebe bens de valor justo de US$ 100 por massagem. Que renda bruta de permuta geralmente entra na declaração?","54":"Ben, 38, has reviewed barter income for a month. What portion of the fair market value of taxable barter proceeds is generally included in gross income?|Ben, 38 anos, revisa rendimentos de troca há um mês. Que parcela do valor justo de permuta tributável geralmente integra a renda bruta?","55":"Cora, 50, has asked about insurance coverage for three weeks. Before promising insurance reimbursement, what should the practitioner do FIRST?|Cora, 50 anos, pergunta sobre cobertura do seguro há três semanas. Antes de prometer reembolso por seguro, o que o profissional deve fazer PRIMEIRO?","56":"Dan, 42, has had back discomfort for a month and asks about visit records. Which record is MOST appropriate after a session?|Dan, 42 anos, sente desconforto nas costas há um mês e pergunta sobre o prontuário. Qual registro é MAIS apropriado após uma sessão?","57":"Eve, 57, has questioned a record error for four days. You discover an error in a completed record. What should the practitioner do FIRST to correct the record appropriately?|Eve, 57 anos, questiona um erro no prontuário há quatro dias. Você descobre erro em registro concluído. O que o profissional deve fazer PRIMEIRO para corrigir o prontuário adequadamente?","58":"Finn, 46, has reported an injury claim for two weeks. A client alleges negligent performance of massage caused injury. Which coverage addresses this professional claim?|Finn, 46 anos, relata uma alegação de lesão há duas semanas. Cliente alega lesão por execução negligente de massagem. Qual cobertura trata dessa alegação profissional?","59":"Gia, 40, has arrived late to appointments for three weeks. A client repeatedly arrives late. What should the practitioner do FIRST about the repeated lateness?|Gia, 40 anos, chega atrasada às sessões há três semanas. Cliente chega atrasado repetidamente. O que o profissional deve fazer PRIMEIRO diante dos atrasos repetidos?","60":"Hugo, 35, has discussed access to client records for one week. A colleague asks for your account password to read client records. What should the practitioner do FIRST about the password request?|Hugo, 35 anos, discute acesso a prontuários há uma semana. Colega pede sua senha para ler prontuários. O que o profissional deve fazer PRIMEIRO diante do pedido de senha?","61":"Iris, 29, has asked about MBLEx licensure for two weeks. A learner passed the MBLEx but has not received state licensure. What is the BEST interpretation?|Iris, 29 anos, pergunta sobre licenciamento após o MBLEx há duas semanas. Aluna passou no MBLEx, mas ainda não recebeu licença estadual. Qual a MELHOR interpretação?","62":"Jon, 58, has had sudden chest pain and shortness of breath for five minutes. A client develops sudden shortness of breath and chest pain during a visit. What should the practitioner do FIRST when these symptoms appear?|Jon, 58 anos, sente dor súbita no peito e falta de ar há cinco minutos. Cliente apresenta falta de ar súbita e dor no peito durante a visita. O que o profissional deve fazer PRIMEIRO quando surgem esses sintomas?","63":"Kira, 65, has taken an anticoagulant for six months and bruises easily. A client uses an anticoagulant. Which concern is MOST relevant to forceful massage?|Kira, 65 anos, usa anticoagulante há seis meses e desenvolve hematomas facilmente. Cliente usa anticoagulante. Qual preocupação é MAIS relevante para massagem intensa?","64":"Lia, 32, is in her third trimester and has had positional discomfort for two weeks. A client in late pregnancy needs a comfortable massage position. Which is generally appropriate?|Lia, 32 anos, está no terceiro trimestre e sente desconforto posicional há duas semanas. Cliente no fim da gestação precisa de posição confortável para massagem. Qual geralmente é apropriada?","65":"Max, 49, has felt feverish and acutely ill since yesterday. A client arrives with fever and feels acutely ill. What should the practitioner do FIRST about today's appointment?|Max, 49 anos, sente febre e mal-estar agudo desde ontem. Cliente chega com febre e mal-estar agudo. O que o profissional deve fazer PRIMEIRO quanto à sessão de hoje?","66":"Nia, 43, has had a fresh bruise on the treatment area for one day. A fresh bruise is present on the intended treatment area. What should the practitioner do FIRST about the bruised area?|Nia, 43 anos, tem hematoma recente na área de atendimento há um dia. Há hematoma recente na área pretendida. O que o profissional deve fazer PRIMEIRO quanto à área com hematoma?","67":"Oli, 72, has had osteoporosis-related fragility for two years. A client has fragile bones from osteoporosis. What should the practitioner adjust FIRST for tissue safety?|Oli, 72 anos, tem fragilidade relacionada à osteoporose há dois anos. Cliente tem fragilidade óssea por osteoporose. O que o profissional deve ajustar PRIMEIRO para proteger o tecido?","68":"Pia, 61, has had reduced foot sensation for four months. A client has reduced sensation in the feet. What should the practitioner account for FIRST when using heat or pressure?|Pia, 61 anos, tem sensibilidade reduzida nos pés há quatro meses. Cliente tem sensibilidade reduzida nos pés. O que o profissional deve considerar PRIMEIRO ao usar calor ou pressão?","69":"Quin, 56, has had one-sided calf swelling since surgery three days ago. New one-sided calf swelling follows surgery. The client wants only light massage. What should the practitioner do FIRST before any calf massage?|Quin, 56 anos, tem inchaço unilateral na panturrilha desde cirurgia há três dias. Surge inchaço unilateral na panturrilha após cirurgia. Cliente quer só massagem leve. O que o profissional deve fazer PRIMEIRO antes de massagear a panturrilha?","70":"Rae, 45, has had shoulder stiffness for two weeks and now feels sharp pain on stretching. A client reports sharp pain during a stretch. What should happen FIRST?|Rae, 45 anos, sente rigidez no ombro há duas semanas e agora dor aguda ao alongar. Cliente relata dor aguda durante alongamento. O que fazer PRIMEIRO?","71":"Sam, 37, has had an open wound on the planned treatment area for two days. A client has an open skin wound where massage was planned. What should the practitioner do FIRST at the wounded area?|Sam, 37 anos, tem ferida aberta na área planejada há dois dias. Cliente tem ferida aberta onde a massagem foi planejada. O que o profissional deve fazer PRIMEIRO na área da ferida?","72":"Tia, 62, has had a stable chronic condition for years but a new symptom for one week. A chronic condition is stable, but the client reports a new unexplained symptom. What should the practitioner do FIRST before proceeding with the session?|Tia, 62 anos, tem condição crônica estável há anos, mas sintoma novo há uma semana. Condição crônica está estável, mas cliente relata novo sintoma sem explicação. O que o profissional deve fazer PRIMEIRO antes de continuar a sessão?","73":"Uma, 69, has felt dizzy on rising since starting blood-pressure medication two weeks ago. A client taking blood pressure medicine feels dizzy while rising from the table. What should you do FIRST?|Uma, 69 anos, sente tontura ao levantar desde que iniciou medicação para pressão há duas semanas. Cliente em uso de anti-hipertensivo sente tontura ao levantar da maca. O que fazer PRIMEIRO?","74":"Vic, 59, has used prednisone for six months and developed thin, easily bruised skin. A client using long-term prednisone has thin skin and easy bruising. Which response is BEST?|Vic, 59 anos, usa prednisona há seis meses e desenvolveu pele fina, que forma hematomas facilmente. Cliente usa prednisona prolongadamente e tem pele fina e hematomas fáceis. Qual resposta é MELHOR?","75":"Wes, 54, has had sudden breathing difficulty and chest pain for five minutes. Which finding requires the MOST urgent escalation?|Wes, 54 anos, sente falta de ar súbita e dor no peito há cinco minutos. Qual achado exige encaminhamento MAIS urgente?","76":"Nora, 58, has difficulty bringing a cup to her mouth six weeks after elbow immobilization. At intake, which elbow movement should the gentle plan assess and prioritize?|Nora, 58 anos, tem dificuldade para levar um copo à boca seis semanas após imobilização do cotovelo. Na avaliação, qual movimento do cotovelo o plano suave deve avaliar e priorizar?","77":"Eli, 67, has struggled to straighten his knee for four weeks after a period of reduced activity. During movement assessment, which action should guide a gentle functional goal?|Eli, 67 anos, tem dificuldade para endireitar o joelho há quatro semanas após um período de pouca atividade. Na avaliação do movimento, qual ação deve orientar uma meta funcional suave?","78":"Maya, 43, has had trouble reaching sideways to a shelf for three weeks. With comfortable movement cleared at intake, which shoulder action should the plan assess?|Maya, 43 anos, tem dificuldade para alcançar uma prateleira lateral há três semanas. Com movimento confortável liberado na avaliação, qual ação do ombro o plano deve avaliar?","79":"Leo, 51, has had difficulty returning his raised arm to his side for two weeks. In a comfortable shoulder movement check, which action should be assessed?|Leo, 51 anos, tem dificuldade para trazer o braço erguido de volta ao lado do corpo há duas semanas. Numa avaliação confortável do ombro, qual ação deve ser examinada?","80":"Sara, 46, has struggled to turn her palm upward to hold a bowl for one month. During forearm mobility assessment, which movement should the practitioner check?|Sara, 46 anos, tem dificuldade para virar a palma para cima e segurar uma tigela há um mês. Na avaliação da mobilidade do antebraço, qual movimento o profissional deve verificar?","81":"Omar, 37, has had trouble turning a key with his palm moving downward for three weeks. During a gentle forearm assessment, which movement should be checked?|Omar, 37 anos, tem dificuldade para girar uma chave com a palma virando para baixo há três semanas. Numa avaliação suave do antebraço, qual movimento deve ser verificado?","82":"Bea, 62, has had difficulty lifting her toes while walking for two weeks. At intake, which ankle action should be assessed without forcing the joint?|Bea, 62 anos, tem dificuldade para elevar os dedos do pé ao caminhar há duas semanas. Na avaliação, qual ação do tornozelo deve ser examinada sem forçar a articulação?","83":"Ivan, 49, has had difficulty pressing a pedal for five weeks. During ankle movement assessment, which action should guide the functional goal?|Ivan, 49 anos, tem dificuldade para pressionar um pedal há cinco semanas. Na avaliação do tornozelo, qual ação deve orientar a meta funcional?","84":"Ana, 34, has had mild elbow weakness for four weeks and is cleared for light exercise. She lifts a small weight while the elbow flexors shorten. Which contraction should the plan identify for this lifting phase?|Ana, 34 anos, tem leve fraqueza do cotovelo há quatro semanas e liberação para exercício leve. Ela levanta um peso pequeno enquanto os flexores encurtam. Qual contração o plano deve identificar nessa fase de elevação?","85":"Ben, 55, has had difficulty lowering a light object smoothly for six weeks. His elbow flexors lengthen while controlling the descent. Which contraction should a supervised plan target?|Ben, 55 anos, tem dificuldade para baixar suavemente um objeto leve há seis semanas. Os flexores do cotovelo alongam enquanto controlam a descida. Qual contração um plano supervisionado deve trabalhar?","86":"Cora, 41, has had trouble holding a small package steady for three weeks. Her elbow angle stays fixed during the hold. Which contraction should the movement plan recognize?|Cora, 41 anos, tem dificuldade para segurar uma pequena encomenda parada há três semanas. O ângulo do cotovelo fica fixo durante a sustentação. Qual contração o plano de movimento deve reconhecer?","87":"Dan, 39, has had difficulty bending his elbow smoothly for a month. While the elbow flexors produce the movement, which role should the practitioner assign to the triceps in the movement analysis?|Dan, 39 anos, tem dificuldade para dobrar o cotovelo suavemente há um mês. Enquanto os flexores produzem o movimento, qual papel o profissional deve atribuir ao tríceps na análise?","88":"Elena, 52, has had posterior heel discomfort for five weeks after walking. At intake, which tissue transmits calf-muscle force to the heel and should guide avoiding painful pressure?|Elena, 52 anos, tem desconforto atrás do calcanhar há cinco semanas após caminhar. Na avaliação, qual tecido transmite a força da panturrilha ao calcanhar e orienta evitar pressão dolorosa?","89":"Finn, 29, has had lateral ankle pain for ten days after a medically assessed sprain. Which tissue joins adjacent bones and should make the practitioner avoid stressing the injured area?|Finn, 29 anos, tem dor lateral no tornozelo há dez dias após entorse avaliada por profissional de saúde. Qual tecido une ossos vizinhos e orienta evitar sobrecarga na região lesionada?","90":"Gina, 64, has had joint discomfort for three months and asks why forceful rubbing over the joint is not the plan. Which low-friction covering of bone ends is relevant to this explanation?|Gina, 64 anos, tem desconforto articular há três meses e pergunta por que o plano não inclui fricção forte sobre a articulação. Qual revestimento de baixo atrito das extremidades ósseas é relevante?","91":"Hugo, 47, has had hand tingling for six weeks and reports a clinical evaluation for carpal tunnel symptoms. Which nerve is relevant when the practitioner avoids pressure and refers back for changing symptoms?|Hugo, 47 anos, tem formigamento na mão há seis semanas e relata avaliação clínica de sintomas do túnel do carpo. Qual nervo importa ao evitar pressão e encaminhar sintomas novos?","92":"Iris, 36, has had tingling near the inner elbow for two weeks. During intake, which nerve behind the medial epicondyle should guide avoiding strong local pressure and considering referral?|Iris, 36 anos, tem formigamento perto da parte interna do cotovelo há duas semanas. Na avaliação, qual nervo atrás do epicôndilo medial orienta evitar pressão forte local e considerar encaminhamento?","93":"Jules, 59, has discussed a circulation concern with a clinician for three weeks and asks about blood leaving the heart. Which vessel should the practitioner identify when explaining the route without diagnosing the concern?|Jules, 59 anos, conversa com seu profissional de saúde sobre circulação há três semanas e pergunta sobre o sangue que sai do coração. Qual vaso o massoterapeuta deve indicar sem diagnosticar o problema?","94":"Kira, 44, has noticed mild swelling for one month and has been medically assessed. When explaining fluid return without promising treatment, which vessel system should the practitioner point out?|Kira, 44 anos, nota leve inchaço há um mês e já foi avaliada clinicamente. Ao explicar o retorno de líquido sem prometer tratamento, qual sistema de vasos o profissional deve indicar?","95":"Liam, 32, has felt stressed before sleep for four weeks and asks what body system supports rest and digestion. Which autonomic division should the practitioner name during the discussion?|Liam, 32 anos, sente estresse antes de dormir há quatro semanas e pergunta qual sistema favorece repouso e digestão. Qual divisão autonômica o profissional deve nomear?","96":"Mina, 40, has had episodes of alarm and rapid heartbeat for three weeks and is discussing them with a clinician. Which autonomic division explains this response, while the practitioner stays within scope?|Mina, 40 anos, tem episódios de alerta e batimento acelerado há três semanas e os discute com um profissional de saúde. Qual divisão autonômica explica essa resposta, respeitando o escopo da massagem?","97":"Nico, 61, has taken a prescribed diuretic for two months and asks which organs produce urine. Which organs should the practitioner identify while directing medication questions to the prescriber?|Nico, 61 anos, usa diurético prescrito há dois meses e pergunta quais órgãos produzem urina. Quais órgãos o profissional deve indicar, encaminhando dúvidas sobre medicação ao prescritor?","98":"Olivia, 53, has discussed reduced exercise tolerance with a clinician for six weeks. In an anatomy explanation, which tiny vessels exchange gases with tissues and should be identified on the diagram?|Olivia, 53 anos, conversa com seu médico sobre menor tolerância ao exercício há seis semanas. Numa explicação de anatomia, quais vasos pequenos trocam gases com os tecidos e devem ser apontados no diagrama?","99":"Yara, 41, has had back tension for three weeks and asks about body coverage. Appropriate draping protects which client interest?|Yara, 41 anos, sente tensão nas costas há três semanas e pergunta sobre cobertura do corpo. A cobertura adequada com lençóis protege qual interesse do cliente?","100":"Zed, 33, has asked about session fees for one week. A client asks about the price before treatment. What should you do?|Zed, 33 anos, pergunta sobre os preços da sessão há uma semana. Cliente pergunta o preço antes do atendimento. O que fazer?","101":"Maya, 28, has a medically assessed ankle sprain from 24 hours ago, with swelling and local warmth. Sensation and circulation are normal. At intake, which thermal option is most appropriate, while deferring massage over the injury?|Maya, 28 anos, tem entorse de tornozelo avaliada por profissional de saúde há 24 horas, com edema e calor local. Sensibilidade e circulação são normais. Na avaliação inicial, qual opção térmica é mais adequada, adiando a massagem sobre a lesão?","102":"Luis, 46, reports stable neck stiffness for six months after desk work, without recent injury, redness or swelling. Sensation and circulation are normal. Which preparation best fits the agreed gentle session?|Luis, 46 anos, relata rigidez cervical estável há seis meses após trabalho sentado, sem lesão recente, vermelhidão ou edema. Sensibilidade e circulação são normais. Qual preparação combina melhor com a sessão suave acordada?","103":"Rosa, 62, arrives for hand massage after three months of recurrent finger coldness. Today her fingers are pale and cold, and she reports impaired circulation. What should the practitioner do about a planned cold application?|Rosa, 62 anos, chega para massagem nas mãos após três meses de episódios de dedos frios. Hoje estão pálidos e frios, e ela relata circulação comprometida. O que fazer com a aplicação de frio planejada?","104":"Noah, 31, has mild hamstring tightness for two weeks without injury. During an agreed gentle stretch, a student suddenly speeds up the movement and the muscle resists. Which receptor signal supports returning to a slow, comfortable stretch?|Noah, 31 anos, tem leve tensão posterior de coxa há duas semanas, sem lesão. Durante alongamento suave acordado, um aluno acelera o movimento e o músculo resiste. Qual sinal receptor fundamenta voltar ao alongamento lento e confortável?","105":"Amira, 39, has calf tightness for four weeks and is cleared for comfortable movement. During a low-effort contract-relax exercise, she asks to use maximal force. Which explanation best supports keeping the effort controlled?|Amira, 39 anos, tem tensão na panturrilha há quatro semanas e está liberada para movimento confortável. Em exercício de contrair e relaxar com pouco esforço, pede força máxima. Qual explicação melhor fundamenta manter o esforço controlado?","106":"Ethan, 45, has mild elbow stiffness for six weeks after immobilization and has clearance for gentle range of motion. For the humeroulnar articulation, which movement should the practitioner choose?|Ethan, 45 anos, tem leve rigidez do cotovelo há seis semanas após imobilização e liberação para mobilidade suave. Na articulação umeroulnar, qual movimento escolher?","107":"Sofia, 54, has thumb-base discomfort for three months when opening jars. After assessment and clearance for gentle movement, which description best guides work at the first carpometacarpal joint?|Sofia, 54 anos, tem desconforto na base do polegar há três meses ao abrir potes. Após avaliação e liberação para movimento suave, qual descrição orienta melhor o trabalho na primeira carpometacarpal?","108":"Daniel, 42, reports a draining skin lesion on his lower leg for two days at massage intake. If contact with drainage-contaminated linen is anticipated, what action and PPE are appropriate?|Daniel, 42 anos, relata uma lesão exsudativa na perna há dois dias na avaliação inicial da massagem. Se houver contato previsto com roupa contaminada por secreção, qual conduta e EPI são adequados?","109":"Julia, a 35-year-old massage therapist, has lower-back fatigue at the end of workdays for two weeks. She bends over a low table and reaches across a client during back work. Which adjustment best addresses the observed mechanics?|Julia, massoterapeuta de 35 anos, sente fadiga lombar ao fim do expediente há duas semanas. Inclina-se sobre uma mesa baixa e alcança o outro lado do cliente durante o trabalho nas costas. Qual ajuste melhor aborda a mecânica observada?","110":"Theo, 26, bruised his forearm 12 hours ago. At intake the area is warm, swollen and tender, and he asks for deep local massage. Which process and decision fit this early response?|Theo, 26 anos, sofreu contusão no antebraço há 12 horas. Na avaliação, a região está quente, inchada e sensível, e ele pede massagem profunda local. Qual processo e decisão combinam com essa resposta inicial?","111":"Grace, 48, has a fully closed surgical scar eight weeks after a forearm procedure. Her clinician has cleared gentle scar work with gradual loading. Which tissue change supports gradual rather than maximal progression?|Grace, 48 anos, tem cicatriz cirúrgica totalmente fechada oito semanas após procedimento no antebraço. Seu profissional de saúde liberou trabalho suave na cicatriz com carga gradual. Qual mudança tecidual fundamenta progressão gradual, e não máxima?","112":"Nina, 37, has abdominal muscle tension for three weeks after exercise, with no red flags at assessment. She agrees to gentle abdominal work but asks to keep both legs covered. What should the practitioner do before moving the drape?|Nina, 37 anos, tem tensão muscular abdominal há três semanas após exercícios, sem sinais de alerta na avaliação. Aceita trabalho abdominal suave, mas pede para manter as duas pernas cobertas. O que fazer antes de mover a cobertura?"};

const HUMAN_PATCH={"1":"Ava, 45, reports shoulder pain for one week at intake. What should the practitioner do FIRST before selecting a technique?|Ava, 45 anos, relata dor no ombro há uma semana na avaliação. O que o profissional deve fazer PRIMEIRO antes de escolher uma técnica?","8":"Hugo, 61, has had shoulder pain for ten days. During treatment he asks the practitioner to stop touching it. What should happen FIRST?|Hugo, 61 anos, sente dor no ombro há dez dias. Durante a sessão, pede ao profissional que pare de tocá-lo. O que deve acontecer PRIMEIRO?","9":"Iris, 48, has had a newly swollen, warm calf since a long flight yesterday. What should the practitioner do FIRST before any massage of that leg?|Iris, 48 anos, tem panturrilha inchada e quente desde um voo longo ontem. O que o profissional deve fazer PRIMEIRO antes de qualquer massagem nessa perna?","10":"Jon, 59, has been limping since a fall two hours ago. At intake, what should the practitioner do FIRST before continuing his usual session?|Jon, 59 anos, manca desde uma queda há duas horas. Na avaliação, o que o profissional deve fazer PRIMEIRO antes de continuar a sessão habitual?","62":"Jon, 58, has had sudden chest pain and shortness of breath for five minutes during a visit. What should the practitioner do FIRST while arranging emergency help?|Jon, 58 anos, sente dor súbita no peito e falta de ar há cinco minutos durante a visita. O que o profissional deve fazer PRIMEIRO enquanto aciona a emergência?","64":"Lia, 32, is in her third trimester and has felt uncomfortable lying flat for two weeks. Which supported position should the practitioner offer for a comfortable massage?|Lia, 32 anos, está no terceiro trimestre e sente desconforto ao deitar de costas há duas semanas. Qual posição apoiada o profissional deve oferecer para uma massagem confortável?","65":"Max, 49, has had fever and acute illness since yesterday. What should the practitioner do FIRST about today's elective session?|Max, 49 anos, tem febr
