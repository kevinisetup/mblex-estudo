scenario("EFE",2,"thermal","Maya, 28, has a medically assessed ankle sprain from 24 hours ago, with swelling and local warmth. Sensation and circulation are normal. At intake, which thermal option is most appropriate, while deferring massage over the injury?|Maya, 28 anos, tem entorse de tornozelo avaliada por profissional de saúde há 24 horas, com edema e calor local. Sensibilidade e circulação são normais. Na avaliação inicial, qual opção térmica é mais adequada, adiando a massagem sobre a lesão?","Brief protected cooling with skin checks|Frio breve com proteção e checagem da pele~Intense heat directly over the swelling|Calor intenso diretamente sobre o edema|Heat may increase acute swelling.|O calor pode aumentar o edema agudo.~Deep friction immediately after heating|Fricção profunda logo após aquecer|An acute sprain is not an indication for deep friction.|Entorse aguda não indica fricção profunda.~Ice directly on skin until all sensation is lost|Gelo direto na pele até perder toda a sensibilidade|Unprotected or excessive cooling can injure skin.|Frio excessivo ou sem proteção pode lesar a pele.","Cooling can temporarily reduce local blood flow and pain and help control swelling. Protect and check the skin; it does not make acute tissue ready for massage.|O frio pode reduzir temporariamente o fluxo local e a dor e ajudar a controlar o edema. Proteja e confira a pele; isso não torna o tecido agudo pronto para massagem.");
scenario("EFE",2,"thermal","Luis, 46, reports stable neck stiffness for six months after desk work, without recent injury, redness or swelling. Sensation and circulation are normal. Which preparation best fits the agreed gentle session?|Luis, 46 anos, relata rigidez cervical estável há seis meses após trabalho sentado, sem lesão recente, vermelhidão ou edema. Sensibilidade e circulação são normais. Qual preparação combina melhor com a sessão suave acordada?","Comfortable moist warmth with skin monitoring|Calor úmido confortável com monitoramento da pele~A scalding pack to reach deeper tissue faster|Compressa escaldante para alcançar tecidos profundos mais rápido|Higher temperature raises burn risk.|Temperatura maior eleva o risco de queimadura.~Prolonged ice until the neck is numb|Gelo prolongado até anestesiar o pescoço|Numbness is not a safe target for preparing movement.|Anestesia não é uma meta segura para preparar movimento.~Forceful stretching before checking tolerance|Alongamento forçado antes de verificar tolerância|Preparation does not justify forcing range.|Preparação não justifica forçar amplitude.","Gentle warmth promotes superficial vasodilation and can ease stiffness before comfortable movement. Screen first and monitor skin rather than treating hotter as better.|Calor suave promove vasodilatação superficial e pode aliviar rigidez antes de movimento confortável. Avalie antes e monitore a pele, sem confundir mais quente com melhor.");
scenario("EFE",3,"thermal","Rosa, 62, arrives for hand massage after three months of recurrent finger coldness. Today her fingers are pale and cold, and she reports impaired circulation. What should the practitioner do about a planned cold application?|Rosa, 62 anos, chega para massagem nas mãos após três meses de episódios de dedos frios. Hoje estão pálidos e frios, e ela relata circulação comprometida. O que fazer com a aplicação de frio planejada?","Withhold cold and seek appropriate clinical guidance|Não aplicar frio e buscar orientação clínica adequada~Use a shorter cold application without further assessment|Aplicar frio por menos tempo sem nova avaliação|Shortening exposure does not resolve impaired circulation.|Encurtar a exposição não resolve a circulação comprometida.~Keep ice on until the fingers turn blue|Manter gelo até os dedos ficarem azulados|Color deterioration is a warning, not a treatment goal.|Piora da cor é alerta, não objetivo terapêutico.~Alternate extreme heat and cold to restore circulation|Alternar calor e frio extremos para restaurar a circulação|Extreme temperatures are unsafe in compromised tissue.|Temperaturas extremas são inseguras no tecido comprometido.","Cold can further reduce local perfusion. Abnormal circulation requires assessment; merely reducing cold exposure is not an adequate safeguard here.|O frio pode reduzir ainda mais a perfusão local. Circulação anormal exige avaliação; apenas diminuir o tempo de frio não é proteção suficiente neste caso.");
scenario("CIN",2,"proprioception","Noah, 31, has mild hamstring tightness for two weeks without injury. During an agreed gentle stretch, a student suddenly speeds up the movement and the muscle resists. Which receptor signal supports returning to a slow, comfortable stretch?|Noah, 31 anos, tem leve tensão posterior de coxa há duas semanas, sem lesão. Durante alongamento suave acordado, um aluno acelera o movimento e o músculo resiste. Qual sinal receptor fundamenta voltar ao alongamento lento e confortável?","Muscle spindles signal muscle length and rate of length change|Fusos musculares sinalizam comprimento e velocidade de mudança do comprimento~Golgi tendon organs primarily measure skin temperature|Órgãos tendinosos de Golgi medem principalmente temperatura da pele|Golgi tendon organs sense tension, not skin temperature.|Órgãos de Golgi detectam tensão, não temperatura da pele.~Joint cartilage detects blood oxygen saturation|Cartilagem articular detecta saturação de oxigênio|Cartilage is not an oxygen-saturation receptor.|Cartilagem não é receptor de saturação de oxigênio.~Pain receptors prove that faster stretching is safer|Receptores de dor comprovam que alongar mais rápido é seguro|Pain is not evidence that speed is safe.|Dor não comprova segurança da velocidade.","Muscle spindles respond to muscle length and stretch rate and contribute to the stretch reflex. Use controlled movement rather than attempting to overpower resistance.|Fusos respondem ao comprimento muscular e à velocidade do alongamento e participam do reflexo de estiramento. Use movimento controlado em vez de vencer a resistência à força.");
scenario("CIN",3,"proprioception","Amira, 39, has calf tightness for four weeks and is cleared for comfortable movement. During a low-effort contract-relax exercise, she asks to use maximal force. Which explanation best supports keeping the effort controlled?|Amira, 39 anos, tem tensão na panturrilha há quatro semanas e está liberada para movimento confortável. Em exercício de contrair e relaxar com pouco esforço, pede força máxima. Qual explicação melhor fundamenta manter o esforço controlado?","Golgi tendon organs monitor tension and contribute to force regulation; maximal force is unnecessary|Órgãos tendinosos de Golgi monitoram tensão e participam da regulação da força; força máxima é desnecessária~Tendon receptors detect only the speed of muscle lengthening|Receptores tendinosos detectam apenas velocidade de alongamento muscular|Length and stretch-rate signals chiefly describe muscle spindles.|Comprimento e velocidade de alongamento descrevem sobretudo os fusos.~A protective reflex guarantees that a tendon cannot be injured|Um reflexo protetor garante que o tendão não pode sofrer lesão|Reflexes do not guarantee protection from tissue injury.|Reflexos não garantem proteção contra lesão.~Maximal pain is needed to switch off every motor neuron|Dor máxima é necessária para desligar todos os neurônios motores|Pain is not a necessary or safe exercise target.|Dor não é objetivo necessário nem seguro do exercício.","Golgi tendon organs sense muscle-tendon tension. Their spinal feedback can inhibit the same muscle in the classic autogenic-inhibition model, but depends on the task and never guarantees injury prevention.|Órgãos de Golgi detectam tensão musculotendínea. No modelo clássico de inibição autogênica, o retorno medular pode inibir o mesmo músculo, mas depende da tarefa e nunca garante prevenção de lesão.");
scenario("CIN",2,"joints","Ethan, 45, has mild elbow stiffness for six weeks after immobilization and has clearance for gentle range of motion. For the humeroulnar articulation, which movement should the practitioner choose?|Ethan, 45 anos, tem leve rigidez do cotovelo há seis semanas após imobilização e liberação para mobilidade suave. Na articulação umeroulnar, qual movimento escolher?","Comfortable flexion and extension at a hinge joint|Flexão e extensão confortáveis em uma articulação em dobradiça~Forced circumduction as at a ball-and-socket joint|Circundução forçada como numa articulação esferoide|The humeroulnar joint is not a ball-and-socket joint.|A umeroulnar não é uma articulação esferoide.~Lateral bending beyond the joint limits|Inclinação lateral além dos limites articulares|This would stress structures outside the intended motion.|Isso sobrecarregaria estruturas fora do movimento previsto.~Forearm rotation attributed only to the humeroulnar hinge|Rotação do antebraço atribuída apenas à dobradiça umeroulnar|Pronation and supination involve the radioulnar joints.|Pronação e supinação envolvem as radioulnares.","The humeroulnar joint is a hinge permitting flexion and extension. Respect clearance, pain and available range; do not confuse it with nearby pivot joints.|A umeroulnar é uma dobradiça que permite flexão e extensão. Respeite liberação, dor e amplitude disponível; não a confunda com articulações trocoides próximas.");
scenario("CIN",3,"joints","Sofia, 54, has thumb-base discomfort for three months when opening jars. After assessment and clearance for gentle movement, which description best guides work at the first carpometacarpal joint?|Sofia, 54 anos, tem desconforto na base do polegar há três meses ao abrir potes. Após avaliação e liberação para movimento suave, qual descrição orienta melhor o trabalho na primeira carpometacarpal?","A saddle joint contributing to opposition; use comfortable motion without forceful end-range loading|Articulação em sela que participa da oposição; usar movimento confortável sem carga forçada no fim da amplitude~A hinge joint that permits only elbow-like bending|Articulação em dobradiça que permite apenas dobrar como o cotovelo|The first carpometacarpal joint has saddle geometry.|A primeira carpometacarpal tem geometria em sela.~A fused joint that should be forced until it moves|Articulação fundida que deve ser forçada até mover|This is a mobile synovial joint; forcing is inappropriate.|É uma articulação sinovial móvel; forçar é inadequado.~A pivot joint designed for unrestricted spinning|Articulação trocoide feita para rotação irrestrita|Saddle motion is not unrestricted axial spinning.|Movimento em sela não é giro axial irrestrito.","The first carpometacarpal joint is a saddle joint whose mobility contributes to thumb opposition. Symptoms and the plan guide force and range.|A primeira carpometacarpal é uma articulação em sela cuja mobilidade participa da oposição do polegar. Os sintomas e o plano orientam força e amplitude.");
scenario("PRO",2,"ppe","Daniel, 42, reports a draining skin lesion on his lower leg for two days at massage intake. If contact with drainage-contaminated linen is anticipated, what action and PPE are appropriate?|Daniel, 42 anos, relata uma lesão exsudativa na perna há dois dias na avaliação inicial da massagem. Se houver contato previsto com roupa contaminada por secreção, qual conduta e EPI são adequados?","Use gloves for anticipated fluid contact, perform hand hygiene, and defer work over the lesion|Usar luvas no contato previsto com fluidos, higienizar as mãos e adiar trabalho sobre a lesão~Massage the lesion because gloves make it safe|Massagear a lesão porque as luvas tornam isso seguro|Gloves do not remove a local contraindication.|Luvas não eliminam uma contraindicação local.~Handle drainage with bare hands and wash later|Manusear secreção sem luvas e lavar depois|Handwashing afterward does not replace the barrier when contact is anticipated.|Lavar depois não substitui a barreira no contato previsto.~Reuse gloves between clients if they look clean|Reutilizar luvas entre clientes se parecerem limpas|Used gloves can transfer contamination.|Luvas usadas podem transferir contaminação.","Standard precautions call for gloves when contact with body fluids or nonintact skin is anticipated. Gloves do not replace hand hygiene or authorize massage over a draining lesion.|Precauções padrão indicam luvas quando se prevê contato com fluidos ou pele não íntegra. Luvas não substituem higiene das mãos nem autorizam massagem sobre lesão exsudativa.");
scenario("PRO",2,"mechanics","Julia, a 35-year-old massage therapist, has lower-back fatigue at the end of workdays for two weeks. She bends over a low table and reaches across a client during back work. Which adjustment best addresses the observed mechanics?|Julia, massoterapeuta de 35 anos, sente fadiga lombar ao fim do expediente há duas semanas. Inclina-se sobre uma mesa baixa e alcança o outro lado do cliente durante o trabalho nas costas. Qual ajuste melhor aborda a mecânica observada?","Raise the table to a suitable working height and step closer to the area|Elevar a mesa a uma altura adequada e aproximar-se da área~Lower the table further and keep the feet fixed|Baixar ainda mais a mesa e manter os pés fixos|This increases the need to bend and reach.|Isso aumenta a necessidade de inclinar e alcançar.~Twist the trunk while keeping the hips still|Torcer o tronco mantendo o quadril imóvel|Sustained twisting adds mechanical stress.|Torção sustentada aumenta a sobrecarga mecânica.~Apply more force with the same posture|Aplicar mais força com a mesma postura|More force does not correct the awkward position.|Mais força não corrige a postura inadequada.","An appropriate table height reduces sustained trunk flexion; moving closer reduces reaching. Persistent pain warrants assessment rather than simply working through it.|Altura adequada da mesa reduz flexão sustentada do tronco; aproximar-se reduz o alcance. Dor persistente exige avaliação, em vez de simplesmente continuar trabalhando.");
scenario("ANA",2,"repair","Theo, 26, bruised his forearm 12 hours ago. At intake the area is warm, swollen and tender, and he asks for deep local massage. Which process and decision fit this early response?|Theo, 26 anos, sofreu contusão no antebraço há 12 horas. Na avaliação, a região está quente, inchada e sensível, e ele pede massagem profunda local. Qual processo e decisão combinam com essa resposta inicial?","Vasodilation and increased vascular permeability; defer deep work over the injury|Vasodilatação e maior permeabilidade vascular; adiar trabalho profundo sobre a lesão~Completed collagen remodeling; use maximum pressure|Remodelamento do colágeno concluído; usar pressão máxima|An acute injury has not completed remodeling.|Uma lesão aguda não completou o remodelamento.~No inflammatory activity; ignore warmth and swelling|Ausência de inflamação; ignorar calor e edema|Warmth and swelling are compatible with inflammation.|Calor e edema são compatíveis com inflamação.~Immediate full tissue strength; force the painful range|Resistência tecidual total imediata; forçar a amplitude dolorosa|Early tissue injury does not imply full strength.|Lesão inicial não implica resistência total.","Early inflammation includes vasodilation and fluid movement into tissue as vascular permeability rises. Do not interpret these signs as an invitation to deep local work; assess the need for referral.|A inflamação inicial inclui vasodilatação e passagem de líquido ao tecido com maior permeabilidade vascular. Esses sinais não indicam trabalho profundo local; avalie necessidade de encaminhamento.");
scenario("ANA",3,"remodeling","Grace, 48, has a fully closed surgical scar eight weeks after a forearm procedure. Her clinician has cleared gentle scar work with gradual loading. Which tissue change supports gradual rather than maximal progression?|Grace, 48 anos, tem cicatriz cirúrgica totalmente fechada oito semanas após procedimento no antebraço. Seu profissional de saúde liberou trabalho suave na cicatriz com carga gradual. Qual mudança tecidual fundamenta progressão gradual, e não máxima?","Collagen reorganizes and tissue strength develops during remodeling|O colágeno se reorganiza e a resistência se desenvolve no remodelamento~Closure means the scar immediately has normal tissue strength|Fechamento significa resistência normal imediata da cicatriz|Surface closure does not prove full mechanical strength.|Fechamento superficial não prova resistência mecânica completa.~Collagen disappears completely at eight weeks|O colágeno desaparece totalmente em oito semanas|Collagen persists and is remodeled.|O colágeno permanece e é remodelado.~More pain proves that the load is more effective|Mais dor comprova que a carga é mais eficaz|Pain is not a measure of useful loading.|Dor não mede a utilidade da carga.","Remodeling reorganizes collagen and improves tensile strength over time; healed tissue may not regain its original strength. Follow clearance and tolerance rather than a calendar-only rule.|O remodelamento reorganiza colágeno e melhora resistência à tração com o tempo; o tecido cicatrizado pode não recuperar a resistência original. Siga liberação e tolerância, não apenas o calendário.");
scenario("ETI",2,"rights","Nina, 37, has abdominal muscle tension for three weeks after exercise, with no red flags at assessment. She agrees to gentle abdominal work but asks to keep both legs covered. What should the practitioner do before moving the drape?|Nina, 37 anos, tem tensão muscular abdominal há três semanas após exercícios, sem sinais de alerta na avaliação. Aceita trabalho abdominal suave, mas pede para manter as duas pernas cobertas. O que fazer antes de mover a cobertura?","Explain the limited exposure, keep the legs covered and confirm permission|Explicar a exposição limitada, manter as pernas cobertas e confirmar permissão~Uncover the legs because the practitioner prefers it|Descobrir as pernas por preferência profissional|Preference does not override the client’s boundary.|Preferência profissional não supera o limite da cliente.~Move the drape first and explain afterward|Mover a cobertura primeiro e explicar depois|Permission should precede the change.|A permissão deve vir antes da mudança.~Treat her initial agreement as consent to every exposure|Tratar a concordância inicial como consentimento para toda exposição|Consent is specific and can be limited or withdrawn.|O consentimento é específico e pode ser limitado ou retirado.","Respect the requested coverage, explain what will be exposed and confirm ongoing consent. If the requested work cannot be done within those limits, agree on another plan.|Respeite a cobertura solicitada, explique o que será exposto e confirme consentimento contínuo. Se não for possível trabalhar dentro desses limites, combinem outro plano.");

DATA_PATCH.forEach(p=>Object.assign(BANK.find(q=>q.id===p.id),{hook:pair(p.hook),practice:pair(p.practice),img:p.img}));
let ptEnabled=true;
let state={screen:'intro',at:0,answers:Array(20).fill(null),profile:null,exam:null};
function mount(html,light=false){document.body.classList.toggle('pt-off',!ptEnabled);document.body.classList.toggle('light',light);$('#app').innerHTML='<div class="fade">'+html+'</div>';const heading=$('main h1,main h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}window.scrollTo(0,0);}
function bind(id,fn){const el=document.getElementById(id);if(el)el.onclick=fn;}
function button(id,label,cls=''){return `<button type="button" id="${id}" class="${cls}">${label}</button>`;}
function startProfile(){state={screen:'profile',at:0,answers:Array(20).fill(null),profile:null,exam:null};renderItem();}
function intro(){state.screen='intro';mount(`<section class="hero"><div><p class="eyebrow">01 / Primeiro, seu jeito de estudar</p><h1>Mais clareza.<br>Uma questão<br>de cada vez.</h1><p class="lead">São 20 perguntas rápidas sobre seu estudo.<br>Não existe resposta certa ou errada.<br>O resultado ajusta seu próximo treino.</p>${button('start','Começar','primary')}</div><div><div class="orb" aria-hidden="true"><div class="orb-label"><strong>20</strong><span>um novo ponto de partida</span></div></div></div></section><div class="steps"><div><b>01 · Seu perfil</b><span>20 escolhas rápidas</span></div><div><b>02 · Sua direção</b><span>Um plano de treino</span></div><div><b>03 · Sua prática</b><span>${BANK.length} itens · EN + PT</span></div></div><details><summary>Como este material foi preparado</summary>${sourceNotes()}</details>`);bind('start',startProfile);}
function ptButton(){return `<button type="button" id="pt-toggle" aria-label="PT on/off: tradução em português" aria-pressed="${ptEnabled}">${ptEnabled?'PT ligado':'PT desligado'}</button>`;}
function wirePT(){bind('pt-toggle',()=>{ptEnabled=!ptEnabled;document.body.classList.toggle('pt-off',!ptEnabled);const b=$('#pt-toggle');b.setAttribute('aria-pressed',String(ptEnabled));b.textContent=ptEnabled?'PT ligado':'PT desligado';});}
function renderItem(){const i=state.at,[axis,q,opts]=ITEMS[i];mount(`<section class="question-shell"><div class="topline">${ptButton()}</div><div class="topline"><span class="eyebrow" style="margin:0">Seu perfil de estudo</span><span class="small num">${String(i+1).padStart(2,'0')} <span class="muted">/ 20</span></span></div><progress value="${i}" max="20" aria-label="${i} de 20 itens anteriores concluídos"></progress><p class="eyebrow">${esc(AXES[axis].split(':')[0])}</p><div class="question-text"><h2 lang="en">${esc(PROFILE_EN[i][0])}</h2><p lang="pt-BR" class="pt">${esc(q)}</p><div class="choices">${opts.map((x,j)=>`<button type="button" class="choice profile-choice" data-choice="${j}" aria-pressed="${state.answers[i]===j}"><span class="letter">${letters[j]}</span><span><span lang="en">${esc(PROFILE_EN[i][1][j])}</span><span lang="pt-BR" class="pt">${esc(x)}</span></span></button>`).join('')}</div></div><div class="actions">${i?button('back','Voltar'):''}${button('next',i===19?'Ver meu perfil':'Continuar','primary')}</div><p class="small muted" style="margin-top:22px">Escolha uma opção para continuar. Ao sair ou recarregar, você perde as respostas.</p></section>`);wirePT();$('#next').disabled=state.answers[i]===null;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.answers[i]=Number(b.dataset.choice);document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#next').disabled=false;});bind('back',()=>{state.at--;renderItem();});bind('next',()=>{if(state.answers[i]===null)return;if(i===19){state.profile=classify(state.answers);result();}else{state.at++;renderItem();}});}
function classify(a){if(a.length!==20||a.some(x=>!Number.isInteger(x)||x<0||x>3))throw Error('Responda todos os 20 itens.');const axes={};for(const key of Object.keys(AXES)){const ids=ITEMS.map((x,i)=>x[0]===key?i:-1).filter(i=>i>=0);axes[key]=Math.round(ids.reduce((n,i)=>n+ITEMS[i][3][a[i]],0)/ids.length*10)/10;}const can=[2,7,14],mot=[4,18],errs=[5,11,15,19];const scores={'ROTAÇÃO':(axes.RET+axes.PRA)/8,'ANSIOSA':axes.ANS/4*.8+errs.filter(i=>a[i]===2).length/4*.2,'VISUAL':can.filter(i=>a[i]===0).length/3,'AUDITIVA':can.filter(i=>a[i]===1).length/3,'PRAGMÁTICA':mot.reduce((n,i)=>n+ITEMS[i][3][a[i]],0)/8};const ranked=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]);const dominant=ranked[0],secondary=ranked[1],tie=Math.abs(scores[dominant]-scores[secondary])<.001;const anxious=scores.ANSIOSA>=.6,visual=scores.VISUAL>=.5,pragmatic=scores.PRAGMÁTICA>=.5;return {axes,scores,dominant,secondary,tie,note:Math.round(100*(scores[dominant]-scores[secondary])),config:{timer:anxious?'não':'sim',imagem:visual?'alta':scores.VISUAL>0?'média':'baixa',idioma:a[12]>=2?'PT':'EN',bloco:anxious||pragmatic?10:20},hour:ITEMS[8][2][a[8]],created:new Date()};}
function exportProfile(p,a){
 const d=p.created,pad=n=>String(n).padStart(2,'0');
 const header=`PERFIL-MBLEX v1\nDATA: ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}\nPERFIL: ${p.dominant} | SECUNDÁRIO: ${p.secondary}\nEIXOS: ${Object.keys(AXES).map(k=>`${k} (${p.axes[k]}/4)`).join(' ')}\nRESPOSTAS: ${a.map((x,i)=>`${i+1}${letters[x]}`).join(' ')}\nCONFIG: timer=${p.config.timer} imagem=${p.config.imagem} idioma=${p.config.idioma} bloco=${p.config.bloco}\nNOTA: ${p.note}`;
 const detailed=a.map((choice,i)=>`${i+1} | ${ITEMS[i][0]} | ${letters[choice]} | EN: ${PROFILE_EN[i][1][choice]} | PT: ${ITEMS[i][2][choice]}`).join('\n');
 const complete=`DOMINANTE: ${p.dominant} | SECUNDÁRIO: ${p.secondary} | NOTA: ${p.note}\n${Object.keys(AXES).map(k=>`${k} ${p.axes[k]}/4`).join(' ')}`;
 return `${header}\n\nRESPOSTAS DETALHADAS:\n${detailed}\n\nPERFIL COMPLETO:\n${complete}`;
}
function result(){state.screen='result';const p=state.profile,c=p.config;mount(`<p class="eyebrow">02 / Seu ponto de partida</p><h1 style="font-size:40px">Um plano para<br>estudar com direção.</h1><div class="grid"><section class="glass"><span class="tag">Perfil predominante no autorrelato</span><h2 class="profile-name">${p.dominant}</h2><p class="small muted">Secundário: ${p.secondary} · apoio complementar</p><div class="reading">${PROFILES[p.dominant].lines.map(x=>`<p>${x}</p>`).join('')}</div>${p.tie?'<p class="note">Houve empate. A ordem dos rótulos é apenas operacional; não há predominância clara.</p>':''}<h3>Prescrição prática</h3><ul class="prescription">${PROFILES[p.dominant].rx.map(x=>`<li>${x}</li>`).join('')}</ul><p class="small"><b>Complemento:</b> ${PROFILES[p.secondary].rx[0]}</p><p class="small muted">Horário relatado: ${p.hour.toLowerCase()}.</p></section><section class="glass"><h2>Seu treino, ajustado.</h2><div class="config"><div><span>Timer inicial</span>${c.timer==='sim'?'Ativado':'A partir do 3º bloco'}</div><div><span>Imagens recomendadas</span>${c.imagem}</div><div><span>Primeiro idioma</span>Inglês + português abaixo</div><div><span>Tamanho do bloco</span>${c.bloco} questões</div></div><p class="small muted">O treino aplica timer e bloco; a apresentação começa em inglês, com tradução abaixo. O simulado ampliado usa ${Math.ceil(BANK.length/20)} blocos (o último com ${BANK.length%20||20} itens) e 110 minutos contínuos.</p><h3>Seis eixos</h3>${Object.keys(AXES).map(k=>`<div class="axis" title="${AXES[k]}"><span>${k}</span><progress value="${p.axes[k]}" max="4" aria-label="${AXES[k]}: ${p.axes[k]} de 4"></progress><span>${p.axes[k]}/4</span></div>`).join('')}<details><summary>Entender pontuação e limites</summary><p>As pontuações organizam apenas as respostas desta sessão. Não medem memória real, personalidade, inteligência ou aptidão. Visual e auditiva são preferências de recurso, não estilos de aprendizagem comprovados.</p><p>RET/PRA: maior pontuação indica mais dependência de estudo concentrado. CAN: apoio visual ou oral relatado. ERR/ANS: interferência de leitura ou pressão. MOT: apoio de metas e idioma; horário é uma escolha neutra.</p><p>NOTA ${p.note}/100: diferença entre os dois maiores índices, em pontos percentuais. É um indicador editorial de separação, não confiança estatística nem chance de aprovação. Empates seguem a ordem rotação, ansiosa, visual, auditiva, pragmática.</p></details></section></div><p class="note">Perfil não é diagnóstico clínico. Um questionário de autorrelato não confirma a causa dos erros; o desempenho no treino deve conferir esta hipótese.</p><div class="actions">${button('review','Perfil e respostas')}${button('generate','Gerar resumo para enviar')}${button('configure','Configurar simulado','primary')}</div><div id="export"></div><div class="actions">${button('redo','Refazer perfil','quiet')}</div>`);bind('review',reviewReport);bind('generate',()=>{const target=$('#export');target.innerHTML='<label for="summary-text">Resumo para enviar</label><textarea id="summary-text" readonly spellcheck="false"></textarea><div class="actions">'+button('copy','Copiar')+'</div><p id="copy-status" class="status" role="status"></p>';$('#summary-text').value=exportProfile(p,state.answers);bind('copy',()=>copyText($('#summary-text'),$('#copy-status')));target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});});bind('configure',setup);bind('redo',()=>{if(confirm('Refazer apaga as respostas desta sessão. Continuar?'))startProfile();});}
async function copyText(field,status){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(field.value);}else{field.focus();field.select();field.setSelectionRange(0,field.value.length);if(!document.execCommand('copy'))throw Error('Cópia indisponível');}status.textContent='Copiado. Cole na mensagem que desejar.';}catch{field.focus();field.select();field.setSelectionRange(0,field.value.length);status.textContent='Cópia automática bloqueada. O texto está selecionado: use Copiar no menu do aparelho.';}}
function sourceNotes(){return `<p>Questões autorais de treino, inspiradas nos temas dos prints e no formato público do MBLEx. Não são itens oficiais nem reprodução de um exame real. Fontes consultadas em 05/11/2026; os links precisam de internet, o treino não.</p><p><b>Correções dos prints:</b> educação, competência e lei delimitam <i lang="en">scope of practice</i>, não <i lang="en">certificate</i>. Flashback isolado não prova transferência. As questões 28 e 37 repetem draping; várias imagens enviadas repetem a mesma página. Venda de prática não autoriza divulgar prontuários indiscriminadamente.</p><p>O exame oficial é adaptativo; este banco é fixo e sua dificuldade é editorial. Percentual neste treino não prevê aprovação. Alegação fornecida, não verificada: "Em 87 questões medidas de três bancos públicos, B e C concentraram 62% das respostas corretas. Amostra pequena: use só como desempate, depois de eliminar." Os bancos e gabaritos dessa medição não foram fornecidos. Neste simulado, as alternativas são embaralhadas; a alegação não fundamenta preferir B ou C. Há duas repetições deliberadas, nas posições 40 e 80, para retomar conteúdo.</p><p><b>Exame:</b> 100 questões em 110 minutos; é preciso concluir todas. Resultado oficial PASS/FAIL, sem equivalência com percentual deste treino. Inscrição: US$ 265 no manual de setembro de 2026. O prazo de 30 dias citado no material enviado não foi confirmado nessa edição; confira a regra vigente com a FSMTB. <a href="${SOURCES.exam[1]}" target="_blank" rel="noopener noreferrer">Manual oficial</a>.</p><p><b>Nevada:</b> o conselho informa programa de pelo menos 625 horas e impressões digitais para verificação de antecedentes. Há outros requisitos; aprovação no exame não é licença. <a href="${SOURCES.nevada[1]}" target="_blank" rel="noopener noreferrer">Conselho de Nevada</a>.</p><details><summary>Mapa de revisão: termos e decisões</summary>${studyGuide()}</details><ul class="sources">${Object.values(SOURCES).map(([name,url])=>`<li><a href="${url}" target="_blank" rel="noopener noreferrer">${name}</a></li>`).join('')}</ul><p>Alterne fontes públicas de prática e compare explicações. Alegação fornecida, não verificada: "Em 87 questões medidas de três bancos públicos, B e C concentraram 62% das respostas corretas. Amostra pequena: use só como desempate, depois de eliminar." Os bancos e gabaritos dessa medição não foram fornecidos. Neste simulado, as alternativas são embaralhadas; a alegação não fundamenta preferir B ou C. Um intervalo fixo de três semanas não é uma regra oficial de retenção.</p>`;}
function studyGuide(){const rows=[
['Global vs local','Febre ou suspeita de trombose exige adiar e encaminhar; hematoma recente exige cautela local e avaliação do contexto. Crônico não significa automaticamente seguro.','Fever or a suspected clot calls for deferral and referral; a fresh bruise requires local caution and contextual assessment. Chronic does not automatically mean safe.','massage'],
['Client rights vs therapist prerogative','Privacidade, cobertura e recusa são direitos do cliente. O profissional também pode recusar conduta insegura ou fora do escopo.','Privacy, draping and refusal are client rights. Practitioners may also decline unsafe or out-of-scope services.','rights'],
['Scope vs ethics','Escopo delimita atividades permitidas; ética orienta conduta. Certificado não substitui licença nem competência.','Scope defines permitted activities; ethics guides conduct. A certificate does not replace licensure or competence.','ethics'],
['Transference vs countertransference','Transferência: projeção do cliente. Contratransferência: questões pessoais do profissional interferem no atendimento. Flashback isolado não estabelece nenhum dos dois. Atalho incorreto do material: "Na prova, flashback durante a sessão é transference; o distrator é countertransference." Um flashback sozinho não sustenta essa resposta; procure projeção de sentimentos de relações anteriores no profissional.','Transference: client projection. Countertransference: practitioner issues affect care. An isolated flashback establishes neither. Do not label a flashback as transference without evidence of projection onto the practitioner.','transfer'],
['Abuse / misappropriation / power differential','Abuse: abuso. Misappropriation: apropriação indevida, por exemplo de bens. Power differential: influência desigual da relação profissional. Não são sinônimos.','Abuse, wrongful appropriation of property and unequal professional influence describe different conduct or circumstances.','abmp'],
['Cleaning / disinfection / sterilization','Limpeza remove sujeira. Desinfecção não garante eliminar esporos. Esterilização elimina formas microbianas, inclusive esporos; siga uso indicado do equipamento.','Cleaning removes soil. Disinfection does not guarantee spore elimination. Sterilization eliminates microbial forms including spores; match processing to intended use.','cdc'],
['Informed / implied / assumption of risk / waiver','Consentimento informado exige compreensão e escolha. Implícito é inferido da conduta. Assumir risco e assinar isenção não substituem consentimento nem autorizam negligência.','Informed consent requires understanding and choice. Implied consent is inferred from conduct. Risk acknowledgment and a waiver do not replace consent or authorize negligence.','rights'],
['Anticoagulants / corticosteroids','Anticoagulantes aumentam preocupação com sangramento. Corticoides podem causar fragilidade cutânea. Adapte manejo e não altere medicação.','Anticoagulants raise bleeding concerns. Corticosteroids may cause skin fragility. Adapt handling and do not alter medication.','drugs'],
['Antihypertensives / analgesics','Anti-hipertensivos podem causar tontura. Analgésicos podem reduzir dor sem comprovar recuperação. Levantar com segurança e reavaliar são mais úteis que presumir tolerância.','Antihypertensives may cause dizziness. Analgesics may reduce pain without proving recovery. Safe transitions and reassessment matter more than assumed tolerance.','pressure'],
['Pregnancy positioning','Decúbito lateral apoiado é uma opção adequada; lado, pressão e duração dependem de conforto, sintomas e avaliação. Não transforme um lado específico em regra universal. Atalho do material, não regra oficial confirmada: "Na prova, decúbito lateral esquerdo é o padrão no terceiro trimestre, com pressão e duração reduzidas." O cenário e as alternativas devem orientar a escolha; adapte lado, pressão e duração à avaliação individual.','Supported side-lying is an appropriate option; side, pressure and duration depend on comfort, symptoms and assessment. Do not make one side a universal rule. A universal exam rule requiring left-side positioning and reduced pressure and duration has not been established here.','pregnancy']
];return rows.map(([term,pt,en,s])=>`<p><b>${term}</b><br>${pt}<br><span lang="en">${en}</span><br><a href="${SOURCES[s][1]}" target="_blank" rel="noopener noreferrer">${SOURCES[s][0]}</a></p>`).join('');}
function setup(){state.screen='setup';mount(`<section class="question-shell"><p class="eyebrow">03 / Da intenção à prática</p><h1 style="font-size:42px">Prepare seu bloco.</h1><p class="muted">${BANK.length} itens de treino (${BANK.filter(q=>!q.repeatOf).length} únicos). Sete domínios. Perguntas, alternativas e correções em inglês e português.</p><label for="mode">Modo</label><select id="mode"><option value="study">Treino ajustado ao perfil · ver resposta</option><option value="exam" selected>Simulado ampliado · ${BANK.length} itens / 110 minutos</option></select><label for="difficulty">Dificuldade</label><select id="difficulty"><option value="progressive">Progressiva · básico até superavançado</option><option value="1">Básico primeiro</option><option value="2">Intermediário primeiro</option><option value="3">Avançado primeiro</option><option value="4">Superavançado primeiro</option></select><p class="small muted">As opções mudam a ordem inicial; todos os níveis e domínios permanecem no percurso completo. Superavançado exige distinguir prioridade, contexto e termos próximos.</p><label for="first-language">Idioma apresentado primeiro</label><select id="first-language"><option value="EN">English first · português abaixo</option></select><label for="deadline">Horário pessoal de encerramento (opcional)</label><input id="deadline" type="time" style="font:inherit;padding:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px"><div class="note"><b>Briefing</b><br>${BANK.length} itens, quatro alternativas, uma correta. O exame oficial tem 100 questões.<br>Na prova: 110 minutos, sem voltar; o relógio continua nos intervalos.<br>Planejamento deste treino ampliado: 110 minutos para ${BANK.length} itens; reserve tempo para as últimas ${BANK.length%20} questões.<br>Metas de treino: 80% nas primeiras 20 e 60% nas questões 21–60.<br>Ao fim de cada bloco, confira o parcial e clique em Seguir.</div><p class="small muted">Os ajustes de timer e blocos do perfil são aplicados ao selecionar Treino. Imagens clínicas não verificadas aparecem como SEM IMAGEM; densidade recomendada não significa acervo disponível.</p><div class="actions">${button('profile','Voltar ao perfil')}${button('begin','Iniciar','primary')}</div><details><summary>Fontes, correções dos prints e limites</summary>${sourceNotes()}</details></section>`,true);$('#first-language').value='EN';bind('profile',result);bind('begin',()=>startExam($('#mode').value,$('#difficulty').value,$('#first-language').value,$('#deadline').value));}
function shuffle(a){const out=a.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function makeDeck(difficulty){const priority=l=>difficulty==='progressive'?l:((l-Number(difficulty)+4)%4);const pools=Object.keys(DOMAINS).map(d=>shuffle(BANK.filter(q=>q.d===d&&!q.slot)).sort((a,b)=>priority(a.l)-priority(b.l)));const deck=[];while(pools.some(p=>p.length)){for(const p of pools){if(p.length)deck.push(p.shift());}}deck.sort((a,b)=>priority(a.l)-priority(b.l));for(const q of BANK.filter(q=>q.slot).sort((a,b)=>a.slot-b.slot))deck.splice(q.slot-1,0,q);return deck.map(q=>{const opts=shuffle(q.o.map((v,i)=>({v,correct:i===0})));return {...q,options:opts,correct:opts.findIndex(x=>x.correct)};});}
function startExam(mode,difficulty,lang,deadline){const now=Date.now();state.exam={mode,difficulty,lang,deadline,deck:makeDeck(difficulty),index:0,selected:null,records:[],revealed:false,block:1,blockSize:mode==='exam'?20:state.profile.config.bloco,started:now,blockStarted:now,itemStarted:now,blockDue:null,ended:null,expired:false};state.screen='question';setBlockTimer();renderQuestion();}
function setBlockTimer(){const e=state.exam;e.blockDue=e.mode==='study'&&(state.profile.config.timer==='sim'||e.block>=3)?Date.now()+Math.min(e.blockSize,e.deck.length-e.index)*66000:null;}
function remaining(){const e=state.exam;if(!e)return null;const due=e.mode==='exam'?e.started+6600000:e.blockDue;return due===null?null:Math.max(0,due-Date.now());}
function formatTime(ms){const sec=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function bilingual(p,lang,cls=''){const order=lang==='PT'?[1,0]:[0,1];return order.map((idx,n)=>`<div lang="${idx?'pt-BR':'en'}" class="${n?'pt':cls||'en'}"><span class="language">${idx?'PORTUGUÊS':'ENGLISH'}</span>${esc(p[idx])}</div>`).join('');}
function renderQuestion(){state.screen='question';const e=state.exam,q=e.deck[e.index];mount(`<section class="question-shell"><div class="topline">${ptButton()}</div><div class="topline"><span class="tag">Bloco ${e.block} · ${e.mode==='exam'?'Prova':'Treino'}</span><span id="clock" class="small num" aria-label="Tempo restante"></span></div><progress value="${e.index}" max="${e.deck.length}" aria-label="${e.index} questões concluídas de ${e.deck.length}"></progress><div class="topline"><p class="eyebrow" style="margin:0">${DOMAINS[q.d]}</p><span class="small num">${e.index+1} / ${e.deck.length}</span></div><p class="small muted" style="margin-top:10px">${LEVELS[q.l-1]}${e.deadline?' · Encerrar até '+esc(e.deadline):''}</p><h2 class="sr">Questão ${e.index+1}</h2><div class="question-text">${bilingual(q.q,e.lang)}<div class="choices">${q.options.map((o,j)=>`<button class="choice" data-answer="${j}" aria-pressed="${e.selected===j}"><span class="letter">${letters[j]}</span><span lang="${e.lang==='PT'?'pt-BR':'en'}">${esc(o.v[e.lang==='PT'?1:0])}<small lang="${e.lang==='PT'?'en':'pt-BR'}">${esc(o.v[e.lang==='PT'?0:1])}</small></span></button>`).join('')}</div></div><div id="feedback"></div><div class="actions">${button('submit',e.mode==='study'?'Ver resposta':'Confirmar resposta','primary')}</div><p class="small muted" style="margin-top:18px">${e.mode==='study'?'Escolha antes de revelar. A primeira resposta fica registrada.':'Depois de confirmar, não é possível voltar. Correção completa ao encerrar.'}</p></section>`,true);wirePT();$('#submit').disabled=e.selected===null;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(e.revealed)return;e.selected=Number(b.dataset.answer);document.querySelectorAll('[data-answer]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#submit').disabled=false;});bind('submit',submitAnswer);tick();}
function imageBlock(q){
 const m=q.img;
 if(!m)return '<p class="small muted">SEM IMAGEM — este item não tem referência visual cadastrada e validada.</p>';
 return `<section class="memory" aria-label="Roteiro de imagem da questão ${q.id}">
 <h3>Roteiro visual</h3><p class="small muted">Descrição para selecionar uma imagem; nenhuma imagem está incorporada.</p>
 <p><b>Deve mostrar</b>${esc(m.show)}</p>
 <p><b>Não pode aparecer</b>${esc(m.avoid)}</p>
 <p><b>BUSCA</b><span lang="en">${esc(m.search)}</span></p>
 <p><b>Legenda EN/PT</b><span lang="en">${esc(m.capEN)}</span><br><span lang="pt-BR">${esc(m.capPT)}</span></p>
 <p><b>Conferir</b>${esc(m.check)}</p>
 </section>`;
}
function explanation(q,selected,lang){const correct=q.options[q.correct].v;return `<div class="answer"><h3>${selected===q.correct?'Resposta correta':'Vamos revisar'} · ${letters[q.correct]}</h3>${bilingual(q.why,lang,'small')}<div class="memory"><b>Vocabulário / Vocabulary</b><span lang="en">${esc(correct[0])}</span> = <span lang="pt-BR">${esc(correct[1])}</span></div><h3>Por que as outras não respondem</h3><ul class="small">${q.options.map((o,j)=>j===q.correct?'':`<li><b>${letters[j]}.</b> <span lang="en">${esc(o.v[2])}</span><br><span lang="pt-BR">${esc(o.v[3])}</span></li>`).join('')}</ul>
<p class="small"><b>Gancho / Memory cue:</b><br><span lang="en">${esc(q.hook[0])}</span><br><span lang="pt-BR">${esc(q.hook[1])}</span></p>

<p class="small"><b>Na prática / In practice:</b><br><span lang="en">${esc(q.practice[0])}</span><br><span lang="pt-BR">${esc(q.practice[1])}</span></p>

${imageBlock(q)}
<p class="small"><a href="${SOURCES[q.s][1]}" target="_blank" rel="noopener noreferrer">Fonte de consulta: ${SOURCES[q.s][0]}</a></p></div>`;}
function submitAnswer(){const e=state.exam;if(e.selected===null||e.revealed)return;if(remaining()!==null&&remaining()<=0){expire();return;}const q=e.deck[e.index];e.records.push({id:q.id,selected:e.selected,correct:e.selected===q.correct,ms:Date.now()-e.itemStarted,cause:null});if(e.mode==='exam'){advance();return;}e.revealed=true;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(Number(b.dataset.answer)===q.correct)b.classList.add('correct');else if(Number(b.dataset.answer)===e.selected)b.classList.add('wrong');});$('#feedback').innerHTML=explanation(q,e.selected,e.lang)+(e.selected===q.correct?'':causeSelect(e.records.length-1));$('#submit').textContent='Continuar';bind('submit',advance);wireCauses();$('#feedback').scrollIntoView({block:'start',behavior:'instant'});}
function causeSelect(i){return `<label for="cause-${i}">O que contribuiu para este erro? (opcional)</label><select id="cause-${i}" data-cause="${i}"><option value="">Não informado</option><option>Conteúdo</option><option>Leitura/idioma</option><option>Ansiedade</option><option>Chute</option></select>`;}
function wireCauses(){document.querySelectorAll('[data-cause]').forEach(x=>{x.value=state.exam.records[Number(x.dataset.cause)].cause||'';x.onchange=()=>{state.exam.records[Number(x.dataset.cause)].cause=x.value||null;};});}
function advance(){const e=state.exam;e.index=e.records.length;e.revealed=false;e.selected=null;if(e.index>=e.deck.length){finish(false);return;}if(e.index%e.blockSize===0){blockResult();return;}e.itemStarted=Date.now();renderQuestion();}
function blockResult(){state.screen='break';const e=state.exam,records=e.records.slice(-e.blockSize),right=records.filter(r=>r.correct).length;mount(`<section class="question-shell glass"><div class="break-symbol" aria-hidden="true">Ⅱ</div><p class="eyebrow">Bloco ${e.block} concluído</p><h1 style="font-size:43px">Respire.<br>Reconstrua.<br>Continue.</h1><p class="score">${right}<span class="muted" style="font-size:25px"> / ${e.blockSize}</span></p><p>${e.blockSize-right} erros · ${formatTime(Date.now()-e.blockStarted)} neste bloco</p><p class="muted">${e.mode==='exam'?'O relógio da prova continua correndo durante esta tela.':'Faça uma pequena pausa como recompensa. Antes de continuar, retome uma regra que errou.'}</p><p id="clock" class="num"></p><p class="small">${state.profile.config.timer==='não'&&e.block===2&&e.mode==='study'?'O próximo bloco introduz o timer.':''}</p><div class="actions">${button('continue','Seguir','primary')}${button('end','Encerrar e corrigir')}</div></section>`,true);if(e.mode==='study')e.blockDue=null;bind('continue',()=>{if(remaining()!==null&&remaining()<=0){expire();return;}e.block++;e.blockStarted=Date.now();e.itemStarted=Date.now();setBlockTimer();renderQuestion();});bind('end',()=>finish(false));tick();}
function tick(){const e=state.exam;if(!e||e.ended)return;const left=remaining(),clock=$('#clock');if(clock)clock.textContent=left===null?'Sem limite de tempo':formatTime(left)+' restantes';if(left!==null&&left<=0)expire();}
function expire(){const e=state.exam;if(!e||e.ended)return;e.expired=true;finish(true);}
function finish(expired){const e=state.exam;if(!e.ended)e.ended=Date.now();e.expired=expired||e.expired;state.screen='finished';const n=e.records.length,right=e.records.filter(x=>x.correct).length,stats=Object.keys(DOMAINS).map(d=>{const r=e.records.filter((x,i)=>e.deck[i].d===d);return {d,n:r.length,ok:r.filter(x=>x.correct).length};}),wrong=e.records.map((r,i)=>({r,i})).filter(x=>!x.r.correct),first=e.records.slice(0,20),middle=e.records.slice(20,60),rate=r=>r.length?Math.round(r.filter(x=>x.correct).length/r.length*100):0;mount(`<p class="eyebrow">Seu resultado de treino</p><h1 style="font-size:43px">O erro vira direção.</h1><div class="grid"><section class="glass"><p class="score">${n?Math.round(right/n*100):0}<span style="font-size:26px">%</span></p><p>${right} acertos / ${n} respondidas · ${e.deck.length-n} sem responder</p><p class="small muted">Tempo total: ${formatTime(e.ended-e.started)} · ${e.mode==='study'?'Treino':'Prova'}</p>${e.expired?'<p class="note">Tempo encerrado. As respostas confirmadas foram preservadas nesta tela.</p>':''}<p class="small">${n===e.deck.length?'Percurso completo.':'Sessão parcial: não compare este percentual com um percurso completo.'}</p><p class="note">Este percentual não corresponde ao resultado oficial PASS/FAIL. Não é possível inferir aprovação nem um corte de 70% ou 80% neste banco.</p><p class="small">Primeiras 20: ${first.length===20?rate(first)+'% · meta 80%':'parcial, '+first.length+'/20'}<br>Questões 21–60: ${middle.length===40?rate(middle)+'% · meta 60%':'parcial, '+middle.length+'/40'}</p></section><section class="glass"><h2>Por domínio</h2><table><thead><tr><th>Domínio</th><th>Acertos</th><th>%</th></tr></thead><tbody>${stats.map(x=>`<tr><td>${DOMAINS[x.d]}</td><td>${x.ok}/${x.n}</td><td>${x.n?Math.round(x.ok/x.n*100):'—'}</td></tr>`).join('')}</tbody></table></section></div><section class="glass" style="margin-top:18px"><h2>Seu próximo passo</h2><p class="small">Prioridades pelo erro observado; amostras pequenas não medem domínio. Misture essas fichas com conteúdos já acertados.</p><ul>${stats.filter(x=>x.n&&x.ok<x.n).sort((a,b)=>(b.n-b.ok)/b.n-(a.n-a.ok)/a.n).slice(0,3).map(x=>`<li>${DOMAINS[x.d]}: ${Math.min(10,Math.max(3,(x.n-x.ok)*2))} fichas de recuperação ativa.</li>`).join('')||'<li>Sem erros registrados: retome depois, com questões diferentes, para conferir retenção.</li>'}</ul><p class="small">Se a prova for amanhã, priorize os erros recorrentes, uma revisão mista curta e descanso. Revisão em 48 horas é continuidade, não preparação para amanhã.</p><p class="small">Causas são autorrelatadas abaixo. O programa não consegue distinguir ansiedade de desconhecimento apenas pela alternativa marcada.</p></section><h2 style="margin-top:32px">Revisão das respostas</h2><p class="small muted">${wrong.length} erros. Acertos também podem ser abertos para consultar a explicação.</p>${e.records.map((r,i)=>`<details class="glass"><summary>${r.correct?'Acerto':'Revisar'} · ${i+1} · ${DOMAINS[e.deck[i].d]} · marcada ${letters[r.selected]}, correta ${letters[e.deck[i].correct]}</summary>${bilingual(e.deck[i].q,e.lang,'small')}${explanation(e.deck[i],r.selected,e.lang)}${r.correct?'':causeSelect(i)}</details>`).join('')}<p class="note">Incertezas: não há item incluído com gabarito deliberadamente incerto.<br>Questões clínicas simplificam o contexto; decisões reais dependem de avaliação e escopo local.<br>Este banco não passou por validação psicométrica nem revisão independente de uma banca.</p><details><summary>Fontes e correções</summary>${sourceNotes()}</details><div class="actions">${button('review','Perfil e respostas')}${button('again','Novo percurso','primary')}${button('profile','Meu perfil')}</div>`,true);wireCauses();bind('review',reviewReport);bind('again',setup);bind('profile',result);}
function reportBody(){
 const p=state.profile,e=state.exam;
 if(!p)return '<p>Conclua o perfil para gerar o relatório.</p>';
 return `<h1>Perfil e respostas</h1><p class="small">Relatório da sessão · ${esc(p.created.toLocaleString('pt-BR'))}</p>
 <section class="glass"><h2>${esc(p.dominant)}</h2><p>Secundário: ${esc(p.secondary)}</p><p>Preferências relatadas, não diagnóstico de personalidade ou medida de capacidade. Compare com o desempenho observado.</p>${PROFILES[p.dominant].lines.map(x=>`<p>${esc(x)}</p>`).join('')}<h3>Plano sugerido</h3><ul>${PROFILES[p.dominant].rx.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(exportProfile(p,state.answers))}</pre></section>
 <h2>As 20 escolhas do perfil</h2>${ITEMS.map((item,i)=>`<details class="glass"><summary>${i+1}. ${esc(PROFILE_EN[i][0])}<br><span lang="pt-BR">${esc(item[1])}</span></summary>${item[2].map((x,j)=>`<p${state.answers[i]===j?' class="note"':''}><b>${letters[j]}${state.answers[i]===j?' · Selected / Escolhida':''}</b><br><span lang="en">${esc(PROFILE_EN[i][1][j])}</span><br><span lang="pt-BR">${esc(x)}</span></p>`).join('')}</details>`).join('')}
 <h2>Escolhas no simulado</h2>${e?`<p>Modo: ${e.mode==='study'?'Treino':'Prova'} · Dificuldade inicial: ${esc(e.difficulty==='progressive'?'Progressiva':LEVELS[Number(e.difficulty)-1])}<br>Idioma: inglês primeiro · Bloco: ${e.blockSize}<br>${e.records.filter(r=>r.correct).length} acertos de ${e.records.length} respondidas.</p>${e.records.map((r,i)=>{const q=e.deck[i];return `<details class="glass"><summary>${i+1}. ${esc(DOMAINS[q.d])} · ${r.correct?'Acerto':'Revisar'} · marcada ${letters[r.selected]}, correta ${letters[q.correct]}</summary>${bilingual(q.q,'EN')}${q.options.map((o,j)=>`<p><b>${letters[j]}${j===r.selected?' · Selected / Escolhida':''}${j===q.correct?' · Correct / Correta':''}</b>${bilingual(o.v,'EN','small')}</p>`).join('')}<p class="small">Tempo até confirmar: ${Math.round(r.ms/1000)} s · Causa relatada: ${esc(r.cause||'Não informada')}</p>${explanation(q,r.selected,'EN')}</details>`;}).join('')}`:'<p>Nenhuma questão respondida nesta sessão.</p>'}`;
}
function reviewReport(){
 state.screen='review';
 mount(`${reportBody()}<div class="actions">${button('save-report','Salvar relatório para revisar depois','primary')}${button('return','Voltar')}</div><p class="small muted">O arquivo inclui suas respostas. Envie somente a quem você escolher. Não há envio automático.</p>`,true);
 bind('save-report',saveReport);bind('return',()=>state.exam&&state.exam.ended?finish(state.exam.expired):result());
}
function reportHTML(){
 const css=document.querySelector('style').textContent;
 return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBLEx · Relatório da sessão</title><style>'+css+'</style></head><body class="light"><main>'+reportBody()+'</main></body></html>';
}
function saveReport(){
 const url=URL.createObjectURL(new Blob([reportHTML()],{type:'text/html;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='mblex-relatorio-'+new Date().toISOString().slice(0,10)+'.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
window.addEventListener('beforeunload',event=>{if(state.answers.some(x=>x!==null)||state.exam){event.preventDefault();event.returnValue='';}});
setInterval(tick,1000);
intro();
</script>
</body>
</html>
