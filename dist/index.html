rofissional deve escolher PRIMEIRO?","o":"Gentle effleurage with agreed pressure|Effleurage suave com pressão combinada~Forceful tapotement despite her request|Tapotement forte apesar do pedido|This ignores her stated preference.|Isso ignora a preferência declarada.~Deep friction over a sore spot immediately|Fricção profunda imediata sobre área dolorida|This is not a gentle introductory choice.|Essa não é uma escolha inicial suave.~Fast percussion until the tissue feels numb|Percussão rápida até a região ficar dormente|Numbness is not a safe target.|Dormência não é meta segura.","why":"Long, smooth gliding strokes can begin a gentle session when the client agrees to the pressure. Preference and tolerance guide technique selection.|Deslizamentos longos e suaves podem iniciar a sessão quando a cliente concorda com a pressão. Preferência e tolerância orientam a técnica.","hook":"Start smooth, ask often.|Comece suave, pergunte sempre.","practice":"Use a brief stroke, then ask whether its pace feels comfortable.|Faça uma manobra breve e pergunte se o ritmo está confortável."},{"d":"PAT","l":4,"s":"drugs","q":"Celia, 67, has taken a blood thinner for six months and has a new large bruise after a minor fall yesterday. Which action should the practitioner choose before deep thigh work?|Celia, 67 anos, usa anticoagulante há seis meses e tem hematoma grande novo após pequena queda ontem. Qual ação o profissional deve escolher antes de trabalho profundo na coxa?","o":"Defer pressure over the bruise and advise medical assessment of the new bleeding|Adiar pressão sobre o hematoma e orientar avaliação médica do sangramento novo~Deeply massage the bruise to disperse it|Massagear profundamente o hematoma para dispersá-lo|Force may worsen bleeding.|Força pode agravar o sangramento.~Apply heat until the bruise fades|Aplicar calor até o hematoma sumir|Heat does not establish safety of an unexplained large bruise.|Calor não comprova segurança de hematoma grande novo.~Continue unchanged because the medicine is prescribed|Continuar sem mudança porque o remédio é prescrito|A prescription does not remove bleeding risk.|Prescrição não elimina risco de sangramento.","why":"Anticoagulants raise bleeding risk. A new large bruise after a fall needs caution and medical assessment; deep local pressure is inappropriate.|Anticoagulantes aumentam o risco de sangramento. Hematoma grande novo após queda exige cautela e avaliação médica; pressão profunda local é inadequada.","hook":"Bruise plus thinner: soften.|Hematoma e anticoagulante: alivie.","practice":"Ask when the bruise appeared and record its location without pressing it.|Pergunte quando o hematoma apareceu e registre a localização sem pressioná-lo."},{"d":"PRO","l":3,"s":"cdc","q":"Diego, 31, has noticed visible oil on the table for two days. The disinfectant label requires a five-minute wet contact time. Which sequence should he follow FIRST before the next client?|Diego, 31 anos, nota óleo visível na mesa há dois dias. O rótulo do desinfetante pede cinco minutos de contato úmido. Qual sequência deve seguir PRIMEIRO antes do próximo cliente?","o":"Clean off the oil, then disinfect for the full labeled wet time|Limpar o óleo e depois desinfetar pelo tempo úmido indicado~Spray over the oil and wipe immediately|Borrifar sobre o óleo e secar imediatamente|Soil can interfere, and wet time is not met.|Sujeira pode interferir, e o tempo úmido não é cumprido.~Leave the oil because it is not visibly infectious|Deixar o óleo porque não parece infeccioso|Visible soil still requires cleaning.|Sujeira visível ainda exige limpeza.~Use only a dry cloth because the table looks clean afterward|Usar só pano seco porque a mesa parece limpa depois|Appearance alone does not satisfy the protocol.|A aparência sozinha não cumpre o protocolo.","why":"Cleaning removes visible soil before disinfection. The surface then needs the disinfectant's labeled wet contact time.|A limpeza remove sujeira visível antes da desinfecção. Depois, a superfície precisa permanecer úmida pelo tempo indicado no produto.","hook":"Clean, then keep wet.|Limpe, depois mantenha úmido.","practice":"Read the label before scheduling the room's next use.|Leia o rótulo antes de liberar a sala para o próximo atendimento."},{"d":"CIN","l":4,"s":"joints","q":"Eva, 60, has had thumb-base pain for three months and has clearance for gentle movement. She needs to bring the thumb toward the little finger to hold a key. Which joint feature should guide a low-force plan?|Eva, 60 anos, sente dor na base do polegar há três meses e tem liberação para movimento suave. Precisa levar o polegar ao dedo mínimo para segurar uma chave. Qual característica articular deve orientar um plano de pouca força?","o":"The first carpometacarpal is a saddle joint that supports opposition|A primeira carpometacarpal é em sela e permite oposição~The joint is a hinge permitting only flexion|A articulação é dobradiça e só permite flexão|The thumb base has saddle geometry.|A base do polegar tem formato em sela.~The joint is fused and must be forced open|A articulação é fundida e deve ser forçada|This mobile joint should not be forced.|Essa articulação móvel não deve ser forçada.~The joint is a pivot for unrestricted spinning|A articulação é trocoide de giro irrestrito|Opposition is not unrestricted axial rotation.|Oposição não é rotação axial irrestrita.","why":"The first carpometacarpal joint is a saddle joint important for opposition. Use comfortable motion within the client's clearance and symptoms.|A primeira carpometacarpal é articulação em sela importante para oposição. Use movimento confortável, respeitando liberação e sintomas.","hook":"Thumb meets finger gently.|Polegar encontra dedo sem força.","practice":"Ask her to demonstrate a comfortable key grip before choosing range.|Peça que demonstre segurar a chave sem dor antes de definir amplitude."},{"d":"ETI","l":4,"s":"rights","q":"Fiona, 42, has had abdominal tightness for five weeks. She consents to gentle work but asks to keep her legs covered. All actions respect her consent EXCEPT which one?|Fiona, 42 anos, sente tensão abdominal há cinco semanas. Aceita trabalho suave, mas pede para manter as pernas cobertas. Todas as ações respeitam o consentimento, EXCETO qual?","o":"Uncover the legs without asking because she consented to abdominal work|Descobrir as pernas sem perguntar porque ela aceitou trabalho abdominal~Explain which area will be exposed first|Explicar primeiro qual área será descoberta|This supports informed choice.|Isso favorece escolha informada.~Keep the legs covered as requested|Manter as pernas cobertas conforme pedido|This respects her boundary.|Isso respeita o limite dela.~Offer another plan if coverage prevents the technique|Oferecer outro plano se a cobertura impedir a técnica|An alternative can respect her choice.|Uma alternativa pode respeitar sua escolha.","why":"Consent to one region is not blanket permission for other exposure. Explain, ask and keep requested areas covered.|Consentir com uma região não autoriza descobrir outras. Explique, pergunte e mantenha as áreas solicitadas cobertas.","hook":"One area, one agreement.|Uma área, um acordo.","practice":"Before adjusting the sheet, repeat the coverage request in your own words.|Antes de ajustar o lençol, repita o pedido de cobertura com suas palavras."},{"d":"AVA","l":4,"s":"motion","q":"Gabe, 36, has had shoulder stiffness for six weeks. He can lift the arm alone, but passive lifting is greater and comfortable. Which interpretation should guide the next assessment FIRST?|Gabe, 36 anos, sente rigidez no ombro há seis semanas. Consegue elevar o braço sozinho, mas a elevação passiva é maior e confortável. Qual interpretação deve orientar PRIMEIRO a próxima avaliação?","o":"Compare active control with passive range without diagnosing a lesion|Comparar controle ativo com amplitude passiva sem diagnosticar lesão~Assume a tear from the difference alone|Presumir ruptura apenas pela diferença|The finding alone does not establish a diagnosis.|O achado isolado não estabelece diagnóstico.~Force active motion to match passive range|Forçar a amplitude ativa até igualar a passiva|Forcing can provoke symptoms.|Forçar pode provocar sintomas.~Ignore the difference because passive range is normal|Ignorar a diferença porque a amplitude passiva é normal|The active-passive contrast informs the plan.|O contraste ativa-passiva informa o plano.","why":"A difference between active and passive movement is useful assessment information but does not identify a diagnosis by itself. Reassess function and symptoms before choosing care.|Diferença entre movimento ativo e passivo informa a avaliação, mas não define diagnóstico isoladamente. Reavalie função e sintomas antes de escolher a conduta.","hook":"Compare, do not conclude.|Compare, não conclua.","practice":"Document both comfortable ranges and the client's effort.|Registre as duas amplitudes confortáveis e o esforço do cliente."},{"d":"PAT","l":4,"s":"massage","q":"Hana, 64, has had stable back tension for three months but developed fever and a new painful red leg area yesterday. Which plan is safest FIRST?|Hana, 64 anos, sente tensão nas costas há três meses, mas desenvolveu febre e uma área vermelha dolorosa na perna ontem. Qual plano é mais seguro PRIMEIRO?","o":"Defer massage and direct her to timely medical assessment|Adiar a massagem e orientá-la a buscar avaliação médica oportuna~Treat only the back and ignore the new symptoms|Tratar só as costas e ignorar sintomas novos|Systemic symptoms change the whole visit.|Sintomas gerais mudam a sessão inteira.~Apply deep friction to the red area|Aplicar fricção profunda na área vermelha|This may worsen an undiagnosed acute problem.|Isso pode piorar problema agudo não avaliado.~Use heat to test whether the redness fades|Usar calor para testar se a vermelhidão some|Heat is not a diagnostic test.|Calor não é teste diagnóstico.","why":"Fever with a new painful red area requires medical assessment before elective massage. The practitioner should not label the condition or treat through it.|Febre com nova área vermelha dolorosa pede avaliação médica antes de massagem eletiva. O profissional não deve rotular a condição nem tratá-la.","hook":"New fever changes the visit.|Febre nova muda a sessão.","practice":"Explain the reason for postponing without guessing the diagnosis.|Explique o adiamento sem tentar adivinhar o diagnóstico."},{"d":"ANA","l":4,"s":"anatomy","q":"Ivo, 49, has had hand tingling for four weeks. A clinician is evaluating possible carpal tunnel symptoms. Which nerve should the practitioner avoid compressing at the wrist while keeping the medical evaluation separate?|Ivo, 49 anos, sente formigamento na mão há quatro semanas. Um profissional de saúde avalia possível túnel do carpo. Qual nervo o massoterapeuta deve evitar comprimir no punho, sem substituir a avaliação médica?","o":"Median nerve|Nervo mediano~Ulnar nerve|Nervo ulnar|The ulnar nerve does not traverse the carpal tunnel.|O nervo ulnar não atravessa o túnel do carpo.~Radial nerve|Nervo radial|This is not the nerve within the carpal tunnel.|Esse não é o nervo dentro do túnel do carpo.~Sciatic nerve|Nervo ciático|This nerve is in the lower limb.|Esse nervo fica no membro inferior.","why":"The median nerve passes through the carpal tunnel. Avoid provoking symptoms and leave diagnosis and treatment of suspected neuropathy to the appropriate clinician.|O nervo mediano atravessa o túnel do carpo. Evite provocar sintomas e deixe diagnóstico e tratamento de possível neuropatia ao profissional de saúde competente.","hook":"Wrist tunnel, careful touch.|Túnel do punho, toque cuidadoso.","practice":"Ask which wrist positions worsen the symptom before positioning the hand.|Pergunte quais posições do punho pioram o sintoma antes de posicionar a mão."},{"d":"PRO","l":4,"s":"ethics","q":"Jana, 55, has had worsening neck pain for two weeks after her last session and asks to erase that note from the chart before seeking another practitioner. Which response should be chosen FIRST?|Jana, 55 anos, sente dor cervical piorando há duas semanas após a última sessão e pede para apagar essa anotação do prontuário antes de procurar outro profissional. Qual resposta deve ser escolhida PRIMEIRO?","o":"Keep an accurate record and explain how to add a dated correction or comment|Manter registro correto e explicar como acrescentar correção ou comentário datado~Delete the note and deny the visit occurred|Apagar a anotação e negar a visita|Removing relevant history makes the record inaccurate.|Apagar histórico relevante torna o registro incorreto.~Change the note to say she improved|Mudar a anotação para dizer que ela melhorou|This falsifies the record.|Isso falsifica o registro.~Share the full chart with the new practitioner without permission|Compartilhar todo o prontuário sem permissão|Disclosure requires proper authorization.|Compartilhar exige autorização adequada.","why":"Clinical records should remain accurate and traceable. Discuss the concern, document a dated correction or addendum when warranted, and respect privacy rules.|Prontuários devem permanecer corretos e rastreáveis. Converse sobre a preocupação, registre correção datada ou adendo quando cabível e respeite privacidade.","hook":"Correct the record, keep the trail.|Corrija o registro, mantenha o rastro.","practice":"Write the date of any addendum and preserve the original entry.|Anote a data de qualquer adendo e preserve a entrada original."}];
for(const x of EXTRA_QUESTIONS)scenario(x.d,x.l,x.s,x.q,x.o,x.why);
scenario("PAT",4,"massage","Luca, 29, has a known seizure disorder, stable for a year. Mid-session he becomes unresponsive and his limbs jerk. What do you do FIRST?|Luca, 29, tem epilepsia conhecida, estável há um ano. No meio da sessão ele fica sem resposta e os membros se sacodem. O que fazer PRIMEIRO?","Protect the head, do not restrain the limbs, and time it|Proteger a cabeça, não conter os membros e cronometrar|Restraint can stress the episode; timing decides when to escalate.|Conter pode sobrecarregar a crise; o tempo decide quando escalar.~Hold the arms still so he stops moving|Segurar os braços para ele parar de se mover|Immobilizing limbs fights the contraction.|Imobilizar os membros briga com a contração.~Put a spoon between the teeth|Colocar uma colher entre os dentes|Common practice, but not the first need.|Prática comum, mas não é a primeira necessidade.~Sit him up and give water|Sentá-lo e dar água|Swallowing is unreliable during the episode.|A deglutição não é confiável durante a crise.","Protect the head, clear objects, do not restrain, and time the episode. Call emergency care if it passes five minutes or recovery is incomplete.|Proteja a cabeça, afaste objetos, não contenha e cronometre. Acione emergência se passar de cinco minutos ou a recuperação não vier.","Protect, don't hold, time it.|Proteja, não segure, cronometre.","Clear nearby objects and note the start time.","Afaste objetos próximos e anote o horário de início.");
scenario("PAT",3,"massage","Rute, 61, has visible varicose veins on both calves and asks for firm work. What fits?|Rute, 61, tem varizes visíveis nas duas panturrilhas e pede trabalho firme. O que cabe?","Work around them and avoid deep direct pressure over the vein|Contornar e evitar pressão profunda direta sobre a veia|Wall is distended and valves are incompetent.|A parede está distendida e as válvulas são incompetentes.~Press hard along the vein to push blood up|Pressionar forte ao longo da veia para empurrar o sangue|Painful, and it does not fix valves.|Dói e não corrige válvulas.~Avoid the legs entirely|Evitar as pernas por completo|Overcorrection.|Excesso de zelo.~Use cold only, without pressure|Usar só frio, sem pressão|Cold is adjuvant, not a substitute.|Frio é adjuvante, não substituto.","A distended superficial vein with incompetent valves tolerates glide better than deep direct load.|Veia superficial distendida com válvulas incompetentes tolera melhor o deslizamento que a carga direta profunda.","Bulging vein: go around, not through.|Veia saltada: contorne, não atravesse.","Trace the vein with light glide before adding pressure.","Trace a veia com deslizamento leve antes de somar pressão.");
scenario("PAT",4,"hypo","Ana, 47, is diabetic and 40 minutes into a session when she becomes shaky, sweaty and confused. What do you do FIRST?|Ana, 47, é diabética e está há 40 minutos de sessão quando fica trêmula, suada e confusa. O que fazer PRIMEIRO?","Stop the session, support her, and check whether she is alert and able to swallow|Parar a sessão, apoiá-la e verificar se está alerta e consegue engolir|Oral sugar is safe only if she is awake and can swallow; seek emergency help if she cannot.|Açúcar por via oral só é seguro se ela estiver acordada e conseguir engolir; peça ajuda de emergência se não conseguir.~Give her insulin|Dar insulina|Insulin can lower glucose further.|Insulina pode baixar mais a glicose.~Continue and check at the end|Continuar e checar no fim|Symptoms may worsen.|Os sintomas podem piorar.~Lay her flat and raise the legs|Deitá-la e elevar as pernas|This does not address possible low glucose.|Isso não trata possível glicose baixa.","Stop and assess first. If she is awake and can swallow safely, give a fast-acting sugar source and recheck. If she cannot swallow safely, call emergency services and do not give anything by mouth.|Pare e avalie primeiro. Se estiver acordada e conseguir engolir com segurança, dê açúcar de absorção rápida e reavalie. Se não conseguir engolir com segurança, chame a emergência e não dê nada por via oral.","Check swallowing before sugar.|Confira a deglutição antes do açúcar.","Keep the emergency plan and a fast sugar source ready.","Mantenha plano de emergência e açúcar de absorção rápida à mão.");
scenario("PAT",4,"massage","Sofia, 58, has stable arm lymphedema after breast surgery. Which approach fits the arm?|Sofia, 58, tem linfedema estável no braço após cirurgia de mama. Qual abordagem cabe ao braço?","Light, proximal-first work with compression as advised|Trabalho leve, proximal primeiro, com compressão conforme orientação|Clears the gate and respects superficial vessels.|Esvazia o portão e respeita vasos superficiais.~Deep strokes toward the hand|Manobras profundas em direção à mão|Direction wrong, pressure high.|Direção errada, pressão alta.~Avoid the arm entirely|Evitar o braço por completo|Overcorrection when stable and cleared.|Excesso de zelo quando estável e liberado.~Work only the hand to push fluid up|Trabalhar só a mão para empurrar líquido|The gate is proximal, not distal.|O portão é proximal, não distal.","Proximal first and light, following the compression she already uses.|Proximal primeiro e leve, seguindo a compressão que ela já usa.","Gate first, light, respect the garment.|Portão primeiro, leve, respeite a malha.","Ask which compression she uses and when.","Pergunte qual compressão ela usa e quando.");
scenario("ETI",3,"rights","Tomás, 14, comes alone to his first session. What is required before treatment?|Tomás, 14, vem sozinho à primeira sessão. O que é exigido antes do atendimento?","Guardian consent for a minor, plus the minor's own assent|Consentimento do responsável, mais o assentimento do menor|Minors cannot consent alone in most jurisdictions.|Menor não consente sozinho na maioria das jurisdições.~Only the minor's signature|Apenas a assinatura do menor|Insufficient.|Insuficiente.~Nothing, since he booked himself|Nada, já que ele mesmo marcou|Booking is not consent.|Agendar não é consentir.~A physician referral|Encaminhamento médico|Often useful, not always required.|Útil às vezes, nem sempre exigido.","Guardian consent plus the minor's agreement to be touched.|Consentimento do responsável mais a concordância do menor em ser tocado.","Minor: guardian signs, minor agrees.|Menor: responsável assina, menor concorda.","Get the guardian signature and phone before he undresses.","Pegue assinatura e telefone do responsável antes de ele se despir.");
scenario("ETI",3,"ethics","Pia, 32, loved her session and offers to post a photo of herself on the table. What do you need before publishing?|Pia, 32, adorou a sessão e oferece postar foto dela na maca. O que você precisa antes de publicar?","Written permission stating what may be shown and where|Autorização escrita dizendo o que pode aparecer e onde|Covers image and use scope.|Cobre imagem e escopo de uso.~Her verbal yes in the room|Sim verbal na sala|Hard to prove and vague.|Difícil de provar e vago.~Nothing, since she offered|Nada, já que ela ofereceu|Offering is not permission to publish.|Oferecer não é permissão para publicar.~Removing her name is enough|Tirar o nome já basta|A recognizable photo identifies her.|Foto reconhecível identifica.","Image use needs written scope: what is shown, where, and for how long.|Uso de imagem exige escopo escrito: o que aparece, onde e por quanto tempo.","Photo needs paper.|Foto precisa de papel.","Keep a one-paragraph image release ready.","Tenha uma autorização de imagem de um parágrafo pronta.");
scenario("PRO",2,"cdc","Vera, 39, has a pile of used sheets and one towel with drainage on it. How do you handle the laundry?|Vera, 39, tem uma pilha de lençóis usados e uma toalha com secreção. Como manusear a roupa?","Bag the soiled towel separately and do not shake the linen|Embalar a toalha suja separada e não sacudir a roupa|Shaking aerosolizes; separation limits spread.|Sacudir aerosoliza; separar limita a dispersão.~Shake each piece before bagging|Sacudir cada peça antes de embalar|Shaking spreads particles.|Sacudir espalha partículas.~Mix everything and wash hot|Misturar tudo e lavar quente|Heat helps, but mixing spreads the soiled item.|Calor ajuda, mas misturar espalha.~Store the soiled towel with clean linen|Guardar a toalha suja junto da limpa|Contamination transfers.|Contaminação transfere.","Bag the contaminated piece separately, do not shake, then wash per protocol.|Embalar a peça contaminada separada, não sacudir, depois lavar conforme protocolo.","Bag the wet one, don't shake.|Embalar a molhada, não sacudir.","Keep a lidded bin and a separate bag.","Mantenha lixeira com tampa e saco separado.");
scenario("AVA",2,"motion","Kai, 63, walks into the room and you watch before he sits. What are you assessing?|Kai, 63, entra andando na sala e você observa antes de ele sentar. O que está avaliando?","Gait: stride, symmetry, arm swing and base of support|Marcha: passada, simetria, balanço dos braços e base de apoio|Gait is dynamic observation.|Marcha é observação dinâmica.~Static posture on the plumb line|Postura estática no fio de prumo|Static requires standing still.|Estática exige ficar parado.~Passive range of the hips|Amplitude passiva dos quadris|Requires your hands.|Exige suas mãos.~Resisted strength of the legs|Força resistida das pernas|Requires opposition.|Exige oposição.","Walking is gait; standing still is posture. Different observation, different record.|Andar é marcha; ficar parado é postura. Observação e registro diferentes.","Walking is gait; standing is posture.|Andando é marcha; parado é postura.","Note base of support and any limp before he sits.","Anote base de apoio e qualquer claudicação antes de ele sentar.");
scenario("ANA",2,"motion","Rui, 30, has a scrape on the front of the shin. When you describe it, which term correctly places the scrape relative to the knee?|Rui, 30, tem um rascado na frente da canela. Ao descrever, qual termo localiza corretamente o rascado em relação ao joelho?","Distal to the knee|Distal ao joelho|Farther from the trunk.|Mais longe do tronco.~Proximal to the knee|Proximal ao joelho|Toward the trunk.|Em direção ao tronco.~Posterior to the knee|Posterior ao joelho|Behind.|Atrás.~Superior to the knee|Superior ao joelho|Above.|Acima.","The shin is below the knee and farther from the trunk, so it is distal.|A canela fica abaixo do joelho e mais longe do tronco, logo é distal.","Below the joint, farther from trunk: distal.|Abaixo da articulação, longe do tronco: distal.","Use distal and proximal, not up and down.","Use distal e proximal, não cima e baixo.");
scenario("EFE",3,"techniques","Nuno, 45, has had a sluggish, heavy-leg feeling for three weeks and asks for stimulation. Where should tapotement be avoided?|Nuno, 45, tem sensação de perna pesada e lenta há três semanas e pede estímulo. Onde evitar percussão?","Over bony prominences and the kidneys|Sobre proeminências ósseas e os rins|Bone and kidney are poorly padded.|Osso e rim têm pouca proteção.~Over muscle bellies|Sobre ventres musculares|That is where it belongs.|É onde ela cabe.~On the calves|Nas panturrilhas|Common and appropriate.|Comum e adequada.~On the thighs|Nas coxas|Well padded.|Bem acolchoadas.","Percussion over bone hurts and over the kidney is uncomfortable; muscle bellies are the target.|Percussão sobre osso dói e sobre o rim incomoda; o alvo são os ventres musculares.","Tap muscle, not bone or kidney.|Percuta músculo, não osso nem rim.","Cup the hand and keep the wrist loose over muscle.","Faça a mão em concha e mantenha o punho solto sobre o músculo.");
const BATCH2=[
()=>scenario("ETI",2,"rights","You finish the back and ask the client to turn over. She says she does not want the sheet moved and asks you to skip the glutes.|Você termina as costas e pede para a cliente virar. Ela diz que não quer o lençol mexido e pede para pular os glúteos.","Leave the glutes covered and finish without them|Deixar os glúteos cobertos e terminar sem eles|The request is compatible with the plan.|O pedido é compatível com o plano.~Tell her the sheet has to move anyway|Dizer que o lençol precisa mexer de qualquer forma|It usually does, but not always.|Costuma precisar, mas não sempre.~Uncover quickly so she barely notices|Descobrir rápido para ela quase não notar|Speed does not address the wish.|Rapidez não atende o desejo.~Ask her to hold the sheet herself|Pedir que ela segure o lençol|It takes her hand, but the point is the coverage.|Ocupa a mão dela, mas o ponto é a cobertura.","Skipping an area costs nothing. Coverage is her call, not a step of your routine.|Pular uma área não custa nada. A cobertura é decisão dela, não etapa da sua rotina.","Her sheet, her call.|O lençol é dela, a decisão é dela.","Ask once, then work within the answer.","Pergunte uma vez e trabalhe dentro da resposta."),
()=>scenario("ETI",2,"ethics","A client loved the session and asks you to use her before-and-after photo on Instagram.|Uma cliente adorou a sessão e pede que você use a foto de antes e depois dela no Instagram.","Ask for written permission naming the photo and the platform|Pedir autorização escrita nomeando a foto e a plataforma|Scope of the use has to be explicit.|O escopo do uso precisa ser explícito.~Post it, she suggested it|Postar, foi ela que sugeriu|Suggesting is not permission to publish.|Sugerir não é permissão para publicar.~Post only the after photo|Postar só a foto de depois|A recognizable body still identifies her.|Um corpo reconhecível ainda a identifica.~Blur the face and post|Desfocar o rosto e postar|Blur helps, but does not cover the use.|Desfocar ajuda, mas não cobre o uso.","Image use needs writing: what shows, where, for how long.|Uso de imagem exige escrito: o que aparece, onde e por quanto tempo.","Photo needs paper.|Foto precisa de papel.","Keep a two-line image release in the folder.","Tenha uma autorização de imagem de duas linhas na pasta."),
()=>scenario("ETI",3,"rights","The client asks for a copy of her treatment notes to take to her doctor.|A cliente pede uma cópia das anotações de atendimento para levar ao médico.","Provide the copy, charging only what the rule allows|Fornecer a cópia, cobrando só o que a regra permite|Records are hers to access.|O prontuário é dela para acesso.~Read the notes to her by phone|Ler as anotações por telefone|Reading is not a copy.|Ler não é cópia.~Send them only after the doctor asks|Enviar só depois que o médico pedir|Her request is enough.|O pedido dela basta.~Refuse until the bill is paid|Recusar até a conta ser paga|Unpaid balance rarely blocks access.|Conta em aberto raramente bloqueia acesso.","Access is a client right; the copy follows the local rule and fee.|Acesso é direito da cliente; a cópia segue a regra local e a taxa.","Records are hers to read.|O prontuário é dela para ler.","Have the copy routine ready before anyone asks.","Tenha a rotina de cópia pronta antes de alguém pedir."),
()=>scenario("ETI",3,"ftc","A client offers to write a five-star review in exchange for a discount on the next visit.|Uma cliente oferece escrever uma avaliação cinco estrelas em troca de desconto na próxima visita.","Decline the five-star condition; invite an honest review without requiring a rating|Recusar a condição de cinco estrelas; convidar a uma avaliação honesta sem exigir nota|The FTC prohibits incentives conditioned on a particular sentiment.|A FTC proíbe incentivos condicionados a uma opinião específica.~Agree if the discount is disclosed|Aceitar se o desconto for divulgado|Disclosure does not permit a five-star condition.|Divulgar não autoriza exigir cinco estrelas.~Offer the discount only after she posts five stars|Oferecer desconto só depois que ela postar cinco estrelas|Paying later keeps the condition.|Pagar depois mantém a condição.~Ask her not to mention the discount|Pedir que não mencione o desconto|Hiding an incentive compounds the problem.|Esconder um incentivo agrava o problema.","A discount may be offered for an honest review regardless of rating, with proper disclosure. It cannot depend on a five-star or otherwise positive review, even if that condition is disclosed.|Um desconto pode ser oferecido por uma avaliação honesta independentemente da nota, com divulgação adequada. Não pode depender de cinco estrelas ou de avaliação positiva, mesmo que essa condição seja divulgada.","Any rating, honestly given; never buy five stars.|Qualquer nota, com honestidade; nunca compre cinco estrelas.","If offering an incentive, put the no-rating-condition and disclosure in writing.","Se oferecer incentivo, registre por escrito a ausência de exigência de nota e a divulgação."),
()=>scenario("ETI",3,"transfer","Ten minutes in, the client asks whether you are married and whether you have children.|Dez minutos de sessão, a cliente pergunta se você é casada e se tem filhos.","Answer briefly and bring the focus back to her|Responder em resumo e voltar o foco para ela|Short answers keep the session on track.|Respostas curtas mantêm a sessão no trilho.~Say you never mix personal life with work|Dizer que nunca mistura vida pessoal com trabalho|Rigid and untrue for most.|Rígido e falso para a maioria.~Tell the whole story, she seems interested|Contar a história toda, ela parece interessada|Long stories eat the hour.|Histórias longas comem a hora.~Redirect at once without answering|Redirecionar na hora, sem responder|A blank wall feels cold.|Parede lisa esfria.","A sentence or two, then back to the body.|Uma ou duas frases, depois volta ao corpo.","Short answer, quick return.|Resposta curta, retorno rápido.","Answer, then name the next area.","Responda e nomeie a próxima área."),
()=>scenario("ETI",3,"rights","The client falls asleep and stops answering your pressure checks.|A cliente adormece e para de responder às suas checagens de pressão.","Keep working and check with a light touch before increasing|Continuar e checar com toque leve antes de aumentar|Silence is not a yes for more pressure.|Silêncio não é sim para mais pressão.~Wake her to confirm the pressure|Acordá-la para confirmar a pressão|Waking defeats the sleep.|Acordar estraga o sono.~Assume deep pressure is fine now|Presumir que pressão profunda está liberada|Sleep lowers guarding, not tolerance.|Sono baixa a guarda, não a tolerância.~Finish quickly and let her rest|Terminar rápido e deixá-la descansar|Rushing is not the same as adapting.|Apressar não é adaptar.","Sleep is rest, not consent. Nudge, then decide.|Sono é descanso, não consentimento. Cutuque, depois decida.","Asleep is not a green light.|Dormir não é sinal verde.","One light stroke, one quiet question.","Uma manobra leve, uma pergunta baixa."),
()=>scenario("ETI",4,"abmp","Your landlord turns out to be a client, and the rent comes up during a session.|Seu locador é seu cliente, e o aluguel aparece na conversa durante a sessão.","Name the two roles out loud and keep the subjects apart|Nomear os dois papéis em voz alta e manter os assuntos separados|Naming it prevents later confusion.|Nomear evita confusão depois.~Say nothing, it is harmless|Não dizer nada, é inofensivo|It stops being harmless when rent is late.|Deixa de ser inofensivo quando o aluguel atrasa.~Charge him less because he is the landlord|Cobrar menos porque ele é o locador|Discount changes the clinical frame.|Desconto muda o enquadre.~Move to a new room to avoid it|Mudar de sala para evitar|Works, but is not required.|Funciona, mas não é exigido.","Two roles, two ledgers, said out loud once.|Dois papéis, duas contas, ditos em voz alta uma vez.","Landlord in, landlord out.|Locador entra, locador sai.","Say it on the first visit and again if rent comes up.","Diga na primeira visita e de novo se o aluguel surgir."),
()=>scenario("ETI",4,"ethics","A client brings a form for you to sign saying massage is medically necessary for her insurance.|Uma cliente traz um formulário para você assinar dizendo que a massagem é medicalmente necessária para o seguro dela.","Sign what you can attest to and leave diagnosis to the physician|Assinar o que você pode atestar e deixar o diagnóstico para o médico|You attest to care, not to disease.|Você atesta o cuidado, não a doença.~Sign everything, it helps her|Assinar tudo, ajuda ela|Overstating is a small lie that spreads.|Exagerar é mentira pequena que se espalha.~Refuse, insurance is not your field|Recusar, seguro não é sua área|Signing factual is normal.|Assinar o factual é normal.~Tell her to ask the doctor to fill it|Pedir que ela leve ao médico|Possible, but unnecessary here.|Possível, mas desnecessário aqui.","You can say what you did and observed; the diagnosis is not yours.|Você pode dizer o que fez e observou; o diagnóstico não é seu.","Attest care, not disease.|Ateste o cuidado, não a doença.","Write only what you saw and did.","Escreva só o que viu e fez."),
()=>scenario("ETI",4,"rights","A client with early dementia comes with her daughter, who answers every question for her.|Uma cliente com demência inicial vem com a filha, que responde todas as perguntas por ela.","Ask the client first, then let the daughter fill gaps|Perguntar à cliente primeiro e deixar a filha completar lacunas|Capacity is assumed until shown otherwise.|Capacidade se presume até prova contrária.~Address the daughter, she knows more|Falar com a filha, ela sabe mais|She may, but the client is still the client.|Talvez saiba, mas a cliente continua sendo a cliente.~Ask them to decide together|Pedir que decidam juntas|Vague; someone has to lead.|Vago; alguém precisa conduzir.~Get the daughter's signature only|Pegar só a assinatura da filha|Signature is not the whole consent.|Assinatura não é o consentimento todo.","Direct questions to the client; the companion completes, not replaces.|Perguntas à cliente; a acompanhante completa, não substitui.","The client is still the client.|A cliente ainda é a cliente.","Eye contact on her, then on the daughter.","Olho nela, depois na filha."),
()=>scenario("ETI",4,"tax","A client hands you three twenty-dollar bills and says the extra is a tip.|Uma cliente entrega três notas de vinte e diz que o excedente é gorjeta.","Count it as income, tips included|Contar como renda, gorjetas incluídas|Tips are taxable.|Gorjeta é tributável.~Tips are a gift, so they are exempt|Gorjeta é presente, então é isenta|Only true for true gifts.|Só vale para presente real.~Record the tip but not the service|Registrar a gorjeta e não o serviço|Both are income.|Os dois são renda.~Let her decide how you record it|Deixar ela decidir como registrar|She has no say in it.|Ela não decide isso.","Tips are income and are recorded like the service.|Gorjeta é renda e se registra como o serviço.","Tip is income too.|Gorjeta também é renda.","Write the total on the receipt.","Escreva o total no recibo."),
()=>scenario("ETI",4,"ethics","Your website still lists a certification you let expire two years ago.|Seu site ainda lista uma certificação que venceu há dois anos.","Remove it or label it as expired|Remover ou marcar como vencida|A stale credential misleads.|Credencial vencida engana.~Leave it, you did have it|Deixar, você teve|Past tense is not obvious to a reader.|O passado não é óbvio para quem lê.~Add the year it expired|Só acrescentar o ano em que venceu|Better, but still needs a label.|Melhor, mas ainda precisa rótulo.~Replace it with a longer course list|Trocar por lista de cursos|Does not fix the expired line.|Não corrige a linha vencida.","Credentials have to be true in the present tense.|Credencial precisa ser verdadeira no presente.","Expired is past, not present.|Vencido é passado, não presente.","Review the site every renewal cycle.","Revise o site a cada ciclo de renovação."),
()=>scenario("PAT",2,"respiratory","Maya, 42, has had a head cold with a runny nose and cough for two days. She has no fever and says she feels up to a massage.|Maya, 42 anos, está resfriada, com coriza e tosse há dois dias. Não tem febre e diz que se sente disposta para uma massagem.","Postpone until symptoms improve overall for at least 24 hours|Adiar até os sintomas melhorarem no conjunto por pelo menos 24 horas|No fever alone does not show that a respiratory illness has resolved.|Não ter febre, por si só, não mostra que a doença respiratória passou.~Work gently and shorten if she tires|Trabalhar leve e encurtar se ela cansar|She still has active respiratory symptoms.|Ela ainda tem sintomas respiratórios ativos.~Work deeply to boost circulation|Trabalhar fundo para melhorar a circulação|Pressure does not remove transmission risk.|Pressão não elimina risco de transmissão.~Use only the face and neck|Usar só rosto e pescoço|Changing the area does not remove transmission risk.|Mudar a região não elimina risco de transmissão.","The CDC recommends staying home while respiratory symptoms persist and returning to normal activities when symptoms have improved overall for at least 24 hours and there has been no fever without fever-reducing medicine.|O CDC recomenda ficar em casa enquanto persistirem sintomas respiratórios e retomar as atividades quando os sintomas tiverem melhorado no conjunto por pelo menos 24 horas e não houver febre sem antitérmico.","No fever alone is not clearance.|Sem febre, por si só, não libera.","Ask when the cough and runny nose began and whether they are improving.","Pergunte quando começaram a tosse e a coriza e se estão melhorando."),
()=>scenario("PAT",2,"thermal","A client spent the morning at the pool and has pink, hot shoulders and upper back.|Uma cliente passou a manhã na piscina e está com ombros e parte superior das costas rosados e quentes.","Avoid the area today and keep the rest light|Evitar a área hoje e manter o resto leve|Sunburned skin tolerates little.|Pele queimada tolera pouco.~Apply cold over the burn to calm it|Aplicar frio sobre a queimadura para acalmar|Cold on burned skin can hurt.|Frio em pele queimada pode doer.~Work through it with lotion|Trabalhar ali com creme|Friction on a burn stings.|Fricção em queimadura arde.~Use heat to draw it out|Usar calor para tirar|Heat adds to a hot area.|Calor soma em área quente.","Sunburn is a local block; the rest of the body is free.|Queimadura solar é bloqueio local; o resto do corpo está livre.","Pink and hot: go around.|Rosado e quente: contorne.","Look at the skin before you touch it.","Olhe a pele antes de tocar."),
()=>scenario("PAT",3,"massage","A client had a cast removed from the forearm a week ago and the arm looks thin.|Uma cliente tirou o gesso do antebraço há uma semana e o braço está fino.","Work lightly and let her report what the arm tolerates|Trabalhar leve e deixar ela relatar o que o braço tolera|Disuse leaves tissue fragile.|O desuso deixa o tecido frágil.~Work firmly to rebuild the muscle|Trabalhar firme para reconstruir o músculo|Firm work does not build muscle.|Trabalho firme não constrói músculo.~Wait another month before touching it|Esperar mais um mês antes de tocar|A week is enough for light work.|Uma semana já permite trabalho leve.~Stretch it to measure the loss|Alongar para medir a perda|Stretching fresh tissue can hurt.|Alongar tecido novo pode doer.","Recent immobilization means fragile, not forbidden.|Imobilização recente significa frágil, não proibido.","Out of the cast is not out of the woods.|Saiu do gesso, não saiu do risco.","Light pressure, frequent check.","Pressão leve, checagem frequente."),
()=>scenario("PAT",3,"pregnancy","A client is nine weeks pregnant, no complications, and asks for a full session.|Uma cliente está com nove semanas de gestação, sem intercorrências, e pede sessão completa.","Treat normally, avoid deep abdominal work and watch position|Atender normalmente, evitar trabalho abdominal profundo e observar a posição|First trimester tolerates ordinary care.|O primeiro trimestre tolera cuidado comum.~Restrict to the legs until the second trimester|Restringir às pernas até o segundo trimestre|Legs only is too narrow.|Só pernas é estreito demais.~Keep her prone the whole hour|Manter em prono a hora toda|Prone gets uncomfortable fast.|Prono incomoda rápido.~Shorten to thirty minutes as a rule|Encurtar para trinta minutos por regra|No rule requires it.|Nenhuma regra exige.","Early pregnancy is ordinary care with two adjustments: belly and position.|Gestação inicial é cuidado comum com dois ajustes: abdome e posição.","Nine weeks is ordinary care, two tweaks.|Nove semanas é cuidado comum, dois ajustes.","Ask about nausea and pressure on the belly.","Pergunte sobre náusea e pressão no abdome."),
()=>scenario("PAT",3,"drugs","A client takes a beta blocker and says his heart rate never rises much.|Um cliente usa betabloqueador e diz que a frequência cardíaca dele quase não sobe.","Judge effort by breathing and talk, not by pulse alone|Julgar esforço por respiração e fala, não só pelo pulso|The drug blunts the pulse response.|O remédio embota a resposta do pulso.~Use the pulse as your only guide|Usar o pulso como guia único|It will underread.|Ele vai subestimar.~Avoid cardiovascular effects entirely|Evitar qualquer efeito cardiovascular|Impossible; every session has one.|Impossível; toda sessão tem um.~Ask him to stop the drug before the session|Pedir que ele pare o remédio antes|Prescrição não é sua.|Prescrição não é sua.","A blunted pulse hides effort; breathing and speech do not.|Pulso embotado esconde esforço; respiração e fala não.","Beta blocker lies about the pulse.|Betabloqueador mente sobre o pulso.","Listen to the breathing, ask how the effort feels.","Ouça a respiração, pergunte como o esforço parece."),
()=>scenario("PAT",3,"cdc","A client has scaly, itchy skin between the toes and it has been there for weeks.|Uma cliente tem pele descamando e coçando entre os dedos dos pés há semanas.","Glove for the feet and keep the area out of the plan|Usar luva nos pés e manter a área fora do plano|Fungal and contagious by contact.|Fúngico e contagioso por contato.~Work the feet, it is only skin|Trabalhar os pés, é só pele|Contact spreads it to you and to the linen.|O contato espalha para você e para a roupa.~Apply lotion generously between the toes|Passar creme generoso entre os dedos|Moisture worsens it.|Umidade piora.~Skip the whole session|Pular a sessão toda|The rest is free.|O resto está livre.","Athlete's foot is local and contagious; gloves, area out.|Pé de atleta é local e contagioso; luva, área fora.","Fungus: glove, don't glide there.","Fungo: luva, não deslize ali.","Separate towel for the feet.","Toalha separada para os pés."),
()=>scenario("PAT",4,"bleeding","A client on a blood thinner for years had a nosebleed yesterday that took twenty minutes to stop.|Um cliente em anticoagulante há anos teve sangramento nasal ontem que levou vinte minutos para parar.","Postpone the session and advise prompt medical assessment before massage|Adiar a sessão e orientar avaliação médica rápida antes da massagem|A nosebleed lasting over ten minutes can signal excessive bleeding on an anticoagulant.|Sangramento nasal por mais de dez minutos pode indicar sangramento excessivo em quem usa anticoagulante.~Treat as always, the drug is old news|Atender como sempre, o remédio é antigo|A new prolonged bleed changes the risk.|Um sangramento novo e prolongado muda o risco.~Go lighter without arranging assessment|Usar menos pressão sem orientar avaliação|Lighter pressure does not evaluate the bleeding.|Menos pressão não avalia o sangramento.~Avoid the head and neck only|Evitar só cabeça e pescoço|The concern is systemic bleeding risk.|A preocupação é risco sistêmico de sangramento.","The NHS lists nosebleeds lasting longer than ten minutes as a sign of excessive bleeding with anticoagulants. A twenty-minute episode warrants medical assessment before an elective massage.|O NHS lista sangramento nasal por mais de dez minutos como sinal de sangramento excessivo com anticoagulantes. Um episódio de vinte minutos exige avaliação médica antes de uma massagem eletiva.","Twenty minutes of bleeding changes the plan.|Vinte minutos de sangramento mudam o plano.","Ask whether the episode was medically assessed, and defer care until it is addressed.","Pergunte se houve avaliação médica e adie o atendimento até isso ser resolvido."),
()=>scenario("PAT",4,"steroid","A client had a cortisone shot in the shoulder two days ago and the pain is much better.|Uma cliente tomou injeção de cortisona no ombro há dois dias e a dor melhorou muito.","Work gently over the shoulder and tell her the relief may wear off|Trabalhar leve no ombro e avisar que o alívio pode passar|Better pain does not mean repaired tissue.|Menos dor não significa tecido reparado.~Work firmly, the drug killed the pain|Trabalhar firme, o remédio matou a dor|Firm work on fragile tissue can flare.|Trabalho firme em tecido frágil pode inflamar.~Skip the shoulder for a month|Pular o ombro por um mês|A month is arbitrary.|Um mês é arbitrário.~Stretch it to end range while it is quiet|Alongar até o limite enquanto está calado|Quiet tissue still tears.|Tecido calado ainda rompe.","Cortisone quiets the signal, not the lesion, and thins local tissue.|Cortisona cala o sinal, não a lesão, e afina o tecido local.","Quiet shoulder is not a healed shoulder.","Ombro calado não é ombro curado.","Say the relief may fade, keep pressure moderate.","Diga que o alívio pode passar, mantenha pressão moderada."),
()=>scenario("PAT",4,"massage","A client arrives with 37.8 °C, a productive cough and body aches, and says he is at the tail end of it.|Um cliente chega com 37,8 °C, tosse produtiva e dor no corpo, e diz que está no fim do quadro.","Postpone, the combination is still active|Adiar, a combinação ainda está ativa|Fever plus cough plus aches is an active process.|Febre com tosse e dor no corpo é processo ativo.~Proceed, 37.8 is almost normal|Prosseguir, 37,8 é quase normal|The number alone does not decide.|O número sozinho não decide.~Proceed but avoid the chest|Prosseguir, evitando o tórax|The process is systemic, not thoracic.|O processo é sistêmico, não torácico.~Proceed and use percussion to loosen the cough|Prosseguir e usar percussão para soltar a tosse|Helps afterwards, does not settle it.|Ajuda depois, não decide.","Low fever by itself is arguable. Fever with productive cough and body aches is an active process, and the guidance for respiratory illness is to stay home while febrile and symptomatic. The combination decides, not the number.|Febre baixa isolada é discutível. Febre com tosse produtiva e dor no corpo é processo ativo, e a orientação em doença respiratória é ficar em casa enquanto houver febre e sintomas. A combinação decide, não o número.","Fever alone is arguable; fever with cough and aches is not.|Febre sozinha é discutível; febre com tosse e dor não.","Ask fever, cough and body aches in the same breath.","Pergunte febre, tosse e dor no corpo na mesma frase."),
()=>scenario("PAT",4,"pressure","A client's blood pressure reads 168/98 and she feels fine.|A pressão da cliente marca 168/98 e ela se sente bem.","Proceed with moderate pressure, no deep work, and note the reading|Prosseguir com pressão moderada, sem trabalho profundo, e registrar a medida|High but asymptomatic tolerates care.|Alta mas assintomática tolera atendimento.~Postpone until it drops below 140|Adiar até cair abaixo de 140|Too strict.|Rígido demais.~Work deeply, it will lower the pressure|Trabalhar fundo, vai baixar a pressão|Deep work can also raise it briefly.|Trabalho profundo também pode subir de leve.~Send her to the emergency room|Mandar ao pronto-socorro|For 168/98, excessive.|Para 168/98, excessivo.","Asymptomatic high pressure allows moderate work; symptoms change the answer.|Pressão alta assintomática permite trabalho moderado; sintoma muda a resposta.","High but fine: moderate, and record.","Alta mas bem: moderado, e registre.","Write the reading with the time.","Registre a medida com o horário."),
()=>scenario("PAT",4,"massage","A client had a vaccine in the left deltoid yesterday and the axilla is tender and puffy.|Uma cliente tomou vacina no deltoide esquerdo ontem e a axila está sensível e inchada.","Avoid deep pressure in the axilla and work the arm lightly|Evitar pressão profunda na axila e trabalhar o braço leve|Nodes are reacting; the hollow is delicate.|Os linfonodos estão reagindo; o oco é delicado.~Drain the axilla with firm strokes|Drenar a axila com manobras firmes|Firm work on a reactive node hurts.|Trabalho firme em linfonodo reativo dói.~Skip the whole upper limb|Pular todo o membro superior|Overcorrection.|Excesso de zelo.~Apply heat to the axilla|Aplicar calor na axila|Heat adds to a hot area.|Calor soma em área quente.","Reactive nodes are local caution; the limb is still workable.|Linfonodo reativo é cautela local; o membro continua trabalhável.","Puffy armpit: light and around.","Axila inchada: leve e ao redor.","Fingertips at the hollow, nothing more.","Ponta dos dedos no oco, nada além."),
()=>scenario("CIN",2,"motion","A client lifts both shoulders toward the ears and holds them there.|Uma cliente sobe os dois ombros em direção às orelhas e os mantém ali.","Elevation|Elevação|The scapula moves upward.|A escápula sobe.~Depression|Depressão|The opposite direction.|Direção oposta.~Retraction|Retração|Toward the spine.|Para a coluna.~Protraction|Protração|Away from the spine.|Para longe da coluna.","Shoulder blades upward is elevation.|Escápulas para cima é elevação.","Up is elevation.","Para cima é elevação.","Say it while she holds.","Diga enquanto ela mantém."),
()=>scenario("CIN",2,"motion","A client curls her fingers into a fist and then opens them.|Uma cliente fecha os dedos em punho e depois abre.","Flexion, then extension of the fingers|Flexão e depois extensão dos dedos|Closing is flexion, opening is extension.|Fechar é flexão, abrir é extensão.~Abduction, then adduction|Abdução e depois adução|Spread and close, not curl.|Abrir e fechar em leque, não enrolar.~Pronation, then supination|Pronação e depois supinação|Forearm rotation.|Rotação do antebraço.~Circumduction|Circundução|A circle, not a curl.|Círculo, não enrolar.","Curl and open at the fingers: flexion and extension.|Enrolar e abrir nos dedos: flexão e extensão.","Curl is flexion.","Enrolar é flexão.","Watch the joint that moves.","Veja qual articulação se move."),
()=>scenario("CIN",3,"muscle","A client stands and drives the thigh backward against light resistance.|Uma cliente fica de pé e leva a coxa para trás contra leve resistência.","Gluteus maximus|Glúteo máximo|Main hip extensor.|Principal extensor do quadril.~Iliopsoas|Iliopsoas|Hip flexor.|Flexor do quadril.~Rectus femoris|Reto femoral|Flexes the hip and extends the knee.|Flete o quadril e estende o joelho.~Adductor magnus|Adutor magno|Mainly adduction.|Sobretudo adução.","Hip extension is the gluteus maximus.|Extensão do quadril é o glúteo máximo.","Backward is glute max.","Para trás é glúteo máximo.","Ask her to squeeze the buttock, not the thigh.","Peça que ela aperte o glúteo, não a coxa."),
()=>scenario("CIN",3,"muscle","A client marches in place and lifts the knee toward the chest.|Uma cliente marcha no lugar e sobe o joelho em direção ao peito.","Iliopsoas|Iliopsoas|Main hip flexor.|Principal flexor do quadril.~Gluteus maximus|Glúteo máximo|Hip extensor.|Extensor do quadril.~Biceps femoris|Bíceps femoral|Extends the hip and flexes the knee.|Estende o quadril e flete o joelho.~Gluteus medius|Glúteo médio|Abducts the hip.|Abduz o quadril.","Knee toward chest is hip flexion, driven by the iliopsoas.|Joelho ao peito é flexão do quadril, pelo iliopsoas.","Knee up is iliopsoas.","Joelho para cima é iliopsoas.","Feel it in the groin, not the buttock.","Sinta na virilha, não no glúteo."),
()=>scenario("CIN",3,"joints","A client bends and straightens the knee while sitting.|Uma cliente dobra e estica o joelho sentada.","A modified hinge joint allowing flexion and extension|Uma articulação em dobradiça modificada, com flexão e extensão|Tibiofemoral is hinge-like with slight rotation.|A tibiofemoral é tipo dobradiça com leve rotação.~A ball and socket joint|Uma articulação esferoide|That is the hip.|Esse é o quadril.~A saddle joint|Uma articulação em sela|That is the thumb base.|Essa é a base do polegar.~A pivot joint|Uma articulação trocoide|That is the radioulnar.|Essa é a radioulnar.","The knee is a modified hinge: mostly flexion and extension, a little rotation unlocked in flexion.|O joelho é dobradiça modificada: quase só flexão e extensão, com pouca rotação liberada na flexão.","Knee is a modified hinge.","Joelho é dobradiça modificada.","Move it in the plane it actually allows.","Mova no plano que ela realmente permite."),
()=>scenario("CIN",3,"abduction","A client's humeral head drifts upward every time she raises the arm.|A cabeça do úmero da cliente sobe a cada vez que ela eleva o braço.","The rotator cuff compresses the head into the glenoid|O manguito rotador comprime a cabeça na glenoide|Cuff action is centering, not lifting.|A ação do manguito é centrar, não elevar.~The deltoid pulls the head down|O deltoide puxa a cabeça para baixo|Deltoid elevates the arm.|O deltoide eleva o braço.~The long head of biceps does all of it|A cabeça longa do bíceps faz tudo|Helps, not alone.|Ajuda, não sozinha.~The capsule holds it by itself|A cápsula segura sozinha|Capsule is passive.|A cápsula é passiva.","The cuff stabilizes the head in the socket while the deltoid lifts.|O manguito estabiliza a cabeça na cavidade enquanto o deltoide eleva.","Cuff centers, deltoid lifts.","Manguito centra, deltoide eleva.","Watch the head, not the hand.","Olhe a cabeça, não a mão."),
()=>scenario("CIN",4,"muscle","You ask a client to relax the shoulder and the arm lifts further without her effort.|Você pede que a cliente relaxe o ombro e o braço sobe mais, sem esforço dela.","Passive range exceeds active range|A amplitude passiva supera a ativa|That is what passive means.|É o que passivo significa.~Active range exceeds passive|A ativa supera a passiva|Usually the reverse.|Costuma ser o contrário.~The two are always equal|As duas são sempre iguais|Only in ideal tissue.|Só em tecido ideal.~Passive range measures strength|A passiva mede força|Strength needs resistance.|Força precisa de resistência.","Passive is your movement, so it is expected to exceed active.|Passivo é o seu movimento, então se espera que supere o ativo.","Passive goes further, by definition.","Passivo vai mais longe, por definição.","Note both numbers, not just one.","Anote os dois números, não só um."),
()=>scenario("CIN",4,"joints","A client dislocates the shoulder easily and asks why.|Uma cliente desloca o ombro com facilidade e pergunta por quê.","Glenohumeral trades stability for mobility|A glenoumeral troca estabilidade por mobilidade|Shallow socket, wide range.|Cavidade rasa, amplitude ampla.~It is the deepest socket in the body|É a cavidade mais funda do corpo|That is the hip.|Esse é o quadril.~It has no ligaments|Não tem ligamentos|Has them, just lax ones.|Tem, apenas frouxos.~It is a hinge|É uma dobradiça|Ball and socket.|Esferoide.","The shoulder is the most mobile and least stable joint; the trade is built in.|O ombro é a articulação mais móvel e menos estável; a troca é estrutural.","Widest range, weakest rim.","Maior amplitude, borda mais frágil.","Work within range, not into the end.","Trabalhe dentro da amplitude, não no limite."),
()=>scenario("CIN",4,"muscle","Which of these does not cross the elbow?|Qual destes não cruza o cotovelo?","Deltoid|Deltoide|Acts at the shoulder only.|Age só no ombro.~Biceps brachii|Bíceps braquial|Crosses it.|Cruza.~Brachialis|Braquial|Crosses it.|Cruza.~Triceps brachii|Tríceps braquial|Crosses it.|Cruza.","The deltoid inserts on the humerus, above the elbow.|O deltoide insere no úmero, acima do cotovelo.","Deltoid stays at the shoulder.","Deltoide fica no ombro.","Check both ends before naming an action.","Confira as duas pontas antes de nomear ação."),
()=>scenario("CIN",4,"proprioception","A client says vibration feels strong and pressure feels deep, but light touch barely registers.|Uma cliente diz que vibração parece forte e pressão parece profunda, mas toque leve quase não registra.","Pacinian corpuscles are responding to deep pressure and vibration|Os corpúsculos de Pacini estão respondendo a pressão profunda e vibração|They sit deep and prefer rapid change.|Ficam fundo e preferem mudança rápida.~Muscle spindles feel the vibration|Os fusos sentem a vibração|They read length.|Eles leem comprimento.~Golgi organs read light touch|Órgãos de Golgi leem toque leve|They read tension.|Eles leem tensão.~Free nerve endings read pressure depth|Terminações livres leem profundidade|They read pain and temperature.|Leem dor e temperatura.","Pacinian corpuscles are deep and respond to pressure and vibration; light touch uses other receptors.|Pacini são profundos e respondem a pressão e vibração; o toque leve usa outros receptores.","Deep and fast: Pacini.","Fundo e rápido: Pacini.","Vary the stimulus to find what she feels.","Varie o estímulo para achar o que ela sente."),
()=>scenario("CIN",4,"motion","A client traces a full circle with the straight arm.|Uma cliente desenha um círculo completo com o braço esticado.","Circumduction|Circundução|A circle combines the four.|O círculo combina os quatro.~Rotation|Rotação|Turning on the axis.|Giro no eixo.~Abduction alone|Só abdução|One direction.|Uma direção.~Extension alone|Só extensão|One direction.|Uma direção.","Circumduction is the sequential combination of flexion, abduction, extension and adduction.|Circundução é a combinação sequencial de flexão, abdução, extensão e adução.","Circle is circumduction.","Círculo é circundução.","Follow the sequence around.","Acompanhe a sequência ao redor."),
()=>scenario("ANA",2,"anatomy","How many cervical vertebrae are there?|Quantas vértebras cervicais existem?","Seven|Sete|C1 to C7.|C1 a C7.~Five|Cinco|That is lumbar.|Esse é lombar.~Twelve|Doze|That is thoracic.|Esse é torácico.~Nine|Nove|No region has nine.|Nenhuma região tem nove.","Seven cervical vertebrae, C1 through C7.|Sete vértebras cervicais, C1 a C7.","Seven, always.","Sete, sempre.","Count regions, not guesses.","Conte regiões, não palpites."),
()=>scenario("ANA",2,"anatomy","Which is the largest organ of the body?|Qual é o maior órgão do corpo?","The skin|A pele|Covers the whole surface.|Cobre toda a superfície.~The liver|O fígado|Largest internal organ.|Maior órgão interno.~The lungs|Os pulmões|Large, not largest.|Grandes, não o maior.~The brain|O cérebro|Not by mass or area.|Não por massa ou área.","Skin is the largest organ by area and mass.|A pele é o maior órgão por área e massa.","Skin is the largest, period.","Pele é a maior, ponto.","Liver is the trap answer.","Fígado é a pegadinha."),
()=>scenario("ANA",3,"anatomy","What does red bone marrow produce?|O que a medula óssea vermelha produz?","Blood cells|Células do sangue|Hematopoiesis happens there.|A hematopoese ocorre ali.~Bile|Bile|Liver.|Fígado.~Collagen|Colágeno|Connective tissue cells.|Células do conjuntivo.~Synovial fluid|Líquido sinovial|Membrane.|Membrana.","Red marrow is the blood-forming tissue.|A medula vermelha é o tecido formador de sangue.","Marrow makes blood.","Medula faz sangue.","Yellow marrow stores fat, red makes blood.","Medula amarela guarda gordura, a vermelha faz sangue."),
()=>scenario("ANA",3,"anatomy","Which organ produces bile?|Qual órgão produz bile?","The liver|O fígado|Bile is made there and stored in the gallbladder.|A bile é feita ali e guardada na vesícula.~The gallbladder|A vesícula|Stores, does not make.|Guarda, não produz.~The pancreas|O pâncreas|Enzymes and hormones.|Enzimas e hormônios.~The spleen|O baço|Blood filtration.|Filtragem de sangue.","The liver produces bile; the gallbladder stores it.|O fígado produz bile; a vesícula a armazena.","Liver makes, gallbladder keeps.","Fígado faz, vesícula guarda.","Separate making from storing.","Separe produzir de guardar."),
()=>scenario("ANA",3,"repair","What forms immediately after a vessel tears in soft tissue?|O que se forma imediatamente após um vaso se romper no tecido mole?","A hematoma|Um hematoma|Blood escapes and clots.|O sangue escapa e coagula.~Granulation tissue|Tecido de granulação|Comes later.|Vem depois.~A collagen scar|Uma cicatriz de colágeno|Much later.|Muito depois.~New capillaries|Capilares novos|Part of proliferation.|Parte da proliferação.","A hematoma is the first event; granulation and collagen follow.|O hematoma é o primeiro evento; granulação e colágeno vêm depois.","First comes blood.","Primeiro vem sangue.","Order matters more than names.","A ordem importa mais que os nomes."),
()=>scenario("ANA",4,"anatomy","Which structure separates the chest cavity from the abdomen?|Qual estrutura separa a cavidade torácica da abdominal?","The diaphragm|O diafragma|Musculotendinous dome.|Cúpula musculotendínea.~The pleura|A pleura|Lines the lung.|Reveste o pulmão.~The peritoneum|O peritônio|Lines the abdomen.|Reveste o abdome.~The mediastinum|O mediastino|Central chest compartment.|Compartimento central do tórax.","The diaphragm is the partition and the main breathing muscle.|O diafragma é a divisória e o principal músculo da respiração.","Diaphragm divides.","O diafragma divide.","Feel the dome under the ribs.","Sinta a cúpula sob as costelas."),
()=>scenario("ANA",4,"anatomy","Which nerve drives the diaphragm?|Qual nervo comanda o diafragma?","The phrenic nerve|O nervo frênico|C3 to C5.|C3 a C5.~The vagus nerve|O nervo vago|Parasympathetic, viscera.|Parassimpático, vísceras.~The intercostal nerves|Os nervos intercostais|Ribs.|Costelas.~The median nerve|O nervo mediano|Hand.|Mão.","The phrenic nerve, from C3 to C5, is the only motor supply to the diaphragm.|O nervo frênico, de C3 a C5, é a única inervação motora do diafragma.","C3, C4, C5 keeps it alive.","C3, C4, C5 mantém vivo.","Neck injury can reach the breath.","Lesão cervical alcança a respiração."),
()=>scenario("EFE",2,"techniques","A client has a thick, well-nourished upper back and wants tissue worked, not stroked.|Uma cliente tem costas grossas e bem nutridas e quer o tecido trabalhado, não deslizado.","Petrissage|Amassamento|Lifts and kneads.|Levanta e amassa.~Effleurage|Deslizamento|Glide, not lift.|Desliza, não levanta.~Vibration|Vibração|Oscillation.|Oscilação.~Tapotement|Percussão|Rhythm, not kneading.|Ritmo, não amassamento.","Kneading is for well-nourished tissue that can be lifted.|Amassar serve para tecido bem nutrido, que pode ser levantado.","Thick tissue: knead.","Tecido grosso: amasse.","Grab and roll, not slide.","Pegue e role, não deslize."),
()=>scenario("EFE",3,"techniques","A client has an old, fully closed scar that feels stuck to the tissue below.|Uma cliente tem cicatriz antiga, totalmente fechada, que parece aderida ao tecido abaixo.","Small friction across the scar, with the tissue held still|Fricção pequena em cruz na cicatriz, com o tecido imóvel|Localized movement separates layers.|Movimento localizado separa camadas.~Long effleurage over the scar|Deslizamento longo sobre a cicatriz|Glide does not shear layers.|Deslizar não cisalha camadas.~Deep pressure straight down|Pressão profunda em linha reta|Compresses without shear.|Comprime sem cisalhar.~Tapotement over the scar|Percussão sobre a cicatriz|Rhythm, no shear.|Ritmo, sem cisalhamento.","Cross-fiber friction creates shear between adherent layers.|Fricção transversal cria cisalhamento entre camadas aderidas.","Stuck scar: shear it small.","Cicatriz presa: cisalhe pequeno.","Pin the tissue, move two centimeters.","Fixe o tecido, mova dois centímetros."),
()=>scenario("EFE",3,"thermal","A client has a hot, swollen knee from a strain two days ago.|Uma cliente tem joelho quente e inchado por distensão há dois dias.","Cold, protected, short|Frio, protegido, curto|Vasoconstriction limits the swelling.|A vasoconstrição limita o edema.~Hot pack over the knee|Bolsa quente sobre o joelho|Heat increases acute swelling.|Calor aumenta edema agudo.~Hot pack on the opposite leg|Bolsa quente na perna oposta|Indirect, weak.|Indireto, fraco.~Alternating hot and cold|Alternar quente e frio|Confusing in the acute window.|Confuso na janela aguda.","Heat is contraindicated over acute inflammation; cold is the choice.|Calor é contraindicado sobre inflamação aguda; o frio é a escolha.","Hot joint: cold.","Articulação quente: frio.","Ten minutes, cloth between.","Dez minutos, pano no meio."),
()=>scenario("EFE",3,"massage","A client has a fever of 38.5 and asked for drainage work.|Uma cliente está com febre de 38,5 e pediu drenagem.","Postpone; fever blocks lymphatic work|Adiar; febre bloqueia trabalho linfático|Acute infection is a contraindication.|Infecção aguda é contraindicação.~Do drainage anyway, it clears toxins|Fazer a drenagem, ela limpa toxinas|Clears fluid, not infection.|Limpa líquido, não infecção.~Work only the legs|Trabalhar só as pernas|The process is systemic.|O processo é sistêmico.~Do it but very light|Fazer, mas bem leve|Lightness does not fix an active infection.|Leveza não resolve infecção ativa.","Fever means an active process; drainage waits.|Febre indica processo ativo; a drenagem espera.","Fever and drainage do not mix.","Febre e drenagem não combinam.","Take the temperature first.","Meça a temperatura antes."),
()=>scenario("EFE",4,"myofascial","A client's tissue resists slow pressure and the barrier feels far away.|O tecido da cliente resiste à pressão lenta e a barreira parece longe.","Follow the tissue and wait at the first barrier|Seguir o tecido e esperar na primeira barreira|The tissue sets the pace.|O tecido dita o ritmo.~Push through to the deep barrier|Empurrar até a barreira profunda|Force meets guarding.|Força encontra guarda.~Speed up to cover more area|Acelerar para cobrir mais área|Speed loses the listening.|Velocidade perde a escuta.~Stop and use only heat|Parar e usar só calor|Heat does not replace contact.|Calor não substitui contato.","Myofascial work waits at the first resistance and lets the tissue yield.|O trabalho miofascial espera na primeira resistência e deixa o tecido ceder.","Wait at the first wall.","Espere na primeira parede.","Less pressure, more time.","Menos pressão, mais tempo."),
()=>scenario("EFE",4,"massage","A client's hamstrings feel looser after the session. She asks whether to stretch now.|Uma cliente sente os isquiotibiais mais soltos após a sessão. Pergunta se deve alongar agora.","Yes, gently, while the tissue is warm|Sim, suave, enquanto o tecido está quente|Warm tissue tolerates length.|Tecido quente tolera comprimento.~No, wait twenty-four hours|Não, espere vinte e quatro horas|Wastes the window.|Desperdiça a janela.~Only with a strap|Só com faixa|A tool does not decide it.|A ferramenta não decide.~Stretch to the maximum while it is loose|Alongar ao máximo enquanto está solto|Maximum now can overshoot.|Máximo agora pode passar do ponto.","Use the warm window, gently, short of pain.|Use a janela quente, suave, antes da dor.","Warm tissue, gentle length.","Tecido quente, comprimento suave.","Twenty seconds, no bounce.","Vinte segundos, sem balançar."),
()=>scenario("AVA",3,"soap","The note reads: tissue feels boggy, movement guarded, likely guarding from desk work.|A nota diz: tecido pastoso, movimento guardado, provável guarda por trabalho sentado.","Assessment|Avaliação|Interpretation of findings.|Interpretação dos achados.~Subjective|Subjetivo|Client report.|Relato da cliente.~Objective|Objetivo|Measured findings.|Achados medidos.~Plan|Plano|Next steps.|Próximos passos.","Interpretation belongs in Assessment.|Interpretação vai em Avaliação.","Interpretation is A.","Interpretação é A.","Findings go in O, meaning in A.","Achados vão em O, sentido em A."),
()=>scenario("AVA",4,"motion","You move the ankle and feel a firm stop with a little give, no pain.|Você move o tornozelo e sente parada firme com pouca elasticidade, sem dor.","Firm end-feel with slight give, within normal|Parada firme com leve elasticidade, dentro do normal|Capsular pattern is expected.|Padrão capsular é esperado.~Spasm end-feel|Parada por espasmo|Would be springy and painful.|Seria elástica e dolorosa.~Empty end-feel|Parada vazia|The client stops you before resistance.|A cliente te para antes da resistência.~Bone-to-bone end-feel|Parada osso-a-osso|Hard and abrupt.|Dura e abrupta.","Firm with slight give is normal capsular end-feel.|Firme com leve elasticidade é parada capsular normal.","Firm but soft is normal.","Firme mas macia é normal.","Compare both sides before judging.","Compare os dois lados antes de julgar."),
()=>scenario("PRO",3,"mechanics","You lift a folded table from the floor into the car.|Você levanta uma maca dobrada do chão para o carro.","Bend the knees, keep the load close, and pivot the feet|Dobrar os joelhos, manter a carga perto e girar os pés|Legs and proximity protect the back.|Pernas e proximidade protegem a coluna.~Bend at the waist and reach|Dobrar a cintura e alcançar|Long lever on the lumbar spine.|Alavanca longa na lombar.~Twist with the feet planted|Torcer com os pés fixos|Twist plus load.|Torção com carga.~Lift fast to reduce time under load|Levantar rápido para reduzir tempo sob carga|Speed adds momentum.|Velocidade soma impulso.","Knees, closeness and foot pivot keep the load off the lumbar spine.|Joelhos, proximidade e giro dos pés tiram a carga da lombar.","Knees, close, turn the feet.","Joelhos, perto, gire os pés.","Set the feet before you grip.","Fixe os pés antes de pegar."),
()=>scenario("PRO",4,"cdc","You are about to disinfect the wooden stool and the vinyl table.|Você vai desinfetar o banco de madeira e a maca de vinil.","Wipe both, but only the vinyl takes full wet contact|Passar nos dois, mas só o vinil aceita contato úmido pleno|Wood absorbs and dries faster.|Madeira absorve e seca antes.~Treat both the same|Tratar os dois igual|Different surfaces, different behavior.|Superfícies diferentes, comportamento diferente.~Skip the wood, it is not skin contact|Pular a madeira, não é contato com pele|It is touched by hands.|É tocado por mãos.~Use double product on the wood|Dobrar o produto na madeira|Does not fix absorption.|Não corrige a absorção.","Porous surfaces hold product differently; follow the label for each.|Superfície porosa segura o produto de outro jeito; siga o rótulo de cada uma.","Wood drinks, vinyl holds.","Madeira bebe, vinil segura.","Read both labels, not one.","Leia os dois rótulos, não um."),
