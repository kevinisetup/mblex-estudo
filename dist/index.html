function expire(){const e=state.exam;if(!e||e.ended)return;e.expired=true;finish(true);}
function finish(expired){const e=state.exam;if(!e.ended)e.ended=Date.now();e.expired=expired||e.expired;state.screen='finished';const n=e.records.length,right=e.records.filter(x=>x.correct).length,stats=Object.keys(DOMAINS).map(d=>{const r=e.records.filter((x,i)=>e.deck[i].d===d);return {d,n:r.length,ok:r.filter(x=>x.correct).length};}),wrong=e.records.map((r,i)=>({r,i})).filter(x=>!x.r.correct),first=e.records.slice(0,20),middle=e.records.slice(20,60),rate=r=>r.length?Math.round(r.filter(x=>x.correct).length/r.length*100):0;mount(`<p class="eyebrow">Seu resultado de treino</p><h1 style="font-size:43px">Resultado da sessão</h1><div class="grid"><section class="glass"><p class="score">${n?Math.round(right/n*100):0}<span style="font-size:26px">%</span></p><p>${right} acertos / ${n} respondidas · ${e.deck.length-n} sem responder</p><p class="small muted">Tempo total: ${formatTime(e.ended-e.started)} · ${e.mode==='study'?'Treino':e.mode==='focus'?'Bloco 50':'Prova'}</p>${e.expired?'<p class="note">Tempo encerrado. As respostas confirmadas foram preservadas nesta tela.</p>':''}<p class="small">${n===e.deck.length?'Percurso completo.':'Sessão parcial: não compare este percentual com um percurso completo.'}</p><p class="note">Este percentual não corresponde ao resultado oficial PASS/FAIL. Não é possível inferir aprovação nem um corte de 70% ou 80% neste banco.</p><p class="small">Primeiras 20: ${first.length===20?rate(first)+'% · meta 80%':'parcial, '+first.length+'/20'}<br>Questões 21–60: ${middle.length===40?rate(middle)+'% · meta 60%':'parcial, '+middle.length+'/40'}</p></section><section class="glass"><h2>Por domínio</h2><table><thead><tr><th>Domínio</th><th>Acertos</th><th>%</th></tr></thead><tbody>${stats.map(x=>`<tr><td>${DOMAINS[x.d]}</td><td>${x.ok}/${x.n}</td><td>${x.n?Math.round(x.ok/x.n*100):'—'}</td></tr>`).join('')}</tbody></table></section></div><section class="glass" style="margin-top:18px"><h2>Seu próximo passo</h2><p class="small">Prioridades pelo erro observado; amostras pequenas não medem domínio. Misture essas fichas com conteúdos já acertados.</p><ul>${stats.filter(x=>x.n&&x.ok<x.n).sort((a,b)=>(b.n-b.ok)/b.n-(a.n-a.ok)/a.n).slice(0,3).map(x=>`<li>${DOMAINS[x.d]}: ${Math.min(10,Math.max(3,(x.n-x.ok)*2))} fichas de recuperação ativa.</li>`).join('')||'<li>Sem erros registrados: retome depois, com questões diferentes, para conferir retenção.</li>'}</ul><p class="small">Se a prova for amanhã, priorize os erros recorrentes, uma revisão mista curta e descanso. Revisão em 48 horas é continuidade, não preparação para amanhã.</p><p class="small">Causas são autorrelatadas abaixo. O programa não consegue distinguir ansiedade de desconhecimento apenas pela alternativa marcada.</p></section><h2 style="margin-top:32px">Revisão das respostas</h2><p class="small muted">${wrong.length} erros. Acertos também podem ser abertos para consultar a explicação.</p>${e.records.map((r,i)=>`<details class="glass"><summary>${r.correct?'Acerto':'Revisar'} · ${i+1} · ${DOMAINS[e.deck[i].d]} · marcada ${letters[r.selected]}, correta ${letters[e.deck[i].correct]}</summary>${bilingual(e.deck[i].q,e.lang,'small')}${explanation(e.deck[i],r.selected,e.lang)}${r.correct?'':causeSelect(i)}</details>`).join('')}<p class="note">Incertezas: não há item incluído com gabarito deliberadamente incerto.<br>Questões clínicas simplificam o contexto; decisões reais dependem de avaliação e escopo local.<br>Este banco não passou por validação psicométrica nem revisão independente de uma banca.</p><details><summary>Fontes e correções</summary>${sourceNotes()}</details><div class="actions">${button('review','Perfil e respostas')}${button('again','Novo percurso','primary')}${button('profile',state.profile?'Meu perfil':'Fazer perfil')}${button('home-finished','Início')}</div>`,true);wireCauses();bind('review',reviewReport);bind('again',setup);bind('profile',()=>state.profile?result():startProfile());bind('home-finished',goHome);}
function reportBody(){
 const p=state.profile,e=state.exam;
 if(!p)return `<h1>Rodada e respostas</h1><p class="small">Sessão: ${e?esc(new Date(e.started).toLocaleString('pt-BR')):'—'} · Perfil não respondido.</p><p>${e?e.records.length:0} respostas registradas neste aparelho.</p>${e?e.records.map((r,i)=>{const q=e.deck[i];return `<details class="glass"><summary>${i+1}. ${DOMAINS[q.d]} · ${r.correct?'Acerto':'Erro'} · marcada ${letters[r.selected]}, correta ${letters[q.correct]}</summary>${bilingual(q.q,'EN')}<p>Escolhida: ${bilingual(q.options[r.selected].v,'EN','small')}</p>${explanation(q,r.selected,'EN')}</details>`;}).join(''):''}`;
 return `<h1>Perfil e respostas</h1><p class="small">Relatório da sessão · ${esc(p.created.toLocaleString('pt-BR'))}</p>
 <section class="glass"><h2>${esc(p.dominant)}</h2><p>Secundário: ${esc(p.secondary)}</p><p>Preferências relatadas, não diagnóstico de personalidade ou medida de capacidade. Compare com o desempenho observado.</p>${PROFILES[p.dominant].lines.map(x=>`<p>${esc(x)}</p>`).join('')}<h3>Plano sugerido</h3><ul>${PROFILES[p.dominant].rx.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(exportProfile(p,state.answers))}</pre></section>
 <h2>As 20 escolhas do perfil</h2>${ITEMS.map((item,i)=>`<details class="glass"><summary>${i+1}. ${esc(PROFILE_EN[i][0])}<br><span lang="pt-BR">${esc(item[1])}</span></summary>${item[2].map((x,j)=>`<p${state.answers[i]===j?' class="note"':''}><b>${letters[j]}${state.answers[i]===j?' · Selected / Escolhida':''}</b><br><span lang="en">${esc(PROFILE_EN[i][1][j])}</span><br><span lang="pt-BR">${esc(x)}</span></p>`).join('')}</details>`).join('')}
 <h2>Escolhas no simulado</h2>${e?`<p>Modo: ${e.mode==='study'?'Treino':'Prova'} · Dificuldade inicial: ${esc(e.difficulty==='progressive'?'Progressiva':LEVELS[Number(e.difficulty)-1])}<br>Idioma: inglês primeiro · Bloco: ${e.blockSize}<br>${e.records.filter(r=>r.correct).length} acertos de ${e.records.length} respondidas.</p>${e.records.map((r,i)=>{const q=e.deck[i];return `<details class="glass"><summary>${i+1}. ${esc(DOMAINS[q.d])} · ${r.correct?'Acerto':'Revisar'} · marcada ${letters[r.selected]}, correta ${letters[q.correct]}</summary>${bilingual(q.q,'EN')}${q.options.map((o,j)=>`<p><b>${letters[j]}${j===r.selected?' · Selected / Escolhida':''}${j===q.correct?' · Correct / Correta':''}</b>${bilingual(o.v,'EN','small')}</p>`).join('')}<p class="small">Tempo até confirmar: ${Math.round(r.ms/1000)} s · Causa relatada: ${esc(r.cause||'Não informada')}</p>${explanation(q,r.selected,'EN')}</details>`;}).join('')}`:'<p>Nenhuma questão respondida nesta sessão.</p>'}`;
}
function roundText(){
 const e=state.exam,p=state.profile,n=e?.records.length||0,ok=e?.records.filter(r=>r.correct).length||0;
 const domains=e?Object.keys(DOMAINS).map(d=>{const rows=e.records.filter((_,i)=>e.deck[i].d===d);return `${DOMAINS[d]}: ${rows.filter(r=>r.correct).length}/${rows.length}`;}):[];
 const answers=e?e.records.map((r,i)=>{const q=e.deck[i];return [i+1+'. ID '+q.id+' · '+DOMAINS[q.d]+' · '+(r.correct?'CERTO':'ERRADO')+' · '+letters[r.selected]+' / '+letters[q.correct],q.q[0],q.q[1],'Escolhida EN/PT: '+q.options[r.selected].v.slice(0,2).join(' / '),'Correta EN/PT: '+q.options[q.correct].v.slice(0,2).join(' / '),'Por quê EN/PT: '+q.why.join(' / '),'Causa informada: '+(r.cause||'não informada')].join('\n')}):[];
 return ['MBLEx · RODADA',e?'INÍCIO: '+new Date(e.started).toLocaleString('pt-BR'):'SEM SIMULADO',`RESPONDIDAS: ${n}${e?' / '+e.deck.length:''} · ACERTOS: ${ok} · ERROS: ${n-ok}`,domains.join(' · '),p?exportProfile(p,state.answers):'PERFIL: não respondido',...answers].filter(Boolean).join('\n\n');
}
function shareImage(){
 const e=state.exam,p=state.profile,n=e?.records.length||0,ok=e?.records.filter(r=>r.correct).length||0,canvas=document.createElement('canvas');canvas.width=750;canvas.height=1240;const c=canvas.getContext('2d');if(!c)throw Error('Imagem indisponível');
 c.fillStyle='#f5f6f8';c.fillRect(0,0,750,1240);c.textBaseline='top';c.fillStyle='#16191f';c.font='bold 30px system-ui';c.fillText('MBLEx · desempenho da rodada',48,48);c.font='21px system-ui';c.fillStyle='#556070';c.fillText(e?new Date(e.started).toLocaleString('pt-BR'):'Perfil antes do simulado',48,94);
 c.fillStyle='#16191f';c.font='bold 80px system-ui';c.fillText(n?Math.round(ok/n*100)+'%':'—',48,148);c.font='22px system-ui';c.fillText(`${ok} acertos · ${n-ok} erros`,260,174);c.fillText(`${n}${e?' de '+e.deck.length:''} respondidas · parcial`,260,206);c.fillStyle='#556070';c.font='21px system-ui';c.fillText('Perfil: '+(p?p.dominant+' / '+p.secondary:'não respondido'),48,272);
 c.fillStyle='#16191f';c.font='bold 25px system-ui';c.fillText('Desempenho por categoria',48,330);
 Object.keys(DOMAINS).forEach((d,i)=>{const rows=e?e.records.filter((_,j)=>e.deck[j].d===d):[],right=rows.filter(r=>r.correct).length,pct=rows.length?Math.round(right/rows.length*100):0,y=392+i*67;c.fillStyle='#16191f';c.font='21px system-ui';c.fillText(DOMAINS[d],48,y);c.fillStyle='#dce1e6';c.fillRect(316,y+5,246,18);if(rows.length>=3){const color=band(right,rows.length).c;c.fillStyle=color==='g'?'#178a3a':color==='m'?'#a66300':'#c92a20';c.fillRect(316,y+5,246*pct/100,18);}c.fillStyle='#556070';c.font='20px system-ui';c.fillText(rows.length>=3?`${right}/${rows.length} · ${pct}%`:`${rows.length}/3`,585,y);});
 const last=e&&n?{q:e.deck[n-1],r:e.records[n-1]}:null;c.fillStyle='#16191f';c.font='bold 24px system-ui';c.fillText(last?'Última resposta':'Aguardando respostas',48,889);
 const wrap=(value,y,max)=>{c.font='21px system-ui';c.fillStyle='#333c48';let line='',used=0;for(const word of value.split(/\s+/)){const next=line?line+' '+word:word;if(c.measureText(next).width>650&&line){c.fillText(line,48,y+used*30);used++;line=word;if(used>=max)break;}else line=next;}if(used<max&&line)c.fillText(line,48,y+used*30);return y+Math.min(max,used+1)*30;};
 if(last){let y=933;y=wrap(last.q.q[0],y,2)+9;y=wrap(last.q.q[1],y,2)+10;c.font='bold 21px system-ui';c.fillStyle=last.r.correct?'#178a3a':'#c92a20';c.fillText(`${last.r.correct?'Acerto':'Erro'} · marcada ${letters[last.r.selected]} · correta ${letters[last.q.correct]}`,48,y);}c.fillStyle='#657080';c.font='18px system-ui';c.fillText('Respostas completas acompanham o compartilhamento quando possível.',48,1165);c.fillText('Treino independente · não é resultado oficial da prova.',48,1196);
 const url=canvas.toDataURL('image/png'),bytes=Uint8Array.from(atob(url.split(',')[1]),x=>x.charCodeAt(0));return new File([bytes],'mblex-desempenho-'+Date.now()+'.png',{type:'image/png'});
}

function downloadFile(file){const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
async function shareLive(){const status=document.querySelector('#share-status,#round-status'),text=roundText(),image=shareImage(),report=new File([text],'mblex-respostas-'+Date.now()+'.txt',{type:'text/plain'}),title='MBLEx · desempenho e respostas';try{if(navigator.share&&navigator.canShare?.({files:[image,report]})){await navigator.share({title,text:'Gráfico e respostas completas da rodada.',files:[image,report]});}else if(navigator.share&&navigator.canShare?.({files:[image]})){await navigator.share({title,text,files:[image]});}else if(navigator.share){await navigator.share({title,text});downloadFile(image);}else{downloadFile(image);downloadFile(report);if(status)status.textContent='Imagem e respostas baixadas. Envie os dois arquivos ao destinatário.';return;}if(status)status.textContent='Compartilhamento iniciado. Confirme o destinatário no aplicativo escolhido.';}catch(error){if(error.name==='AbortError'){if(status)status.textContent='Compartilhamento cancelado.';return;}downloadFile(image);downloadFile(report);if(status)status.textContent='Compartilhamento indisponível. Imagem e respostas baixadas para envio manual.';}}

function reviewReport(){
 state.screen='review';
 mount(`${reportBody()}<div class="actions">${button('save-report','Salvar relatório HTML','primary')}${button('copy-round','Copiar respostas')}${button('share-round','Compartilhar gráfico e respostas')}${button('return','Voltar')}</div><p id="round-status" class="status" role="status"></p><p class="small muted">As respostas ficam neste aparelho. Para outra pessoa vê-las, copie ou envie o relatório. Não há envio automático.</p>`,true);
 bind('save-report',saveReport);bind('share-round',shareRound);bind('copy-round',()=>{const field=document.createElement('textarea');field.value=roundText();field.style.position='fixed';field.style.left='-9999px';document.body.append(field);copyText(field,$('#round-status')).finally(()=>field.remove());});bind('return',()=>state.exam&&state.exam.ended?finish(state.exam.expired):state.exam?renderQuestion():state.profile?result():intro());
}
async function shareRound(){return shareLive();}
function reportHTML(){
 const css=document.querySelector('style').textContent;
 return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBLEx · Relatório da sessão</title><style>'+css+'.choice.wrong,.choice.wrong[aria-pressed=true]{border-color:#b84a55;background:#ed62652b}.choice.correct,.choice.correct[aria-pressed=true]{border-color:#328859;background:#46bd702b}.choice:disabled{opacity:1}</style></head><body class="light"><main>'+reportBody()+'</main></body></html>';
}
function saveReport(){
 const url=URL.createObjectURL(new Blob([reportHTML()],{type:'text/html;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='mblex-relatorio-'+new Date(state.exam?.started||Date.now()).toISOString().replace(/[:.]/g,'-')+'.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
window.addEventListener('beforeunload',event=>{if(state.answers.some(x=>x!==null)||state.exam){event.preventDefault();event.returnValue='';}});
setInterval(tick,1000);
intro();
