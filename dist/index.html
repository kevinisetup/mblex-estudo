scenario("EFE",2,"thermal","Maya, 28, has a medically assessed ankle sprain from 24 hours ago, with swelling and local warmth. Sensation and circulation are normal. At intake, which thermal option is most appropriate, while deferring massage over the injury?|Maya, 28 anos, tem entorse de tornozelo avaliada por profissional de saúde há 24 horas, com edema e calor local. Sensibilidade e circulação são normais. Na avaliação inicial, qual opção térmica é mais adequada, adiando a massagem sobre a lesão?","Brief protected cooling with skin checks|Frio breve com proteção e checagem da pele~Intense heat directly over the swelling|Calor intenso diretamente sobre o edema|Heat may increase acute swelling.|O calor pode aumentar o edema agudo.~Deep friction immediately after heating|Fricção profunda logo após aquecer|An acute sprain is not an indication for deep friction.|Entorse aguda não indica fricção profunda.~Ice directly on skin until all sensation is lost|Gelo direto na pele até perder toda a sensibilidade|Unprotected or excessive cooling can injure skin.|Frio excessivo ou sem proteção pode lesar a pele.","Cooling can temporarily reduce local blood flow and pain and help control swelling. Protect and check the skin; it does not make acute tissue ready for massage.|O frio pode reduzir temporariamente o fluxo local e a dor e ajudar a controlar o edema. Proteja e confira a pele; isso não torna o tecido agudo pronto para massagem.");

scenario("EFE",2,"thermal","Luis, 46, reports stable neck stiffness for six months after desk work, without recent injury, redness or swelling. Sensation and circulation are normal. Which preparation best fits the agreed gentle session?|Luis, 46 anos, relata rigidez cervical estável há seis meses após trabalho sentado, sem lesão recente, vermelhidão ou edema. Sensibilidade e circulação são normais. Qual preparação combina melhor com a sessão suave acordada?","Comfortable moist warmth with skin monitoring|Calor úmido confortável com monitoramento da pele~A scalding pack to reach deeper tissue faster|Compressa escaldante para alcançar tecidos profundos mais rápido|Higher temperature raises burn risk.|Temperatura maior eleva o risco de queimadura.~Prolonged ice until the neck is numb|Gelo prolongado até anestesiar o pescoço|Numbness is not a safe target for preparing movement.|Anestesia não é uma meta segura para preparar movimento.~Forceful stretching before checking tolerance|Alongamento forçado antes de verificar tolerância|Preparation does not justify forcing range.|Preparação não justifica forçar amplitude.","Gentle warmth promotes superficial vasodilation and can ease stiffness before comfortable movement. Screen first and monitor skin rather than treating hotter as better.|Calor suave promove vasodilatação superficial e pode aliviar rigidez antes de movimento confortável. Avalie antes e monitore a pele, sem confundir mais quente com melhor.");

scenario("EFE",3,"thermal","Rosa, 62, arrives for hand massage after three months of recurrent finger coldness. Today her fingers are pale and cold, and she reports impaired circulation. What should the practitioner do about a planned cold application?|Rosa, 62 anos, chega para massagem nas mãos após três meses de episódios de dedos frios. Hoje estão pálidos e frios, e ela relata circulação comprometida. O que fazer com a aplicação de frio planejada?","Withhold cold and seek appropriate clinical guidance|Não aplicar frio e buscar orientação clínica adequada~Use a shorter cold application without further assessment|Aplicar frio por menos tempo sem nova avaliação|Shortening exposure does not resolve impaired circulation.|Encurtar a exposição não resolve a circulação comprometida.~Keep ice on until the fingers turn blue|Manter gelo até os dedos ficarem azulados|Color deterioration is a warning, not a treatment goal.|Piora da cor é alerta, não objetivo terapêutico.~Alternate extreme heat and cold to restore circulation|Alternar calor e frio extremos para restaurar a circulação|Extreme temperatures are unsafe in compromised tissue.|Temperaturas extremas são inseguras no tecido comprometido.","Cold can further reduce local perfusion. Abnormal circulation requires assessment; merely reducing cold exposure is not an adequate safeguard here.|O frio pode reduzir ainda mais a perfusão local. Circulação anormal exige avaliação; apenas diminuir o tempo de frio não é proteção suficiente neste caso.");

scenario("CIN",2,"proprioception","Noah, 31, has mild hamstring tightness for two weeks without injury. During an agreed gentle stretch, a student suddenly speeds up the movement and the muscle resists. Which receptor signal supports returning to a slow, comfortable stretch?|Noah, 31 anos, tem leve tensão posterior de coxa há duas semanas, sem lesão. Durante alongamento suave acordado, um aluno acelera o movimento e o músculo resiste. Qual sinal receptor fundamenta voltar ao alongamento lento e confortável?","Muscle spindles signal muscle length and rate of length change|Fusos musculares sinalizam comprimento e velocidade de mudança do comprimento~Golgi tendon organs primarily measure skin temperature|Órgãos tendinosos de Golgi medem principalmente temperatura da pele|Golgi tendon organs sense tension, not skin temperature.|Órgãos de Golgi detectam tensão, não temperatura da pele.~Joint cartilage detects blood oxygen saturation|Cartilagem articular detecta saturação de oxigênio|Cartilage is not an oxygen-saturation receptor.|Cartilagem não é receptor de saturação de oxigênio.~Pain receptors prove that faster stretching is safer|Receptores de dor comprovam que alongar mais rápido é seguro|Pain is not evidence that speed is safe.|Dor não comprova segurança da velocidade.","Muscle spindles respond to muscle length and stretch rate and contribute to the stretch reflex. Use controlled movement rather than attempting to overpower resistance.|Fusos respondem ao comprimento muscular e à velocidade do alongamento e participam do reflexo de estiramento. Use movimento controlado em vez de vencer a resistência à força.");

scenario("CIN",3,"proprioception","Amira, 39, has calf tightness for four weeks and is cleared for comfortable movement. During a low-effort contract-relax exercise, she asks to use maximal force. Which explanation best supports keeping the effort controlled?|Amira, 39 anos, tem tensão na panturrilha há quatro semanas e está liberada para movimento confortável. Em exercício de contrair e relaxar com pouco esforço, pede força máxima. Qual explicação melhor fundamenta manter o esforço controlado?","Golgi tendon organs monitor tension and contribute to force regulation; maximal force is unnecessary|Órgãos tendinosos de Golgi monitoram tensão e participam da regulação da força; força máxima é desnecessária~Tendon receptors detect only the speed of muscle lengthening|Receptores tendinosos detectam apenas velocidade de alongamento muscular|Length and stretch-rate signals chiefly describe muscle spindles.|Comprimento e velocidade de alongamento descrevem sobretudo os fusos.~A protective reflex guarantees that a tendon cannot be injured|Um reflexo protetor garante que o tendão não pode sofrer lesão|Reflexes do not guarantee protection from tissue injury.|Reflexos não garantem proteção contra lesão.~Maximal pain is needed to switch off every motor neuron|Dor máxima é necessária para desligar todos os neurônios motores|Pain is not a necessary or safe exercise target.|Dor não é objetivo necessário nem seguro do exercício.","Golgi tendon organs sense muscle-tendon tension. Their spinal feedback can inhibit the same muscle in the classic autogenic-inhibition model, but depends on the task and never guarantees injury prevention.|Órgãos de Golgi detectam tensão musculotendínea. No modelo clássico de inibição autogênica, o retorno medular pode inibir o mesmo músculo, mas depende da tarefa e nunca garante prevenção de lesão.");

scenario("CIN",2,"joints","Ethan, 45, has mild elbow stiffness for six weeks after immobilization and has clearance for gentle range of motion. For the humeroulnar articulation, which movement should the practitioner choose?|Ethan, 45 anos, tem leve rigidez do cotovelo há seis semanas após imobilização e liberação para mobilidade suave. Na articulação umeroulnar, qual movimento escolher?","Comfortable flexion and extension at a hinge joint|Flexão e extensão confortáveis em uma articulação em dobradiça~Forced circumduction as at a ball-and-socket joint|Circundução forçada como numa articulação esferoide|The humeroulnar joint is not a ball-and-socket joint.|A umeroulnar não é uma articulação esferoide.~Lateral bending beyond the joint limits|Inclinação lateral além dos limites articulares|This would stress structures outside the intended motion.|Isso sobrecarregaria estruturas fora do movimento previsto.~Forearm rotation attributed only to the humeroulnar hinge|Rotação do antebraço atribuída apenas à dobradiça umeroulnar|Pronation and supination involve the radioulnar joints.|Pronação e supinação envolvem as radioulnares.","The humeroulnar joint is a hinge permitting flexion and extension. Respect clearance, pain and available range; do not confuse it with nearby pivot joints.|A umeroulnar é uma dobradiça que permite flexão e extensão. Respeite liberação, dor e amplitude disponível; não a confunda com articulações trocoides próximas.");

scenario("CIN",3,"joints","Sofia, 54, has thumb-base discomfort for three months when opening jars. After assessment and clearance for gentle movement, which description best guides work at the first carpometacarpal joint?|Sofia, 54 anos, tem desconforto na base do polegar há três meses ao abrir potes. Após avaliação e liberação para movimento suave, qual descrição orienta melhor o trabalho na primeira carpometacarpal?","A saddle joint contributing to opposition; use comfortable motion without forceful end-range loading|Articulação em sela que participa da oposição; usar movimento confortável sem carga forçada no fim da amplitude~A hinge joint that permits only elbow-like bending|Articulação em dobradiça que permite apenas dobrar como o cotovelo|The first carpometacarpal joint has saddle geometry.|A primeira carpometacarpal tem geometria em sela.~A fused joint that should be forced until it moves|Articulação fundida que deve ser forçada até mover|This is a mobile synovial joint; forcing is inappropriate.|É uma articulação sinovial móvel; forçar é inadequado.~A pivot joint designed for unrestricted spinning|Articulação trocoide feita para rotação irrestrita|Saddle motion is not unrestricted axial spinning.|Movimento em sela não é giro axial irrestrito.","The first carpometacarpal joint is a saddle joint whose mobility contributes to thumb opposition. Symptoms and the plan guide force and range.|A primeira carpometacarpal é uma articulação em sela cuja mobilidade participa da oposição do polegar. Os sintomas e o plano orientam força e amplitude.");

scenario("PRO",2,"ppe","Daniel, 42, reports a draining skin lesion on his lower leg for two days at massage intake. If contact with drainage-contaminated linen is anticipated, what action and PPE are appropriate?|Daniel, 42 anos, relata uma lesão exsudativa na perna há dois dias na avaliação inicial da massagem. Se houver contato previsto com roupa contaminada por secreção, qual conduta e EPI são adequados?","Use gloves for anticipated fluid contact, perform hand hygiene, and defer work over the lesion|Usar luvas no contato previsto com fluidos, higienizar as mãos e adiar trabalho sobre a lesão~Massage the lesion because gloves make it safe|Massagear a lesão porque as luvas tornam isso seguro|Gloves do not remove a local contraindication.|Luvas não eliminam uma contraindicação local.~Handle drainage with bare hands and wash later|Manusear secreção sem luvas e lavar depois|Handwashing afterward does not replace the barrier when contact is anticipated.|Lavar depois não substitui a barreira no contato previsto.~Reuse gloves between clients if they look clean|Reutilizar luvas entre clientes se parecerem limpas|Used gloves can transfer contamination.|Luvas usadas podem transferir contaminação.","Standard precautions call for gloves when contact with body fluids or nonintact skin is anticipated. Gloves do not replace hand hygiene or authorize massage over a draining lesion.|Precauções padrão indicam luvas quando se prevê contato com fluidos ou pele não íntegra. Luvas não substituem higiene das mãos nem autorizam massagem sobre lesão exsudativa.");

scenario("PRO",2,"mechanics","Julia, a 35-year-old massage therapist, has lower-back fatigue at the end of workdays for two weeks. She bends over a low table and reaches across a client during back work. Which adjustment best addresses the observed mechanics?|Julia, massoterapeuta de 35 anos, sente fadiga lombar ao fim do expediente há duas semanas. Inclina-se sobre uma mesa baixa e alcança o outro lado do cliente durante o trabalho nas costas. Qual ajuste melhor aborda a mecânica observada?","Raise the table to a suitable working height and step closer to the area|Elevar a mesa a uma altura adequada e aproximar-se da área~Lower the table further and keep the feet fixed|Baixar ainda mais a mesa e manter os pés fixos|This increases the need to bend and reach.|Isso aumenta a necessidade de inclinar e alcançar.~Twist the trunk while keeping the hips still|Torcer o tronco mantendo o quadril imóvel|Sustained twisting adds mechanical stress.|Torção sustentada aumenta a sobrecarga mecânica.~Apply more force with the same posture|Aplicar mais força com a mesma postura|More force does not correct the awkward position.|Mais força não corrige a postura inadequada.","An appropriate table height reduces sustained trunk flexion; moving closer reduces reaching. Persistent pain warrants assessment rather than simply working through it.|Altura adequada da mesa reduz flexão sustentada do tronco; aproximar-se reduz o alcance. Dor persistente exige avaliação, em vez de simplesmente continuar trabalhando.");

scenario("ANA",2,"repair","Theo, 26, bruised his forearm 12 hours ago. At intake the area is warm, swollen and tender, and he asks for deep local massage. Which process and decision fit this early response?|Theo, 26 anos, sofreu contusão no antebraço há 12 horas. Na avaliação, a região está quente, inchada e sensível, e ele pede massagem profunda local. Qual processo e decisão combinam com essa resposta inicial?","Vasodilation and increased vascular permeability; defer deep work over the injury|Vasodilatação e maior permeabilidade vascular; adiar trabalho profundo sobre a lesão~Completed collagen remodeling; use maximum pressure|Remodelamento do colágeno concluído; usar pressão máxima|An acute injury has not completed remodeling.|Uma lesão aguda não completou o remodelamento.~No inflammatory activity; ignore warmth and swelling|Ausência de inflamação; ignorar calor e edema|Warmth and swelling are compatible with inflammation.|Calor e edema são compatíveis com inflamação.~Immediate full tissue strength; force the painful range|Resistência tecidual total imediata; forçar a amplitude dolorosa|Early tissue injury does not imply full strength.|Lesão inicial não implica resistência total.","Early inflammation includes vasodilation and fluid movement into tissue as vascular permeability rises. Do not interpret these signs as an invitation to deep local work; assess the need for referral.|A inflamação inicial inclui vasodilatação e passagem de líquido ao tecido com maior permeabilidade vascular. Esses sinais não indicam trabalho profundo local; avalie necessidade de encaminhamento.");

scenario("ANA",3,"remodeling","Grace, 48, has a fully closed surgical scar eight weeks after a forearm procedure. Her clinician has cleared gentle scar work with gradual loading. Which tissue change supports gradual rather than maximal progression?|Grace, 48 anos, tem cicatriz cirúrgica totalmente fechada oito semanas após procedimento no antebraço. Seu profissional de saúde liberou trabalho suave na cicatriz com carga gradual. Qual mudança tecidual fundamenta progressão gradual, e não máxima?","Collagen reorganizes and tissue strength develops during remodeling|O colágeno se reorganiza e a resistência se desenvolve no remodelamento~Closure means the scar immediately has normal tissue strength|Fechamento significa resistência normal imediata da cicatriz|Surface closure does not prove full mechanical strength.|Fechamento superficial não prova resistência mecânica completa.~Collagen disappears completely at eight weeks|O colágeno desaparece totalmente em oito semanas|Collagen persists and is remodeled.|O colágeno permanece e é remodelado.~More pain proves that the load is more effective|Mais dor comprova que a carga é mais eficaz|Pain is not a measure of useful loading.|Dor não mede a utilidade da carga.","Remodeling reorganizes collagen and improves tensile strength over time; healed tissue may not regain its original strength. Follow clearance and tolerance rather than a calendar-only rule.|O remodelamento reorganiza colágeno e melhora resistência à tração com o tempo; o tecido cicatrizado pode não recuperar a resistência original. Siga liberação e tolerância, não apenas o calendário.");

scenario("ETI",2,"rights","Nina, 37, has abdominal muscle tension for three weeks after exercise, with no red flags at assessment. She agrees to gentle abdominal work but asks to keep both legs covered. What should the practitioner do before moving the drape?|Nina, 37 anos, tem tensão muscular abdominal há três semanas após exercícios, sem sinais de alerta na avaliação. Aceita trabalho abdominal suave, mas pede para manter as duas pernas cobertas. O que fazer antes de mover a cobertura?","Explain the limited exposure, keep the legs covered and confirm permission|Explicar a exposição limitada, manter as pernas cobertas e confirmar permissão~Uncover the legs because the practitioner prefers it|Descobrir as pernas por preferência profissional|Preference does not override the client’s boundary.|Preferência profissional não supera o limite da cliente.~Move the drape first and explain afterward|Mover a cobertura primeiro e explicar depois|Permission should precede the change.|A permissão deve vir antes da mudança.~Treat her initial agreement as consent to every exposure|Tratar a concordância inicial como consentimento para toda exposição|Consent is specific and can be limited or withdrawn.|O consentimento é específico e pode ser limitado ou retirado.","Respect the requested coverage, explain what will be exposed and confirm ongoing consent. If the requested work cannot be done within those limits, agree on another plan.|Respeite a cobertura solicitada, explique o que será exposto e confirme consentimento contínuo. Se não for possível trabalhar dentro desses limites, combinem outro plano.");

function exportProfile(p,a){
 const d=p.created,pad=n=>String(n).padStart(2,'0');
 const header=`PERFIL-MBLEX v1\nDATA: ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}\nPERFIL: ${p.dominant} | SECUNDÁRIO: ${p.secondary}\nEIXOS: ${Object.keys(AXES).map(k=>`${k} (${p.axes[k]}/4)`).join(' ')}\nRESPOSTAS: ${a.map((x,i)=>`${i+1}${letters[x]}`).join(' ')}\nCONFIG: timer=${p.config.timer} imagem=${p.config.imagem} idioma=${p.config.idioma} bloco=${p.config.bloco}\nNOTA: ${p.note}`;
 const detailed=a.map((choice,i)=>`${i+1} | ${ITEMS[i][0]} | ${letters[choice]} | EN: ${PROFILE_EN[i][1][choice]} | PT: ${ITEMS[i][2][choice]}`).join('\n');
 const complete=`DOMINANTE: ${p.dominant} | SECUNDÁRIO: ${p.secondary} | NOTA: ${p.note}\n${Object.keys(AXES).map(k=>`${k} ${p.axes[k]}/4`).join(' ')}`;
 return `${header}\n\nRESPOSTAS DETALHADAS:\n${detailed}\n\nPERFIL COMPLETO:\n${complete}`;
}

concept('AVA',1,'rights','A new client reports shoulder pain for a week. What should happen FIRST?|Um novo cliente relata dor no ombro há uma semana. O que fazer PRIMEIRO?','observe force diagnose prescribe','Clarify history and goals before planning.|Esclareça histórico e objetivos antes de planejar.');
concept('AVA',1,'anatomy','A client says, “My neck pain is 6 out of 10 today.” Where does this belong in SOAP?|Cliente diz: “Minha dor cervical está 6 de 10 hoje.” Onde registrar no SOAP?','subjective objective assessment plan','A pain rating is the client’s report.|A nota de dor é um relato do cliente.');

concept('AVA',2,'anatomy','The note says “Reassess pain-free movement next visit.” Which SOAP section is this?|A nota diz “Reavaliar movimento sem dor na próxima visita”. Qual seção SOAP é essa?','plan objective subjective assessment','A future reassessment is part of the plan.|Uma reavaliação futura faz parte do plano.');

concept('AVA',1,'rights','During treatment, a client asks you to stop touching the shoulder. What should you do FIRST?|Durante o atendimento, cliente pede para parar de tocar o ombro. O que fazer PRIMEIRO?','stop proceed force diagnose','Consent can be withdrawn during treatment.|O consentimento pode ser retirado durante o atendimento.');
concept('AVA',3,'clots','After a long flight, a client has a newly swollen, warm calf. What is the BEST course before massage?|Após voo longo, cliente apresenta panturrilha recém-inchada e quente. Qual a MELHOR conduta antes da massagem?','refer force proceed prescribe','Possible clot symptoms require prompt medical assessment.|Sinais de possível trombose exigem avaliação médica rápida.');
concept('AVA',2,'rights','A returning client arrives limping after a fall today. What should happen FIRST?|Cliente habitual chega mancando após queda hoje. O que deve acontecer PRIMEIRO?','observe proceed force diagnose','A changed presentation requires updated assessment.|Uma alteração no quadro exige atualizar a avaliação.');
scenario('AVA',3,'rights','Which is the BEST way to compare change after a session?|Qual é a MELHOR forma de comparar mudança após a sessão?','Repeat the same relevant measure|Repetir a mesma medida relevante~Use a new unrelated test|Usar teste diferente e não relacionado|It cannot show comparable change.|Não mostra mudança comparável.~Ask only if it felt pleasant|Perguntar apenas se foi agradável|Pleasure alone is not the target measure.|Prazer isolado não é a medida-alvo.~Assume the treatment worked|Presumir que o atendimento funcionou|Assumption is not reassessment.|Suposição não é reavaliação.','Use comparable measures before and after.|Use medidas comparáveis antes e depois.');
scenario('AVA',2,'rights','A client wants easier neck movement for driving. Which goal is MOST useful?|Cliente quer mover o pescoço com mais facilidade ao dirigir. Qual meta é MAIS útil?','Improve comfortable rotation for driving|Melhorar rotação confortável ao dirigir~Cure all neck conditions|Curar todas as condições cervicais|A cure cannot be promised.|Não se pode prometer cura.~Complete the same routine always|Sempre completar a mesma rotina|Routine is not the client’s goal.|Rotina não é a meta do cliente.~Use the deepest pressure possible|Usar a maior pressão possível|Pressure is not a functional outcome.|Pressão não é resultado funcional.','Link the plan to the client’s functional goal.|Relacione o plano à meta funcional do cliente.');
concept('AVA',4,'rights','A form was signed yesterday, but today the client declines a technique. What controls today’s decision?|O formulário foi assinado ontem, mas hoje o cliente recusa uma técnica. O que orienta a decisão de hoje?','autonomy implied waiver certificate','A previous signature does not override current refusal.|Uma assinatura anterior não supera a recusa atual.');
scenario('AVA',3,'rights','Before changing to a new technique, which action is BEST?|Antes de mudar para uma nova técnica, qual ação é MELHOR?','Explain it and ask permission|Explicar e pedir permissão~Rely only on silence|Confiar apenas no silêncio|Silence does not establish informed agreement.|Silêncio não estabelece concordância esclarecida.~Skip discussion to save time|Pular explicação para ganhar tempo|Efficiency does not replace consent.|Agilidade não substitui consentimento.~Let a companion decide automatically|Deixar acompanhante decidir automaticamente|A capable client makes their own decision.|Cliente capaz toma sua própria decisão.','Discuss the change before applying it.|Converse sobre a mudança antes de aplicá-la.');
scenario('AVA',4,'abmp','A client has trouble understanding your intake questions. What is the BEST next step?|Cliente tem dificuldade para entender suas perguntas de avaliação. Qual o MELHOR próximo passo?','Clarify language and check understanding|Esclarecer linguagem e conferir compreensão~Guess from gestures alone|Adivinhar apenas pelos gestos|Guessing risks inaccurate history.|Adivinhar compromete o histórico.~Treat a signature as understanding|Tratar assinatura como compreensão|A signature alone does not prove understanding.|Assinatura isolada não prova compreensão.~Avoid all further questions|Evitar todas as outras perguntas|Missing history can affect safety.|Histórico incompleto pode afetar segurança.','Ask the client to explain key information back.|Peça ao cliente para explicar os pontos essenciais com suas palavras.');
scenario('AVA',3,'rights','A client reports worsening pain after your last session. What should you do FIRST?|Cliente relata piora da dor após a última sessão. O que fazer PRIMEIRO?','Reassess symptoms and modify the plan|Reavaliar sintomas e modificar o plano~Repeat the exact treatment|Repetir exatamente o atendimento|It ignores the reported response.|Ignora a resposta relatada.~Call it necessary detoxification|Chamar de desintoxicação necessária|That explanation is unsupported.|Essa explicação não é sustentada.~Increase pressure without discussion|Aumentar pressão sem conversar|It ignores tolerance and consent.|Ignora tolerância e consentimento.','Reassess rather than assuming soreness is beneficial.|Reavalie em vez de presumir que dor posterior é benéfica.');
scenario('AVA',4,'abmp','A referral requests a technique you have never learned. What is the BEST response?|Um encaminhamento solicita técnica que você nunca aprendeu. Qual a MELHOR resposta?','Explain your limit and refer appropriately|Explicar seu limite e encaminhar adequadamente~Perform it because it was prescribed|Fazer porque foi prescrita|A referral does not create competence.|Encaminhamento não cria competência.~Learn it during the paid session|Aprender durante a sessão paga|The client is not a training substitute.|Cliente não substitui treinamento.~Ask the client to waive all risks|Pedir isenção de todos os riscos|A waiver does not create competence.|Um termo não cria competência.','Stay within both legal scope and actual competence.|Respeite tanto o escopo legal quanto a competência real.');
// Ética: 15 originais; uma repetição deliberada completa 16.
concept('ETI',1,'ethics','Which term describes activities bounded by education, competence and applicable law?|Qual termo descreve atividades delimitadas por formação, competência e lei aplicável?','scope certificate boundaries consent','Scope concerns permitted work; a certificate records education.|Escopo trata do trabalho permitido; certificado registra formação.');
concept('ETI',1,'rights','A client chooses a technique after hearing its risks and alternatives. This is an example of what?|Cliente escolhe uma técnica após ouvir riscos e alternativas. Isso exemplifica o quê?','consent implied waiver privacy','The decision follows an informed discussion.|A decisão vem após uma conversa esclarecida.');
scenario('ETI',1,'rights','Appropriate draping protects which client interest?|A cobertura adequada com lençóis protege qual interesse do cliente?','Privacy and dignity|Privacidade e dignidade~Therapist convenience only|Apenas conveniência do terapeuta|The client’s rights are central.|Os direitos do cliente são centrais.~Guaranteed pain relief|Alívio garantido da dor|Draping cannot guarantee an outcome.|Cobertura não garante resultado.~Ownership of records|Propriedade dos prontuários|Draping concerns bodily privacy.|Cobertura diz respeito à privacidade corporal.','Expose only the agreed treatment area with appropriate covering.|Exponha apenas a área combinada, com cobertura apropriada.');
concept('ETI',2,'transfer','A client relates to the therapist as if the therapist were a critical parent. Which term BEST fits?|Cliente se relaciona com terapeuta como se fosse um pai crítico. Qual termo MELHOR se aplica?','transfer counter power dual','The projection runs from client to practitioner.|A projeção parte do cliente para o profissional.');
concept('ETI',2,'transfer','A therapist’s unresolved feelings about a relative shape treatment of a similar-looking client. This is what?|Sentimentos não resolvidos sobre um parente influenciam o atendimento de cliente parecido. Isso é o quê?','counter transfer consent privacy','The practitioner’s personal history is influencing care.|A história pessoal do profissional está influenciando o atendimento.');
concept('ETI',3,'abmp','A therapist recognizes that professional knowledge can strongly influence a vulnerable client. Which concept is involved?|Terapeuta reconhece que seu conhecimento pode influenciar muito um cliente vulnerável. Qual conceito está envolvido?','power dual transfer counter','Professional roles can carry unequal influence.|Papéis profissionais podem trazer influência desigual.');
concept('ETI',2,'abmp','A client repeatedly asks for favors outside agreed session times. Which issue should be clarified FIRST?|Cliente pede repetidamente favores fora dos horários combinados. Qual questão esclarecer PRIMEIRO?','boundaries certificate implied counter','Clarify professional limits directly and respectfully.|Esclareça limites profissionais de forma direta e respeitosa.');
concept('ETI',3,'abmp','You trade massage for a client’s business services and also become their customer. What additional relationship arises?|Você troca massagem pelos serviços comerciais de um cliente e também vira cliente dele. Qual relação adicional surge?','dual transfer counter implied','Bartering may add a second role to the therapeutic relationship.|A permuta pode acrescentar um segundo papel à relação terapêutica.');
scenario('ETI',4,'ethics','A potential buyer of your practice asks for named client histories. What is the BEST response?|Possível comprador da sua prática pede históricos identificados dos clientes. Qual a MELHOR resposta?','Protect records and verify lawful disclosure|Proteger registros e verificar divulgação legal~Send everything to prove honesty|Enviar tudo para demonstrar honestidade|Honesty does not cancel confidentiality.|Honestidade não cancela confidencialidade.~Publish records without names removed|Publicar registros identificados|Public disclosure exposes private information.|Divulgação pública expõe informações privadas.~Assume a sale gives consent|Presumir que a venda dá consentimento|A sale is not client authorization.|Venda não é autorização do cliente.','A business transaction does not erase confidentiality obligations.|Uma transação comercial não elimina deveres de confidencialidade.');
scenario('ETI',3,'rights','A client becomes distressed during touch. What should you do FIRST?|Cliente fica angustiado durante o toque. O que fazer PRIMEIRO?','Stop, check safety and ask preferences|Parar, verificar segurança e perguntar preferências~Diagnose transference immediately|Diagnosticar transferência imediatamente|Distress alone does not establish this label.|Angústia isolada não estabelece esse rótulo.~Continue to release the emotion|Continuar para liberar a emoção|Continuing ignores current consent.|Continuar ignora o consentimento atual.~Ask for details of past abuse|Pedir detalhes de abuso passado|Investigating trauma exceeds this role.|Investigar trauma excede esse papel.','Respond to current safety and choice, without psychoanalyzing.|Responda à segurança e escolha atuais, sem psicanalisar.');
scenario('ETI',2,'abmp','Which behavior is incompatible with professional sexual boundaries?|Qual conduta é incompatível com limites sexuais profissionais?','Sexual contact with a client|Contato sexual com cliente~Obtaining consent for a technique|Obter consentimento para técnica|This supports appropriate care.|Isso apoia atendimento adequado.~Maintaining appropriate draping|Manter cobertura apropriada|This protects privacy.|Isso protege a privacidade.~Explaining pressure options|Explicar opções de pressão|This supports client choice.|Isso favorece a escolha do cliente.','Sexual contact violates the therapeutic relationship.|Contato sexual viola a relação terapêutica.');
concept('ETI',2,'ethics','A practitioner seeks training and accurately represents qualifications. Which framework guides this conduct?|Profissional busca capacitação e apresenta suas qualificações honestamente. Qual estrutura orienta essa conduta?','ethics waiver implied transfer','Professional ethics includes honesty and competence.|Ética profissional inclui honestidade e competência.');
scenario('ETI',4,'rights','All support informed consent EXCEPT which action?|Todas apoiam consentimento informado, EXCETO qual ação?','Treating a signature as permanent permission|Tratar assinatura como permissão permanente~Explaining relevant risks|Explicar riscos relevantes|Risk discussion supports informed choice.|Discutir riscos favorece escolha esclarecida.~Allowing questions|Permitir perguntas|Questions help establish understanding.|Perguntas ajudam a estabelecer compreensão.~Respecting refusal|Respeitar a recusa|Refusal is part of autonomy.|Recusa faz parte da autonomia.','Consent remains an ongoing process.|Consentimento continua sendo um processo contínuo.');
scenario('ETI',3,'ethics','A friend asks whether a named person is your client. What is the BEST response?|Amigo pergunta se determinada pessoa é sua cliente. Qual a MELHOR resposta?','Do not confirm private client information|Não confirmar informações privadas de clientes~Confirm but omit the diagnosis|Confirmar, omitindo diagnóstico|The professional relationship is private too.|A relação profissional também é privada.~Share only if the friend is trusted|Compartilhar se o amigo for confiável|Trust does not provide authorization.|Confiança não fornece autorização.~Exchange details for a referral|Trocar detalhes por indicação|Referrals do not justify disclosure.|Indicações não justificam divulgação.','Protect information about the professional relationship.|Proteja informações sobre a relação profissional.');
scenario('ETI',4,'abmp','A client offers an expensive gift and requests special access. What is the BEST response?|Cliente oferece presente caro e pede acesso especial. Qual a MELHOR resposta?','Discuss boundaries and decline the condition|Discutir limites e recusar a condição~Accept and promise priority forever|Aceitar e prometer prioridade permanente|It creates an inappropriate obligation.|Cria obrigação inadequada.~Assume the gift proves consent|Presumir que presente prova consentimento|Gifts do not establish consent.|Presentes não estabelecem consentimento.~Diagnose a psychological disorder|Diagnosticar transtorno psicológico|That diagnosis exceeds massage scope.|Esse diagnóstico excede o escopo da massagem.','Do not exchange professional boundaries for gifts.|Não troque limites profissionais por presentes.');
// Efeitos e técnicas: 15.
concept('EFE',1,'massage','A therapist uses long, smooth gliding strokes. Which technique is described?|Terapeuta usa movimentos longos, suaves e deslizantes. Qual técnica foi descrita?','effleurage petrissage tapotement vibration','Gliding strokes describe effleurage.|Movimentos deslizantes descrevem effleurage.');
concept('EFE',1,'massage','The therapist lifts and kneads soft tissue. Which technique is described?|Terapeuta eleva e amassa tecido mole. Qual técnica foi descrita?','petrissage effleurage tapotement friction','Kneading and lifting characterize petrissage.|Amassar e elevar caracterizam petrissage.');
concept('EFE',1,'massage','Rhythmic tapping is applied to soft tissue. Which term names the technique?|Batidas rítmicas são aplicadas ao tecido mole. Qual termo nomeia a técnica?','tapotement compression effleurage vibration','Percussive contact is tapotement.|Contato percussivo é tapotement.');
concept('EFE',2,'massage','Small oscillations are transmitted through the therapist’s hand. Which technique is described?|Pequenas oscilações são transmitidas pela mão do terapeuta. Qual técnica foi descrita?','vibration petrissage compression friction','Vibration uses oscillating movement.|Vibração usa movimento oscilatório.');
concept('EFE',2,'massage','A therapist applies pressure into tissue without gliding. Which term describes this?|Terapeuta aplica pressão sobre o tecido sem deslizar. Qual termo descreve isso?','compression effleurage tapotement petrissage','Compression is pressure directed into tissue.|Compressão é pressão direcionada ao tecido.');
concept('EFE',2,'massage','Localized rubbing uses little glide over the skin. Which term describes this?|Movimento localizado usa pouco deslizamento sobre a pele. Qual termo descreve isso?','friction effleurage vibration tapotement','Friction is localized rather than a long glide.|Fricção é localizada, em vez de um longo deslizamento.');
scenario('EFE',2,'massage','Which claim about massage is MOST defensible?|Qual afirmação sobre massagem é MAIS defensável?','It may help some pain symptoms|Pode ajudar em alguns sintomas dolorosos~It always cures chronic pain|Sempre cura dor crônica|Evidence does not establish universal cures.|Evidência não estabelece cura universal.~It replaces all medical assessment|Substitui toda avaliação médica|Massage does not replace needed assessment.|Massagem não substitui avaliação necessária.~Its effects are identical for everyone|Seus efeitos são iguais para todos|Responses vary between people.|Respostas variam entre pessoas.','Benefits vary by condition and person.|Benefícios variam conforme a condição e a pessoa.');
scenario('EFE',3,'massage','A client feels better after one session. Which conclusion is BEST supported?|Cliente melhora após uma sessão. Qual conclusão é MAIS sustentada?','Symptoms improved after this session|Sintomas melhoraram após esta sessão~The underlying disease is cured|A doença de base foi curada|Symptom change does not prove cure.|Mudança de sintomas não prova cura.~Every future session will work|Toda sessão futura funcionará|One response cannot guarantee future effects.|Uma resposta não garante efeitos futuros.~The exact mechanism is proven|O mecanismo exato foi comprovado|A response alone cannot identify mechanism.|Uma resposta isolada não identifica mecanismo.','Record the response without overstating causation.|Registre a resposta sem exagerar conclusões causais.');
concept('EFE',2,'rights','A client tenses and says the pressure hurts. What should you do FIRST?|Cliente contrai o corpo e diz que a pressão dói. O que fazer PRIMEIRO?','stop force proceed diagnose','Check comfort and adjust or stop with the client.|Confira conforto e ajuste ou interrompa com o cliente.');
scenario('EFE',3,'massage','All are reasonable limits to discuss EXCEPT which claim?|Todas são limitações razoáveis a discutir, EXCETO qual afirmação?','Massage guarantees lasting relief|Massagem garante alívio duradouro~Results may be temporary|Resultados podem ser temporários|This appropriately limits expectations.|Isso limita expectativas adequadamente.~Response differs between clients|Resposta difere entre clientes|Individual variation matters.|Variação individual importa.~Additional assessment may be needed|Pode ser necessária avaliação adicional|Massage does not replace all assessment.|Massagem não substitui toda avaliação.','Do not promise a guaranteed outcome.|Não prometa um resultado garantido.');
scenario('EFE',3,'myofascial','Slow sustained manual pressure targets restrictions in fascia. Which approach BEST matches this description?|Pressão manual lenta e sustentada visa restrições na fáscia. Qual abordagem MELHOR corresponde à descrição?','Myofascial release|Liberação miofascial~Reiki|Reiki|This is not the described mechanical fascial technique.|Não é a técnica mecânica fascial descrita.~Tapotement|Percussão|This uses rhythmic percussion rather than sustained pressure.|Usa percussão rítmica, não pressão sustentada.~Effleurage|Deslizamento|This emphasizes gliding strokes.|Enfatiza movimentos deslizantes.','Myofascial release addresses fascial tissues with controlled manual techniques.|Liberação miofascial aborda tecidos fasciais com técnicas manuais controladas.');
scenario('EFE',4,'massage','A client asks whether deep pressure is always more effective. Which answer is BEST?|Cliente pergunta se pressão profunda é sempre mais eficaz. Qual resposta é MELHOR?','No; pressure should fit the individual|Não; a pressão deve se adequar à pessoa~Yes, bruising proves effectiveness|Sim, hematomas comprovam eficácia|Bruising is not proof of benefit.|Hematoma não comprova benefício.~Yes, all pain must be overcome|Sim, toda dor deve ser superada|Ignoring pain can cause harm.|Ignorar dor pode causar dano.~Only the therapist’s preference matters|Só importa a preferência do terapeuta|Client tolerance and consent matter.|Tolerância e consentimento do cliente importam.','More force does not guarantee more benefit.|Mais força não garante mais benefício.');
scenario('EFE',4,'massage','A person in cancer care asks for massage. Which statement is BEST?|Pessoa em tratamento de câncer solicita massagem. Qual afirmação é MELHOR?','Care may need specialized modifications|Atendimento pode exigir adaptações especializadas~Massage treats the cancer itself|Massagem trata o câncer em si|Supportive care is not cancer treatment.|Cuidado de apoio não é tratamento do câncer.~Every person with cancer is identical|Toda pessoa com câncer é igual|Treatment and risks vary.|Tratamento e riscos variam.~Medical treatment can be stopped|Tratamento médico pode ser interrompido|A massage therapist cannot direct this.|Massoterapeuta não pode orientar isso.','Coordinate appropriate supportive care within training.|Coordene cuidado de apoio adequado à sua formação.');
scenario('EFE',3,'massage','A client feels sore after forceful work. Which explanation should be avoided?|Cliente fica dolorido após trabalho intenso. Qual explicação deve ser evitada?','Soreness proves toxins are leaving|Dor comprova que toxinas estão saindo~The response needs reassessment|A resposta exige reavaliação|Reassessment is appropriate.|Reavaliar é apropriado.~Pressure may need reduction|A pressão pode precisar diminuir|Tolerance should guide modification.|Tolerância deve orientar adaptação.~Severe symptoms need medical evaluation|Sintomas graves precisam de avaliação médica|Escalating symptoms require appropriate assessment.|Sintomas agravados exigem avaliação adequada.','Do not label an adverse response as necessary detoxification.|Não chame uma resposta adversa de desintoxicação necessária.');
scenario('EFE',4,'pain','Pain decreased after an analgesic. What is the BEST inference before applying deeper pressure?|Dor diminuiu após analgésico. Qual a MELHOR conclusão antes de aplicar pressão profunda?','Reduced pain does not prove tissue recovery|Menos dor não comprova recuperação do tecido~Absence of pain proves healing|Ausência de dor comprova cicatrização|Analgesia can change symptoms without proving recovery.|Analgesia pode mudar sintomas sem comprovar recuperação.~The client should stop the medicine|Cliente deve suspender o medicamento|Medication changes belong to the prescriber.|Mudanças de medicação cabem ao prescritor.~Pressure can now be unlimited|Pressão agora pode ser ilimitada|Reduced pain does not establish unlimited tolerance.|Menos dor não estabelece tolerância ilimitada.','Reassess safety; analgesia is not proof of healing.|Reavalie segurança; analgesia não comprova cicatrização.');
// Prática profissional: 14 originais e uma repetição.
concept('PRO',1,'cdc','Visible lotion residue remains on a table. What process removes this soil before disinfection?|Há resíduo visível de loção na maca. Qual processo remove a sujeira antes da desinfecção?','clean disinfect sterilize fragrance','Remove soil before the appropriate disinfection step.|Remova sujeira antes da etapa adequada de desinfecção.');
concept('PRO',2,'cdc','Which process eliminates all forms of microbial life, including bacterial spores?|Qual processo elimina todas as formas de vida microbiana, incluindo esporos bacterianos?','sterilize disinfect clean fragrance','Sterilization includes resistant microbial forms.|Esterilização inclui formas microbianas resistentes.');
concept('PRO',2,'cdc','After cleaning a suitable nonporous surface, which process reduces pathogens using an appropriate product?|Após limpar superfície não porosa adequada, qual processo reduz patógenos com produto apropriado?','disinfect fragrance clean consent','Use a suitable disinfectant according to its label.|Use desinfetante adequado conforme o rótulo.');
scenario('PRO',3,'cdc','The disinfectant label requires a wet contact time. What is the BEST action?|O rótulo exige tempo de contato com a superfície molhada. Qual a MELHOR ação?','Follow the specified wet contact time|Cumprir o tempo de contato indicado~Wipe it dry immediately|Secar imediatamente|Early drying may defeat the required contact.|Secar cedo pode impedir o contato necessário.~Use scent to judge effectiveness|Julgar eficácia pelo cheiro|Odor does not establish disinfection.|Odor não comprova desinfecção.~Guess based on the last product|Adivinhar pelo produto anterior|Product instructions can differ.|Instruções dos produtos podem diferir.','The product’s directions determine correct use.|As instruções do produto determinam o uso correto.');
scenario('PRO',1,'abmp','A client asks about the price before treatment. What should you do?|Cliente pergunta o preço antes do atendimento. O que fazer?','Explain fees before starting|Explicar valores antes de começar~Discuss fees only afterward|Discutir valores apenas depois|It prevents an informed financial choice.|Impede escolha financeira esclarecida.~Avoid answering until payment|Evitar responder até o pagamento|It withholds relevant terms.|Omite condições relevantes.~Promise insurance always pays|Prometer que o seguro sempre paga|Coverage cannot be assumed.|Não se pode presumir cobertura.','Clarify costs and policies before the session.|Esclareça custos e políticas antes da sessão.');
scenario('PRO',2,'tax','You receive goods worth $100 for a massage. What gross barter income is generally included?|Você recebe bens de valor justo de US$ 100 por massagem. Que renda bruta de permuta geralmente entra na declaração?','100 dollars|100 dólares~0 dollars|0 dólares|No cash does not mean no income.|Ausência de dinheiro não significa ausência de renda.~50 dollars|50 dólares|Half the value has no stated basis.|Metade do valor não tem base no enunciado.~25 dollars|25 dólares|A quarter has no stated basis.|Um quarto não tem base no enunciado.','Generally include the fair market value received.|Geralmente inclua o valor justo de mercado recebido.');
scenario('PRO',3,'tax','What portion of the fair market value of taxable barter proceeds is generally included in gross income?|Que parcela do valor justo de permuta tributável geralmente integra a renda bruta?','100 percent|100 por cento~75 percent|75 por cento|No general 25 percent exclusion applies here.|Não há exclusão geral de 25% aqui.~50 percent|50 por cento|No general half-value exclusion applies here.|Não há exclusão geral da metade aqui.~25 percent|25 por cento|The remaining value is not automatically exempt.|O restante não é automaticamente isento.','Income inclusion is not a 100 percent tax rate.|Inclusão na renda não significa alíquota de imposto de 100%.');
scenario('PRO',3,'abmp','Before promising insurance reimbursement, what should the practitioner do FIRST?|Antes de prometer reembolso por seguro, o que o profissional deve fazer PRIMEIRO?','Verify the specific plan’s requirements|Verificar exigências do plano específico~Assume all plans cover massage|Presumir que todos cobrem massagem|Coverage varies by plan.|Cobertura varia conforme o plano.~Use another client’s approval|Usar autorização de outro cliente|Another approval does not establish eligibility.|Outra autorização não estabelece elegibilidade.~Guarantee payment after referral|Garantir pagamento após encaminhamento|Referral alone does not guarantee coverage.|Encaminhamento isolado não garante cobertura.','Confirm requirements without guaranteeing payment.|Confirme exigências sem garantir pagamento.');
scenario('PRO',2,'ethics','Which record is MOST appropriate after a session?|Qual registro é MAIS apropriado após uma sessão?','Relevant findings, care and response|Achados relevantes, atendimento e resposta~Personal insults about the client|Insultos pessoais sobre o cliente|Insults are not professional documentation.|Insultos não são documentação profissional.~Invented findings to justify billing|Achados inventados para justificar cobrança|Fabrication is dishonest.|Fabricação é desonesta.~Only a promotional testimonial|Apenas depoimento promocional|Promotion is not a clinical record.|Promoção não é registro clínico.','Document accurately and professionally.|Documente com precisão e profissionalismo.');
scenario('PRO',4,'ethics','You discover an error in a completed record. What is the BEST response?|Você descobre erro em registro concluído. Qual a MELHOR resposta?','Make a traceable dated correction|Fazer correção datada e rastreável~Secretly erase the original entry|Apagar o original secretamente|It conceals the record’s history.|Oculta o histórico do registro.~Backdate a replacement note|Retroagir a data da nova nota|It misrepresents when the entry was made.|Falseia quando o registro foi feito.~Leave a known safety error unexplained|Deixar erro de segurança sem explicação|It preserves misleading information.|Mantém informação enganosa.','Preserve an accurate record and correction history.|Preserve registro preciso e histórico da correção.');
scenario('PRO',3,'insurance','A client alleges negligent performance of massage caused injury. Which coverage addresses this professional claim?|Cliente alega lesão por execução negligente de massagem. Qual cobertura trata dessa alegação profissional?','Professional liability (malpractice)|Responsabilidade profissional (malpractice)~General premises liability|Responsabilidade geral do estabelecimento|Typically addresses premises risks such as falls.|Geralmente trata de riscos do local, como quedas.~Business property insurance|Seguro de patrimônio comercial|Covers insured property rather than negligent treatment.|Cobre patrimônio segurado, não atendimento negligente.~Disability income insurance|Seguro de renda por incapacidade|Concerns income when the insured cannot work.|Trata de renda quando o segurado não pode trabalhar.','Professional liability addresses covered treatment-related claims; policy terms apply.|Responsabilidade profissional trata de alegações cobertas sobre atendimento; valem os termos da apólice.');
scenario('PRO',3,'rights','A client repeatedly arrives late. What is the BEST practical response?|Cliente chega atrasado repetidamente. Qual a MELHOR resposta prática?','Discuss and apply the stated policy|Conversar e aplicar a política informada~Shame the client publicly|Constranger cliente em público|It violates dignity and privacy.|Viola dignidade e privacidade.~Change fees secretly after treatment|Mudar valores secretamente após atendimento|Terms should be communicated in advance.|Condições devem ser informadas previamente.~Diagnose a personality disorder|Diagnosticar transtorno de personalidade|It exceeds this professional role.|Excede esse papel profissional.','Clear policies support consistent boundaries.|Políticas claras apoiam limites consistentes.');
scenario('PRO',4,'ethics','A colleague asks for your account password to read client records. What is the BEST response?|Colega pede sua senha para ler prontuários. Qual a MELHOR resposta?','Use authorized individual access only|Usar apenas acesso individual autorizado~Share the password verbally|Compartilhar a senha verbalmente|Verbal sharing still exposes access.|Compartilhar verbalmente ainda expõe acesso.~Send the password with the records|Enviar senha junto dos registros|It compromises access controls.|Compromete controles de acesso.~Allow everyone to use one login|Permitir um login para todos|It undermines traceability.|Prejudica rastreabilidade.','Protect confidentiality and accountable access.|Proteja confidencialidade e acesso rastreável.');
scenario('PRO',4,'exam','A learner passed the MBLEx but has not received state licensure. What is the BEST interpretation?|Aluna passou no MBLEx, mas ainda não recebeu licença estadual. Qual a MELHOR interpretação?','Passing alone is not a practice license|Aprovação isolada não é licença profissional~Passing automatically grants every state license|Aprovação concede toda licença estadual|State requirements still apply.|Exigências estaduais ainda se aplicam.~A score report replaces all state requirements|Resultado substitui todas as exigências estaduais|An exam result is not full licensure.|Resultado de exame não é licenciamento completo.~Licensure is unnecessary after passing|Licença é desnecessária após aprovação|Regulated practice still requires authorization.|Prática regulamentada ainda exige autorização.','Follow the relevant state licensing process.|Siga o processo de licenciamento do estado pertinente.');
// Patologia e precauções: 14.
concept('PAT',1,'clots','A client develops sudden shortness of breath and chest pain during a visit. Which action is BEST?|Cliente apresenta falta de ar súbita e dor no peito durante a visita. Qual ação é MELHOR?','stop proceed force prescribe','Stop and activate emergency medical assistance immediately.|Interrompa e acione assistência médica de emergência imediatamente.');
scenario('PAT',2,'drugs','A client uses an anticoagulant. Which concern is MOST relevant to forceful massage?|Cliente usa anticoagulante. Qual preocupação é MAIS relevante para massagem intensa?','Increased bleeding or bruising risk|Maior risco de sangramento ou hematomas~Complete protection from bruising|Proteção completa contra hematomas|Anticoagulants do not provide this protection.|Anticoagulantes não fornecem essa proteção.~A need to stop the medication|Necessidade de suspender o medicamento|Medication changes belong to the prescriber.|Mudanças na medicação cabem ao prescritor.~Guaranteed pain relief|Alívio garantido da dor|Anticoagulants do not guarantee analgesia.|Anticoagulantes não garantem analgesia.','Adapt pressure and clarify precautions; do not alter medication.|Adapte pressão e esclareça precauções; não altere a medicação.');
scenario('PAT',1,'pregnancy','A client in late pregnancy needs a comfortable massage position. Which is generally appropriate?|Cliente no fim da gestação precisa de posição confortável para massagem. Qual geralmente é apropriada?','Supported side-lying|Decúbito lateral com apoio~Prolonged flat supine position|Deitada de costas por tempo prolongado|Later pregnancy can make this unsuitable.|No fim da gestação, pode ser inadequado.~Prone without abdominal accommodation|De bruços sem acomodar o abdome|This does not accommodate the pregnancy.|Isso não acomoda a gestação.~Any position despite dizziness|Qualquer posição apesar de tontura|Symptoms require an immediate adjustment.|Sintomas exigem ajuste imediato.','Use comfortable supported positioning and monitor symptoms.|Use posição confortável com apoio e monitore sintomas.');
concept('PAT',2,'massage','A client arrives with fever and feels acutely ill. What is the BEST course?|Cliente chega com febre e mal-estar agudo. Qual a MELHOR conduta?','refer proceed force prescribe','Postpone massage and direct appropriate medical assessment.|Adie a massagem e oriente avaliação médica adequada.');
scenario('PAT',2,'massage','A fresh bruise is present on the intended treatment area. What is the BEST approach?|Há hematoma recente na área pretendida. Qual a MELHOR abordagem?','Avoid direct force and assess context|Evitar força direta e avaliar contexto~Apply intense friction over it|Aplicar fricção intensa sobre ele|Force can aggravate injured tissue.|Força pode agravar tecido lesionado.~Assume every bruise is harmless|Presumir que todo hematoma é inofensivo|Cause and severity matter.|Causa e gravidade importam.~Promise to dissolve it immediately|Prometer dissolvê-lo imediatamente|Immediate resolution cannot be promised.|Não se pode prometer resolução imediata.','A local finding needs local precautions and contextual assessment.|Achado local exige precauções locais e avaliação contextual.');
scenario('PAT',3,'massage','A client has fragile bones from osteoporosis. Which adjustment is MOST appropriate?|Cliente tem fragilidade óssea por osteoporose. Qual ajuste é MAIS apropriado?','Avoid forceful pressure and adapt support|Evitar pressão intensa e adaptar apoio~Use strong percussion on bony areas|Usar percussão forte sobre ossos|Fragility increases injury concerns.|Fragilidade aumenta preocupação com lesão.~Force joints to end range|Forçar articulações até o limite|Forceful movement may cause harm.|Movimento forçado pode causar dano.~Ignore the history if painless|Ignorar histórico se não houver dor|No pain does not remove fragility.|Ausência de dor não elimina fragilidade.','Match force and positioning to tissue vulnerability.|Ajuste força e posicionamento à vulnerabilidade dos tecidos.');
scenario('PAT',3,'massage','A client has reduced sensation in the feet. Which practice is BEST?|Cliente tem sensibilidade reduzida nos pés. Qual prática é MELHOR?','Use extra caution with heat and pressure|Ter cuidado adicional com calor e pressão~Rely only on pain to limit force|Usar apenas dor para limitar força|Reduced sensation weakens this feedback.|Sensibilidade reduzida limita esse retorno.~Use maximum heat for circulation|Usar calor máximo para circulação|Reduced sensation increases burn concerns.|Sensibilidade reduzida aumenta risco de queimadura.~Assume numbness means no injury risk|Presumir que dormência elimina risco|Injury can occur without normal warning.|Lesão pode ocorrer sem alerta normal.','Reduced sensation can conceal excessive stimulus.|Sensibilidade reduzida pode ocultar estímulo excessivo.');
concept('PAT',4,'clots','New one-sided calf swelling follows surgery. The client wants only light massage. What is the BEST course?|Surge inchaço unilateral na panturrilha após cirurgia. Cliente quer só massagem leve. Qual a MELHOR conduta?','refer proceed compression prescribe','Light pressure does not resolve the need to assess a possible clot.|Pressão leve não elimina a necessidade de avaliar possível trombose.');
scenario('PAT',3,'rights','A client reports sharp pain during a stretch. What should happen FIRST?|Cliente relata dor aguda durante alongamento. O que fazer PRIMEIRO?','Stop the provoking movement and reassess|Parar movimento provocador e reavaliar~Hold longer to force adaptation|Manter mais tempo para forçar adaptação|Sharp pain is not a signal to force.|Dor aguda não é sinal para forçar.~Tell the client to ignore it|Dizer para ignorar|It dismisses a safety signal.|Desconsidera sinal de segurança.~Diagnose a tear immediately|Diagnosticar ruptura imediatamente|The symptom alone is not a diagnosis.|O sintoma isolado não é diagnóstico.','Respect symptoms and reassess within scope.|Respeite sintomas e reavalie dentro do escopo.');
scenario('PAT',2,'massage','A client has an open skin wound where massage was planned. Which action is BEST?|Cliente tem ferida aberta onde a massagem foi planejada. Qual ação é MELHOR?','Avoid direct contact and assess safety|Evitar contato direto e avaliar segurança~Rub lotion into the wound|Esfregar loção na ferida|Massage lotion is not wound treatment.|Loção de massagem não trata feridas.~Use friction to close the wound|Usar fricção para fechar a ferida|Friction can damage exposed tissue.|Fricção pode danificar tecido exposto.~Cover it and ignore all concerns|Cobrir e ignorar preocupações|Covering alone does not establish safety.|Cobrir não estabelece segurança por si só.','Protect damaged skin and respect infection precautions.|Proteja pele lesionada e respeite precauções de infecção.');
scenario('PAT',4,'massage','A chronic condition is stable, but the client reports a new unexplained symptom. What is BEST?|Condição crônica está estável, mas cliente relata novo sintoma sem explicação. O que é MELHOR?','Reassess the new symptom before proceeding|Reavaliar novo sintoma antes de prosseguir~Assume chronic means safe|Presumir que crônico significa seguro|Duration alone does not establish safety.|Duração isolada não estabelece segurança.~Use last month’s plan unchanged|Usar plano do mês passado sem mudanças|The presentation has changed.|O quadro mudou.~Ignore symptoms unrelated to the goal|Ignorar sintomas fora da meta|New symptoms can alter safety.|Novos sintomas podem alterar segurança.','Chronic does not automatically mean safe to treat.|Crônico não significa automaticamente seguro para atender.');
scenario('PAT',3,'pressure','A client taking blood pressure medicine feels dizzy while rising from the table. What should you do FIRST?|Cliente em uso de anti-hipertensivo sente tontura ao levantar da maca. O que fazer PRIMEIRO?','Help them remain safely supported and assess|Ajudar a ficar apoiado com segurança e avaliar~Have them walk it off alone|Mandar caminhar sozinho para passar|This increases fall risk.|Isso aumenta risco de queda.~Offer a medication dose|Oferecer dose de medicamento|Prescribing is outside massage scope.|Prescrever excede o escopo da massagem.~Rush them out to the next appointment|Apressar saída para próximo atendimento|Scheduling does not override safety.|Agenda não supera segurança.','Prevent a fall; persistent or severe symptoms need medical attention.|Previna queda; sintomas persistentes ou graves exigem atenção médica.');
scenario('PAT',4,'steroid','A client using long-term prednisone has thin skin and easy bruising. Which response is BEST?|Cliente usa prednisona prolongadamente e tem pele fina e hematomas fáceis. Qual resposta é MELHOR?','Adapt pressure for tissue fragility|Adaptar pressão à fragilidade dos tecidos~Use deeper friction to strengthen skin|Usar fricção profunda para fortalecer pele|Force can damage fragile tissue.|Força pode lesionar tecido frágil.~Ask the client to stop prednisone|Pedir ao cliente para parar prednisona|Stopping requires prescriber guidance.|Suspensão exige orientação do prescritor.~Ignore bruising if pain is absent|Ignorar hematomas se não houver dor|Absence of pain does not remove fragility.|Ausência de dor não elimina fragilidade.','Corticosteroid effects can require gentler handling and medical coordination.|Efeitos de corticoides podem exigir manejo mais suave e coordenação médica.');
scenario('PAT',4,'clots','Which finding requires the MOST urgent escalation?|Qual achado exige encaminhamento MAIS urgente?','Sudden breathing difficulty with chest pain|Falta de ar súbita com dor no peito~Stable familiar stiffness|Rigidez habitual estável|This is not the same emergency pattern.|Não é o mesmo padrão de emergência.~A preference for lighter pressure|Preferência por pressão mais leve|A preference requires adjustment, not emergency care.|Preferência exige ajuste, não emergência.~An old healed scar|Cicatriz antiga cicatrizada|The description lacks acute danger signs.|A descrição não apresenta sinais agudos de perigo.','Possible pulmonary embolism is an emergency.|Possível embolia pulmonar é uma emergência.');

concept('CIN',1,'motion','A client bends the elbow to bring a cup toward the mouth. Which movement occurs at the elbow?|Cliente dobra o cotovelo para levar copo à boca. Qual movimento ocorre no cotovelo?','flexion extension abduction adduction','The elbow angle decreases in flexion.|O ângulo do cotovelo diminui na flexão.');
concept('CIN',1,'motion','A client straightens a bent knee. Which movement occurs?|Cliente estica o joelho dobrado. Qual movimento ocorre?','extension flexion pronation supination','Straightening the knee increases its angle.|Esticar o joelho aumenta seu ângulo.');
concept('CIN',2,'motion','A client raises the arm sideways away from the trunk. Which movement is this?|Cliente eleva braço lateralmente, afastando-o do tronco. Qual movimento é esse?','abduction adduction flexion pronation','Away from the midline is abduction.|Afastar da linha média é abdução.');
concept('CIN',2,'motion','The raised arm returns toward the side of the trunk. Which movement is this?|O braço elevado retorna em direção à lateral do tronco. Qual movimento é esse?','adduction abduction supination dorsiflexion','Toward the midline is adduction.|Aproximar da linha média é adução.');
concept('CIN',2,'motion','With the elbow bent, a client rotates the forearm to hold soup in the palm. Which movement is this?|Com cotovelo dobrado, cliente gira antebraço para segurar sopa na palma. Qual movimento é esse?','supination pronation extension plantar','The palm faces upward in this supinated position.|A palma fica para cima nessa posição supinada.');
concept('CIN',3,'motion','With the elbow bent, the forearm turns the palm from upward to downward. Which movement occurs?|Com cotovelo dobrado, antebraço gira palma de cima para baixo. Qual movimento ocorre?','pronation supination abduction adduction','Pronation turns the palm downward in this position.|Pronação vira a palma para baixo nessa posição.');
concept('CIN',2,'motion','A client lifts the front of the foot toward the shin while the heel stays down. Which movement occurs?|Cliente eleva frente do pé em direção à perna, mantendo calcanhar apoiado. Qual movimento ocorre?','dorsiflexion plantar pronation extension','The foot approaches the shin in dorsiflexion.|O pé se aproxima da perna na dorsiflexão.');
concept('CIN',3,'motion','A client points the foot downward as if pressing a pedal. Which ankle movement occurs?|Cliente aponta pé para baixo como ao pisar em pedal. Qual movimento do tornozelo ocorre?','plantar dorsiflexion supination flexion','Pointing the foot downward is plantar flexion.|Apontar o pé para baixo é flexão plantar.');
concept('CIN',3,'muscle','The elbow flexors shorten while lifting a weight. Which contraction occurs?|Flexores do cotovelo encurtam ao elevar um peso. Qual contração ocorre?','concentric eccentric isometric passive','Active shortening under load is concentric.|Encurtamento ativo sob carga é concêntrico.');
concept('CIN',4,'muscle','The elbow flexors control slow lowering of a weight while lengthening. Which contraction occurs?|Flexores do cotovelo controlam a descida lenta de peso enquanto alongam. Qual contração ocorre?','eccentric concentric isometric passive','Active lengthening under load is eccentric.|Alongamento ativo sob carga é excêntrico.');
concept('CIN',3,'muscle','A client holds a weight still with the elbow fixed. Which contraction BEST describes the hold?|Cliente segura peso parado com cotovelo fixo. Qual contração MELHOR descreve a sustentação?','isometric concentric eccentric passive','Force is maintained without appreciable length change.|Força é mantida sem mudança apreciável de comprimento.');
concept('CIN',4,'muscle','During elbow flexion, the triceps can oppose the action. Which functional role is this?|Na flexão do cotovelo, tríceps pode se opor à ação. Qual papel funcional é esse?','antagonist agonist synergist tendon','An opposing action defines the antagonist role.|Uma ação oposta define o papel antagonista.');

concept('ANA',1,'muscle','You follow the cordlike attachment transmitting calf muscle force to the heel. What tissue is this?|Você acompanha estrutura em cordão que transmite força da panturrilha ao calcanhar. Que tecido é esse?','tendon ligament cartilage fascia','A tendon transfers muscle force to bone.|Um tendão transmite força muscular ao osso.');
concept('ANA',1,'anatomy','An ankle sprain injured tissue connecting adjacent bones. Which tissue was injured?|Entorse de tornozelo lesionou tecido que conecta ossos adjacentes. Qual tecido foi lesionado?','ligament tendon cartilage fascia','Ligaments connect bones and support joints.|Ligamentos conectam ossos e sustentam articulações.');
concept('ANA',2,'anatomy','A joint surface needs a low-friction covering. Which tissue provides this covering?|Superfície articular precisa de revestimento de baixo atrito. Qual tecido fornece esse revestimento?','cartilage tendon ligament fascia','Articular cartilage covers opposing joint surfaces.|Cartilagem articular reveste superfícies articulares opostas.');
concept('ANA',2,'anatomy','A client asks which nerve travels through the carpal tunnel. Which is correct?|Cliente pergunta qual nervo atravessa túnel do carpo. Qual é o correto?','median ulnar radial sciatic','The median nerve passes through the carpal tunnel.|O nervo mediano atravessa o túnel do carpo.');
concept('ANA',3,'anatomy','You avoid strong pressure behind the medial epicondyle at the elbow. Which nerve is especially relevant?|Você evita pressão forte atrás do epicôndilo medial no cotovelo. Qual nervo é especialmente relevante?','ulnar median sciatic radial','The ulnar nerve passes behind the medial epicondyle.|O nervo ulnar passa atrás do epicôndilo medial.');
concept('ANA',2,'anatomy','When reviewing circulation, which vessel carries blood away from the heart?|Ao revisar circulação, qual vaso leva sangue para fora do coração?','artery vein lymph capillary','Arteries are defined by flow away from the heart.|Artérias são definidas pelo fluxo para fora do coração.');
concept('ANA',3,'anatomy','A diagram shows return of excess interstitial fluid toward the bloodstream. Which vessel system is involved?|Diagrama mostra retorno de excesso de líquido intersticial ao sangue. Qual sistema de vasos está envolvido?','lymph artery vein capillary','Lymphatic vessels collect and return interstitial fluid.|Vasos linfáticos coletam e devolvem líquido intersticial.');
concept('ANA',3,'anatomy','A client is discussing rest and digestion. Which autonomic division is MOST associated with these functions?|Cliente discute repouso e digestão. Qual divisão autonômica é MAIS associada a essas funções?','parasympathetic sympathetic somatic sensory','Parasympathetic activity supports rest and digestion.|Atividade parassimpática favorece repouso e digestão.');
concept('ANA',3,'anatomy','A sudden threat increases alertness and heart rate. Which autonomic division is MOST involved?|Uma ameaça súbita aumenta alerta e frequência cardíaca. Qual divisão autonômica está MAIS envolvida?','sympathetic parasympathetic somatic sensory','Sympathetic activity supports mobilization during threat.|Atividade simpática favorece mobilização diante de ameaça.');
concept('ANA',4,'anatomy','A client taking a diuretic asks which organs directly regulate urine production. Which answer is correct?|Cliente usa diurético e pergunta quais órgãos regulam diretamente produção de urina. Qual resposta está correta?','kidney liver lung pancreas','The kidneys regulate urine and fluid balance.|Os rins regulam urina e equilíbrio de líquidos.');
concept('ANA',4,'anatomy','A client asks why oxygen exchanges with tissues at tiny vessels, not large arteries. Which vessels perform this exchange?|Cliente pergunta em quais vasos pequenos ocorre troca de oxigênio com tecidos. Quais realizam essa troca?','capillary artery vein lymph','Thin capillary walls support exchange with tissues.|Paredes finas de capilares permitem troca com tecidos.');
