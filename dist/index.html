scenario("EFE",2,"thermal","Maya, 28, has a medically assessed ankle sprain from 24 hours ago, with swelling and local warmth. Sensation and circulation are normal. At intake, which thermal option is most appropriate, while deferring massage over the injury?|Maya, 28 anos, tem entorse de tornozelo avaliada por profissional de saúde há 24 horas, com edema e calor local. Sensibilidade e circulação são normais. Na avaliação inicial, qual opção térmica é mais adequada, adiando a massagem sobre a lesão?","Brief protected cooling with skin checks|Frio breve com proteção e checagem da pele~Intense heat directly over the swelling|Calor intenso diretamente sobre o edema|Heat may increase acute swelling.|O calor pode aumentar o edema agudo.~Deep friction immediately after heating|Fricção profunda logo após aquecer|An acute sprain is not an indication for deep friction.|Entorse aguda não indica fricção profunda.~Ice directly on skin until all sensation is lost|Gelo direto na pele até perder toda a sensibilidade|Unprotected or excessive cooling can injure skin.|Frio excessivo ou sem proteção pode lesar a pele.","Cooling can temporarily reduce local blood flow and pain and help control swelling. Protect and check the skin; it does not make acute tissue ready for massage.|O frio pode reduzir temporariamente o fluxo local e a dor e ajudar a controlar o edema. Proteja e confira a pele; isso não torna o tecido agudo pronto para massagem.");
scenario("EFE",2,"thermal","Luis, 46, reports stable neck stiffness for six months after desk work, without recent injury, redness or swelling. Sensation and circulation are normal. Which preparation best fits the agreed gentle session?|Luis, 46 anos, relata rigidez cervical estável há seis meses após trabalho sentado, sem lesão recente, vermelhidão ou edema. Sensibilidade e circulação são normais. Qual preparação combina melhor com a sessão suave acordada?","Comfortable moist warmth with skin monitoring|Calor úmido confortável com monitoramento da pele~A scalding pack to reach deeper tissue faster|Compressa escaldante para alcançar tecidos profundos mais rápido|Higher temperature raises burn risk.|Temperatura maior eleva o risco de queimadura.~Prolonged ice until the neck is numb|Gelo prolongado até anestesiar o pescoço|Numbness is not a safe target for preparing movement.|Anestesia não é uma meta segura para preparar movimento.~Forceful stretching before checking tolerance|Alongamento forçado antes de verificar tolerância|Preparation does not justify forcing range.|Preparação não justifica forçar amplitude.","Gentle warmth promotes superficial vasodilation and can ease stiffness before comfortable movement. Screen first and monitor skin rather than treating hotter as better.|Calor suave promove vasodilatação superficial e pode aliviar rigidez antes de movimento confortável. Avalie antes e monitore a pele, sem confundir mais quente com melhor.");
scenario("EFE",3,"thermal","Rosa, 62, arrives for hand massage after three months of recurrent finger coldness. Today her fingers are pale and cold, and she reports impaired circulation. What should the practitioner do about a planned cold application?|Rosa, 62 anos, chega para massagem nas mãos após três meses de episódios de dedos frios. Hoje estão pálidos e frios, e ela relata circulação comprometida. O que fazer com a aplicação de frio planejada?","Withhold cold and seek appropriate clinical guidance|Não aplicar frio e buscar orientação clínica adequada~Use a shorter cold application without further assessment|Aplicar frio por menos tempo sem nova avaliação|Shortening exposure does not resolve impaired circulation.|Encurtar a exposição não resolve a circulação comprometida.~Keep ice on until the fingers turn blue|Manter gelo até os dedos ficarem azulados|Color deterioration is a warning, not a treatment goal.|Piora da cor é alerta, não objetivo terapêutico.~Alternate extreme heat and cold to restore circulation|Alternar calor e frio extremos para restaurar a circulação|Extreme temperatures are unsafe in compromised tissue.|Temperaturas extremas são inseguras no tecido comprometido.","Cold can further reduce local perfusion. Abnormal circulation requires assessment; merely reducing cold exposure is not an adequate safeguard here.|O frio pode reduzir ainda mais a perfusão local. Circulação anormal exige avaliação; apenas diminuir o tempo de frio não é proteção suficiente neste caso.");
scenario("CIN",2,"proprioception","Noah, 31, has mild hamstring tightness for two weeks without injury. During an agreed gentle stretch, a student suddenly speeds up the movement and the muscle resists. Which receptor signal supports returning to a slow, comfortable stretch?|Noah, 31 anos, tem leve tensão posterior de coxa há duas semanas, sem lesão. Durante alongamento suave acordado, um aluno acelera o movimento e o músculo resiste. Qual sinal receptor fundamenta voltar ao alongamento lento e confortável?","Muscle spindles signal muscle length and rate of length change|Fusos musculares sinalizam comprimento e velocidade de mudança do comprimento~Golgi tendon organs primarily measure skin temperature|Órgãos tendinosos de Golgi medem principalmente temperatura da pele|Golgi tendon organs sense tension, not skin temperature.|Órgãos de Golgi detectam tensão, não temperatura da pele.~Joint cartilage detects blood oxygen saturation|Cartilagem articular detecta saturação de oxigênio|Cartilage is not an oxygen-saturation receptor.|Cartilagem não é receptor de saturação de oxigênio.~Pain receptors prove that faster stretching is safer|Receptores de dor comprovam que alongar mais rápido é seguro|Pain is not evidence that speed is safe.|Dor não comprova segurança da velocidade.","Muscle spindles respond to muscle length and stretch rate and contribute to the stretch reflex. Use controlled movement rather than attempting to overpower resistance.|Fusos respondem ao comprimento muscular e à velocidade do alongamento e participam do reflexo de estiramento. Use movimento controlado em vez de vencer a resistência à força.");
scenario("CIN",3,"proprioception","Amira, 39, has calf tightness for four weeks and is cleared for comfortable movement. During a low-effort contract-relax exercise, she asks to use maximal force. Which explanation best supports keeping the effort controlled?|Amira, 39 anos, tem tensão na panturrilha há quatro semanas e está liberada para movimento confortável. Em exercício de contrair e relaxar com pouco esforço, pede força máxima. Qual explicação melhor fundamenta manter o esforço controlado?","Golgi tendon organs monitor tension and contribute to force regulation; maximal force is unnecessary|Órgãos tendinosos de Golgi monitoram tensão e participam da regulação da força; força máxima é desnecessária~Tendon receptors detect only the speed of muscle lengthening|Receptores tendinosos detectam apenas velocidade de alongamento muscular|Length and stretch-rate signals chiefly describe muscle spindles.|Comprimento e velocidade de alongamento descrevem sobretudo os fusos.~A protective reflex guarantees that a tendon cannot be injured|Um reflexo protetor garante que o tendão não pode sofrer lesão|Reflexes do not guarantee protection from tissue injury.|Reflexos não garantem proteção contra lesão.~Maximal pain is needed to switch off every motor neuron|Dor máxima é necessária para desligar todos os neurônios motores|Pain is not a necessary or safe exercise target.|Dor não é objetivo necessário nem seguro do exercício.","Golgi tendon organs sense muscle-tendon tension. Their spinal feedback can inhibit the same muscle in the classic autogenic-inhibition model, but depends on the task and never guarantees injury prevention.|Órgãos de Golgi detectam tensão musculotendínea. No modelo clássico de inibição autogênica, o retorno medular pode inibir o mesmo músculo, mas depende da tarefa e nunca garante prevenção de lesão.");
scenario("CIN",2,"joints","Ethan, 45, has mild elbow stiffness for six weeks after immobilization and has clearance for gentle range of motion. For the humeroulnar articulation, which movement should the practitioner choose?|Ethan, 45 anos, tem leve rigidez do cotovelo há seis semanas após imobilização e liberação para mobilidade suave. Na articulação umeroulnar, qual movimento escolher?","Comfortable flexion and extension at a hinge joint|Flexão e extensão confortáveis em uma articulação em dobradiça~Forced circumduction as at a ball-and-socket joint|Circundução forçada como numa articulação esferoide|The humeroulnar joint is not a ball-and-socket joint.|A umeroulnar não é uma articulação esferoide.~Lateral bending beyond the joint limits|Inclinação lateral além dos limites articulares|This would stress structures outside the intended motion.|Isso sobrecarregaria estruturas fora do movimento previsto.~Forearm rotation attributed only to the humeroulnar hinge|Rotação do antebraço atribuída apenas à dobradiça umeroulnar|Pronation and supination involve the radioulnar joints.|Pronação e supinação envolvem as radioulnares.","The humeroulnar joint is a hinge permitting flexion and extension. Respect clearance, pain and available range; do not confuse it with nearby pivot joints.|A umeroulnar é uma dobradiça que permite flexão e extensão. Respeite liberação, dor e amplitude disponível; não a confunda com articulações trocoides próximas.");
scenario("CIN",3,"joints","Sofia, 54, has thumb-base discomfort for three months when opening jars. After assessment and clearance for gentle movement, which description best guides work at the first carpometacarpal joint?|Sofia, 54 anos, tem desconforto na base do polegar há três meses ao abrir potes. Após avaliação e liberação para movimento suave, qual descrição orienta melhor o trabalho na primeira carpometacarpal?","A saddle joint contributing to opposition; use comfortable motion without forceful end-range loading|Articulação em sela que participa da oposição; usar movimento confortável sem carga forçada no fim da amplitude~A hinge joint that permits only elbow-like bending|Articulação em dobradiça que permite apenas dobrar como o cotovelo|The first carpometacarpal joint has saddle geometry.|A primeira carpometacarpal tem geometria em sela.~A fused joint that should be forced until it moves|Articulação fundida que deve ser forçada até mover|This is a mobile synovial joint; forcing is inappropriate.|É uma articulação sinovial móvel; forçar é inadequado.~A pivot joint designed for unrestricted spinning|Articulação trocoide feita para rotação irrestrita|Saddle motion is not unrestricted axial spinning.|Movimento em sela não é giro axial irrestrito.","The first carpometacarpal joint is a saddle joint whose mobility contributes to thumb opposition. Symptoms and the plan guide force and range.|A primeira carpometacarpal é uma articulação em sela cuja mobilidade participa da oposição do polegar. Os sintomas e o plano orientam força e amplitude.");
scenario("PRO",2,"ppe","Daniel, 42, reports a draining skin lesion on his lower leg for two days at massage intake. If contact with drainage-contaminated linen is anticipated, what action and PPE are appropriate?|Daniel, 42 anos, relata uma lesão exsudativa na perna há dois dias na avaliação inicial da massagem. Se houver contato previsto com roupa contaminada por secreção, qual conduta e EPI são adequados?","Use gloves for anticipated fluid contact, perform hand hygiene, and defer work over the lesion|Usar luvas no contato previsto com fluidos, higienizar as mãos e adiar trabalho sobre a lesão~Massage the lesion because gloves make it safe|Massagear a lesão porque as luvas tornam isso seguro|Gloves do not remove a local contraindication.|Luvas não eliminam uma contraindicação local.~Handle drainage with bare hands and wash later|Manusear secreção sem luvas e lavar depois|Handwashing afterward does not replace the barrier when contact is anticipated.|Lavar depois não substitui a barreira no contato previsto.~Reuse gloves between clients if they look clean|Reutilizar luvas entre clientes se parecerem limpas|Used gloves can transfer contamination.|Luvas usadas podem transferir contaminação.","Standard precautions call for gloves when contact with body fluids or nonintact skin is anticipated. Gloves do not replace hand hygiene or authorize massage over a draining lesion.|Precauções padrão indicam luvas quando se prevê contato com fluidos ou pele não íntegra. Luvas não substituem higiene das mãos nem autorizam massagem sobre lesão exsudativa.");
scenario("PRO",2,"mechanics","Julia, a 35-year-old massage therapist, has lower-back fatigue at the end of workdays for two weeks. She bends over a low table and reaches across a client during back work. Which adjustment best addresses the observed mechanics?|Julia, massoterapeuta de 35 anos, sente fadiga lombar ao fim do expediente há duas semanas. Inclina-se sobre uma mesa baixa e alcança o outro lado do cliente durante o trabalho nas costas. Qual ajuste melhor aborda a mecânica observada?","Raise the table to a suitable working height and step closer to the area|Elevar a mesa a uma altura adequada e aproximar-se da área~Lower the table further and keep the feet fixed|Baixar ainda mais a mesa e manter os pés fixos|This increases the need to bend and reach.|Isso aumenta a necessidade de inclinar e alcançar.~Twist the trunk while keeping the hips still|Torcer o tronco mantendo o quadril imóvel|Sustained twisting adds mechanical stress.|Torção sustentada aumenta a sobrecarga mecânica.~Apply more force with the same posture|Aplicar mais força com a mesma postura|More force does not correct the awkward position.|Mais força não corrige a postura inadequada.","An appropriate table height reduces sustained trunk flexion; moving closer reduces reaching. Persistent pain warrants assessment rather than simply working through it.|Altura adequada da mesa reduz flexão sustentada do tronco; aproximar-se reduz o alcance. Dor persistente exige avaliação, em vez de simplesmente continuar trabalhando.");
scenario("ANA",2,"repair","Theo, 26, bruised his forearm 12 hours ago. At intake the area is warm, swollen and tender, and he asks for deep local massage. Which process and decision fit this early response?|Theo, 26 anos, sofreu contusão no antebraço há 12 horas. Na avaliação, a região está quente, inchada e sensível, e ele pede massagem profunda local. Qual processo e decisão combinam com essa resposta inicial?","Vasodilation and increased vascular permeability; defer deep work over the injury|Vasodilatação e maior permeabilidade vascular; adiar trabalho profundo sobre a lesão~Completed collagen remodeling; use maximum pressure|Remodelamento do colágeno concluído; usar pressão máxima|An acute injury has not completed remodeling.|Uma lesão aguda não completou o remodelamento.~No inflammatory activity; ignore warmth and swelling|Ausência de inflamação; ignorar calor e edema|Warmth and swelling are compatible with inflammation.|Calor e edema são compatíveis com inflamação.~Immediate full tissue strength; force the painful range|Resistência tecidual total imediata; forçar a amplitude dolorosa|Early tissue injury does not imply full strength.|Lesão inicial não implica resistência total.","Early inflammation includes vasodilation and fluid movement into tissue as vascular permeability rises. Do not interpret these signs as an invitation to deep local work; assess the need for referral.|A inflamação inicial inclui vasodilatação e passagem de líquido ao tecido com maior permeabilidade vascular. Esses sinais não indicam trabalho profundo local; avalie necessidade de encaminhamento.");
scenario("ANA",3,"remodeling","Grace, 48, has a fully closed surgical scar eight weeks after a forearm procedure. Her clinician has cleared gentle scar work with gradual loading. Which tissue change supports gradual rather than maximal progression?|Grace, 48 anos, tem cicatriz cirúrgica totalmente fechada oito semanas após procedimento no antebraço. Seu profissional de saúde liberou trabalho suave na cicatriz com carga gradual. Qual mudança tecidual fundamenta progressão gradual, e não máxima?","Collagen reorganizes and tissue strength develops during remodeling|O colágeno se reorganiza e a resistência se desenvolve no remodelamento~Closure means the scar immediately has normal tissue strength|Fechamento significa resistência normal imediata da cicatriz|Surface closure does not prove full mechanical strength.|Fechamento superficial não prova resistência mecânica completa.~Collagen disappears completely at eight weeks|O colágeno desaparece totalmente em oito semanas|Collagen persists and is remodeled.|O colágeno permanece e é remodelado.~More pain proves that the load is more effective|Mais dor comprova que a carga é mais eficaz|Pain is not a measure of useful loading.|Dor não mede a utilidade da carga.","Remodeling reorganizes collagen and improves tensile strength over time; healed tissue may not regain its original strength. Follow clearance and tolerance rather than a calendar-only rule.|O remodelamento reorganiza colágeno e melhora resistência à tração com o tempo; o tecido cicatrizado pode não recuperar a resistência original. Siga liberação e tolerância, não apenas o calendário.");
scenario("ETI",2,"rights","Nina, 37, has abdominal muscle tension for three weeks after exercise, with no red flags at assessment. She agrees to gentle abdominal work but asks to keep both legs covered. What should the practitioner do before moving the drape?|Nina, 37 anos, tem tensão muscular abdominal há três semanas após exercícios, sem sinais de alerta na avaliação. Aceita trabalho abdominal suave, mas pede para manter as duas pernas cobertas. O que fazer antes de mover a cobertura?","Explain the limited exposure, keep the legs covered and confirm permission|Explicar a exposição limitada, manter as pernas cobertas e confirmar permissão~Uncover the legs because the practitioner prefers it|Descobrir as pernas por preferência profissional|Preference does not override the client’s boundary.|Preferência profissional não supera o limite da cliente.~Move the drape first and explain afterward|Mover a cobertura primeiro e explicar depois|Permission should precede the change.|A permissão deve vir antes da mudança.~Treat her initial agreement as consent to every exposure|Tratar a concordância inicial como consentimento para toda exposição|Consent is specific and can be limited or withdrawn.|O consentimento é específico e pode ser limitado ou retirado.","Respect the requested coverage, explain what will be exposed and confirm ongoing consent. If the requested work cannot be done within those limits, agree on another plan.|Respeite a cobertura solicitada, explique o que será exposto e confirme consentimento contínuo. Se não for possível trabalhar dentro desses limites, combinem outro plano.");
const EXTRA_QUESTIONS=[{"d":"PAT","l":4,"s":"clots","q":"Marta, 57, has had one-sided calf swelling since surgery three days ago. At intake she suddenly develops chest pain and shortness of breath. What should the practitioner do FIRST?|Marta, 57 anos, tem inchaço unilateral na panturrilha desde uma cirurgia há três dias. Na avaliação, surge dor no peito e falta de ar. O que o profissional deve fazer PRIMEIRO?","o":"Stop the session and call emergency services|Parar a sessão e chamar o serviço de emergência~Massage the calf gently while observing|Massagear suavemente a panturrilha enquanto observa|Possible clot symptoms require urgent care.|Possíveis sinais de coágulo exigem atendimento urgente.~Offer deep breathing and resume when calm|Orientar respiração profunda e retomar quando acalmar|This delays emergency assessment.|Isso atrasa a avaliação de emergência.~Apply heat to the swollen calf|Aplicar calor na panturrilha inchada|Heat does not address the emergency.|Calor não resolve a emergência.","why":"Chest pain and sudden breathlessness with postoperative calf swelling raise concern for a pulmonary embolism. Stop and activate emergency help; do not diagnose or massage the leg.|Dor torácica e falta de ar súbita com panturrilha inchada após cirurgia sugerem possível embolia pulmonar. Pare e acione a emergência; não diagnostique nem massageie a perna.","hook":"Chest plus calf: call now.|Peito e panturrilha: peça socorro.","practice":"Keep the client supported while emergency help is called.|Mantenha a cliente apoiada enquanto chama a emergência."},{"d":"PRO","l":3,"s":"cdc","q":"Noah, 34, has handled drainage-soiled linen for two minutes while wearing gloves. He then touches his phone before preparing for the next client. What should he do FIRST?|Noah, 34 anos, manuseia roupa com secreção por dois minutos usando luvas. Depois toca o celular antes de preparar a sala para outro cliente. O que deve fazer PRIMEIRO?","o":"Remove gloves, clean hands and address the contaminated phone before the next client|Retirar as luvas, higienizar as mãos e tratar o celular contaminado antes do próximo cliente~Keep the same gloves because they still look clean|Manter as mesmas luvas porque parecem limpas|Visible appearance does not establish safety.|A aparência não comprova segurança.~Spray disinfectant over the gloves and continue|Borrifar desinfetante sobre as luvas e continuar|This does not replace glove removal and hand hygiene.|Isso não substitui tirar as luvas e higienizar as mãos.~Ignore the phone because only linen carries contamination|Ignorar o celular porque só a roupa transmite contaminação|The phone was touched with contaminated gloves.|O celular foi tocado com luvas contaminadas.","why":"Gloves can transfer contamination to nearby objects. Remove them safely, perform hand hygiene, and clean or disinfect touched surfaces according to product instructions.|Luvas podem transferir contaminação para objetos. Retire-as com cuidado, higienize as mãos e limpe ou desinfete superfícies tocadas conforme o produto.","hook":"Gloves travel; germs travel.|Luvas circulam; sujeira também.","practice":"Place the phone aside until its surface has been cleaned appropriately.|Separe o celular até limpar a superfície adequadamente."},{"d":"ANA","l":4,"s":"anatomy","q":"Inez, 46, has had tingling in her ring and little fingers for two weeks. During a session, pressure behind the medial elbow increases it. Which nerve and action should guide the practitioner FIRST?|Inez, 46 anos, sente formigamento no anelar e no mínimo há duas semanas. Durante a sessão, pressão atrás da parte interna do cotovelo piora o sintoma. Qual nervo e ação devem orientar o profissional PRIMEIRO?","o":"Ulnar nerve; stop local pressure and reassess|Nervo ulnar; parar a pressão local e reavaliar~Median nerve; increase local pressure|Nervo mediano; aumentar a pressão local|The location and fingers fit the ulnar pathway better.|A região e os dedos combinam mais com o trajeto ulnar.~Radial nerve; stretch to end range|Nervo radial; alongar até o limite|Provoking symptoms should not be forced.|Sintomas provocados não devem ser forçados.~Sciatic nerve; continue unchanged|Nervo ciático; continuar sem alteração|The sciatic nerve is in the lower limb.|O nervo ciático está no membro inferior.","why":"The ulnar nerve passes near the medial epicondyle and supplies sensation to the little finger and part of the ring finger. New or worsening tingling warrants stopping pressure and appropriate assessment.|O nervo ulnar passa perto do epicôndilo medial e participa da sensibilidade do dedo mínimo e parte do anelar. Formigamento novo ou piorando pede interromper a pressão e avaliar.","hook":"Inner elbow, outer fingers.|Cotovelo interno, dedos externos.","practice":"Ask whether the tingling eases after pressure stops and document the response.|Pergunte se o formigamento melhora ao parar a pressão e registre."},{"d":"CIN","l":4,"s":"muscle","q":"Owen, 52, has had difficulty lowering a light object for six weeks after elbow immobilization. His flexors lengthen while controlling descent; he reports sharp pain at the end. Which contraction and modification should guide the plan?|Owen, 52 anos, tem dificuldade para baixar um objeto leve há seis semanas após imobilização do cotovelo. Os flexores alongam enquanto controlam a descida; ele relata dor aguda no fim. Qual contração e ajuste devem orientar o plano?","o":"Eccentric; reduce load or range and stop the painful phase|Excêntrica; reduzir carga ou amplitude e parar a fase dolorosa~Concentric; increase load through the pain|Concêntrica; aumentar a carga apesar da dor|Lengthening under load is not concentric.|Alongar sob carga não é concêntrico.~Isometric; force the elbow to move faster|Isométrica; forçar o cotovelo a mover mais rápido|The joint is moving during the descent.|A articulação se move na descida.~Passive; ignore pain because the muscle is inactive|Passiva; ignorar a dor porque o músculo está inativo|The muscle actively controls lowering.|O músculo controla ativamente a descida.","why":"Controlled lengthening is eccentric contraction. Sharp pain calls for reducing or stopping the provoking task rather than treating the label as permission to load harder.|Alongamento muscular controlado sob carga é contração excêntrica. Dor aguda pede reduzir ou interromper a tarefa, não aumentar a carga.","hook":"Lower slowly, ease load.|Baixe devagar, alivie a carga.","practice":"Try a smaller comfortable arc and ask about symptoms before progressing.|Teste um arco menor e confortável e pergunte sobre sintomas antes de avançar."},{"d":"ETI","l":4,"s":"rights","q":"Lara, 39, has felt uneasy with shoulder touch for a month. During today's session she recalls a traumatic event and asks for space. Which response should the practitioner choose FIRST?|Lara, 39 anos, sente desconforto com toque no ombro há um mês. Na sessão de hoje, lembra de evento traumático e pede espaço. Qual resposta o profissional deve escolher PRIMEIRO?","o":"Stop touch, offer space and ask what she wants next|Parar o toque, dar espaço e perguntar o que ela deseja em seguida~Label the memory as transference and continue|Rotular a lembrança como transferência e continuar|A flashback alone does not establish transference.|Uma lembrança intrusiva isolada não estabelece transferência.~Ask for details of the event before stopping|Pedir detalhes do evento antes de parar|Consent to touch has changed now.|O consentimento ao toque mudou agora.~Explain that the agreed plan cannot change|Dizer que o plano combinado não pode mudar|The client may withdraw consent.|A cliente pode retirar o consentimento.","why":"Consent is ongoing. Stop immediately, support safety and choice, and do not infer a psychological diagnosis from a flashback.|Consentimento é contínuo. Pare imediatamente, respeite segurança e escolha e não deduza diagnóstico psicológico da lembrança.","hook":"A pause is a choice.|Pausar também é escolher.","practice":"Move your hands away and ask if she prefers to end the session.|Afaste as mãos e pergunte se ela prefere encerrar a sessão."},{"d":"AVA","l":3,"s":"soap","q":"Ari, 44, has had limited neck rotation for three weeks. After two visits, measured rotation improves but she reports worse pain when driving. What should the practitioner do FIRST when updating the plan?|Ari, 44 anos, tem rotação cervical limitada há três semanas. Após duas visitas, a medida melhora, mas ela relata mais dor ao dirigir. O que o profissional deve fazer PRIMEIRO ao atualizar o plano?","o":"Reassess the pain report and revise the plan with her|Reavaliar o relato de dor e rever o plano com ela~Ignore the pain because range improved|Ignorar a dor porque a amplitude melhorou|One measure does not outweigh worsening symptoms.|Uma medida não apaga sintomas piores.~Record only the improved angle|Registrar apenas o ângulo melhorado|The subjective change is relevant too.|A mudança subjetiva também importa.~Use deeper pressure to preserve the gain|Usar pressão maior para manter o ganho|More force is not justified by the measurement.|A medida não justifica mais força.","why":"Combine the measured change with the client's reported function and pain. Worsening symptoms require reassessment and a shared plan, not automatic progression.|Considere a medida junto do relato funcional e da dor. Sintomas piores exigem reavaliação e plano compartilhado, não progressão automática.","hook":"Numbers and story both count.|Medida e relato contam juntos.","practice":"Record the new pain description alongside the rotation measurement.|Registre a nova descrição da dor junto da medida de rotação."},{"d":"EFE","l":3,"s":"techniques","q":"Bea, 58, has had mild back tension for four weeks and asks for a calming start. She is uncomfortable with tapping. Which technique should the practitioner choose FIRST?|Bea, 58 anos, sente leve tensão nas costas há quatro semanas e pede início calmante. Ela não gosta de percussão. Qual técnica o profissional deve escolher PRIMEIRO?","o":"Gentle effleurage with agreed pressure|Effleurage suave com pressão combinada~Forceful tapotement despite her request|Tapotement forte apesar do pedido|This ignores her stated preference.|Isso ignora a preferência declarada.~Deep friction over a sore spot immediately|Fricção profunda imediata sobre área dolorida|This is not a gentle introductory choice.|Essa não é uma escolha inicial suave.~Fast percussion until the tissue feels numb|Percussão rápida até a região ficar dormente|Numbness is not a safe target.|Dormência não é meta segura.","why":"Long, smooth gliding strokes can begin a gentle session when the client agrees to the pressure. Preference and tolerance guide technique selection.|Deslizamentos longos e suaves podem iniciar a sessão quando a cliente concorda com a pressão. Preferência e tolerância orientam a técnica.","hook":"Start smooth, ask often.|Comece suave, pergunte sempre.","practice":"Use a brief stroke, then ask whether its pace feels comfortable.|Faça uma manobra breve e pergunte se o ritmo está confortável."},{"d":"PAT","l":4,"s":"drugs","q":"Celia, 67, has taken a blood thinner for six months and has a new large bruise after a minor fall yesterday. Which action should the practitioner choose before deep thigh work?|Celia, 67 anos, usa anticoagulante há seis meses e tem hematoma grande novo após pequena queda ontem. Qual ação o profissional deve escolher antes de trabalho profundo na coxa?","o":"Defer pressure over the bruise and advise medical assessment of the new bleeding|Adiar pressão sobre o hematoma e orientar avaliação médica do sangramento novo~Deeply massage the bruise to disperse it|Massagear profundamente o hematoma para dispersá-lo|Force may worsen bleeding.|Força pode agravar o sangramento.~Apply heat until the bruise fades|Aplicar calor até o hematoma sumir|Heat does not establish safety of an unexplained large bruise.|Calor não comprova segurança de hematoma grande novo.~Continue unchanged because the medicine is prescribed|Continuar sem mudança porque o remédio é prescrito|A prescription does not remove bleeding risk.|Prescrição não elimina risco de sangramento.","why":"Anticoagulants raise bleeding risk. A new large bruise after a fall needs caution and medical assessment; deep local pressure is inappropriate.|Anticoagulantes aumentam o risco de sangramento. Hematoma grande novo após queda exige cautela e avaliação médica; pressão profunda local é inadequada.","hook":"Bruise plus thinner: soften.|Hematoma e anticoagulante: alivie.","practice":"Ask when the bruise appeared and record its location without pressing it.|Pergunte quando o hematoma apareceu e registre a localização sem pressioná-lo."},{"d":"PRO","l":3,"s":"cdc","q":"Diego, 31, has noticed visible oil on the table for two days. The disinfectant label requires a five-minute wet contact time. Which sequence should he follow FIRST before the next client?|Diego, 31 anos, nota óleo visível na mesa há dois dias. O rótulo do desinfetante pede cinco minutos de contato úmido. Qual sequência deve seguir PRIMEIRO antes do próximo cliente?","o":"Clean off the oil, then disinfect for the full labeled wet time|Limpar o óleo e depois desinfetar pelo tempo úmido indicado~Spray over the oil and wipe immediately|Borrifar sobre o óleo e secar imediatamente|Soil can interfere, and wet time is not met.|Sujeira pode interferir, e o tempo úmido não é cumprido.~Leave the oil because it is not visibly infectious|Deixar o óleo porque não parece infeccioso|Visible soil still requires cleaning.|Sujeira visível ainda exige limpeza.~Use only a dry cloth because the table looks clean afterward|Usar só pano seco porque a mesa parece limpa depois|Appearance alone does not satisfy the protocol.|A aparência sozinha não cumpre o protocolo.","why":"Cleaning removes visible soil before disinfection. The surface then needs the disinfectant's labeled wet contact time.|A limpeza remove sujeira visível antes da desinfecção. Depois, a superfície precisa permanecer úmida pelo tempo indicado no produto.","hook":"Clean, then keep wet.|Limpe, depois mantenha úmido.","practice":"Read the label before scheduling the room's next use.|Leia o rótulo antes de liberar a sala para o próximo atendimento."},{"d":"CIN","l":4,"s":"joints","q":"Eva, 60, has had thumb-base pain for three months and has clearance for gentle movement. She needs to bring the thumb toward the little finger to hold a key. Which joint feature should guide a low-force plan?|Eva, 60 anos, sente dor na base do polegar há três meses e tem liberação para movimento suave. Precisa levar o polegar ao dedo mínimo para segurar uma chave. Qual característica articular deve orientar um plano de pouca força?","o":"The first carpometacarpal is a saddle joint that supports opposition|A primeira carpometacarpal é em sela e permite oposição~The joint is a hinge permitting only flexion|A articulação é dobradiça e só permite flexão|The thumb base has saddle geometry.|A base do polegar tem formato em sela.~The joint is fused and must be forced open|A articulação é fundida e deve ser forçada|This mobile joint should not be forced.|Essa articulação móvel não deve ser forçada.~The joint is a pivot for unrestricted spinning|A articulação é trocoide de giro irrestrito|Opposition is not unrestricted axial rotation.|Oposição não é rotação axial irrestrita.","why":"The first carpometacarpal joint is a saddle joint important for opposition. Use comfortable motion within the client's clearance and symptoms.|A primeira carpometacarpal é articulação em sela importante para oposição. Use movimento confortável, respeitando liberação e sintomas.","hook":"Thumb meets finger gently.|Polegar encontra dedo sem força.","practice":"Ask her to demonstrate a comfortable key grip before choosing range.|Peça que demonstre segurar a chave sem dor antes de definir amplitude."},{"d":"ETI","l":4,"s":"rights","q":"Fiona, 42, has had abdominal tightness for five weeks. She consents to gentle work but asks to keep her legs covered. All actions respect her consent EXCEPT which one?|Fiona, 42 anos, sente tensão abdominal há cinco semanas. Aceita trabalho suave, mas pede para manter as pernas cobertas. Todas as ações respeitam o consentimento, EXCETO qual?","o":"Uncover the legs without asking because she consented to abdominal work|Descobrir as pernas sem perguntar porque ela aceitou trabalho abdominal~Explain which area will be exposed first|Explicar primeiro qual área será descoberta|This supports informed choice.|Isso favorece escolha informada.~Keep the legs covered as requested|Manter as pernas cobertas conforme pedido|This respects her boundary.|Isso respeita o limite dela.~Offer another plan if coverage prevents the technique|Oferecer outro plano se a cobertura impedir a técnica|An alternative can respect her choice.|Uma alternativa pode respeitar sua escolha.","why":"Consent to one region is not blanket permission for other exposure. Explain, ask and keep requested areas covered.|Consentir com uma região não autoriza descobrir outras. Explique, pergunte e mantenha as áreas solicitadas cobertas.","hook":"One area, one agreement.|Uma área, um acordo.","practice":"Before adjusting the sheet, repeat the coverage request in your own words.|Antes de ajustar o lençol, repita o pedido de cobertura com suas palavras."},{"d":"AVA","l":4,"s":"motion","q":"Gabe, 36, has had shoulder stiffness for six weeks. He can lift the arm alone, but passive lifting is greater and comfortable. Which interpretation should guide the next assessment FIRST?|Gabe, 36 anos, sente rigidez no ombro há seis semanas. Consegue elevar o braço sozinho, mas a elevação passiva é maior e confortável. Qual interpretação deve orientar PRIMEIRO a próxima avaliação?","o":"Compare active control with passive range without diagnosing a lesion|Comparar controle ativo com amplitude passiva sem diagnosticar lesão~Assume a tear from the difference alone|Presumir ruptura apenas pela diferença|The finding alone does not establish a diagnosis.|O achado isolado não estabelece diagnóstico.~Force active motion to match passive range|Forçar a amplitude ativa até igualar a passiva|Forcing can provoke symptoms.|Forçar pode provocar sintomas.~Ignore the difference because passive range is normal|Ignorar a diferença porque a amplitude passiva é normal|The active-passive contrast informs the plan.|O contraste ativa-passiva informa o plano.","why":"A difference between active and passive movement is useful assessment information but does not identify a diagnosis by itself. Reassess function and symptoms before choosing care.|Diferença entre movimento ativo e passivo informa a avaliação, mas não define diagnóstico isoladamente. Reavalie função e sintomas antes de escolher a conduta.","hook":"Compare, do not conclude.|Compare, não conclua.","practice":"Document both comfortable ranges and the client's effort.|Registre as duas amplitudes confortáveis e o esforço do cliente."},{"d":"PAT","l":4,"s":"massage","q":"Hana, 64, has had stable back tension for three months but developed fever and a new painful red leg area yesterday. Which plan is safest FIRST?|Hana, 64 anos, sente tensão nas costas há três meses, mas desenvolveu febre e uma área vermelha dolorosa na perna ontem. Qual plano é mais seguro PRIMEIRO?","o":"Defer massage and direct her to timely medical assessment|Adiar a massagem e orientá-la a buscar avaliação médica oportuna~Treat only the back and ignore the new symptoms|Tratar só as costas e ignorar sintomas novos|Systemic symptoms change the whole visit.|Sintomas gerais mudam a sessão inteira.~Apply deep friction to the red area|Aplicar fricção profunda na área vermelha|This may worsen an undiagnosed acute problem.|Isso pode piorar problema agudo não avaliado.~Use heat to test whether the redness fades|Usar calor para testar se a vermelhidão some|Heat is not a diagnostic test.|Calor não é teste diagnóstico.","why":"Fever with a new painful red area requires medical assessment before elective massage. The practitioner should not label the condition or treat through it.|Febre com nova área vermelha dolorosa pede avaliação médica antes de massagem eletiva. O profissional não deve rotular a condição nem tratá-la.","hook":"New fever changes the visit.|Febre nova muda a sessão.","practice":"Explain the reason for postponing without guessing the diagnosis.|Explique o adiamento sem tentar adivinhar o diagnóstico."},{"d":"ANA","l":4,"s":"anatomy","q":"Ivo, 49, has had hand tingling for four weeks. A clinician is evaluating possible carpal tunnel symptoms. Which nerve should the practitioner avoid compressing at the wrist while keeping the medical evaluation separate?|Ivo, 49 anos, sente formigamento na mão há quatro semanas. Um profissional de saúde avalia possível túnel do carpo. Qual nervo o massoterapeuta deve evitar comprimir no punho, sem substituir a avaliação médica?","o":"Median nerve|Nervo mediano~Ulnar nerve|Nervo ulnar|The ulnar nerve does not traverse the carpal tunnel.|O nervo ulnar não atravessa o túnel do carpo.~Radial nerve|Nervo radial|This is not the nerve within the carpal tunnel.|Esse não é o nervo dentro do túnel do carpo.~Sciatic nerve|Nervo ciático|This nerve is in the lower limb.|Esse nervo fica no membro inferior.","why":"The median nerve passes through the carpal tunnel. Avoid provoking symptoms and leave diagnosis and treatment of suspected neuropathy to the appropriate clinician.|O nervo mediano atravessa o túnel do carpo. Evite provocar sintomas e deixe diagnóstico e tratamento de possível neuropatia ao profissional de saúde competente.","hook":"Wrist tunnel, careful touch.|Túnel do punho, toque cuidadoso.","practice":"Ask which wrist positions worsen the symptom before positioning the hand.|Pergunte quais posições do punho pioram o sintoma antes de posicionar a mão."},{"d":"PRO","l":4,"s":"ethics","q":"Jana, 55, has had worsening neck pain for two weeks after her last session and asks to erase that note from the chart before seeking another practitioner. Which response should be chosen FIRST?|Jana, 55 anos, sente dor cervical piorando há duas semanas após a última sessão e pede para apagar essa anotação do prontuário antes de procurar outro profissional. Qual resposta deve ser escolhida PRIMEIRO?","o":"Keep an accurate record and explain how to add a dated correction or comment|Manter registro correto e explicar como acrescentar correção ou comentário datado~Delete the note and deny the visit occurred|Apagar a anotação e negar a visita|Removing relevant history makes the record inaccurate.|Apagar histórico relevante torna o registro incorreto.~Change the note to say she improved|Mudar a anotação para dizer que ela melhorou|This falsifies the record.|Isso falsifica o registro.~Share the full chart with the new practitioner without permission|Compartilhar todo o prontuário sem permissão|Disclosure requires proper authorization.|Compartilhar exige autorização adequada.","why":"Clinical records should remain accurate and traceable. Discuss the concern, document a dated correction or addendum when warranted, and respect privacy rules.|Prontuários devem permanecer corretos e rastreáveis. Converse sobre a preocupação, registre correção datada ou adendo quando cabível e respeite privacidade.","hook":"Correct the record, keep the trail.|Corrija o registro, mantenha o rastro.","practice":"Write the date of any addendum and preserve the original entry.|Anote a data de qualquer adendo e preserve a entrada original."}];
for(const x of EXTRA_QUESTIONS)scenario(x.d,x.l,x.s,x.q,x.o,x.why);

{id:1,hook:'Questions before hands.|Perguntas antes das mãos.',practice:'Ask when the shoulder pain began before choosing a technique.|Pergunte quando a dor começou antes de escolher a técnica.',img:null},

{id:3,hook:'A measurement is an observation.|Medida é observação.',practice:'Record the measured shoulder angle and how you measured it.|Registre o ângulo medido do ombro e como fez a medida.',img:null},
{id:4,hook:'Tomorrow belongs in the plan.|O próximo passo vai no plano.',practice:'Set a reminder to repeat that movement check at the next visit.|Anote um lembrete para repetir a verificação na próxima visita.',img:null},
{id:5,hook:'Their effort, their movement.|Esforço próprio, movimento próprio.',practice:'Ask the client to raise the arm while you observe without assisting.|Peça ao cliente para elevar o braço enquanto você observa sem ajudar.',img:null},
{id:6,hook:'Relaxed client, guided joint.|Cliente relaxado, articulação guiada.',practice:'Support the arm and ask the client to relax before gently moving it.|Apoie o braço e peça relaxamento antes de movimentá-lo suavemente.',img:null},
{id:7,hook:'They push; you oppose.|A pessoa empurra; você resiste.',practice:'Explain the direction of effort and agree on a comfortable resistance.|Explique a direção do esforço e combine uma resistência confortável.',img:null},
{id:8,hook:'A stop request ends the touch.|Pedir para parar encerra o toque.',practice:'Remove your hands from the shoulder and ask whether the client wants to continue elsewhere.|Retire as mãos do ombro e pergunte se o cliente quer continuar em outra região.',img:null},
{id:9,hook:'New warm swelling: pause.|Inchaço novo e quente: pause.',practice:'Explain why the calf needs prompt medical assessment instead of starting massage.|Explique por que a panturrilha precisa de avaliação médica rápida em vez de iniciar a massagem.',img:null},
{id:10,hook:'New limp, new questions.|Nova dificuldade, novas perguntas.',practice:'Ask what happened in the fall and whether walking or bearing weight changed.|Pergunte como foi a queda e se houve mudança ao andar ou apoiar o peso.',img:null},
{id:11,hook:'Same ruler, meaningful comparison.|Mesma régua, comparação útil.',practice:'Repeat the same movement under similar conditions and record the difference.|Repita o mesmo movimento em condições semelhantes e registre a diferença.',img:null},
{id:12,hook:'Choose a goal you can notice.|Escolha uma meta que dá para perceber.',practice:'Ask which driving movement is difficult and agree on how to reassess it.|Pergunte qual movimento ao dirigir é difícil e combine como reavaliá-lo.',img:null},
{id:13,hook:'Today’s no beats yesterday’s yes.|O não de hoje supera o sim de ontem.',practice:'Acknowledge the refusal and offer another appropriate option without pressure.|Acolha a recusa e ofereça outra opção adequada sem pressionar.',img:null},
{id:14,hook:'New technique, new conversation.|Nova técnica, nova conversa.',practice:'Describe what will change and wait for agreement before placing your hands.|Descreva o que vai mudar e espere a concordância antes de tocar.',img:null},
{id:15,hook:'A signature cannot explain back.|Assinatura não explica com as próprias palavras.',practice:'Use simpler words, then ask the client to describe the proposed care.|Use palavras mais simples e peça ao cliente para descrever o atendimento proposto.',img:null},
{id:16,hook:'A worse response changes the route.|Piora muda a rota.',practice:'Ask where the pain increased, how long it lasted and what activities changed.|Pergunte onde a dor aumentou, quanto durou e quais atividades mudaram.',img:null},
{id:17,hook:'A referral cannot teach your hands.|Encaminhamento não treina suas mãos.',practice:'Tell the referring professional which service you can safely provide and who may help further.|Informe ao profissional que encaminhou qual serviço você pode oferecer e quem pode ajudar além disso.',img:null},
{id:18,hook:'Allowed, trained, competent.|Permitido, aprendido, competente.',practice:'Before accepting a new service, check the local rules and your actual training.|Antes de aceitar um novo serviço, confira as regras locais e sua formação real.',img:null},
{id:19,hook:'Explain, understand, choose.|Explicar, entender, escolher.',practice:'Discuss the proposed technique, invite questions and ask what the client chooses.|Converse sobre a técnica, abra espaço para perguntas e pergunte o que o cliente escolhe.',img:null},
{id:20,hook:'Cover the person; expose the task.|Cubra a pessoa; descubra só a área.',practice:'Ask permission before adjusting the sheet and keep adjacent areas covered.|Peça permissão antes de ajustar o lençol e mantenha as áreas próximas cobertas.',img:null},
{id:21,hook:'The old relationship travels toward you.|A relação antiga é projetada em você.',practice:'Maintain clear limits if a client assigns you a parental role; avoid interpreting their history.|Mantenha limites claros se o cliente lhe atribuir papel parental; evite interpretar sua história.',img:null},
{id:22,hook:'Your history enters their session.|Sua história entra na sessão alheia.',practice:'Notice whether memories of your relative are changing how you treat this client.|Observe se lembranças do seu parente estão mudando como você atende esse cliente.',img:null},
{id:23,hook:'Expertise carries influence.|Conhecimento traz influência.',practice:'Give the client time to decline instead of using your authority to obtain agreement.|Dê tempo para o cliente recusar, sem usar sua autoridade para obter concordância.',img:null},
{id:24,hook:'Clear limits prevent guessing.|Limites claros evitam adivinhação.',practice:'Explain your contact hours and how requests outside sessions are handled.|Explique seus horários de contato e como trata pedidos fora das sessões.',img:null},
{id:25,hook:'Two roles need two checks.|Dois papéis pedem dupla atenção.',practice:'Before bartering, consider whether being each other’s customer could affect professional decisions.|Antes da permuta, considere se a relação comercial pode afetar decisões profissionais.',img:null},
{id:26,hook:'Selling a business does not sell privacy.|Vender o negócio não vende a privacidade.',practice:'Discuss the sale using appropriate nonidentifying information while checking disclosure requirements.|Converse sobre a venda usando informações não identificáveis adequadas enquanto verifica exigências de divulgação.',img:null},
{id:27,hook:'Safety first; labels later, if warranted.|Segurança primeiro; rótulos só com fundamento.',practice:'Pause touch and ask whether the client would prefer space, a break or ending the session.|Pause o toque e pergunte se o cliente prefere espaço, uma pausa ou encerrar a sessão.',img:null},
{id:28,hook:'Therapeutic contact is not sexual access.|Contato terapêutico não dá acesso sexual.',practice:'State the professional boundary clearly when a sexual request arises.|Declare claramente o limite profissional quando surgir um pedido sexual.',img:null},
{id:29,hook:'Credentials must match reality.|Credenciais precisam corresponder à realidade.',practice:'List only qualifications you actually hold when describing your services.|Liste apenas qualificações que realmente possui ao descrever seus serviços.',img:null},
{id:30,hook:'EXCEPT asks for the outsider.|EXCEPT pede o que não pertence.',practice:'Before answering, identify which option removes the client’s continuing choice.|Antes de responder, identifique qual opção elimina a escolha contínua do cliente.',img:null},
{id:31,hook:'Knowing someone is a client is private too.|Saber quem é cliente também é privado.',practice:'Tell your friend that you do not discuss whether anyone receives your services.|Diga ao amigo que você não comenta se alguém recebe seus serviços.',img:null},
{id:32,hook:'A gift cannot buy an exception.|Presente não compra exceção.',practice:'Decline the requested special access and explain the policy you apply consistently.|Recuse o acesso especial solicitado e explique a política que aplica de forma consistente.',img:null},
{id:33,hook:'Glide like a smooth road.|Deslize como numa estrada lisa.',practice:'Recognize the continuous traveling stroke instead of a lift or a tap.|Reconheça o movimento contínuo que percorre a área, em vez de elevar ou percutir.',img:{show:'Mão aberta deslizando sobre tecido mole, com seta contínua.',avoid:'Elevação do tecido ou batidas rítmicas.',search:'effleurage massage gliding stroke diagram',capEN:'A continuous gliding stroke.',capPT:'Um deslizamento contínuo.',check:'A seta deve acompanhar o percurso sobre a pele, sem indicar pressão excessiva.'}},
{id:34,hook:'Lift and knead, like soft dough.|Eleve e amasse, como massa macia.',practice:'Distinguish tissue lifting and kneading from a hand simply sliding over the skin.|Diferencie elevar e amassar o tecido de apenas deslizar a mão sobre a pele.',img:{show:'Mãos elevando e amassando tecido mole.',avoid:'Torção extrema da pele ou hematomas.',search:'petrissage kneading lifting soft tissue diagram',capEN:'Soft tissue is lifted and kneaded.',capPT:'O tecido mole é elevado e amassado.',check:'A figura deve mostrar amassamento, não somente deslizamento.'}},
{id:35,hook:'A rhythm of taps.|Uma sequência de batidas.',practice:'Look for repeated percussive contacts when identifying the named stroke.|Procure contatos percussivos repetidos ao identificar o movimento descrito.',img:{show:'Contatos leves e alternados com setas de percussão.',avoid:'Golpes fortes em proeminências ósseas.',search:'tapotement rhythmic percussion massage diagram',capEN:'Rhythmic percussive contact.',capPT:'Contato percussivo rítmico.',check:'A sequência deve representar percussão, não pressão sustentada.'}},
{id:36,hook:'Small shakes, not long strokes.|Pequenas oscilações, não longos percursos.',practice:'Notice the small repeated oscillations at the contact point.|Observe as pequenas oscilações repetidas no ponto de contato.',img:{show:'Mão em contato e setas curtas oscilatórias.',avoid:'Seta longa de deslizamento ou batidas separadas.',search:'massage vibration small oscillations diagram',capEN:'Fine oscillations at the contact point.',capPT:'Oscilações finas no ponto de contato.',check:'As setas devem indicar oscilação de pequena amplitude.'}},
{id:37,hook:'Press inward without traveling.|Pressione sem percorrer a área.',practice:'Separate pressure directed into tissue from a stroke that moves along it.|Diferencie a pressão dirigida ao tecido de um movimento que percorre sua superfície.',img:{show:'Mão apoiada com seta de pressão dirigida ao tecido.',avoid:'Seta tangencial longa sugerindo deslizamento.',search:'massage compression pressure without glide diagram',capEN:'Pressure is directed into the tissue.',capPT:'A pressão é dirigida ao tecido.',check:'Não devem aparecer instruções de força máxima ou pressão sobre área vulnerável.'}},
{id:38,hook:'Small area, little glide.|Área pequena, pouco deslizamento.',practice:'Identify the localized rubbing rather than following the length of a limb.|Identifique o movimento localizado, em vez de um percurso pelo comprimento do membro.',img:{show:'Contato localizado e setas curtas de fricção.',avoid:'Promessas de romper aderências ou trabalho em lesão aguda.',search:'localized massage friction short movement diagram',capEN:'Localized movement with limited glide.',capPT:'Movimento localizado com pouco deslizamento.',check:'A região e as setas devem distinguir fricção de effleurage.'}},
{id:39,hook:'May help is not will cure.|Pode ajudar não é vai curar.',practice:'Describe a possible benefit without promising that every client will improve.|Descreva um benefício possível sem prometer melhora para todos os clientes.',img:null},
{id:40,hook:'One result is one observation.|Um resultado é uma observação.',practice:'Record what changed today and ask about the response at the next visit.|Registre o que mudou hoje e pergunte sobre a resposta na próxima visita.',img:null},
{id:41,hook:'Pain changes the pressure conversation.|Dor muda a conversa sobre pressão.',practice:'Ask whether the client wants less pressure, another approach or a stop.|Pergunte se o cliente quer menos pressão, outra abordagem ou uma interrupção.',img:null},
{id:42,hook:'A guarantee is the odd one out.|A garantia é o elemento fora do grupo.',practice:'Cross out claims promising lasting relief when comparing realistic expectations.|Elimine promessas de alívio duradouro ao comparar expectativas realistas.',img:null},
{id:43,hook:'Slow and sustained, not tapping.|Lento e sustentado, não percussivo.',practice:'Use the tissue target and sustained contact to distinguish the approach in the vignette.|Use o tecido-alvo e o contato sustentado para distinguir a abordagem da vinheta.',img:{show:'Contato manual lento sobre uma representação de tecido fascial.',avoid:'Percussão, promessas de cura ou ruptura desenhada da fáscia.',search:'myofascial release sustained manual pressure diagram',capEN:'Controlled sustained contact with fascial tissue.',capPT:'Contato sustentado e controlado com tecido fascial.',check:'A imagem deve diferenciar pressão sustentada de deslizamento e percussão.'}},
{id:44,hook:'Deeper is not automatically better.|Mais profundo não é automaticamente melhor.',practice:'Agree on comfortable pressure and ask for feedback before increasing it.|Combine pressão confortável e peça retorno antes de aumentá-la.',img:null},
{id:45,hook:'Support the person, not a cure claim.|Apoie a pessoa, sem prometer cura.',practice:'Ask about current treatment precautions and seek appropriate coordination before proceeding.|Pergunte sobre precauções do tratamento atual e busque coordenação adequada antes de prosseguir.',img:null},
{id:46,hook:'Soreness is feedback, not a detox badge.|Dor posterior é retorno, não selo de desintoxicação.',practice:'Ask how the soreness affected daily activities and adjust the next session accordingly.|Pergunte como a dor posterior afetou as atividades diárias e ajuste a próxima sessão.',img:null},
{id:47,hook:'Quiet pain does not prove healed tissue.|Dor silenciosa não comprova tecido recuperado.',practice:'Ask what medication was taken and reassess tissue tolerance before deeper work.|Pergunte qual medicamento foi usado e reavalie a tolerância antes de trabalho mais profundo.',img:null},
{id:48,hook:'Remove the dirt before the germ step.|Tire a sujeira antes da etapa contra germes.',practice:'Remove the lotion residue before applying the appropriate disinfectant.|Remova o resíduo de loção antes de aplicar o desinfetante adequado.',img:null},
{id:49,hook:'All forms includes spores.|Todas as formas inclui esporos.',practice:'Check whether the item’s intended use requires sterilization rather than surface disinfection.|Confira se o uso do item exige esterilização em vez de desinfecção de superfície.',img:null},
{id:50,hook:'A clean surface can still need disinfection.|Superfície limpa ainda pode precisar de desinfecção.',practice:'After removing soil, apply a product suitable for that surface according to its label.|Após remover sujeira, aplique produto adequado à superfície conforme o rótulo.',img:null},
{id:51,hook:'Wet for the time on the label.|Molhado pelo tempo do rótulo.',practice:'Read the contact time before starting and keep the surface wet for that period.|Leia o tempo de contato antes de começar e mantenha a superfície molhada por esse período.',img:null},
{id:52,hook:'Price before the first touch.|Preço antes do primeiro toque.',practice:'Confirm the session price and any relevant cancellation policy before beginning.|Confirme o valor da sessão e a política de cancelamento pertinente antes de começar.',img:null},
{id:53,hook:'No cash does not mean no value.|Sem dinheiro não significa sem valor.',practice:'Record the fair market value of the goods received in the exchange.|Registre o valor justo de mercado dos bens recebidos na troca.',img:null},
{id:54,hook:'Income included is not the tax rate.|Renda incluída não é alíquota.',practice:'Separate the value reported as income from the tax calculation on that income.|Separe o valor declarado como renda do cálculo do imposto sobre essa renda.',img:null},
{id:55,hook:'A referral is not a payment promise.|Encaminhamento não promete pagamento.',practice:'Check the client’s plan and documentation requirements before discussing reimbursement.|Confira o plano do cliente e as exigências de documentação antes de discutir reembolso.',img:null},
{id:56,hook:'Write what happened, not what sells.|Escreva o que ocorreu, não o que vende.',practice:'Document the relevant findings, what you did and how the client responded.|Documente achados relevantes, o que você fez e como o cliente respondeu.',img:null},
{id:57,hook:'Correct the record; keep the trail.|Corrija o registro; preserve o histórico.',practice:'Add a dated correction that identifies the original error without concealing it.|Acrescente correção datada que identifique o erro original sem ocultá-lo.',img:null},
{id:58,hook:'Treatment claim, professional cover.|Alegação sobre atendimento, cobertura profissional.',practice:'Read the policy’s professional liability section when checking coverage for treatment-related allegations.|Leia a seção de responsabilidade profissional ao conferir cobertura de alegações sobre atendimento.',img:null},
{id:59,hook:'State the policy, not a judgment.|Explique a política, não um julgamento.',practice:'Explain how late arrival affects session length under the policy already communicated.|Explique como o atraso afeta a duração da sessão conforme a política já informada.',img:null},
{id:60,hook:'One person, accountable access.|Uma pessoa, acesso rastreável.',practice:'Ask the authorized administrator to provide individual access instead of sharing your password.|Peça ao administrador autorizado um acesso individual em vez de compartilhar sua senha.',img:null},
{id:61,hook:'Passing opens a step, not a license.|Aprovar conclui uma etapa, não emite licença.',practice:'Check the state board’s remaining requirements before advertising yourself as licensed.|Confira exigências restantes do conselho antes de se anunciar como profissional licenciado.',img:null},
{id:62,hook:'Breathing and chest pain outrank the session.|Respiração e dor no peito vêm antes da sessão.',practice:'Stop treatment and call emergency medical assistance immediately for these sudden symptoms.|Interrompa o atendimento e acione assistência médica de emergência para esses sintomas súbitos.',img:null},
{id:63,hook:'Less clotting means more bleeding concern.|Menos coagulação, mais atenção a sangramento.',practice:'Ask about bruising and relevant medical instructions before selecting pressure.|Pergunte sobre hematomas e orientações médicas pertinentes antes de escolher a pressão.',img:null},
{id:64,hook:'Support the side; listen to symptoms.|Apoie de lado; observe os sintomas.',practice:'Arrange supports for comfortable side-lying and ask about dizziness or discomfort.|Organize apoios para decúbito lateral confortável e pergunte sobre tontura ou desconforto.',img:{show:'Gestante em decúbito lateral apoiado, com cabeça e membros confortáveis.',avoid:'Compressão abdominal, posição supina prolongada ou apoio insuficiente.',search:'pregnancy massage supported side lying positioning diagram',capEN:'Supported side-lying during pregnancy.',capPT:'Decúbito lateral com apoio na gestação.',check:'A postura deve concordar com o gabarito e não impor um lado como regra universal.'}},
{id:65,hook:'A fever pauses the appointment.|Febre pausa o atendimento.',practice:'Explain that the session should be postponed while the acute illness is assessed.|Explique que a sessão deve ser adiada enquanto o quadro agudo é avaliado.',img:null},
{id:66,hook:'Fresh bruising is not a target for force.|Hematoma recente não é alvo para força.',practice:'Ask how the bruise appeared and avoid pressing directly over it.|Pergunte como surgiu o hematoma e evite pressioná-lo diretamente.',img:null},
{id:67,hook:'Fragile bones need a lighter plan.|Ossos frágeis pedem um plano mais leve.',practice:'Adjust positioning and avoid forceful contacts over vulnerable bony areas.|Ajuste o posicionamento e evite contatos intensos sobre regiões ósseas vulneráveis.',img:null},
{id:68,hook:'Less feeling means less warning.|Menos sensibilidade significa menos aviso.',practice:'Do not use the absence of pain as the only check on heat or pressure.|Não use a ausência de dor como única verificação de calor ou pressão.',img:null},
{id:69,hook:'Light touch does not clear a clot concern.|Toque leve não descarta suspeita de trombose.',practice:'Defer the requested massage and explain why new postoperative swelling needs prompt assessment.|Adie a massagem pedida e explique por que o novo inchaço após cirurgia exige avaliação rápida.',img:null},
{id:70,hook:'Sharp pain is a stop sign.|Dor aguda é sinal de parada.',practice:'Release the stretch and ask where and when the sharp pain began.|Interrompa o alongamento e pergunte onde e quando a dor aguda começou.',img:null},
{id:71,hook:'Broken skin needs protection, not friction.|Pele aberta precisa de proteção, não fricção.',practice:'Keep massage products and direct manipulation away from the open wound.|Mantenha produtos de massagem e manipulação direta longe da ferida aberta.',img:null},
{id:72,hook:'An old diagnosis does not explain every new symptom.|Diagnóstico antigo não explica todo sintoma novo.',practice:'Ask about the new symptom before relying on the previous treatment plan.|Pergunte sobre o novo sintoma antes de confiar no plano anterior.',img:null},
{id:73,hook:'Stand slowly; protect against a fall.|Levante devagar; proteja contra quedas.',practice:'Help the client remain supported and do not let them walk alone while dizzy.|Ajude o cliente a permanecer apoiado e não o deixe caminhar sozinho enquanto estiver tonto.',img:null},
{id:74,hook:'Thin skin changes how hands work.|Pele fina muda o cuidado das mãos.',practice:'Ask about easy bruising and use gentler handling without changing the prescribed drug.|Pergunte sobre hematomas fáceis e use manejo mais suave sem alterar o medicamento prescrito.',img:null},
{id:75,hook:'Sudden breathing trouble moves to the front.|Falta de ar súbita passa à frente.',practice:'Prioritize emergency assistance over routine session concerns when chest pain accompanies sudden breathlessness.|Priorize assistência de emergência quando a dor no peito acompanha falta de ar súbita.',img:null},
{id:76,hook:'Cup toward mouth, angle closes.|Copo à boca, ângulo fecha.',practice:'Watch the elbow angle decrease as the forearm approaches the upper arm.|Observe o ângulo do cotovelo diminuir quando o antebraço se aproxima do braço.',img:{show:'Cotovelo dobrando, com o antebraço aproximando-se do braço.',avoid:'Seta de extensão ou movimento principal no ombro.',search:'elbow flexion cup to mouth movement diagram',capEN:'The elbow angle decreases.',capPT:'O ângulo do cotovelo diminui.',check:'A seta deve mostrar flexão do cotovelo, não flexão do ombro.'}},
{id:77,hook:'Straighten the knee, open the angle.|Estique o joelho, abra o ângulo.',practice:'Compare the bent and straight positions without forcing the knee beyond its comfortable range.|Compare joelho dobrado e estendido sem forçar além da amplitude confortável.',img:{show:'Joelho passando de flexionado para estendido.',avoid:'Hiperextensão forçada ou seta de flexão.',search:'knee extension bent to straight diagram',capEN:'The knee moves toward a straight position.',capPT:'O joelho se aproxima da posição estendida.',check:'A direção deve aumentar o ângulo do joelho sem representar hiperextensão.'}},
{id:78,hook:'Away is the A in abduction.|Abdução afasta.',practice:'Use the trunk’s midline as the reference while the arm moves sideways away from it.|Use a linha média do tronco como referência enquanto o braço se afasta lateralmente.',img:{show:'Vista anterior com braço afastando-se lateralmente do tronco.',avoid:'Elevação anterior do braço ou seta de aproximação.',search:'shoulder abduction frontal plane diagram',capEN:'The arm moves away from the midline.',capPT:'O braço se afasta da linha média.',check:'A vista e a seta devem mostrar abdução, sem confundir com flexão.'}},
{id:79,hook:'Add the arm back to the body.|Traga o braço de volta ao corpo.',practice:'Follow the arm returning toward the trunk rather than continuing outward.|Acompanhe o braço retornando ao tronco em vez de continuar para fora.',img:{show:'Braço elevado lateralmente retornando em direção ao tronco.',avoid:'Seta de afastamento ou rotação do antebraço.',search:'shoulder adduction arm toward body diagram',capEN:'The arm moves toward the midline.',capPT:'O braço se aproxima da linha média.',check:'A seta deve apontar para o tronco.'}},
{id:80,hook:'Hold the soup in your palm.|Segure a sopa na palma.',practice:'With the elbow bent, turn the forearm until the palm faces upward.|Com o cotovelo dobrado, gire o antebraço até a palma ficar para cima.',img:{show:'Cotovelo dobrado e antebraço girando para palma voltada para cima.',avoid:'Movimento isolado do punho ou palma final para baixo.',search:'forearm supination elbow bent palm up diagram',capEN:'The palm turns upward with the elbow bent.',capPT:'A palma vira para cima com o cotovelo dobrado.',check:'O movimento deve ocorrer no antebraço e terminar em supinação.'}},
{id:81,hook:'Turn the soup bowl over.|Vire a tigela de sopa.',practice:'Keep the elbow bent while observing the palm turn from up to down.|Mantenha o cotovelo dobrado enquanto observa a palma virar de cima para baixo.',img:{show:'Antebraço girando de palma para cima para palma para baixo.',avoid:'Supinação ou somente flexão do punho.',search:'forearm pronation palm down elbow bent diagram',capEN:'The palm turns downward.',capPT:'A palma vira para baixo.',check:'A posição final deve ser pronação no contexto do cotovelo dobrado.'}},
{id:82,hook:'Toes toward the shin.|Dedos em direção à perna.',practice:'Observe the front of the foot rise while the heel remains supported.|Observe a frente do pé subir enquanto o calcanhar permanece apoiado.',img:{show:'Vista lateral com frente do pé aproximando-se da perna.',avoid:'Calcanhar elevado ou seta de flexão plantar.',search:'ankle dorsiflexion heel down diagram',capEN:'The top of the foot approaches the shin.',capPT:'O dorso do pé se aproxima da perna.',check:'A seta deve apontar a frente do pé para cima.'}},
{id:83,hook:'Press the pedal with the foot.|Pise no pedal com o pé.',practice:'Compare pointing the foot downward with lifting its front toward the shin.|Compare apontar o pé para baixo com elevar sua frente em direção à perna.',img:{show:'Pé apontando para baixo em relação à perna.',avoid:'Seta de dorsiflexão ou apenas flexão dos dedos.',search:'ankle plantar flexion pointing foot diagram',capEN:'The foot points away from the shin.',capPT:'O pé aponta para longe da perna.',check:'O movimento deve estar no tornozelo, não apenas nos dedos.'}},
{id:84,hook:'Lift and shorten.|Eleve e encurte.',practice:'Notice the elbow flexors shortening while the weight rises against gravity.|Observe os flexores do cotovelo encurtarem enquanto o peso sobe contra a gravidade.',img:{show:'Peso subindo durante flexão do cotovelo e músculo encurtando.',avoid:'Seta de descida ou músculo alongando durante a subida.',search:'concentric elbow flexion lifting weight diagram',capEN:'Active elbow flexors shorten while lifting.',capPT:'Flexores ativos encurtam durante a elevação.',check:'Direção do peso e mudança do comprimento devem corresponder à contração concêntrica.'}},
{id:85,hook:'Lower slowly, lengthen under control.|Desça devagar, alongue sob controle.',practice:'Distinguish controlled lowering from simply relaxing and letting the weight drop.|Diferencie descida controlada de apenas relaxar e deixar o peso cair.',img:{show:'Peso descendo lentamente e flexores do cotovelo alongando sob carga.',avoid:'Queda livre, relaxamento completo ou seta de subida.',search:'eccentric elbow flexors lowering weight diagram',capEN:'Active flexors lengthen while controlling descent.',capPT:'Flexores ativos alongam ao controlar a descida.',check:'A figura deve manter atividade muscular durante o alongamento.'}},
{id:86,hook:'Hold still, keep the effort.|Fique parado, mantenha o esforço.',practice:'Watch for a fixed elbow angle while the client continues supporting the load.|Observe o ângulo fixo do cotovelo enquanto o cliente sustenta a carga.',img:{show:'Peso sustentado e cotovelo com ângulo estável.',avoid:'Setas de movimento ou alteração grande do comprimento muscular.',search:'isometric elbow flexion static weight hold diagram',capEN:'The load is held without appreciable movement.',capPT:'A carga é sustentada sem movimento apreciável.',check:'Não deve haver subida ou descida da carga.'}},
{id:87,hook:'Name the role for this action.|Nomeie o papel nesta ação.',practice:'Identify elbow flexion first, then identify the muscle whose action opposes it.|Identifique primeiro a flexão do cotovelo e depois o músculo cuja ação se opõe a ela.',img:{show:'Bíceps e tríceps identificados em um esquema de flexão do cotovelo.',avoid:'Tríceps rotulado como flexor principal do cotovelo.',search:'elbow flexion biceps triceps antagonist diagram',capEN:'Triceps opposes elbow flexion.',capPT:'O tríceps se opõe à flexão do cotovelo.',check:'Rótulos e setas devem relacionar antagonismo à ação específica.'}},
{id:88,hook:'Muscle to bone is the force cable.|Músculo ao osso: cabo de força.',practice:'Trace the calf muscle toward its cordlike attachment at the heel.|Acompanhe o músculo da panturrilha até sua inserção em cordão no calcanhar.',img:{show:'Panturrilha, tendão calcâneo e calcâneo identificados.',avoid:'Tendão rotulado como ligamento ou conexão apenas entre ossos.',search:'Achilles tendon calf muscle calcaneus labeled diagram',capEN:'The tendon transmits calf muscle force to the heel.',capPT:'O tendão transmite força da panturrilha ao calcanhar.',check:'A continuidade músculo-tendão-osso deve estar correta.'}},
{id:89,hook:'Bone to bone supports the joint.|Osso a osso sustenta a articulação.',practice:'Identify the bone-to-bone connection instead of a muscle attachment in an ankle diagram.|Identifique a conexão entre ossos, em vez de inserção muscular, num diagrama do tornozelo.',img:{show:'Ossos do tornozelo unidos por um ligamento identificado.',avoid:'Tendão muscular identificado como ligamento.',search:'ankle ligament bone to bone connection diagram',capEN:'A ligament connects bones at the ankle.',capPT:'Um ligamento conecta ossos no tornozelo.',check:'As duas extremidades da estrutura devem se conectar a ossos.'}},
{id:90,hook:'The smooth cover is at the joint surface.|A cobertura lisa está na superfície articular.',practice:'Locate the covering on the opposing bone surfaces rather than outside the joint.|Localize o revestimento nas superfícies ósseas opostas, não fora da articulação.',img:{show:'Corte de articulação sinovial com cartilagem sobre extremidades ósseas.',avoid:'Cartilagem indicada como tendão ou cobrindo toda a diáfise.',search:'synovial joint articular cartilage labeled diagram',capEN:'Articular cartilage covers the opposing surfaces.',capPT:'A cartilagem articular reveste as superfícies opostas.',check:'O rótulo deve apontar para cartilagem, não líquido ou cápsula.'}},
{id:91,hook:'Median takes the carpal tunnel.|Mediano passa pelo túnel do carpo.',practice:'Follow the median nerve through the wrist tunnel without confusing nearby nerves.|Acompanhe o nervo mediano no túnel do punho sem confundir nervos próximos.',img:{show:'Túnel do carpo em corte com nervo mediano identificado.',avoid:'Nervo ulnar apresentado dentro do túnel do carpo.',search:'carpal tunnel median nerve cross section labeled diagram',capEN:'The median nerve travels through the carpal tunnel.',capPT:'O nervo mediano atravessa o túnel do carpo.',check:'Conferir nervo mediano, retináculo e limites do túnel.'}},
{id:92,hook:'Behind the inner elbow: ulnar.|Atrás do cotovelo medial: ulnar.',practice:'Locate the medial epicondyle before discussing the nearby nerve’s vulnerable course.|Localize o epicôndilo medial antes de discutir o trajeto vulnerável do nervo próximo.',img:{show:'Nervo ulnar passando atrás do epicôndilo medial.',avoid:'Epicôndilo lateral confundido com medial.',search:'ulnar nerve behind medial epicondyle diagram',capEN:'The ulnar nerve passes behind the medial epicondyle.',capPT:'O nervo ulnar passa atrás do epicôndilo medial.',check:'A orientação medial e o trajeto posterior precisam estar corretos.'}},
{id:93,hook:'Artery means away.|Artéria: afastando-se do coração.',practice:'Follow the flow arrow away from the heart instead of deciding by blood color alone.|Acompanhe a seta para fora do coração em vez de decidir só pela cor do sangue.',img:{show:'Coração e vaso com seta de fluxo saindo do coração.',avoid:'Definir artéria exclusivamente como vaso de sangue oxigenado.',search:'artery blood flow away from heart diagram',capEN:'Arterial flow travels away from the heart.',capPT:'O fluxo arterial se afasta do coração.',check:'A direção do fluxo, não a cor isolada, deve fundamentar a legenda.'}},
{id:94,hook:'Extra tissue fluid finds the return route.|Líquido extra encontra o caminho de volta.',practice:'Trace fluid from the interstitial space into lymphatic vessels and toward venous return.|Acompanhe líquido do espaço intersticial aos vasos linfáticos e ao retorno venoso.',img:{show:'Espaço intersticial, capilar linfático e retorno à circulação.',avoid:'Sistema linfático apresentado como bomba arterial independente.',search:'lymphatic interstitial fluid venous return diagram',capEN:'Lymphatic vessels return excess interstitial fluid.',capPT:'Vasos linfáticos devolvem excesso de líquido intersticial.',check:'As setas devem seguir do tecido para a via de retorno.'}},
{id:95,hook:'Rest and digest travel together.|Repouso e digestão caminham juntos.',practice:'Match the question’s digestive context to autonomic function without promising a massage effect.|Relacione o contexto digestivo à função autonômica sem prometer efeito da massagem.',img:{show:'Esquema autonômico com funções de repouso e digestão.',avoid:'Afirmar que uma técnica ativa somente uma divisão autonômica.',search:'parasympathetic rest digest autonomic diagram',capEN:'Parasympathetic activity supports rest and digestion.',capPT:'Atividade parassimpática favorece repouso e digestão.',check:'As funções devem ser exemplos, não garantias de resposta à massagem.'}},
{id:96,hook:'A threat mobilizes the body.|Uma ameaça mobiliza o corpo.',practice:'Use the sudden-threat context to distinguish mobilization from digestion.|Use o contexto de ameaça súbita para distinguir mobilização de digestão.',img:{show:'Resposta autonômica de alerta com aumento da frequência cardíaca.',avoid:'Confundir sistema motor somático com divisão autonômica.',search:'sympathetic threat response heart rate diagram',capEN:'Sympathetic activity supports rapid mobilization.',capPT:'Atividade simpática favorece mobilização rápida.',check:'O esquema não deve apresentar efeitos autonômicos como sempre idênticos.'}},
{id:97,hook:'Urine points you toward the kidneys.|Urina aponta para os rins.',practice:'Locate the kidneys in the urinary system before linking them to fluid balance.|Localize os rins no sistema urinário antes de relacioná-los ao equilíbrio de líquidos.',img:{show:'Rins, ureteres e bexiga identificados.',avoid:'Bexiga identificada como órgão que produz urina.',search:'urinary system kidneys ureters bladder labeled diagram',capEN:'The kidneys produce urine; the bladder stores it.',capPT:'Os rins produzem urina; a bexiga a armazena.',check:'Não confundir produção, transporte e armazenamento de urina.'}},
{id:98,hook:'Tiny walls make exchange possible.|Paredes finas permitem as trocas.',practice:'Locate the capillary bed between larger vessels and identify the exchange surface.|Localize a rede capilar entre vasos maiores e identifique a superfície de troca.',img:{show:'Rede capilar e trocas entre sangue e tecido.',avoid:'Atribuir a troca principal de gases às paredes de grandes artérias.',search:'capillary bed tissue gas exchange diagram',capEN:'Exchange occurs across thin capillary walls.',capPT:'As trocas ocorrem pelas paredes finas dos capilares.',check:'As setas devem distinguir fluxo sanguíneo de trocas com os tecidos.'}},
{id:99,hook:'Privacy stays covered between regions.|A privacidade continua coberta entre regiões.',practice:'When changing treatment areas, cover the previous area before exposing the next agreed area.|Ao mudar de região, cubra a anterior antes de descobrir a próxima área combinada.',img:null},
