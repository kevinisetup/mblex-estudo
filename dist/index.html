{"id": 105, "hook": "Tension feedback is a guide, not a shield.|O sinal de tensão orienta; não é um escudo.", "practice": "Keep Amira within a comfortable, agreed effort and stop if pain appears instead of chasing a reflex with more force.|Mantenha Amira no esforço confortável acordado e pare se houver dor, sem tentar provocar um reflexo com mais força.", "img": {"show": "Órgão de Golgi no tendão em série com o músculo e seta de tensão.", "avoid": "Golgi como sensor de temperatura ou garantia absoluta contra lesão.", "search": "Golgi tendon organ in series tendon tension feedback diagram", "capEN": "Tendon tension provides feedback for force regulation.", "capPT": "A tensão tendínea fornece retorno para regular a força.", "check": "Não representar toda resposta como inibição obrigatória em qualquer tarefa."}},

cisão de hoje?","14":"Nora, 37, has had back tension for two weeks. What should the practitioner do FIRST before switching techniques?|Nora, 37 anos, sente tensão nas costas há duas semanas. O que o profissional deve fazer PRIMEIRO antes de mudar de técnica?","15":"Omar, 46, has had shoulder pain for five days and needs clarification during intake. A client has trouble understanding your intake questions. What should the practitioner do FIRST to make intake understandable?|Omar, 46 anos, sente dor no ombro há cinco dias e precisa de esclarecimento na avaliação. Cliente tem dificuldade para entender suas perguntas de avaliação. O que o profissional deve fazer PRIMEIRO para tornar a avaliação compreensível?","16":"Pia, 57, has had worsening back pain since a session three days ago. A client reports worsening pain after your last session. What should you do FIRST?|Pia, 57 anos, sente dor nas costas piorando desde uma sessão há três dias. Cliente relata piora da dor após a última sessão. O que fazer PRIMEIRO?","17":"Quin, 44, has had neck pain for one month and brings a referral. A referral requests a technique you have never learned. What should the practitioner do FIRST about the unfamiliar technique?|Quin, 44 anos, sente dor cervical há um mês e traz um encaminhamento. Um encaminhamento solicita técnica que você nunca aprendeu. O que o profissional deve fazer PRIMEIRO quanto à técnica que não domina?","18":"Rae, 35, has had wrist discomfort for two weeks and requests a medical diagnosis from a massage therapist. Which professional limit should guide the therapist's decision to stay within training and applicable law?|Rae, 35 anos, sente desconforto no punho há duas semanas e pede diagnóstico médico ao massoterapeuta. Qual limite profissional deve orientar a decisão de respeitar formação e lei aplicável?","19":"Sam, 49, has had calf tightness for three weeks. Before choosing a technique, the practitioner explains risks and alternatives and Sam agrees. Which consent concept should guide the plan?|Sam, 49 anos, sente tensão na panturrilha há três semanas. Antes de escolher a técnica, o profissional explica riscos e alternativas, e Sam concorda. Qual conceito de consentimento deve orientar o plano?","20":"Tia, 41, has had back tension for two weeks and requests careful draping. Which client interest should the practitioner protect when arranging coverage?|Tia, 41 anos, sente tensão nas costas há duas semanas e pede cobertura cuidadosa. Qual interesse da cliente o profissional deve proteger ao arrumar o lençol?","21":"Uma, 58, has discussed discomfort with touch for four weeks. A client relates to the therapist as if the therapist were a critical parent. Which term BEST fits?|Uma, 58 anos, discute desconforto com o toque há quatro semanas. Cliente se relaciona com terapeuta como se fosse um pai crítico. Qual termo MELHOR se aplica?","22":"Vic, 43, has noticed emotional discomfort in sessions for three weeks. The therapist's own unresolved family feelings begin to influence care. Which boundary concept should the therapist recognize and address before continuing?|Vic, 43 anos, nota desconforto emocional nas sessões há três semanas. Sentimentos familiares não resolvidos do terapeuta começam a influenciar o cuidado. Qual conceito de limites ele deve reconhecer e abordar antes de continuar?","23":"Wes, 62, has felt vulnerable during care for two weeks and treats the therapist's advice as unquestionable. Which influence should the practitioner recognize when inviting Wes to make his own decisions?|Wes, 62 anos, sente-se vulnerável há duas semanas e aceita conselhos sem questionar. Qual influência o profissional deve reconhecer ao convidá-lo a decidir por si?","24":"Xena, 39, has had neck tension for one month and asks for extra favors. A client repeatedly asks for favors outside agreed session times. Which issue should be clarified FIRST?|Xena, 39 anos, sente tensão cervical há um mês e pede favores extras. Cliente pede repetidamente favores fora dos horários combinados. Qual questão esclarecer PRIMEIRO?","25":"Yuri, 45, has discussed exchanging massage for business services for two weeks and also becomes the client's customer. Which added relationship should the practitioner evaluate before agreeing?|Yuri, 45 anos, conversa há duas semanas sobre trocar massagem por serviços e também vira cliente da pessoa. Qual relação adicional o profissional deve avaliar antes de concordar?","26":"Zoe, 53, has been reviewing a practice sale for three weeks. A potential buyer of your practice asks for named client histories. What should the practitioner do FIRST with the request for client records?|Zoe, 53 anos, avalia a venda do consultório há três semanas. Possível comprador da sua prática pede históricos identificados dos clientes. O que o profissional deve fazer PRIMEIRO diante do pedido de prontuários?","27":"Ari, 34, has felt distressed by touch for two sessions over one week. A client becomes distressed during touch. What should you do FIRST?|Ari, 34 anos, sente angústia com o toque em duas sessões ao longo de uma semana. Cliente fica angustiado durante o toque. O que fazer PRIMEIRO?","28":"Bea, 27, has felt uneasy about a therapist's behavior for two weeks. Which behavior is incompatible with professional sexual boundaries?|Bea, 27 anos, sente-se desconfortável com a conduta de um terapeuta há duas semanas. Qual conduta é incompatível com limites sexuais profissionais?","29":"Cal, 40, has questioned the practitioner's qualifications for a week. The practitioner seeks needed training and describes credentials honestly. Which professional framework should guide this response?|Cal, 40 anos, questiona as qualificações profissionais há uma semana. O profissional busca formação e descreve suas credenciais honestamente. Qual estrutura profissional deve orientar essa resposta?","30":"Dee, 48, has considered a new technique for three weeks and wants to control consent. All support informed consent EXCEPT which action?|Dee, 48 anos, considera uma técnica nova há três semanas e quer controlar o consentimento. Todas apoiam consentimento informado, EXCETO qual ação?","31":"Eli, 56, has had a privacy concern for ten days. A friend asks whether a named person is your client. What should the practitioner say FIRST about the named client's status?|Eli, 56 anos, tem uma preocupação com privacidade há dez dias. Amigo pergunta se determinada pessoa é sua cliente. O que o profissional deve dizer PRIMEIRO sobre o status do cliente mencionado?","32":"Fay, 51, has requested special access for two weeks. A client offers an expensive gift and requests special access. What should the practitioner do FIRST about the gift and requested access?|Fay, 51 anos, pede acesso especial há duas semanas. Cliente oferece presente caro e pede acesso especial. O que o profissional deve fazer PRIMEIRO sobre o presente e o acesso pedido?","33":"Gus, 48, has had back stiffness for three weeks and agrees to a gentle introductory stroke. Which technique should the practitioner choose for long, smooth gliding movements?|Gus, 48 anos, sente rigidez nas costas há três semanas e concorda com manobra inicial suave. Qual técnica o profissional deve escolher para deslizamentos longos e suaves?","34":"Hana, 44, has had calf tightness for a month and agrees to kneading without pain. Which technique should the practitioner choose to lift and knead soft tissue?|Hana, 44 anos, sente tensão na panturrilha há um mês e concorda com amassamento sem dor. Qual técnica o profissional deve escolher para levantar e amassar o tecido mole?","35":"Ian, 38, has had shoulder tension for two weeks and asks about rhythmic tapping. Rhythmic tapping is applied to soft tissue. Which term names the technique?|Ian, 38 anos, sente tensão no ombro há duas semanas e pergunta sobre percussão rítmica. Batidas rítmicas são aplicadas ao tecido mole. Qual termo nomeia a técnica?","36":"Jill, 50, has had back tension for six weeks and asks for small comfortable oscillations. Which technique should the practitioner choose to transmit them through the hand?|Jill, 50 anos, sente tensão nas costas há seis semanas e pede pequenas oscilações confortáveis. Qual técnica o profissional deve escolher para transmiti-las pela mão?","37":"Kai, 42, has had neck tension for three weeks and asks about stationary pressure. A therapist applies pressure into tissue without gliding. Which term describes this?|Kai, 42 anos, sente tensão cervical há três semanas e pergunta sobre pressão estacionária. Terapeuta aplica pressão sobre o tecido sem deslizar. Qual termo descreve isso?","38":"Luz, 47, has had localized back tension for one month and asks about a small rubbing stroke. Localized rubbing uses little glide over the skin. Which term describes this?|Luz, 47 anos, sente tensão localizada nas costas há um mês e pergunta sobre fricção curta. Movimento localizado usa pouco deslizamento sobre a pele. Qual termo descreve isso?","39":"Max, 55, has had mild back discomfort for three months and asks whether massage guarantees a cure. Which claim should the practitioner choose when setting realistic expectations?|Max, 55 anos, sente leve desconforto nas costas há três meses e pergunta se massagem garante cura. Qual afirmação o profissional deve escolher ao definir expectativas realistas?","40":"Nia, 31, has had neck tension for two weeks and feels better after one session. Which conclusion should the practitioner document without promising that the improvement will last?|Nia, 31 anos, sente tensão cervical há duas semanas e melhora após uma sessão. Qual conclusão o profissional deve registrar sem prometer duração do efeito?","41":"Oli, 60, has had shoulder discomfort for four weeks and now reports painful pressure. A client tenses and says the pressure hurts. What should you do FIRST?|Oli, 60 anos, sente desconforto no ombro há quatro semanas e agora relata pressão dolorosa. Cliente contrai o corpo e diz que a pressão dói. O que fazer PRIMEIRO?","42":"Paz, 37, has had back pain for six weeks. The practitioner is preparing a discussion of reasonable limits. Which claim should be excluded because it promises a guaranteed outcome? (EXCEPT)|Paz, 37 anos, sente dor nas costas há seis semanas. O profissional prepara uma conversa sobre limites razoáveis. Qual afirmação deve ser excluída por prometer um resultado garantido? (EXCETO)","43":"Quin, 46, has had thigh tightness for one month and asks about sustained fascial work. Slow sustained manual pressure targets restrictions in fascia. Which approach BEST matches this description?|Quin, 46 anos, sente tensão na coxa há um mês e pergunta sobre trabalho fascial sustentado. Pressão manual lenta e sustentada visa restrições na fáscia. Qual abordagem MELHOR corresponde à descrição?","44":"Rui, 52, has had neck pain for three weeks and asks about deeper pressure. A client asks whether deep pressure is always more effective. What should the practitioner explain FIRST about pressure?|Rui, 52 anos, sente dor cervical há três semanas e pergunta sobre pressão mais profunda. Cliente pergunta se pressão profunda é sempre mais eficaz. O que o profissional deve explicar PRIMEIRO sobre a pressão?","45":"Sia, 63, has been receiving cancer care for four months and asks about massage. A person in cancer care asks for massage. Which point should the practitioner clarify FIRST before planning care?|Sia, 63 anos, está em tratamento oncológico há quatro meses e pergunta sobre massagem. Pessoa em tratamento de câncer solicita massagem. Qual ponto o profissional deve esclarecer PRIMEIRO antes de planejar o atendimento?","46":"Tom, 45, has felt sore for two days after forceful work. A client feels sore after forceful work. Which explanation should be avoided?|Tom, 45 anos, sente dor há dois dias após trabalho com muita força. Cliente fica dolorido após trabalho intenso. Qual explicação deve ser evitada?","47":"Uma, 54, has had shoulder pain for three weeks and reports less pain after ssional deve explicar PRIMEIRO antes de iniciar o atendimento?","53":"Ava, 45, has discussed exchanging massage for goods for two weeks. You receive goods worth $100 for a massage. What gross barter income is generally included?|Ava, 45 anos, conversa sobre troca de massagem por produtos há duas semanas. Você recebe bens de valor justo de US$ 100 por massagem. Que renda bruta de permuta geralmente entra na declaração?","54":"Ben, 38, has reviewed barter income for a month. What portion of the fair market value of taxable barter proceeds is generally included in gross income?|Ben, 38 anos, revisa rendimentos de troca há um mês. Que parcela do valor justo de permuta tributável geralmente integra a renda bruta?","55":"Cora, 50, has asked about insurance coverage for three weeks. Before promising insurance reimbursement, what should the practitioner do FIRST?|Cora, 50 anos, pergunta sobre cobertura do seguro há três semanas. Antes de prometer reembolso por seguro, o que o profissional deve fazer PRIMEIRO?","56":"Dan, 42, has had back discomfort for a month and asks about visit records. Which record is MOST appropriate after a session?|Dan, 42 anos, sente desconforto nas costas há um mês e pergunta sobre o prontuário. Qual registro é MAIS apropriado após uma sessão?","57":"Eve, 57, has questioned a record error for four days. You discover an error in a completed record. What should the practitioner do FIRST to correct the record appropriately?|Eve, 57 anos, questiona um erro no prontuário há quatro dias. Você descobre erro em registro concluído. O que o profissional deve fazer PRIMEIRO para corrigir o prontuário adequadamente?","58":"Finn, 46, has reported an injury claim for two weeks. A client alleges negligent performance of massage caused injury. Which coverage addresses this professional claim?|Finn, 46 anos, relata uma alegação de lesão há duas semanas. Cliente alega lesão por execução negligente de massagem. Qual cobertura trata dessa alegação profissional?","59":"Gia, 40, has arrived late to appointments for three weeks. A client repeatedly arrives late. What should the practitioner do FIRST about the repeated lateness?|Gia, 40 anos, chega atrasada às sessões há três semanas. Cliente chega atrasado repetidamente. O que o profissional deve fazer PRIMEIRO diante dos atrasos repetidos?","60":"Hugo, 35, has discussed access to client records for one week. A colleague asks for your account password to read client records. What should the practitioner do FIRST about the password request?|Hugo, 35 anos, discute acesso a prontuários há uma semana. Colega pede sua senha para ler prontuários. O que o profissional deve fazer PRIMEIRO diante do pedido de senha?","61":"Iris, 29, has asked about MBLEx licensure for two weeks. A learner passed the MBLEx but has not received state licensure. What is the BEST interpretation?|Iris, 29 anos, pergunta sobre licenciamento após o MBLEx há duas semanas. Aluna passou no MBLEx, mas ainda não recebeu licença estadual. Qual a MELHOR interpretação?","62":"Jon, 58, has had sudden chest pain and shortness of breath for five minutes. A client develops sudden shortness of breath and chest pain during a visit. What should the practitioner do FIRST when these symptoms appear?|Jon, 58 anos, sente dor súbita no peito e falta de ar há cinco minutos. Cliente apresenta falta de ar súbita e dor no peito durante a visita. O que o profissional deve fazer PRIMEIRO quando surgem esses sintomas?","63":"Kira, 65, has taken an anticoagulant for six months and bruises easily. A client uses an anticoagulant. Which concern is MOST relevant to forceful massage?|Kira, 65 anos, usa anticoagulante há seis meses e desenvolve hematomas facilmente. Cliente usa anticoagulante. Qual preocupação é MAIS relevante para massagem intensa?","64":"Lia, 32, is in her third trimester and has had positional discomfort for two weeks. A client in late pregnancy needs a comfortable massage position. Which is generally appropriate?|Lia, 32 anos, está no terceiro trimestre e sente desconforto posicional há duas semanas. Cliente no fim da gestação precisa de posição confortável para massagem. Qual geralmente é apropriada?","65":"Max, 49, has felt feverish and acutely ill since yesterday. A client arrives with fever and feels acutely ill. What should the practitioner do FIRST about today's appointment?|Max, 49 anos, sente febre e mal-estar agudo desde ontem. Cliente chega com febre e mal-estar agudo. O que o profissional deve fazer PRIMEIRO quanto à sessão de hoje?","66":"Nia, 43, has had a fresh bruise on the treatment area for one day. A fresh bruise is present on the intended treatment area. What should the practitioner do FIRST about the bruised area?|Nia, 43 anos, tem hematoma recente na área de atendimento há um dia. Há hematoma recente na área pretendida. O que o profissional deve fazer PRIMEIRO quanto à área com hematoma?","67":"Oli, 72, has had osteoporosis-related fragility for two years. A client has fragile bones from osteoporosis. What should the practitioner adjust FIRST for tissue safety?|Oli, 72 anos, tem fragilidade relacionada à osteoporose há dois anos. Cliente tem fragilidade óssea por osteoporose. O que o profissional deve ajustar PRIMEIRO para proteger o tecido?","68":"Pia, 61, has had reduced foot sensation for four months. A client has reduced sensation in the feet. What should the practitioner account for FIRST when using heat or pressure?|Pia, 61 anos, tem sensibilidade reduzida nos pés há quatro meses. Cliente tem sensibilidade reduzida nos pés. O que o profissional deve considerar PRIMEIRO ao usar calor ou pressão?","69":"Quin, 56, has had one-sided calf swelling since surgery three days ago. New one-sided calf swelling follows surgery. The client wants only light massage. What should the practitioner do FIRST before any calf massage?|Quin, 56 anos, tem inchaço unilateral na panturrilha desde cirurgia há três dias. Surge inchaço unilateral na panturrilha após cirurgia. Cliente quer só massagem leve. O que o profissional deve fazer PRIMEIRO antes de massagear a panturrilha?","70":"Rae, 45, has had shoulder stiffness for two weeks and now feels sharp pain on stretching. A client reports sharp pain during a stretch. What should happen FIRST?|Rae, 45 anos, sente rigidez no ombro há duas semanas e agora dor aguda ao alongar. Cliente relata dor aguda durante alongamento. O que fazer PRIMEIRO?","71":"Sam, 37, has had an open wound on the planned treatment area for two days. A client has an open skin wound where massage was planned. What should the practitioner do FIRST at the wounded area?|Sam, 37 anos, tem ferida aberta na área planejada há dois dias. Cliente tem ferida aberta onde a massagem foi planejada. O que o profissional deve fazer PRIMEIRO na área da ferida?","72":"Tia, 62, has had a stable chronic condition for years but a new symptom for one week. A chronic condition is stable, but the client reports a new unexplained symptom. What should the practitioner do FIRST before proceeding with the session?|Tia, 62 anos, tem condição crônica estável há anos, mas sintoma novo há uma semana. Condição crônica está estável, mas cliente relata novo sintoma sem explicação. O que o profissional deve fazer PRIMEIRO antes de continuar a sessão?","73":"Uma, 69, has felt dizzy on rising since starting blood-pressure medication two weeks ago. A client taking blood pressure medicine feels dizzy while rising from the table. What should you do FIRST?|Uma, 69 anos, sente tontura ao levantar desde que iniciou medicação para pressão há duas semanas. Cliente em uso de anti-hipertensivo sente tontura ao levantar da maca. O que fazer PRIMEIRO?","74":"Vic, 59, has used prednisone for six months and developed thin, easily bruised skin. A client using long-term prednisone has thin skin and easy bruising. Which response is BEST?|Vic, 59 anos, usa prednisona há seis meses e desenvolveu pele fina, que forma hematomas facilmente. Cliente usa prednisona prolongadamente e tem pele fina e hematomas fáceis. Qual resposta é MELHOR?","75":"Wes, 54, has had sudden breathing difficulty and chest pain for five minutes. Which finding requires the MOST urgent escalation?|Wes, 54 anos, sente falta de ar súbita e dor no peito há cinco minutos. Qual achado exige encaminhamento MAIS urgente?","76":"Nora, 58, has difficulty bringing a cup to her mouth six weeks after elbow immobilization. At intake, which elbow movement should the gentle plan assess and prioritize?|Nora, 58 anos, tem dificuldade para levar um copo à boca seis semanas após imobilização do cotovelo. Na avaliação, qual movimento do cotovelo o plano suave deve avaliar e priorizar?","77":"Eli, 67, has struggled to straighten his knee for four weeks after a period of reduced activity. During movement assessment, which action should guide a gentle functional goal?|Eli, 67 anos, tem dificuldade para endireitar o joelho há quatro semanas após um período de pouca atividade. Na avaliação do movimento, qual ação deve orientar uma meta funcional suave?","78":"Maya, 43, has had trouble reaching sideways to a shelf for three weeks. With comfortable movement cleared at intake, which shoulder action should the plan assess?|Maya, 43 anos, tem dificuldade para alcançar uma prateleira lateral há três semanas. Com movimento confortável liberado na avaliação, qual ação do ombro o plano deve avaliar?","79":"Leo, 51, has had difficulty returning his raised arm to his side for two weeks. In a comfortable shoulder movement check, which action should be assessed?|Leo, 51 anos, tem dificuldade para trazer o braço erguido de volta ao lado do corpo há duas semanas. Numa avaliação confortável do ombro, qual ação deve ser examinada?","80":"Sara, 46, has struggled to turn her palm upward to hold a bowl for one month. During forearm mobility assessment, which movement should the practitioner check?|Sara, 46 anos, tem dificuldade para virar a palma para cima e segurar uma tigela há um mês. Na avaliação da mobilidade do antebraço, qual movimento o profissional deve verificar?","81":"Omar, 37, has had trouble turning a key with his palm moving downward for three weeks. During a gentle forearm assessment, which movement should be checked?|Omar, 37 anos, tem dificuldade para girar uma chave com a palma virando para baixo há três semanas. Numa avaliação suave do antebraço, qual movimento deve ser verificado?","82":"Bea, 62, has had difficulty lifting her toes while walking for two weeks. At intake, which ankle action should be assessed without forcing the joint?|Bea, 62 anos, tem dificuldade para elevar os dedos do pé ao caminhar há duas semanas. Na avaliação, qual ação do tornozelo deve ser examinada sem forçar a articulação?","83":"Ivan, 49, has had difficulty pressing a pedal for five weeks. During ankle movement assessment, which action should guide the functional goal?|Ivan, 49 anos, tem dificuldade para pressionar um pedal há cinco semanas. Na avaliação do tornozelo, qual ação deve orientar a meta funcional?","84":"Ana, 34, has had mild elbow weakness for four weeks and is cleared for light exercise. She lifts a small weight while the elbow flexors shorten. Which contraction should the plan identify for this lifting phase?|Ana, 34 anos, tem leve fraqueza do cotovelo há quatro semanas e liberação para exercício leve. Ela levanta um peso pequeno enquanto os flexores encurtam. Qual contração o plano deve identificar nessa fase de elevação?","85":"Ben, 55, has had difficulty lowering a light object smoothly for six weeks. His elbow flexors lengthen while controlling the descent. Which contraction should a supervised plan target?|Ben, 55 anos, tem dificuldade para baixar suavemente um objeto leve há seis semanas. Os flexores do cotovelo alongam enquanto controlam a descida. Qual contração um plano supervisionado deve trabalhar?","86":"Cora, 41, has had trouble holding a small package steady for three weeks. Her elbow angle stays fixed during the hold. Which contraction should the movement plan recognize?|Cora, 41 anos, tem dificuldade para segurar uma pequena encomenda parada há três semanas. O ângulo do cotovelo fica fixo durante a sustentação. Qual contração o plano de movimento deve reconhecer?","87":"Dan, 39, has had difficulty bending his elbow smoothly for a month. While the elbow flexors produce the movement, which role should the practitioner assign to the triceps in the movement analysis?|Dan, 39 anos, tem dificuldade para dobrar o cotovelo suavemente há um mês. Enquanto os flexores produzem o movimento, qual papel o profissional deve atribuir ao tríceps na análise?","88":"Elena, 52, has had posterior heel discomfort for five weeks after walking. At intake, which tissue transmits calf-muscle force to the heel and should guide avoiding painful pressure?|Elena, 52 anos, tem desconforto atrás do calcanhar há cinco semanas após caminhar. Na avaliação, qual tecido transmite a força da panturrilha ao calcanhar e orienta evitar pressão dolorosa?","89":"Finn, 29, has had lateral ankle pain for ten days after a medically assessed sprain. Which tissue joins adjacent bones and should make the practitioner avoid stressing the injured area?|Finn, 29 anos, tem dor lateral no tornozelo há dez dias após entorse avaliada por profissional de saúde. Qual tecido une ossos vizinhos e orienta evitar sobrecarga na região lesionada?","90":"Gina, 64, has had joint discomfort for three months and asks why forceful rubbing over the joint is not the plan. Which low-friction covering of bone ends is relevant to this explanation?|Gina, 64 anos, tem desconforto articular há três meses e pergunta por que o plano não inclui fricção forte sobre a articulação. Qual revestimento de baixo atrito das extremidades ósseas é relevante?","91":"Hugo, 47, has had hand tingling for six weeks and reports a clinical evaluation for carpal tunnel symptoms. Which nerve is relevant when the practitioner avoids pressure and refers back for changing symptoms?|Hugo, 47 anos, tem formigamento na mão há seis semanas e relata avaliação clínica de sintomas do túnel do carpo. Qual nervo importa ao evitar pressão e encaminhar sintomas novos?","92":"Iris, 36, has had tingling near the inner elbow for two weeks. During intake, which nerve behind the medial epicondyle should guide avoiding strong local pressure and considering referral?|Iris, 36 anos, tem formigamento perto da parte interna do cotovelo há duas semanas. Na avaliação, qual nervo atrás do epicôndilo medial orienta evitar pressão forte local e considerar encaminhamento?","93":"Jules, 59, has discussed a circulation concern with a clinician for three weeks and asks about blood leaving the heart. Which vessel should the practitioner identify when explaining the route without diagnosing the concern?|Jules, 59 anos, conversa com seu profissional de saúde sobre circulação há três semanas e pergunta sobre o sangue que sai do coração. Qual vaso o massoterapeuta deve indicar sem diagnosticar o problema?","94":"Kira, 44, has noticed mild swelling for one month and has been medically assessed. When explaining fluid return without promising treatment, which vessel system should the practitioner point out?|Kira, 44 anos, nota leve inchaço há um mês e já foi avaliada clinicamente. Ao explicar o retorno de líquido sem prometer tratamento, qual sistema de vasos o profissional deve indicar?","95":"Liam, 32, has felt stressed before sleep for four weeks and asks what body system supports rest and digestion. Which autonomic division should the practitioner name during the discussion?|Liam, 32 anos, sente estresse antes de dormir há quatro semanas e pergunta qual sistema favorece repouso e digestão. Qual divisão autonômica o profissional deve nomear?","96":"Mina, 40, has had episodes of alarm and rapid heartbeat for three weeks and is discussing them with a clinician. Which autonomic division explains this response, while the practitioner stays within scope?|Mina, 40 anos, tem episódios de alerta e batimento acelerado há três semanas e os discute com um profissional de saúde. Qual divisão autonômica explica essa resposta, respeitando o escopo da massagem?","97":"Nico, 61, has taken a prescribed diuretic for two months and asks which organs produce urine. Which organs should the practitioner identify while directing medication questions to the prescriber?|Nico, 61 anos, usa diurético prescrito há dois meses e pergunta quais órgãos produzem urina. Quais órgãos o profissional deve indicar, encaminhando dúvidas sobre medicação ao prescritor?","98":"Olivia, 53, has discussed reduced exercise tolerance with a clinician for six weeks. In an anatomy explanation, which tiny vessels exchange gases with tissues and should be identified on the diagram?|Olivia, 53 anos, conversa com seu médico sobre menor tolerância ao exercício há seis semanas. Numa explicação de anatomia, quais vasos pequenos trocam gases com os tecidos e devem ser apontados no diagrama?","99":"Yara, 41, has had back tension for three weeks and asks about body coverage. Appropriate draping protects which client interest?|Yara, 41 anos, sente tensão nas costas há três semanas e pergunta sobre cobertura do corpo. A cobertura adequada com lençóis protege qual interesse do cliente?","100":"Zed, 33, has asked about session fees for one week. A client asks about the price before treatment. What should you do?|Zed, 33 anos, pergunta sobre os preços da sessão há uma semana. Cliente pergunta o preço antes do atendimento. O que fazer?","101":"Maya, 28, has a medically assessed ankle sprain from 24 hours ago, with swelling and local warmth. Sensation and circulation are normal. At intake, which thermal option is most appropriate, while deferring massage over the injury?|Maya, 28 anos, tem entorse de tornozelo avaliada por profissional de saúde há 24 horas, com edema e calor local. Sensibilidade e circulação são normais. Na avaliação inicial, qual opção térmica é mais adequada, adiando a massagem sobre a lesão?","102":"Luis, 46, reports stable neck stiffness for six months after desk work, without recent injury, redness or swelling. Sensation and circulation are normal. Which preparation best fits the agreed gentle session?|Luis, 46 anos, relata rigidez cervical estável há seis meses após trabalho sentado, sem lesão recente, vermelhidão ou edema. Sensibilidade e circulação são normais. Qual preparação combina melhor com a sessão suave acordada?","103":"Rosa, 62, arrives for hand massage after three months of recurrent finger coldness. Today her fingers are pale and cold, and she reports impaired circulation. What should the practitioner do about a planned cold application?|Rosa, 62 anos, chega para massagem nas mãos após três meses de episódios de dedos frios. Hoje estão pálidos e frios, e ela relata circulação comprometida. O que fazer com a aplicação de frio planejada?","104":"Noah, 31, has mild hamstring tightness for two weeks without injury. During an agreed gentle stretch, a student suddenly speeds up the movement and the muscle resists. Which receptor signal supports returning to a slow, comfortable stretch?|Noah, 31 anos, tem leve tensão posterior de coxa há duas semanas, sem lesão. Durante alongamento suave acordado, um aluno acelera o movimento e o músculo resiste. Qual sinal receptor fundamenta voltar ao alongamento lento e confortável?","105":"Amira, 39, has calf tightness for four weeks and is cleared for comfortable movement. During a low-effort contract-relax exercise, she asks to use maximal force. Which explanation best supports keeping the effort controlled?|Amira, 39 anos, tem tensão na panturrilha há quatro semanas e está liberada para movimento confortável. Em exercício de contrair e relaxar com pouco esforço, pede força máxima. Qual explicação melhor fundamenta manter o esforço controlado?","106":"Ethan, 45, has mild elbow stiffness for six weeks after immobilization and has clearance for gentle range of motion. For the humeroulnar articulation, which movement should the practitioner choose?|Ethan, 45 anos, tem leve rigidez do cotovelo há seis semanas após imobilização e liberação para mobilidade suave. Na articulação umeroulnar, qual movimento escolher?","107":"Sofia, 54, has thumb-base discomfort for three months when opening jars. After assessment and clearance for gentle movement, which description best guides work at the first carpometacarpal joint?|Sofia, 54 anos, tem desconforto na base do polegar há três meses ao abrir potes. Após avaliação e liberação para movimento suave, qual descrição orienta melhor o trabalho na primeira carpometacarpal?","108":"Daniel, 42, reports a draining skin lesion on his lower leg for two days at massage intake. If contact with drainage-contaminated linen is anticipated, what action and PPE are appropriate?|Daniel, 42 anos, relata uma lesão exsudativa na perna há dois dias na avaliação inicial da massagem. Se houver contato previsto com roupa contaminada por secreção, qual conduta e EPI são adequados?","109":"Julia, a 35-year-old massage therapist, has lower-back fatigue at the end of workdays for two weeks. She bends over a low table and reaches across a client during back work. Which adjustment best addresses the observed mechanics?|Julia, massoterapeuta de 35 anos, sente fadiga lombar ao fim do expediente há duas semanas. Inclina-se sobre uma mesa baixa e alcança o outro lado do cliente durante o trabalho nas costas. Qual ajuste melhor aborda a mecânica observada?","110":"Theo, 26, bruised his forearm 12 hours ago. At intake the area is warm, swollen and tender, and he asks for deep local massage. Which process and decision fit this early response?|Theo, 26 anos, sofreu contusão no antebraço há 12 horas. Na avaliação, a região está quente, inchada e sensível, e ele pede massagem profunda local. Qual processo e decisão combinam com essa resposta inicial?","111":"Grace, 48, has a fully closed surgical scar eight weeks after a forearm procedure. Her clinician has cleared gentle scar work with gradual loading. Which tissue change supports gradual rather than maximal progression?|Grace, 48 anos, tem cicatriz cirúrgica totalmente fechada oito semanas após procedimento no antebraço. Seu profissional de saúde liberou trabalho suave na cicatriz com carga gradual. Qual mudança tecidual fundamenta progressão gradual, e não máxima?","112":"Nina, 37, has abdominal muscle tension for three weeks after exercise, with no red flags at assessment. She agrees to gentle abdominal work but asks to keep both legs covered. What should the practitioner do before moving the drape?|Nina, 37 anos, tem tensão muscular abdominal há três semanas após exercícios, sem sinais de alerta na avaliação. Aceita trabalho abdominal suave, mas pede para manter as duas pernas cobertas. O que fazer antes de mover a cobertura?"};

const HUMAN_PATCH={"1":"Ava, 45, reports shoulder pain for one week at intake. What should the practitioner do FIRST before selecting a technique?|Ava, 45 anos, relata dor no ombro há uma semana na avaliação. O que o profissional deve fazer PRIMEIRO antes de escolher uma técnica?","8":"Hugo, 61, has had shoulder pain for ten days. During treatment he asks the practitioner to stop touching it. What should happen FIRST?|Hugo, 61 anos, sente dor no ombro há dez dias. Durante a sessão, pede ao profissional que pare de tocá-lo. O que deve acontecer PRIMEIRO?","9":"Iris, 48, has had a newly swollen, warm calf since a long flight yesterday. What should the practitioner do FIRST before any massage of that leg?|Iris, 48 anos, tem panturrilha inchada e quente desde um voo longo ontem. O que o profissional deve fazer PRIMEIRO antes de qualquer massagem nessa perna?","10":"Jon, 59, has been limping since a fall two hours ago. At intake, what should the practitioner do FIRST before continuing his usual session?|Jon, 59 anos, manca desde uma queda há duas horas. Na avaliação, o que o profissional deve fazer PRIMEIRO antes de continuar a sessão habitual?","62":"Jon, 58, has had sudden chest pain and shortness of breath for five minutes during a visit. What should the practitioner do FIRST while arranging emergency help?|Jon, 58 anos, sente dor súbita no peito e falta de ar há cinco minutos durante a visita. O que o profissional deve fazer PRIMEIRO enquanto aciona a emergência?","64":"Lia, 32, is in her third trimester and has felt uncomfortable lying flat for two weeks. Which supported position should the practitioner offer for a comfortable massage?|Lia, 32 anos, está no terceiro trimestre e sente desconforto ao deitar de costas há duas semanas. Qual posição apoiada o profissional deve oferecer para uma massagem confortável?","65":"Max, 49, has had fever and acute illness since yesterday. What should the practitioner do FIRST about today's elective session?|Max, 49 anos, tem febre e mal-estar agudo desde ontem. O que o profissional deve fazer PRIMEIRO quanto à sessão eletiva de hoje?","69":"Quin, 56, has had new one-sided calf swelling since surgery three days ago. Although he asks for light massage, what should the practitioner do FIRST?|Quin, 56 anos, tem inchaço novo em uma panturrilha desde cirurgia há três dias. Embora peça massagem leve, o que o profissional deve fazer PRIMEIRO?","75":"Wes, 54, has had sudden breathing difficulty and chest pain for five minutes. Which finding in this situation requires the most urgent escalation?|Wes, 54 anos, sente falta de ar súbita e dor no peito há cinco minutos. Qual achado nessa situação exige o encaminhamento mais urgente?"};

let ptEnabled=true;
let state={screen:'intro',at:0,answers:Array(20).fill(null),profile:null,exam:null};
function mount(html,light=false){document.body.classList.toggle('pt-off',!ptEnabled);document.body.classList.toggle('light',light);$('#app').innerHTML='<div class="fade">'+html+'</div>';const heading=$('main h1,main h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}window.scrollTo(0,0);}
function bind(id,fn){const el=document.getElementById(id);if(el)el.onclick=fn;}
function button(id,label,cls=''){return `<button type="button" id="${id}" class="${cls}">${label}</button>`;}
function startProfile(){state={screen:'profile',at:0,answers:Array(20).fill(null),profile:null,exam:null};renderItem();}
function intro(){state.screen='intro';mount(`<section class="hero"><div><p class="eyebrow">MBLEx · treino bilíngue</p><h1>Simulado MBLEx</h1><p class="lead">${BANK.length} questões em inglês, com tradução em português abaixo.<br>O perfil de estudo é opcional e tem 20 escolhas.<br>Use Rodada para revisar e compartilhar as respostas.</p><div class="actions">${button('direct','Ir direto às questões','primary')}${button('start','Fazer perfil de estudo')}</div></div></section><details><summary>Fontes e limites</summary>${sourceNotes()}</details>`);bind('start',startProfile);bind('direct',()=>{state.profile=null;setup();});}
function ptButton(){return `<button type="button" id="pt-toggle" aria-label="PT on/off: tradução em português" aria-pressed="${ptEnabled}">${ptEnabled?'PT ligado':'PT desligado'}</button>${state.exam?button('round','Rodada · '+new Date(state.exam.started).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})):''}`;}
function wirePT(){bind('pt-toggle',()=>{ptEnabled=!ptEnabled;document.body.classList.toggle('pt-off',!ptEnabled);const b=$('#pt-toggle');b.setAttribute('aria-pressed',String(ptEnabled));b.textContent=ptEnabled?'PT ligado':'PT desligado';});bind('round',reviewReport);}
function renderItem(){const i=state.at,[axis,q,opts]=ITEMS[i];mount(`<section class="question-shell"><div class="topline">${ptButton()}</div><div class="topline"><span class="eyebrow" style="margin:0">Seu perfil de estudo</span><span class="small num">${String(i+1).padStart(2,'0')} <span class="muted">/ 20</span></span></div><progress value="${i}" max="20" aria-label="${i} de 20 itens anteriores concluídos"></progress><p class="eyebrow">${esc(AXES[axis].split(':')[0])}</p><div class="question-text"><h2 lang="en">${esc(PROFILE_EN[i][0])}</h2><p lang="pt-BR" class="pt">${esc(q)}</p><div class="choices">${opts.map((x,j)=>`<button type="button" class="choice profile-choice" data-choice="${j}" aria-pressed="${state.answers[i]===j}"><span class="letter">${letters[j]}</span><span><span lang="en">${esc(PROFILE_EN[i][1][j])}</span><span lang="pt-BR" class="pt">${esc(x)}</span></span></button>`).join('')}</div></div><div class="actions">${i?button('back','Voltar'):''}${button('next',i===19?'Ver meu perfil':'Continuar','primary')}</div><p class="small muted" style="margin-top:22px">Escolha uma opção para continuar. Ao sair ou recarregar, você perde as respostas.</p></section>`);wirePT();$('#next').disabled=state.answers[i]===null;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.answers[i]=Number(b.dataset.choice);document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#next').disabled=false;});bind('back',()=>{state.at--;renderItem();});bind('next',()=>{if(state.answers[i]===null)return;if(i===19){state.profile=classify(state.answers);result();}else{state.at++;renderItem();}});}
function classify(a){if(a.length!==20||a.some(x=>!Number.isInteger(x)||x<0||x>3))throw Error('Responda todos os 20 itens.');const axes={};for(const key of Object.keys(AXES)){const ids=ITEMS.map((x,i)=>x[0]===key?i:-1).filter(i=>i>=0);axes[key]=Math.round(ids.reduce((n,i)=>n+ITEMS[i][3][a[i]],0)/ids.length*10)/10;}const can=[2,7,14],mot=[4,18],errs=[5,11,15,19];const scores={'ROTAÇÃO':(axes.RET+axes.PRA)/8,'ANSIOSA':axes.ANS/4*.8+errs.filter(i=>a[i]===2).length/4*.2,'VISUAL':can.filter(i=>a[i]===0).length/3,'AUDITIVA':can.filter(i=>a[i]===1).length/3,'PRAGMÁTICA':mot.reduce((n,i)=>n+ITEMS[i][3][a[i]],0)/8};const ranked=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]);const dominant=ranked[0],secondary=ranked[1],tie=Math.abs(scores[dominant]-scores[secondary])<.001;const anxious=scores.ANSIOSA>=.6,visual=scores.VISUAL>=.5,pragmatic=scores.PRAGMÁTICA>=.5;return {axes,scores,dominant,secondary,tie,note:Math.round(100*(scores[dominant]-scores[secondary])),config:{timer:anxious?'não':'sim',imagem:visual?'alta':scores.VISUAL>0?'média':'baixa',idioma:a[12]>=2?'PT':'EN',bloco:anxious||pragmatic?10:20},hour:ITEMS[8][2][a[8]],created:new Date()};}
function exportProfile(p,a){
 const d=p.created,pad=n=>String(n).padStart(2,'0');
 const header=`PERFIL-MBLEX v1\nDATA: ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}\nPERFIL: ${p.dominant} | SECUNDÁRIO: ${p.secondary}\nEIXOS: ${Object.keys(AXES).map(k=>`${k} (${p.axes[k]}/4)`).join(' ')}\nRESPOSTAS: ${a.map((x,i)=>`${i+1}${letters[x]}`).join(' ')}\nCONFIG: timer=${p.config.timer} imagem=${p.config.imagem} idioma=${p.config.idioma} bloco=${p.config.bloco}\nNOTA: ${p.note}`;
 const detailed=a.map((choice,i)=>`${i+1} | ${ITEMS[i][0]} | ${letters[choice]} | EN: ${PROFILE_EN[i][1][choice]} | PT: ${ITEMS[i][2][choice]}`).join('\n');
 const complete=`DOMINANTE: ${p.dominant} | SECUNDÁRIO: ${p.secondary} | NOTA: ${p.note}\n${Object.keys(AXES).map(k=>`${k} ${p.axes[k]}/4`).join(' ')}`;
 return `${header}\n\nRESPOSTAS DETALHADAS:\n${detailed}\n\nPERFIL COMPLETO:\n${complete}`;
}
function result(){state.screen='result';const p=state.profile,c=p.config;mount(`<p class="eyebrow">02 / Seu ponto de partida</p><h1 style="font-size:40px">Resultado do perfil</h1><div class="grid"><section class="glass"><span class="tag">Perfil predominante no autorrelato</span><h2 class="profile-name">${p.dominant}</h2><p class="small muted">Secundário: ${p.secondary} · apoio complementar</p><div class="reading">${PROFILES[p.dominant].lines.map(x=>`<p>${x}</p>`).join('')}</div>${p.tie?'<p class="note">Houve empate. A ordem dos rótulos é apenas operacional; não há predominância clara.</p>':''}<h3>Prescrição prática</h3><ul class="prescription">${PROFILES[p.dominant].rx.map(x=>`<li>${x}</li>`).join('')}</ul><p class="small"><b>Complemento:</b> ${PROFILES[p.secondary].rx[0]}</p><p class="small muted">Horário relatado: ${p.hour.toLowerCase()}.</p></section><section class="glass"><h2>Seu treino, ajustado.</h2><div class="config"><div><span>Timer inicial</span>${c.timer==='sim'?'Ativado':'A partir do 3º bloco'}</div><div><span>Imagens recomendadas</span>${c.imagem}</div><div><span>Primeiro idioma</span>Inglês + português abaixo</div><div><span>Tamanho do bloco</span>${c.bloco} questões</div></div><p class="small muted">O treino aplica timer e bloco; a apresentação começa em inglês, com tradução abaixo. O modo prova usa 100 itens em 110 minutos. O treino completo usa ${Math.ceil(BANK.length/c.bloco)} blocos (o último com ${BANK.length%c.bloco||c.bloco} itens).</p><h3>Seis eixos</h3>${Object.keys(AXES).map(k=>`<div class="axis" title="${AXES[k]}"><span>${k}</span><progress value="${p.axes[k]}" max="4" aria-label="${AXES[k]}: ${p.axes[k]} de 4"></progress><span>${p.axes[k]}/4</span></div>`).join('')}<details><summary>Entender pontuação e limites</summary><p>As pontuações organizam apenas as respostas desta sessão. Não medem memória real, personalidade, inteligência ou aptidão. Visual e auditiva são preferências de recurso, não estilos de aprendizagem comprovados.</p><p>RET/PRA: maior pontuação indica mais dependência de estudo concentrado. CAN: apoio visual ou oral relatado. ERR/ANS: interferência de leitura ou pressão. MOT: apoio de metas e idioma; horário é uma escolha neutra.</p><p>NOTA ${p.note}/100: diferença entre os dois maiores índices, em pontos percentuais. É um indicador editorial de separação, não confiança estatística nem chance de aprovação. Empates seguem a ordem rotação, ansiosa, visual, auditiva, pragmática.</p></details></section></div><p class="note">Perfil não é diagnóstico clínico. Um questionário de autorrelato não confirma a causa dos erros; o desempenho no treino deve conferir esta hipótese.</p><div class="actions">${button('review','Perfil e respostas')}${button('generate','Gerar resumo para enviar')}${button('configure','Configurar simulado','primary')}</div><div id="export"></div><div class="actions">${button('redo','Refazer perfil','quiet')}</div>`);bind('review',reviewReport);bind('generate',()=>{const target=$('#export');target.innerHTML='<label for="summary-text">Resumo para enviar</label><textarea id="summary-text" readonly spellcheck="false"></textarea><div class="actions">'+button('copy','Copiar')+'</div><p id="copy-status" class="status" role="status"></p>';$('#summary-text').value=exportProfile(p,state.answers);bind('copy',()=>copyText($('#summary-text'),$('#copy-status')));target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});});bind('configure',setup);bind('redo',()=>{if(confirm('Refazer apaga as respostas desta sessão. Continuar?'))startProfile();});}
async function copyText(field,status){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(field.value);}else{field.focus();field.select();field.setSelectionRange(0,field.value.length);if(!document.execCommand('copy'))throw Error('Cópia indisponível');}status.textContent='Copiado. Cole na mensagem que desejar.';}catch{field.focus();field.select();field.setSelectionRange(0,field.value.length);status.textContent='Cópia automática bloqueada. O texto está selecionado: use Copiar no menu do aparelho.';}}
function sourceNotes(){return `<p>Questões autorais de treino, inspiradas nos temas dos prints e no formato público do MBLEx. Não são itens oficiais nem reprodução de um exame real. Fontes consultadas em 05/11/2026; os links precisam de internet, o treino não.</p><p><b>Correções dos prints:</b> educação, competência e lei delimitam <i lang="en">scope of practice</i>, não <i lang="en">certificate</i>. Flashback isolado não prova transferência. As questões 28 e 37 repetem draping; várias imagens enviadas repetem a mesma página. Venda de prática não autoriza divulgar prontuários indiscriminadamente.</p><p>O exame oficial é adaptativo; este banco é fixo e sua dificuldade é editorial. Percentual neste treino não prevê aprovação. Alegação fornecida, não verificada: "Em 87 questões medidas de três bancos públicos, B e C concentraram 62% das respostas corretas. Amostra pequena: use só como desempate, depois de eliminar." Os bancos e gabaritos dessa medição não foram fornecidos. Neste simulado, as alternativas são embaralhadas; a alegação não fundamenta preferir B ou C. Há duas repetições deliberadas, nas posições 40 e 80, para retomar conteúdo.</p><p><b>Exame:</b> 100 questões em 110 minutos; é preciso concluir todas. Resultado oficial PASS/FAIL, sem equivalência com percentual deste treino. Inscrição: US$ 265 no manual de setembro de 2026. O prazo de 30 dias citado no material enviado não foi confirmado nessa edição; confira a regra vigente com a FSMTB. <a href="${SOURCES.exam[1]}" target="_blank" rel="noopener noreferrer">Manual oficial</a>.</p><p><b>Nevada:</b> o conselho informa programa de pelo menos 625 horas e impressões digitais para verificação de antecedentes. Há outros requisitos; aprovação no exame não é licença. <a href="${SOURCES.nevada[1]}" target="_blank" rel="noopener noreferrer">Conselho de Nevada</a>.</p><details><summary>Mapa de revisão: termos e decisões</summary>${studyGuide()}</details><ul class="sources">${Object.values(SOURCES).map(([name,url])=>`<li><a href="${url}" target="_blank" rel="noopener noreferrer">${name}</a></li>`).join('')}</ul><p>Alterne fontes públicas de prática e compare explicações. Alegação fornecida, não verificada: "Em 87 questões medidas de três bancos públicos, B e C concentraram 62% das respostas corretas. Amostra pequena: use só como desempate, depois de eliminar." Os bancos e gabaritos dessa medição não foram fornecidos. Neste simulado, as alternativas são embaralhadas; a alegação não fundamenta preferir B ou C. Um intervalo fixo de três semanas não é uma regra oficial de retenção.</p>`;}
function studyGuide(){const rows=[
['Global vs local','Febre ou suspeita de trombose exige adiar e encaminhar; hematoma recente exige cautela local e avaliação do contexto. Crônico não significa automaticamente seguro.','Fever or a suspected clot calls for deferral and referral; a fresh bruise requires local caution and contextual assessment. Chronic does not automatically mean safe.','massage'],
['Client rights vs therapist prerogative','Privacidade, cobertura e recusa são direitos do cliente. O profissional também pode recusar conduta insegura ou fora do escopo.','Privacy, draping and refusal are client rights. Practitioners may also decline unsafe or out-of-scope services.','rights'],
['Scope vs ethics','Escopo delimita atividades permitidas; ética orienta conduta. Certificado não substitui licença nem competência.','Scope defines permitted activities; ethics guides conduct. A certificate does not replace licensure or competence.','ethics'],
['Transference vs countertransference','Transferência: projeção do cliente. Contratransferência: questões pessoais do profissional interferem no atendimento. Flashback isolado não estabelece nenhum dos dois. Atalho incorreto do material: "Na prova, flashback durante a sessão é transference; o distrator é countertransference." Um flashback sozinho não sustenta essa resposta; procure projeção de sentimentos de relações anteriores no profissional.','Transference: client projection. Countertransference: practitioner issues affect care. An isolated flashback establishes neither. Do not label a flashback as transference without evidence of projection onto the practitioner.','transfer'],
['Abuse / misappropriation / power differential','Abuse: abuso. Misappropriation: apropriação indevida, por exemplo de bens. Power differential: influência desigual da relação profissional. Não são sinônimos.','Abuse, wrongful appropriation of property and unequal professional influence describe different conduct or circumstances.','abmp'],
['Cleaning / disinfection / sterilization','Limpeza remove sujeira. Desinfecção não garante eliminar esporos. Esterilização elimina formas microbianas, inclusive esporos; siga uso indicado do equipamento.','Cleaning removes soil. Disinfection does not guarantee spore elimination. Sterilization eliminates microbial forms including spores; match processing to intended use.','cdc'],
['Informed / implied / assumption of risk / waiver','Consentimento informado exige compreensão e escolha. Implícito é inferido da conduta. Assumir risco e assinar isenção não substituem consentimento nem autorizam negligência.','Informed consent requires understanding and choice. Implied consent is inferred from conduct. Risk acknowledgment and a waiver do not replace consent or authorize negligence.','rights'],
['Anticoagulants / corticosteroids','Anticoagulantes aumentam preocupação com sangramento. Corticoides podem causar fragilidade cutânea. Adapte manejo e não altere medicação.','Anticoagulants raise bleeding concerns. Corticosteroids may cause skin fragility. Adapt handling and do not alter medication.','drugs'],
['Antihypertensives / analgesics','Anti-hipertensivos podem causar tontura. Analgésicos podem reduzir dor sem comprovar recuperação. Levantar com segurança e reavaliar são mais úteis que presumir tolerância.','Antihypertensives may cause dizziness. Analgesics may reduce pain without proving recovery. Safe transitions and reassessment matter more than assumed tolerance.','pressure'],
['Pregnancy positioning','Decúbito lateral apoiado é uma opção adequada; lado, pressão e duração dependem de conforto, sintomas e avaliação. Não transforme um lado específico em regra universal. Atalho do material, não regra oficial confirmada: "Na prova, decúbito lateral esquerdo é o padrão no terceiro trimestre, com pressão e duração reduzidas." O cenário e as alternativas devem orientar a escolha; adapte lado, pressão e duração à avaliação individual.','Supported side-lying is an appropriate option; side, pressure and duration depend on comfort, symptoms and assessment. Do not make one side a universal rule. A universal exam rule requiring left-side positioning and reduced pressure and duration has not been established here.','pregnancy']
];return rows.map(([term,pt,en,s])=>`<p><b>${term}</b><br>${pt}<br><span lang="en">${en}</span><br><a href="${SOURCES[s][1]}" target="_blank" rel="noopener noreferrer">${SOURCES[s][0]}</a></p>`).join('');}
function setup(){state.screen='setup';mount(`<section class="question-shell"><p class="eyebrow">03 / Da intenção à prática</p><h1 style="font-size:42px">Configurar simulado</h1><p class="muted">${BANK.length} itens de treino (${BANK.filter(q=>!q.repeatOf).length} únicos). Sete domínios. Perguntas, alternativas e correções em inglês e português.</p><label for="mode">Modo</label><select id="mode"><option value="study">Treino completo · ver resposta</option><option value="exam" selected>100 de ${BANK.length} · 110 minutos</option></select><label for="difficulty">Dificuldade</label><select id="difficulty"><option value="progressive">Progressiva · básico até superavançado</option><option value="1">Básico primeiro</option><option value="2">Intermediário primeiro</option><option value="3">Avançado primeiro</option><option value="4">Superavançado primeiro</option></select><p class="small muted">As opções mudam a ordem inicial; o treino completo inclui todos os itens e a prova sorteia 100. Superavançado exige distinguir prioridade, contexto e termos próximos.</p><label for="first-language">Idioma apresentado primeiro</label><select id="first-language"><option value="EN">English first · português abaixo</option></select><label for="deadline">Horário pessoal de encerramento (opcional)</label><input id="deadline" type="time" style="font:inherit;padding:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px"><div class="note"><b>Briefing</b><br>Modo prova: 100 de ${BANK.length} itens sorteados, quatro alternativas e uma correta; 110 minutos (66 s por item), sem voltar, com explicação após cada resposta. O relógio continua nos intervalos.<br>Treino: ${BANK.length} itens; o último bloco pode ser menor.<br>Metas de treino: 80% nas primeiras 20 e 60% nas questões 21–60.<br>Ao fim de cada bloco, confira o parcial e clique em Seguir.</div><p class="small muted">Os ajustes de timer e blocos do perfil são aplicados ao selecionar Treino. Imagens carregam com internet; se falharem, o roteiro de busca continua visível.</p><div class="actions">${button('profile',state.profile?'Voltar ao perfil':'Voltar ao início')}${button('begin','Iniciar','primary')}</div><details><summary>Fontes, correções dos prints e limites</summary>${sourceNotes()}</details></section>`,true);$('#first-language').value='EN';bind('profile',()=>state.profile?result():intro());bind('begin',()=>startExam($('#mode').value,$('#difficulty').value,$('#first-language').value,$('#deadline').value));}
function shuffle(a){const out=a.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function makeDeck(difficulty,count=BANK.length){
 const priority=l=>difficulty==='progressive'?l:((l-Number(difficulty)+4)%4);
 const unique=BANK.filter(q=>!q.slot);
 const selected=count===100?[...unique.filter(q=>q.id===20||q.id===52),...shuffle(unique.filter(q=>q.id!==20&&q.id!==52)).slice(0,96)]:unique;
 const pools=Object.keys(DOMAINS).map(d=>shuffle(selected.filter(q=>q.d===d)).sort((a,b)=>priority(a.l)-priority(b.l)));
 const deck=[];while(pools.some(p=>p.length)){for(const pool of pools){if(pool.length)deck.push(pool.shift());}}
 deck.sort((a,b)=>priority(a.l)-priority(b.l));
 for(const q of BANK.filter(q=>q.slot).sort((a,b)=>a.slot-b.slot))deck.splice(q.slot-1,0,q);
 return deck.map(q=>{const opts=shuffle(q.o.map((v,i)=>({v,correct:i===0})));return {...q,options:opts,correct:opts.findIndex(x=>x.correct)};});
}
function startExam(mode,difficulty,lang,deadline){const now=Date.now();state.exam={mode,difficulty,lang,deadline,deck:makeDeck(difficulty,mode==='exam'?100:BANK.length),index:0,selected:null,records:[],revealed:false,block:1,blockSize:mode==='exam'?20:state.profile.config.bloco,started:now,blockStarted:now,itemStarted:now,blockDue:null,ended:null,expired:false};state.screen='question';setBlockTimer();renderQuestion();}
function setBlockTimer(){const e=state.exam;e.blockDue=e.mode==='study'&&((state.profile?.config.timer||'sim')==='sim'||e.block>=3)?Date.now()+Math.min(e.blockSize,e.deck.length-e.index)*66000:null;}
function remaining(){const e=state.exam;if(!e)return null;const due=e.mode==='exam'?e.started+6600000:e.blockDue;return due===null?null:Math.max(0,Math.ceil((due-Date.now())/1000)*1000);}
function formatTime(ms){const sec=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function bilingual(p,lang,cls=''){const order=lang==='PT'?[1,0]:[0,1];return order.map((idx,n)=>`<div lang="${idx?'pt-BR':'en'}" class="${n?'pt':cls||'en'}"><span class="language">${idx?'PORTUGUÊS':'ENGLISH'}</span>${esc(p[idx])}</div>`).join('');}
function renderQuestion(){state.screen='question';const e=state.exam,q=e.deck[e.index];mount(`<section class="question-shell"><div class="topline">${ptButton()}</div><div class="topline"><span class="tag">Bloco ${e.block} · ${e.mode==='exam'?'Prova':'Treino'}</span><span id="clock" class="small num" aria-label="Tempo restante"></span></div><progress value="${e.index}" max="${e.deck.length}" aria-label="${e.index} questões concluídas de ${e.deck.length}"></progress><div class="topline"><p class="eyebrow" style="margin:0">${DOMAINS[q.d]}</p><span class="small num">${e.index+1} / ${e.deck.length}</span></div><p class="small muted" style="margin-top:10px">${LEVELS[q.l-1]}${e.deadline?' · Encerrar até '+esc(e.deadline):''}</p><h2 class="sr">Questão ${e.index+1}</h2><div class="question-text">${bilingual(q.q,e.lang)}<div class="choices">${q.options.map((o,j)=>`<button class="choice" data-answer="${j}" aria-pressed="${e.selected===j}"><span class="letter">${letters[j]}</span><span lang="${e.lang==='PT'?'pt-BR':'en'}">${esc(o.v[e.lang==='PT'?1:0])}<small lang="${e.lang==='PT'?'en':'pt-BR'}">${esc(o.v[e.lang==='PT'?0:1])}</small></span></button>`).join('')}</div></div><div id="feedback"></div><div class="actions">${button('submit','Ver resposta','primary')}</div><p class="small muted" style="margin-top:18px">${'Escolha antes de revelar. A primeira resposta fica registrada.'}</p></section>`,true);wirePT();if(e.revealed){document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(Number(b.dataset.answer)===q.correct)b.classList.add('correct');else if(Number(b.dataset.answer)===e.selected)b.classList.add('wrong');});$('#feedback').innerHTML=explanation(q,e.selected,e.lang)+(e.selected===q.correct?'':causeSelect(e.records.length-1));$('#submit').textContent='Continuar';$('#submit').disabled=false;bind('submit',advance);wireCauses();tick();return;}$('#submit').disabled=e.selected===null;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(e.revealed)return;e.selected=Number(b.dataset.answer);document.querySelectorAll('[data-answer]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#submit').disabled=false;});bind('submit',submitAnswer);tick();}
function imageBlock(q){
 const m=q.img;
 if(!m)return '<p class="small muted">SEM IMAGEM — não há roteiro visual validado para este conceito.</p>';
 const figure=m.src?`<figure><img src="${esc(m.src)}" alt="${esc(m.alt)}" loading="lazy" onerror="this.closest('figure').classList.add('noimg')"><figcaption><span lang="en">${esc(m.capEN)}</span><br><span lang="pt-BR">${esc(m.capPT)}</span><br><b>Conferir</b> ${esc(m.check)}<br><a href="${esc('https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(decodeURIComponent(m.src.split('/').pop())))}" target="_blank" rel="noopener noreferrer">Autor e licença da imagem · Wikimedia Commons</a></figcaption></figure>`:`<p class="small muted">SEM IMAGEM — não foi encontrada URL pública que representasse com fidelidade este gabarito.</p>`;
 return `<section class="memory" aria-label="Roteiro de imagem da questão ${q.id}">${figure}<details><summary>Roteiro visual e busca</summary><p><b>Deve mostrar</b> ${esc(m.show)}</p><p><b>Não pode aparecer</b> ${esc(m.avoid)}</p><p><b>BUSCA</b> <span lang="en">${esc(m.search)}</span></p><p><b>Legenda EN/PT</b> <span lang="en">${esc(m.capEN)}</span><br><span lang="pt-BR">${esc(m.capPT)}</span></p><p><b>Conferir</b> ${esc(m.check)}</p></details></section>`;
}
function explanation(q,selected,lang){const correct=q.options[q.correct].v;return `<div class="answer"><h3>${selected===q.correct?'Resposta correta':'Vamos revisar'} · ${letters[q.correct]}</h3>${bilingual(q.why,lang,'small')}<div class="memory"><b>Vocabulário / Vocabulary</b><span lang="en">${esc(correct[0])}</span> = <span lang="pt-BR">${esc(correct[1])}</span></div><h3>Por que as outras não respondem</h3><ul class="small">${q.options.map((o,j)=>j===q.correct?'':`<li><b>${letters[j]}.</b> <span lang="en">${esc(o.v[2])}</span><br><span lang="pt-BR">${esc(o.v[3])}</span></li>`).join('')}</ul>
<p class="small"><b>Gancho / Memory cue:</b><br><span lang="en">${esc(q.hook[0])}</span><br><span lang="pt-BR">${esc(q.hook[1])}</span></p>

<p class="small"><b>Na prática / In practice:</b><br><span lang="en">${esc(q.practice[0])}</span><br><span lang="pt-BR">${esc(q.practice[1])}</span></p>

${imageBlock(q)}
<p class="small"><a href="${SOURCES[q.s][1]}" target="_blank" rel="noopener noreferrer">Fonte de consulta: ${SOURCES[q.s][0]}</a></p></div>`;}
function submitAnswer(){const e=state.exam;if(e.selected===null||e.revealed)return;if(remaining()!==null&&remaining()<=0){expire();return;}const q=e.deck[e.index];e.records.push({id:q.id,selected:e.selected,correct:e.selected===q.correct,ms:Date.now()-e.itemStarted,cause:null});e.revealed=true;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(Number(b.dataset.answer)===q.correct)b.classList.add('correct');else if(Number(b.dataset.answer)===e.selected)b.classList.add('wrong');});$('#feedback').innerHTML=explanation(q,e.selected,e.lang)+(e.selected===q.correct?'':causeSelect(e.records.length-1));$('#submit').textContent='Continuar';bind('submit',advance);wireCauses();$('#feedback').scrollIntoView({block:'start',behavior:'instant'});}
function causeSelect(i){return `<label for="cause-${i}">O que contribuiu para este erro? (opcional)</label><select id="cause-${i}" data-cause="${i}"><option value="">Não informado</option><option>Conteúdo</option><option>Leitura/idioma</option><option>Ansiedade</option><option>Chute</option></select>`;}
function wireCauses(){document.querySelectorAll('[data-cause]').forEach(x=>{x.value=state.exam.records[Number(x.dataset.cause)].cause||'';x.onchange=()=>{state.exam.records[Number(x.dataset.cause)].cause=x.value||null;};});}
function advance(){const e=state.exam;e.index=e.records.length;e.revealed=false;e.selected=null;if(e.index>=e.deck.length){blockResult();return;}if(e.index%e.blockSize===0){blockResult();return;}e.itemStarted=Date.now();renderQuestion();}
function blockResult(){
 state.screen='break';const e=state.exam,from=Math.max(0,e.records.length-e.blockSize,(e.block-1)*e.blockSize),records=e.records.slice(from),right=records.filter(r=>r.correct).length,final=e.index>=e.deck.length;
 mount(`<section class="question-shell glass"><div class="break-symbol" aria-hidden="true">Ⅱ</div><p class="eyebrow">Bloco ${e.block} concluído</p><h1 style="font-size:43px">Bloco concluído</h1><p class="score">${right}<span class="muted" style="font-size:25px"> / ${records.length}</span></p><p>${records.length-right} erros · ${formatTime(Date.now()-e.blockStarted)} neste bloco</p><p class="muted">${e.mode==='exam'?'O relógio da prova continua correndo durante esta tela.':'Confira os acertos, os erros e o tempo deste bloco antes de seguir.'}</p><p id="clock" class="num"></p><p class="small">${state.profile.config.timer==='não'&&e.block===2&&e.mode==='study'?'O próximo bloco introduz o timer.':''}</p><div class="actions">${button('continue',final?'Ver resultado':'Seguir','primary')}${final?'':button('end','Encerrar e corrigir')}</div></section>`,true);
 if(e.mode==='study')e.blockDue=null;
 bind('continue',()=>{if(final){finish(false);return;}if(remaining()!==null&&remaining()<=0){expire();return;}e.block++;e.blockStarted=Date.now();e.itemStarted=Date.now();setBlockTimer();renderQuestion();});
 if(!final)bind('end',()=>finish(false));tick();
}
function tick(){const e=state.exam;if(!e||e.ended)return;const left=remaining(),clock=$('#clock');if(clock)clock.textContent=left===null?'Sem limite de tempo':formatTime(left)+' restantes';if(left!==null&&left<=0)expire();}
function expire(){const e=state.exam;if(!e||e.ended)return;e.expired=true;finish(true);}
function finish(expired){const e=state.exam;if(!e.ended)e.ended=Date.now();e.expired=expired||e.expired;state.screen='finished';const n=e.records.length,right=e.records.filter(x=>x.correct).length,stats=Object.keys(DOMAINS).map(d=>{const r=e.records.filter((x,i)=>e.deck[i].d===d);return {d,n:r.length,ok:r.filter(x=>x.correct).length};}),wrong=e.records.map((r,i)=>({r,i})).filter(x=>!x.r.correct),first=e.records.slice(0,20),middle=e.records.slice(20,60),rate=r=>r.length?Math.round(r.filter(x=>x.correct).length/r.length*100):0;mount(`<p class="eyebrow">Seu resultado de treino</p><h1 style="font-size:43px">Resultado da sessão</h1><div class="grid"><section class="glass"><p class="score">${n?Math.round(right/n*100):0}<span style="font-size:26px">%</span></p><p>${right} acertos / ${n} respondidas · ${e.deck.length-n} sem responder</p><p class="small muted">Tempo total: ${formatTime(e.ended-e.started)} · ${e.mode==='study'?'Treino':'Prova'}</p>${e.expired?'<p class="note">Tempo encerrado. As respostas confirmadas foram preservadas nesta tela.</p>':''}<p class="small">${n===e.deck.length?'Percurso completo.':'Sessão parcial: não compare este percentual com um percurso completo.'}</p><p class="note">Este percentual não corresponde ao resultado oficial PASS/FAIL. Não é possível inferir aprovação nem um corte de 70% ou 80% neste banco.</p><p class="small">Primeiras 20: ${first.length===20?rate(first)+'% · meta 80%':'parcial, '+first.length+'/20'}<br>Questões 21–60: ${middle.length===40?rate(middle)+'% · meta 60%':'parcial, '+middle.length+'/40'}</p></section><section class="glass"><h2>Por domínio</h2><table><thead><tr><th>Domínio</th><th>Acertos</th><th>%</th></tr></thead><tbody>${stats.map(x=>`<tr><td>${DOMAINS[x.d]}</td><td>${x.ok}/${x.n}</td><td>${x.n?Math.round(x.ok/x.n*100):'—'}</td></tr>`).join('')}</tbody></table></section></div><section class="glass" style="margin-top:18px"><h2>Seu próximo passo</h2><p class="small">Prioridades pelo erro observado; amostras pequenas não medem domínio. Misture essas fichas com conteúdos já acertados.</p><ul>${stats.filter(x=>x.n&&x.ok<x.n).sort((a,b)=>(b.n-b.ok)/b.n-(a.n-a.ok)/a.n).slice(0,3).map(x=>`<li>${DOMAINS[x.d]}: ${Math.min(10,Math.max(3,(x.n-x.ok)*2))} fichas de recuperação ativa.</li>`).join('')||'<li>Sem erros registrados: retome depois, com questões diferentes, para conferir retenção.</li>'}</ul><p class="small">Se a prova for amanhã, priorize os erros recorrentes, uma revisão mista curta e descanso. Revisão em 48 horas é continuidade, não preparação para amanhã.</p><p class="small">Causas são autorrelatadas abaixo. O programa não consegue distinguir ansiedade de desconhecimento apenas pela alternativa marcada.</p></section><h2 style="margin-top:32px">Revisão das respostas</h2><p class="small muted">${wrong.length} erros. Acertos também podem ser abertos para consultar a explicação.</p>${e.records.map((r,i)=>`<details class="glass"><summary>${r.correct?'Acerto':'Revisar'} · ${i+1} · ${DOMAINS[e.deck[i].d]} · marcada ${letters[r.selected]}, correta ${letters[e.deck[i].correct]}</summary>${bilingual(e.deck[i].q,e.lang,'small')}${explanation(e.deck[i],r.selected,e.lang)}${r.correct?'':causeSelect(i)}</details>`).join('')}<p class="note">Incertezas: não há item incluído com gabarito deliberadamente incerto.<br>Questões clínicas simplificam o contexto; decisões reais dependem de avaliação e escopo local.<br>Este banco não passou por validação psicométrica nem revisão independente de uma banca.</p><details><summary>Fontes e correções</summary>${sourceNotes()}</details><div class="actions">${button('review','Perfil e respostas')}${button('again','Novo percurso','primary')}${button('profile',state.profile?'Meu perfil':'Fazer perfil')}</div>`,true);wireCauses();bind('review',reviewReport);bind('again',setup);bind('profile',()=>state.profile?result():startProfile());}
function reportBody(){
 const p=state.profile,e=state.exam;
 if(!p)return `<h1>Rodada e respostas</h1><p class="small">Sessão: ${e?esc(new Date(e.started).toLocaleString('pt-BR')):'—'} · Perfil não respondido.</p><p>${e?e.records.length:0} respostas registradas neste aparelho.</p>${e?e.records.map((r,i)=>{const q=e.deck[i];return `<details class="glass"><summary>${i+1}. ${DOMAINS[q.d]} · ${r.correct?'Acerto':'Erro'} · marcada ${letters[r.selected]}, correta ${letters[q.correct]}</summary>${bilingual(q.q,'EN')}<p>Escolhida: ${bilingual(q.options[r.selected].v,'EN','small')}</p>${explanation(q,r.selected,'EN')}</details>`;}).join(''):''}`;
 return `<h1>Perfil e respostas</h1><p class="small">Relatório da sessão · ${esc(p.created.toLocaleString('pt-BR'))}</p>
 <section class="glass"><h2>${esc(p.dominant)}</h2><p>Secundário: ${esc(p.secondary)}</p><p>Preferências relatadas, não diagnóstico de personalidade ou medida de capacidade. Compare com o desempenho observado.</p>${PROFILES[p.dominant].lines.map(x=>`<p>${esc(x)}</p>`).join('')}<h3>Plano sugerido</h3><ul>${PROFILES[p.dominant].rx.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(exportProfile(p,state.answers))}</pre></section>
 <h2>As 20 escolhas do perfil</h2>${ITEMS.map((item,i)=>`<details class="glass"><summary>${i+1}. ${esc(PROFILE_EN[i][0])}<br><span lang="pt-BR">${esc(item[1])}</span></summary>${item[2].map((x,j)=>`<p${state.answers[i]===j?' class="note"':''}><b>${letters[j]}${state.answers[i]===j?' · Selected / Escolhida':''}</b><br><span lang="en">${esc(PROFILE_EN[i][1][j])}</span><br><span lang="pt-BR">${esc(x)}</span></p>`).join('')}</details>`).join('')}
 <h2>Escolhas no simulado</h2>${e?`<p>Modo: ${e.mode==='study'?'Treino':'Prova'} · Dificuldade inicial: ${esc(e.difficulty==='progressive'?'Progressiva':LEVELS[Number(e.difficulty)-1])}<br>Idioma: inglês primeiro · Bloco: ${e.blockSize}<br>${e.records.filter(r=>r.correct).length} acertos de ${e.records.length} respondidas.</p>${e.records.map((r,i)=>{const q=e.deck[i];return `<details class="glass"><summary>${i+1}. ${esc(DOMAINS[q.d])} · ${r.correct?'Acerto':'Revisar'} · marcada ${letters[r.selected]}, correta ${letters[q.correct]}</summary>${bilingual(q.q,'EN')}${q.options.map((o,j)=>`<p><b>${letters[j]}${j===r.selected?' · Selected / Escolhida':''}${j===q.correct?' · Correct / Correta':''}</b>${bilingual(o.v,'EN','small')}</p>`).join('')}<p class="small">Tempo até confirmar: ${Math.round(r.ms/1000)} s · Causa relatada: ${esc(r.cause||'Não informada')}</p>${explanation(q,r.selected,'EN')}</details>`;}).join('')}`:'<p>Nenhuma questão respondida nesta sessão.</p>'}`;
}
function roundText(){const e=state.exam,p=state.profile;return ['MBLEx · RODADA',e?'INÍCIO: '+new Date(e.started).toLocaleString('pt-BR'):'SEM SIMULADO',p?'PERFIL: '+p.dominant+' / '+p.secondary:'PERFIL: não respondido',e?'RESPONDIDAS: '+e.records.length:'RESPONDIDAS: 0',...(e?e.records.map((r,i)=>{const q=e.deck[i];return [i+1+'. ID '+q.id+' · '+(r.correct?'CERTO':'ERRADO')+' · '+letters[r.selected]+' / '+letters[q.correct],q.q[0],q.q[1],'Escolhida EN/PT: '+q.options[r.selected].v.slice(0,2).join(' / '),'Correta EN/PT: '+q.options[q.correct].v.slice(0,2).join(' / '),'Por quê EN/PT: '+q.why.join(' / ')].join('\n')}):[])].join('\n\n');}
function reviewReport(){
 state.screen='review';
 mount(`${reportBody()}<div class="actions">${button('save-report','Salvar relatório HTML','primary')}${button('copy-round','Copiar respostas')}${button('share-round','Compartilhar respostas')}${button('return','Voltar')}</div><p id="round-status" class="status" role="status"></p><p class="small muted">As respostas ficam neste aparelho. Para outra pessoa vê-las, copie ou envie o relatório. Não há envio automático.</p>`,true);
 bind('save-report',saveReport);bind('share-round',shareRound);bind('copy-round',()=>{const field=document.createElement('textarea');field.value=roundText();field.style.position='fixed';field.style.left='-9999px';document.body.append(field);copyText(field,$('#round-status')).finally(()=>field.remove());});bind('return',()=>state.exam&&state.exam.ended?finish(state.exam.expired):state.exam?renderQuestion():state.profile?result():intro());
}
async function shareRound(){if(!navigator.share){$('#round-status').textContent='Use Copiar respostas ou Salvar relatório HTML para enviar.';return;}try{await navigator.share({title:'MBLEx · rodada '+new Date(state.exam.started).toLocaleString('pt-BR'),text:roundText()});$('#round-status').textContent='Compartilhamento concluído.';}catch(e){if(e.name!=='AbortError')$('#round-status').textContent='Compartilhamento indisponível. Use Copiar respostas ou Salvar relatório HTML.';}}
function reportHTML(){
 const css=document.querySelector('style').textContent;
 return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBLEx · Relatório da sessão</title><style>'+css+'.choice.wrong,.choice.wrong[aria-pressed=true]{border-color:#b84a55;background:#ed62652b}.choice.correct,.choice.correct[aria-pressed=true]{border-color:#328859;background:#46bd702b}.choice:disabled{opacity:1}</style></head><body class="light"><main>'+reportBody()+'</main></body></html>';
}
function saveReport(){
 const url=URL.createObjectURL(new Blob([reportHTML()],{type:'text/html;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='mblex-relatorio-'+new Date(state.exam?.started||Date.now()).toISOString().replace(/[:.]/g,'-')+'.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
window.addEventListener('beforeunload',event=>{if(state.answers.some(x=>x!==null)||state.exam){event.preventDefault();event.returnValue='';}});
setInterval(tick,1000);
intro();
</script>
</body>
</html>
